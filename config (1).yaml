# ============================================================
#  CONFIGURAÇÃO DO RADAR DE ARTIGOS (versão SITE)
#  Regras para os termos:
#   - NÃO use vírgulas dentro dos termos
#   - Expressões com mais de uma palavra são tratadas como frase exata
#   - Palavras soltas (ex.: bee) aceitam variações (bee, bees)
#   - Em cada tópico: o artigo precisa casar com UM termo de "termos"
#     E (se existir) com UM termo de "contexto".
# ============================================================

site:
  titulo: Radar de Abelhas Sem Ferrão
  subtitulo: Artigos novos todo dia + clássicos da literatura

busca:
  dias_para_tras: 7          # janela diária (o que já apareceu nunca se repete)
  primeira_vez_dias: 90      # na 1ª execução, busca mais para encher o site
  max_por_topico: 30         # máximo de artigos novos por tópico por dia
  pontuacao_minima: 1        # filtra ruído (termo no título vale 3, no resumo vale 1)
  fontes: [openalex, europepmc]   # europepmc cobre PubMed + preprints

# ------------------------------------------------------------
#  FILTRO DE REVISTAS
#  ativo: true  -> só aparecem artigos de revistas da lista "permitidas"
#  ativo: false -> aparecem artigos de qualquer revista
#  - Basta o nome conter o texto: "Insectes Sociaux" pega "Insectes Sociaux".
#  - Nomes curtos e genéricos pegam variações. Para exigir nome IGUAL,
#    coloque = na frente: "=Science" (pega só "Science").
#  - "bloqueadas" remove revistas específicas (vale mesmo se permitida).
#  - Preprints (bioRxiv etc.) só entram se "bioRxiv" estiver na lista.
# ------------------------------------------------------------
filtro_revistas:
  ativo: true
  permitidas:
    # Abelhas e insetos sociais
    - Apidologie
    - Insectes Sociaux
    - Journal of Apicultural Research
    - Bee World
    - Sociobiology
    - Journal of Hymenoptera Research
    # Comportamento e ecologia
    - Journal of Insect Behavior
    - Behavioral Ecology
    - Animal Behaviour
    - Journal of Chemical Ecology
    - Ecological Entomology
    - Journal of Animal Ecology
    - Oecologia
    - Biological Conservation
    - Journal of Comparative Physiology
    - Journal of Experimental Biology
    # Brasil / Neotrópico
    - Neotropical Entomology
    - Revista Brasileira de Entomologia
    - Papéis Avulsos de Zoologia
    - Apis
    # Generalistas de alto impacto
    - =Science
    - =Nature
    - Nature Communications
    - Nature Ecology
    - Proceedings of the Royal Society B
    - Current Biology
    - Biology Letters
    - Proceedings of the National Academy of Sciences
    - Scientific Reports
    - PLoS ONE
    - Insects
    - Journal of Economic Entomology
    - Environmental Entomology
  bloqueadas: []

classicos:
  por_topico: 50             # quantos clássicos (mais citados) por tópico
  ate_ano: null              # ex.: 2015 -> só trabalhos publicados até 2015

# E-mail é OPCIONAL. Deixe false se quiser só o site.
email:
  ativo: false
  destinatario: ""
  servidor_smtp: smtp.gmail.com
  porta_smtp: 465

topicos:
  - nome: Comportamento de abelhas sem ferrão
    termos:
      - stingless bee
      - Meliponini
      - Melipona
      - Tetragonula
      - Trigona
      - Scaptotrigona
      - Plebeia
      - Frieseomelitta
      - Nannotrigona
      - Partamona
    contexto:
      - behavior
      - behaviour
      - foraging
      - communication
      - pheromone
      - recruitment
      - learning
      - aggression
      - nest defense
      - nest defence
      - thermoregulation
      - division of labor
      - division of labour
      - queen

  - nome: Manejo e meliponicultura
    termos:
      - stingless bee
      - Meliponini
      - Melipona
      - meliponiculture
    contexto:
      - colony
      - management
      - honey
      - propolis
      - pollination
      - conservation

  - nome: Abelhas solitárias e ninhos-isca em ambiente urbano
    termos:
      - solitary bee
      - cavity-nesting bee
      - trap nest
      - bee hotel
    contexto:
      - urban
