# ============================================================
#  FOTO DA ABELHA NO TOPO DO SITE (iNaturalist)
#  Escreva em "especies" os nomes científicos das abelhas que você quer ver.
#  A cada vez que você abre ou atualiza o site, aparece uma foto diferente, sorteada
#  entre elas (sem repetir a anterior). O robô busca as fotos livres (Creative Commons)
#  de TODAS as espécies da lista; o crédito do fotógrafo aparece sob a foto.
#  Se um nome estiver errado ou sem foto livre, o registro da execução (Actions) avisa.
#  modo: aleatoria -> muda a cada atualização da página (padrão)
#        dia       -> uma foto por dia, igual o dia todo
#  fotos_por_especie: quantas fotos diferentes guardar de cada espécie (1 a 5). Com 3,
#                     uma lista de 45 espécies vira até 135 fotos para sortear.
# ============================================================
