# ============================================================
#  CONFIGURAÇÃO DO RADAR DE ARTIGOS (versão SITE)
#  Regras para os termos:
#   - NÃO use vírgulas dentro dos termos
#   - Expressões com mais de uma palavra são tratadas como frase exata
#   - Palavras soltas (ex.: bee) aceitam variações (bee, bees)
#   - Em cada tópico: o artigo precisa casar com UM termo de "termos"
#     E (se existir) com UM termo de "contexto".
# ============================================================

site:
  titulo: Radar de Abelhas Sem Ferrão
  subtitulo: Artigos novos todo dia + clássicos da literatura

busca:
  dias_para_tras: 7          # janela diária (o que já apareceu nunca se repete)
  primeira_vez_dias: 90      # na 1ª execução, busca mais para encher o site
  max_por_topico: 30         # máximo de artigos novos por tópico por dia
  pontuacao_minima: 1        # filtra ruído (termo no título vale 3, no resumo vale 1)
  fontes: [openalex, europepmc]   # europepmc cobre PubMed + preprints

classicos:
  por_topico: 50             # quantos clássicos (mais citados) por tópico
  ate_ano: null              # ex.: 2015 -> só trabalhos publicados até 2015

# E-mail é OPCIONAL. Deixe false se quiser só o site.
email:
  ativo: false
  destinatario: ""
  servidor_smtp: smtp.gmail.com
  porta_smtp: 465

topicos:
  - nome: Comportamento de abelhas sem ferrão
    termos:
      - stingless bee
      - Meliponini
      - Melipona
      - Tetragonula
      - Trigona
      - Scaptotrigona
      - Plebeia
      - Frieseomelitta
      - Nannotrigona
      - Partamona
    contexto:
      - behavior
      - behaviour
      - foraging
      - communication
      - pheromone
      - recruitment
      - learning
      - aggression
      - nest defense
      - nest defence
      - thermoregulation
      - division of labor
      - division of labour
      - queen

  - nome: Manejo e meliponicultura
    termos:
      - stingless bee
      - Meliponini
      - Melipona
      - meliponiculture
    contexto:
      - colony
      - management
      - honey
      - propolis
      - pollination
      - conservation

  - nome: Abelhas solitárias e ninhos-isca em ambiente urbano
    termos:
      - solitary bee
      - cavity-nesting bee
      - trap nest
      - bee hotel
    contexto:
      - urban
      - city
      - biodiversity
      - nesting
