# ============================================================
#  CONFIGURAÇÃO DO RADAR DE ARTIGOS — ABELHAS
#
#  Como funcionam os tópicos:
#   - "termos"  = quem é o assunto (aqui: abelhas em geral)
#   - "contexto" = o tema que você quer ver (termorregulação, nidificação...)
#   - O artigo precisa casar com UM termo E com UM termo de contexto.
#  Regras:
#   - NÃO use vírgulas dentro dos termos
#   - Mais de uma palavra = frase exata ("nest defense")
#   - Palavra solta aceita plural (bee pega bees)
#   - Para tirar um tópico, apague o bloco inteiro dele
# ============================================================

site:
  titulo: Radar de Abelhas
  subtitulo: Artigos novos todo dia + clássicos da literatura
  novidades_dias: 7          # janela que o site mostra ao abrir (a linha do tempo permite ampliar)
  historico_dias: 90         # quantos dias de histórico o site guarda (limite da linha do tempo)

busca:
  # modo: amplo  -> (RECOMENDADO) busca tudo que cita abelhas no título, resumo ou palavras-chave,
  #                 só em revistas da Scopus (bloco "scopus"); os temas viram etiquetas no site.
  #                 + as revistas SÓ DE ABELHAS que você listar em "revistas_de_abelhas": delas
  #                 entra TUDO que publicam, sem olhar palavra nenhuma.
  # modo: por_tema -> o jeito antigo: só entra o que casa com algum tema.
  # modo: revistas -> só as revistas do bloco "revistas" (veja mais abaixo).
  modo: amplo
  max_paginas: 100           # (amplo) máximo de páginas de 100 resultados por busca (o OpenAlex entrega até 10.000)
  max_por_dia: 3000          # (amplo) limite de segurança de artigos novos por execução
  dias_para_tras: 7          # artigos com mais de N dias de publicação chegam marcados como "chegou ao radar em..."
  reprocessar_dias: 30       # a cada execução o robô olha os últimos N dias: pega o que o OpenAlex cadastrou com atraso (nada se repete)
  max_por_topico: 20         # máximo de artigos novos por tópico por dia
  pontuacao_minima: 3        # 3 = termo no título (ou vários no resumo). Mais alto = mais seletivo
  paginas: 3                 # quantas "páginas" de 100 resultados buscar por tópico
  fontes: [openalex, europepmc]   # europepmc cobre PubMed + preprints

# ------------------------------------------------------------
#  REVISTAS SÓ DE ABELHAS (modo: amplo)
#  Tudo o que sai nessas revistas é sobre abelhas, então entra TUDO o que elas publicam
#  (inclusive artigos fechados, que o OpenAlex entrega sem resumo), mesmo que não estejam
#  na Scopus. Escreva o nome ou, melhor, o ISSN. Pode acrescentar quantas quiser.
#  No registro da execução aparece "Revista X -> nome achado (ISSN)": confira se está certo.
# ------------------------------------------------------------
revistas_de_abelhas:
  - 0044-8435    # Apidologie
  - 0021-8839    # Journal of Apicultural Research
  - 0005-772X    # Bee World

# ------------------------------------------------------------
#  SUAS REVISTAS (só se busca > modo for: revistas)
#  Escreva o nome ou, melhor, o ISSN (ex.: 0044-8435). Para uma revista generalista
#  (Science, Nature...), use so_abelhas: true, assim só entra o que cita abelhas.
#  Ao rodar, o registro mostra "Revista X -> nome achado (ISSN)": confira se está certo.
# ------------------------------------------------------------
revistas:
  - Apidologie
  - Insectes Sociaux
  - Journal of Insect Behavior
  - Sociobiology
  - Journal of Apicultural Research
  - Neotropical Entomology
  - Behavioral Ecology
  - Animal Behaviour
  - Biological Conservation
  - {nome: Science, so_abelhas: true}
  - {nome: Nature, so_abelhas: true}
  - {nome: Current Biology, so_abelhas: true}
  - {nome: Proceedings of the Royal Society B, so_abelhas: true}

# O que conta como "citar abelhas" no modo amplo:
abelhas:
  # RIGOR da busca por palavras (para tirar artigos que não têm nada a ver):
  #   normal -> basta uma palavra de abelha no título, no resumo ou nas palavras-chave
  #   medio  -> palavra no título/palavras-chave, OU pelo menos 2 palavras diferentes no resumo
  #   alto   -> palavra no título ou nas palavras-chave (resumo sozinho não basta)
  # Artigos das "revistas_de_abelhas" não passam por esse teste (entra tudo delas).
  # Dica: para barrar uma palavra problemática, use "excluir" (mais abaixo).
  rigor: normal
  # Muitos artigos só dizem "Apis cerana" ou "Bombus terrestris" e nunca a palavra "bee".
  # Por isso a lista tem também nomes de grupos. Acrescente os que quiser (sem vírgula dentro do nome).
  termos: [bee, honeybee, honey bee, bumblebee, bumble bee, Anthophila, Apoidea, Apidae, Meliponini,
           Apis cerana, Apis mellifera, Apis dorsata, Apis florea,
           Bombus, Melipona, Trigona, Tetragonula, Scaptotrigona, Euglossa, Eulaema,
           Osmia, Megachile, Xylocopa, Andrena, Lasioglossum, Halictus, Ceratina, Centris, Colletes]

classicos:
  por_topico: 30             # quantos clássicos (mais citados) por tópico
  ate_ano: null              # ex.: 2015 -> só trabalhos publicados até 2015

# ------------------------------------------------------------
#  EXCLUIR ASSUNTOS
#  onde: titulo            -> descarta se o termo aparecer no TÍTULO (recomendado;
#                             estudos que só citam Apis no resumo continuam entrando)
#  onde: titulo_e_resumo   -> descarta se aparecer no título OU no resumo (mais rígido)
#  manter_se_no_titulo     -> se o título tiver uma destas palavras, NÃO descarta
#                             (protege estudos comparativos e "stingless honeybees")
# ------------------------------------------------------------
excluir:
  onde: titulo
  # Para barrar ruído no TÍTULO, acrescente as palavras aqui. Ex.: termos: [bee-eater, beetle]
  termos: []               # vazio = nada é excluído (Apis mellifera / honey bee APARECEM). Para voltar a barrar:
                           # termos: [Apis mellifera, honey bee, honeybee, honey-bee]
  manter_se_no_titulo:
    - stingless
    - Meliponini
    - meliponine
    - meliponiculture

# ------------------------------------------------------------
#  LISTA DE REVISTAS DA SCOPUS (opcional)
#  ativo: true -> só entram artigos de revistas que estão na lista da Scopus
#                 (a "Scopus Source List"). Revistas fora dela e preprints
#                 (bioRxiv etc.) são descartados.
#  arquivo: o arquivo da lista, enviado para a pasta principal do repositório.
#           Pode ser .csv (leve, recomendado) ou .xlsx.
#  somente_ativas: true -> ignora revistas que a Scopus não indexa mais.
#  tipos: quais tipos de fonte aceitar (Journal, Book Series, Trade Journal).
#  Se o arquivo não for encontrado, o filtro é ignorado (nada é apagado).
#  Obs.: se "filtro_revistas" abaixo também estiver ativo, os DOIS valem juntos.
# ------------------------------------------------------------
scopus:
  ativo: true
  arquivo: scopus.csv
  somente_ativas: true
  tipos: [Journal]

# ------------------------------------------------------------
#  FILTRO DE REVISTAS (desligado: você pediu só por temas)
#  Para usar: troque ativo para true e edite a lista.
#  - O nome da revista precisa conter o texto. "=Science" exige nome igual.
# ------------------------------------------------------------
filtro_revistas:
  ativo: false
  permitidas:
    - Apidologie
    - Insectes Sociaux
    - Journal of Insect Behavior
    - Behavioral Ecology
    - Animal Behaviour
    - Journal of Chemical Ecology
    - Ecological Entomology
    - Neotropical Entomology
    - Sociobiology
    - Biological Conservation
    - =Science
    - =Nature
    - Proceedings of the Royal Society B
    - Current Biology
  bloqueadas: []

# ------------------------------------------------------------
#  SJR DAS REVISTAS (opcional)
#  O SJR (SCImago Journal Rank) aparece em cada artigo, ao lado da revista.
#  Para ativar: baixe a tabela em scimagojr.com (Journal Rankings > "Download
#  data" no fim da página), renomeie o arquivo para sjr.csv e envie para a
#  pasta principal do repositório. Sem o arquivo, o SJR simplesmente não aparece.
# ------------------------------------------------------------
sjr:
  arquivo: sjr.csv

# E-mail é OPCIONAL. Deixe false se quiser só o site.
email:
  ativo: false
  destinatario: ""
  servidor_smtp: smtp.gmail.com
  porta_smtp: 465

# ============================================================
#  CATEGORIAS DE FILTRO DO SITE
#  Cada categoria vira uma linha de botões no site. O robô marca cada artigo
#  conforme as palavras que aparecem no título e no resumo.
#  - Um artigo pode cair em mais de uma opção (ex.: um estudo com sem-ferrão
#    e mamangavas aparece nas duas).
#  - Sem nenhuma palavra encontrada, vai para "rotulo_sem".
#  - "termos" procuram no título E no resumo; "termos_titulo" só no título.
#  - Sem vírgula dentro dos termos. É uma detecção automática: pode errar.
#  - Para tirar uma categoria, apague o bloco dela. Para criar, copie um bloco.
# ============================================================
filtros:

  - nome: Abelha
    rotulo_sem: Sem grupo identificado
    opcoes:
      - nome: Sem ferrão (Meliponini)
        termos: [stingless bee, Meliponini, Meliponinae, meliponine, meliponiculture,
                 Melipona, Trigona, Tetragonula, Tetragonisca, Scaptotrigona, Plebeia,
                 Frieseomelitta, Nannotrigona, Partamona, Geotrigona, Lestrimelitta,
                 Heterotrigona, Austroplebeia, Leurotrigona, Friesella, Meliponula,
                 Axestotrigona, Cephalotrigona, Oxytrigona, Paratrigona, Schwarziana,
                 Scaptotrigona, Trigonisca, Plebeina, Dactylurina, Lisotrigona,
                 Tetrigona, Geniotrigona, Lepidotrigona, Homotrigona, Hypotrigona]
      - nome: Mamangavas (Bombini)
        termos: [Bombus, bumble bee, bumblebee, Bombini]
      - nome: Apis (Apini)
        termos: [Apini, Apis mellifera, Apis cerana, Apis dorsata, Apis florea,
                 Apis laboriosa, Apis andreniformis, Apis koschevnikovi, honey bee, honeybee]
      - nome: Solitárias
        termos: [solitary bee, trap nest, trap-nest, trap-nesting, cavity-nesting,
                 cavity nesting, ground-nesting, mason bee, leafcutter bee, leaf-cutter bee,
                 carpenter bee, mining bee, bee hotel, Osmia, Megachile, Xylocopa,
                 Andrena, Anthophora, Centris]
      - nome: Abelhas das orquídeas (Euglossini)
        termos: [orchid bee, Euglossini, Euglossa, Eulaema, Eufriesea, Exaerete]

  - nome: Tipo de estudo
    rotulo_sem: Não identificado
    opcoes:
      - nome: Revisão ou síntese
        termos: [systematic review, literature review, meta-analysis, metaanalysis,
                 meta-analytic, bibliometric, state of the art]
        termos_titulo: [review, overview, synthesis, primer, perspective]
      - nome: Experimento ou campo
        termos: [field experiment, field study, field survey, laboratory experiment,
                 experimental, in situ, field observations, we measured, we tested]
      - nome: Modelagem ou simulação
        termos: [species distribution model, niche model, mathematical model,
                 agent-based, simulation, modelling, modeling, MaxEnt]
      - nome: Filogenia e taxonomia
        termos: [phylogeny, phylogenetic, taxonomy, systematics, new species,
                 species delimitation, molecular phylogeny, biogeography]
      - nome: Genética e molecular
        termos: [genome, genomic, transcriptome, transcriptomic, RNA-seq, microsatellite,
                 DNA barcoding, metabarcoding, proteomic, epigenetic, genetic]
      - nome: Tecnologia e monitoramento
        termos: [sensor, Internet of Things, IoT, machine learning, deep learning,
                 computer vision, monitoring system, RFID]

  - nome: Região
    rotulo_sem: Região não citada
    opcoes:
      - nome: Brasil
        termos: [Brazil, Brazilian, Brasil, brasileira, São Paulo, Amazon, Amazonia,
                 Atlantic Forest, Mata Atlântica, Cerrado, Caatinga, Pantanal]
      - nome: Neotrópico (fora do Brasil)
        termos: [Neotropical, Neotropics, Mexico, Colombia, Costa Rica, Argentina, Peru,
                 Ecuador, Venezuela, Central America, South America, Latin America,
                 Panama, Bolivia, Paraguay, Chile, Guatemala, French Guiana]
      - nome: América do Norte
        termos: [North America, United States, Canada, California, Florida, Texas]
      - nome: Europa
        termos: [Europe, European, Germany, France, Spain, Italy, United Kingdom,
                 Britain, Netherlands, Sweden, Poland, Switzerland, Portugal]
      - nome: Ásia e Oceania
        termos: [Asia, Asian, China, Japan, India, Malaysia, Thailand, Indonesia,
                 Australia, New Zealand, Vietnam, Philippines, Taiwan, Korea, Borneo, Sri Lanka]
      - nome: África
        termos: [Africa, African, Kenya, South Africa, Tanzania, Nigeria, Ethiopia,
                 Uganda, Ghana, Cameroon]

