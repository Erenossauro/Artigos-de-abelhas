name: Radar de artigos

on:
  schedule:
    - cron: "0 10 * * *"      # 10:00 UTC = 07:00 em Brasília
  workflow_dispatch: {}        # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Atualizar o site
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python radar_artigos.py diario

      - name: Salvar alterações
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add state.json docs
          git diff --staged --quiet || git commit -m "Radar: atualização $(date -u +%F)"
          git push
