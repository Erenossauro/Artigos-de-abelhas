name: Diagnóstico de revista

on:
  workflow_dispatch:
    inputs:
      revista:
        description: "Nome ou ISSN da revista (ex.: Apidologie)"
        required: true
        default: "Apidologie"
      dias:
        description: "Quantos dias para trás olhar"
        required: true
        default: "60"

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar diagnóstico
        env:
          REVISTA: ${{ inputs.revista }}
          DIAS: ${{ inputs.dias }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python radar_artigos.py diagnostico "$REVISTA" --dias "$DIAS"

      - name: Salvar relatório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/diagnostico.html
          git diff --staged --quiet || git commit -m "Diagnóstico: $REVISTA"
          git push
        env:
          REVISTA: ${{ inputs.revista }}
