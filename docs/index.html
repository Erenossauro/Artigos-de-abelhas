nor pest in Africa, they can cause significant damage to social bee colonies in their new ranges. Potential reasons for differential impact include differences in bee behaviour, climate and release from natural enemies. Here, we provide an overview on biology, d", "url": "https://doi.org/10.1007/s13592-016-0426-x", "citacoes": 164, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.1113398109", "titulo": "A morphologically specialized soldier caste improves colony defense in a neotropical eusocial bee", "autores": "Christoph Grüter, Cristiano Menezes, Vera Lúcia Imperatriz-Fonseca, Francis L. W. Ratnieks", "revista": "Proceedings of the National Academy of Sciences", "data": "2012-01-09", "ano": 2012, "resumo": "Division of labor among workers is common in insect societies and is thought to be important in their ecological success. In most species, division of labor is based on age (temporal castes), but workers in some ants and termites show morphological specialization for particular tasks (physical castes). Large-headed soldier ants and termites are well-known examples of this specialization. However, until now there has been no equivalent example of physical worker subcastes in social bees or wasps. Here we provide evidence for a physical soldier subcaste in a bee. In the neotropical stingless bee", "url": "https://doi.org/10.1073/pnas.1113398109", "citacoes": 164, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1590/s0085-56262003000300001", "titulo": "Meliponini neotropicais: o gênero Partamona Schwarz, 1939 (Hymenoptera, Apidae, Apinae) - bionomia e biogeografia", "autores": "João M. F. Camargo, Silvia R. M. Pedro", "revista": "Revista Brasileira de Entomologia", "data": "2003-01-01", "ano": 2003, "resumo": "This work, dedicated to the study of nesting habits of the species of the Neotropical genus Partamona Schwarz, is a sequence to the taxonomic revision recently published elsewhere. A total of 214 nests and nest aggregations of 18 species [Partamona epiphytophila Pedro & Camargo, 2003; P. testacea (Klug, 1807); P. mourei Camargo, 1980; P. vicina Camargo, 1980; P. auripennis Pedro & Camargo, 2003; P. combinata Pedro & Camargo, 2003; P. chapadicola Pedro & Camargo, 2003; P. nhambiquara Pedro & Camargo, 2003; P. ferreirai Pedro & Camargo, 2003; P. pearsoni (Schwarz, 1938); P. gregaria Pedro & Cama", "url": "https://doi.org/10.1590/s0085-56262003000300001", "citacoes": 151, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/s0003-3472(05)80877-2", "titulo": "Boundary disputes in the territorial ant Azteca trigona: effects of asymmetries in colony size", "autores": "Eldridge S. Adams", "revista": "Animal Behaviour", "data": "1990-02-01", "ano": 1990, "resumo": "", "url": "https://doi.org/10.1016/s0003-3472(05)80877-2", "citacoes": 149, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1371/journal.pone.0038406", "titulo": "Imidacloprid-Induced Impairment of Mushroom Bodies and Behavior of the Native Stingless Bee Melipona quadrifasciata anthidioides", "autores": "Hudson V. V. Tomé, Gustavo Ferreira Martins, Maria Augusta Pereira Lima, Lúcio Antônio Oliveira Campos, R. N. C. Guedes", "revista": "PLoS ONE", "data": "2012-06-04", "ano": 2012, "resumo": "Declines in pollinator colonies represent a worldwide concern. The widespread use of agricultural pesticides is recognized as a potential cause of these declines. Previous studies have examined the effects of neonicotinoid insecticides such as imidacloprid on pollinator colonies, but these investigations have mainly focused on adult honey bees. Native stingless bees (Hymenoptera: Apidae: Meliponinae) are key pollinators in neotropical areas and are threatened with extinction due to deforestation and pesticide use. Few studies have directly investigated the effects of pesticides on these pollin", "url": "https://doi.org/10.1371/journal.pone.0038406", "citacoes": 148, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/bf01201668", "titulo": "Tropical pollinators in the canopy and understory: Field data and theory for stratum ?preferences?", "autores": "David Ward Roubik", "revista": "Journal of Insect Behavior", "data": "1993-11-01", "ano": 1993, "resumo": "", "url": "https://doi.org/10.1007/bf01201668", "citacoes": 147, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.1174096", "titulo": "Tiger Moth Jams Bat Sonar", "autores": "Aaron J. Corcoran, Jesse R. Barber, William E. Conner", "revista": "Science", "data": "2009-07-16", "ano": 2009, "resumo": "Moths Battling Bats Many night-flying insects hear the sonar sounds of attacking bats and take evasive action. Among moths, evasive flight is often accompanied by the production of ultrasonic sounds. Three functions of these sounds have been proposed: to startle the bat, to warn of distastefulness, or to “jam” the bat's sonar system. Corcoran et al. (p. 325 ) studied a species of tiger moth ( Bertholdia trigona ) that emits a particularly dense series of ultrasonic clicks and the interception behavior of big brown bats ( Eptesicus fuscus ) presented with silenced or sound-producing tethered mo", "url": "https://doi.org/10.1126/science.1174096", "citacoes": 146, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s004420050178", "titulo": "Aggressive foraging of social bees as a mechanism of floral resource partitioning in an Asian tropical rainforest", "autores": "Teruyoshi Nagamitsu, Tamiji Inoue", "revista": "Oecologia", "data": "1997-04-18", "ano": 1997, "resumo": "", "url": "https://doi.org/10.1007/s004420050178", "citacoes": 142, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.cub.2015.09.028", "titulo": "A Brazilian Social Bee Must Cultivate Fungus to Survive", "autores": "Cristiano Menezes, Ayrton Vollet-Neto, Anita Jocelyne Marsaioli, Dávila Zampieri, Isabela Cardoso Fontoura, Augusto Ducati Luchessi et al.", "revista": "Current Biology", "data": "2015-10-25", "ano": 2015, "resumo": "", "url": "https://doi.org/10.1016/j.cub.2015.09.028", "citacoes": 139, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s00442-001-0848-6", "titulo": "Determinants of stingless bee nest density in lowland dipterocarp forests of Sabah, Malaysia", "autores": "Thomas Eltz, Carsten A. Brühl, Sander van der Kaars, Eduard K. Linsenmair", "revista": "Oecologia", "data": "2002-03-01", "ano": 2002, "resumo": "", "url": "https://doi.org/10.1007/s00442-001-0848-6", "citacoes": 136, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.85.17.6424", "titulo": "The oldest fossil bee: Apoid history, evolutionary stasis, and antiquity of social behavior", "autores": "Charles Duncan Michener, David A. Grimaldi", "revista": "Proceedings of the National Academy of Sciences", "data": "1988-09-01", "ano": 1988, "resumo": "Trigona prisca, a stingless honey bee (Apidae; Meliponinae), is reported from Cretaceous New Jersey amber (96-74 million years before present). This is about twice the age of the oldest previously known fossil bee, although Trigona is one of the most derived bee genera. T. prisca is closely similar to modern neotropical species. Most of bee evolution probably occurred during the approximately 50 million years between the beginning of the Cretaceous when flowering plants (on which bees depend) appeared and the time of T. prisca. Since then, in this phyletic line of Meliponinae, there has been a", "url": "https://doi.org/10.1073/pnas.85.17.6424", "citacoes": 132, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1371/journal.pone.0137198", "titulo": "Native and Non-Native Supergeneralist Bee Species Have Different Effects on Plant-Bee Networks", "autores": "Tereza Cristina Giannini, Lucas A. Garibaldi, André Luís Acosta, Juliana Saragiotto Silva, Kate P. Maia, António Mauro Saraiva et al.", "revista": "PLoS ONE", "data": "2015-09-10", "ano": 2015, "resumo": "Supergeneralists, defined as species that interact with multiple groups of species in ecological networks, can act as important connectors of otherwise disconnected species subsets. In Brazil, there are two supergeneralist bees: the honeybee Apis mellifera, a non-native species, and Trigona spinipes, a native stingless bee. We compared the role of both species and the effect of geographic and local factors on networks by addressing three questions: 1) Do both species have similar abundance and interaction patterns (degree and strength) in plant-bee networks? 2) Are both species equally influen", "url": "https://doi.org/10.1371/journal.pone.0137198", "citacoes": 129, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/s41467-016-0012-y", "titulo": "Repeated evolution of soldier sub-castes suggests parasitism drives social complexity in stingless bees", "autores": "Christoph Grüter, Francisca H. I. D. Segers, Cristiano Menezes, Ayrton Vollet-Neto, Tiago Falcón, Lucas von Zuben et al.", "revista": "Nature Communications", "data": "2017-02-09", "ano": 2017, "resumo": "The differentiation of workers into morphological castes represents an important evolutionary innovation that is thought to improve division of labor in insect societies. Giv 102, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.90.18.8687", "titulo": "Multiple origins of advanced eusociality in bees inferred from mitochondrial DNA sequences.", "autores": "S. A. Cameron", "revista": "Proceedings of the National Academy of Sciences", "data": "1993-09-15", "ano": 1993, "resumo": "The remarkably high level of colony organization found in the honey bees and stingless bees (family Apidae) is extremely rare among animals. Yet there is controversy over whether these two groups independently evolved advanced eusocial behavior or inherited it from a common ancestor. Phylogenetic analyses of DNA sequence information from the mitochondrial genome (large-subunit ribosomal RNA gene) of representative apid bees suggest that advanced eusocial behavior evolved twice independently within this assemblage. These results depart from previous hypotheses of apid relationships by indicatin", "url": "https://doi.org/10.1073/pnas.90.18.8687", "citacoes": 100, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido:19850306", "titulo": "EXPLOITATION OF FLORAL RESOURCES BY PLEBEIA REMOTA HOLMBERG (APIDAE, MELIPONINAE)", "autores": "Mauro Ramalho, Vera Lúcia Imperatriz-Fonseca, A. KLEINEKT-GIOVANNINI, M. CORTOPASSl-LAURINO", "revista": "Apidologie", "data": "1985-01-01", "ano": 1985, "resumo": "", "url": "https://doi.org/10.1051/apido:19850306", "citacoes": 100, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s13592-016-0456-4", "titulo": "Seasonal availability of floral resources and ambient temperature shape stingless bee foraging behavior (Scaptotrigona aff. depilis)", "autores": "Kátia Paula Aleixo, Cristiano Menezes, Vera Lúcia Imperatriz-Fonseca, Cláudia Inês da Silva", "revista": "Apidologie", "data": "2016-06-18", "ano": 2016, "resumo": "", "url": "https://doi.org/10.1007/s13592-016-0456-4", "citacoes": 97, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1093/jee/98.2.260", "titulo": "Evaluation of the Neotropical Stingless Bee Melipona quadrifasciata (Hymenoptera: Apidae) as Pollinator of Greenhouse Tomatoes", "autores": "Mário César Laboissiérè Del Sarto, Rui Carlos Peruquetti, L. A. O. Campos", "revista": "Journal of Economic Entomology", "data": "2005-04-01", "ano": 2005, "resumo": "The Neotropical stingless bee Melipona quadrifasciata Lepeletier was evaluated for pollinating tomatoes (variety Rodas; long-life hybrid) in greenhouses under plastic and with a hydroponic system and “organic concepts” in Minas Gerais State, Brazil. Flowers not pollinated did not set any fruit. Pollination by bees plus manual pollination did not differ from either bee or manual pollination. Maximum fruit diameter, fruit height, and roundness (quotient between maximum fruit diameter and fruit height) were not significantly different between treatments, but fruit visited by M. quadrifasciata had", "url": "https://doi.org/10.1093/jee/98.2.260", "citacoes": 97, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido:19950305", "titulo": "Virgin queens in stingless bee (Apidae, Meliponinae) colonies: a review", "autores": "Vera Lúcia Imperatriz-Fonseca, Ronaldo Zucchi", "revista": "Apidologie", "data": "1995-01-01", "ano": 1995, "resumo": "", "url": "https://doi.org/10.1051/apido:19950305", "citacoes": 97, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido:19980302", "titulo": "Within-colony size variation of foragers and pollen load capacity in the stingless bee Melipona quadrifasciata anthidioides Lepeletier (Apidae, Hymenoptera)", "autores": "Mauro Ramalho, Vera Lúcia Imperatriz-Fonseca, Tereza Cristina Giannini", "revista": "Apidologie", "data": "1998-01-01", "ano": 1998, "resumo": "", "url": "https://doi.org/10.1051/apido:19980302", "citacoes": 96, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rspb.2004.2717", "titulo": "Olfactory eavesdropping by a competitively foraging stingless bee,Trigona spinipes", "autores": "James Charles Nieh, L. S. Barreto, Felipe Andrés León Contrera, Vera Lúcia Imperatriz-Fonseca", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2004-07-12", "ano": 2004, "resumo": "Signals that are perceived over long distances or leave extended spatial traces are subject to eavesdropping. Eavesdropping has therefore acted as a selective pressure in the evolution of diverse animal communication systems, perhaps even in the evolution of functionally referential communication. Early work suggested that some species of stingless bees (Hymenoptera, Apidae, Meliponini) may use interceptive olfactory eavesdropping to discover food sources being exploited by competitors, but it is not clear if any stingless bee can be attracted to the odour marks deposited by an interspecific c", "url": "https://doi.org/10.1098/rspb.2004.2717", "citacoes": 92, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1371/journal.pone.0012000", "titulo": "Ambient Temperature Influences Australian Native Stingless Bee (Trigona carbonaria) Preference for Warm Nectar", "autores": "Melanie Norgate, Skye Boyd‐Gerny, Vera Simonov, Marcello G. P. Rosa, Tim A. Heard, Adrian G. Dyer", "revista": "PLoS ONE", "data": "2010-08-09", "ano": 2010, "resumo": "The interaction between flowers and insect pollinators is an important aspect of the reproductive mechanisms of many plant species. Several laboratory and field studies indicate that raising flower temperature above ambient can be an advantage in attracting pollinators. Here we demonstrate that this preference for warmer flowers is, in fact, context-dependent. Using an Australian native bee as a model, we demonstrate for the first time a significant shift in behaviour when the ambient temperature reaches 34 degrees C, at which point bees prefer ambient temperature nectar over warmer nectar. We", "url": "https://doi.org/10.1371/journal.pone.0012000", "citacoes": 90, "fonte": "OpenAlex", "topico": "Comportamento de abelhas sem ferrão", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido:2006026", "titulo": "Stingless bee nesting biology", "autores": "David Ward Roubik", "revista": "Apidologie", "data": "2006-03-01", "ano": 2006, "resumo": "", "url": "https://doi.org/10.1051/apido:2006026", "citacoes": 581, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido:2006022", "titulo": "Stingless bees in applied pollination: practice and perspectives", "autores": "Ester Judith Slaa, Luis Alejandro Sánchez Chaves, K. S. Malagodi-Braga, Frouke Elisabeth Hofstede", "revista": "Apidologie", "data": "2006-03-01", "ano": 2006, "resumo": "", "url": "https://doi.org/10.1051/apido:2006022", "citacoes": 502, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido:2006027", "titulo": "Global meliponiculture: challenges and opportunities", "autores": "Marilda Cortopassi-Laurino, Vera Lúcia Imperatriz-Fonseca, David Ward Roubik, Anne Dollin, Tim A. Heard, Ingrid Aguilar et al.", "revista": "Apidologie", "data": "2006-03-01", "ano": 2006, "resumo": "", "url": "https://doi.org/10.1051/apido:2006027", "citacoes": 447, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido/2009012", "titulo": "Diversity, threats and conservation of native bees in the Neotropics", "autores": "Breno Magalhães Freitas, Vera Lúcia Imperatriz-Fonseca, Luis A. Medina‐Medina, Astrid de Matos Peixoto Kleinert, Leonardo Galetto, Guiomar Nates Parra et al.", "revista": "Apidologie", "data": "2009-05-01", "ano": 2009, "resumo": "", "url": "https://doi.org/10.1051/apido/2009012", "citacoes": 359, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/nature06039", "titulo": "Dating the origin of the Orchidaceae from a fossil orchid with its pollinator", "autores": "Santiago R. Ramírez, Barbara Gravendeel, Rodrigo Bustos Singer, Charles R. Marshall, Naomi E. Pierce", "revista": "Nature", "data": "2007-08-01", "ano": 2007, "resumo": "", "url": "https://doi.org/10.1038/nature06039", "citacoes": 328, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s13592-014-0316-z", "titulo": "Crop pollinators in Brazil: a review of reported interactions", "autores": "Tereza Cristina Giannini, Samuel Boff, Guaraci Duran Cordeiro, E. A. Cartolano, Allan Veiga, Vera Lúcia Imperatriz-Fonseca et al.", "revista": "Apidologie", "data": "2014-09-17", "ano": 2014, "resumo": "", "url": "https://doi.org/10.1007/s13592-014-0316-z", "citacoes": 257, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1574-6968.1997.tb12678.x", "titulo": "Identification and roles of non-pathogenic microflora associated with honey bees1", "autores": "Martha Gilliam", "revista": "FEMS Microbiology Letters", "data": "2006-01-17", "ano": 2006, "resumo": "Microorganisms associated with honey bees, Apis mellifera, and their food include bacteria (Gram-variable pleomorphic bacteria, Bacillus spp., and Enterobacteriaceae), molds (primarily aspergilli and penicillia), and yeasts (mainly Torulopsis spp.). Eggs, prepupae, pupae, and worker bees emerging from cells as adults are usually free of internal microbes. Microorganisms acquired by larvae through ingestion of contaminated food are usually eliminated through the single defecation that occurs at the end of the feeding period prior to pupation. Emerging adult bees acquire intestinal microflora by", "url": "https://doi.org/10.1111/j.1574-6968.1997.tb12678.x", "citacoes": 240, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1371/journal.pone.0121157", "titulo": "Bees for Development: Brazilian Survey Reveals How to Optimize Stingless Beekeeping", "autores": "Rodolfo Jaffé, Nathaniel S. Pope, Airton Torres Carvalho, Ulysses Madureira Maia, Betina Blochtein, Carlos Alfredo Lopes de Carvalho et al.", "revista": "PLoS ONE", "data": "2015-03-31", "ano": 2015, "resumo": "Stingless bees are an important asset to assure plant biodiversity in many natural ecosystems, and fulfill the growing agricultural demand for pollination. However, across developing countries stingless beekeeping remains an essentially informal activity, technical knowledge is scarce, and management practices lack standardization. Here we profited from the large diversity of stingless beekeepers found in Brazil to assess the impact of particular management practices on productivity and economic revenues from the commercialization of stingless bee products. Our study represents the first large", "url": "https://doi.org/10.1371/journal.pone.0121157", "citacoes": 228, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1371/journal.pone.0021086", "titulo": "The Antiquity and Evolutionary History of Social Behavior in Bees", "autores": "Sophie Cardinal, Bryan N. Danforth", "revista": "PLoS ONE", "data": "2011-06-13", "ano": 2011, "resumo": "A long-standing controversy in bee social evolution concerns whether highly eusocial behavior has evolved once or twice within the corbiculate Apidae. Corbiculate bees include the highly eusocial honey bees and stingless bees, the primitively eusocial bumble bees, and the predominantly solitary or communal orchid bees. Here we use a model-based approach to reconstruct the evolutionary history of eusociality and date the antiquity of eusocial behavior in apid bees, using a recent molecular phylogeny of the Apidae. We conclude that eusociality evolved once in the common ancestor of the corbicula", "url": "https://doi.org/10.1371/journal.pone.0021086", "citacoes": 225, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/bf00379082", "titulo": "Nectar selection by Melipona and Apis mellifera (Hymenoptera: Apidae) and the ecology of nectar intake by bee colonies in a tropical forest", "autores": "David Ward Roubik, Stephen L. Buchmann", "revista": "Oecologia", "data": "1984-01-01", "ano": 1984, "resumo": "", "url": "https://doi.org/10.1007/bf00379082", "citacoes": 209, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1080/0005772x.2004.11099603", "titulo": "Quality standards for medicinal uses of Meliponinae honey in Guatemala, Mexico and Venezuela", "autores": "Patrícia Vit, Margarita Medina, Eunice Enríquez", "revista": "Bee World", "data": "2004-01-01", "ano": 2004, "resumo": "Beekeeping with stingless bees (meliponiculture) is practiced in Guatemala, Mexico and Venezuela. In this article we review the medicinal uses of stingless bee honeys in these countries. We include honeys from 23 stingless bee species, review their use in the treatment of ocular cataracts and pterygium, fatigue, gastritis, ulcers, lung weakness, coughs, wounds and bruises; their use as laxatives and fertility enhancers, and their nutritional value. A proposal on quality standards for stingless bee honey is considered a contribution for further regulations.", "url": "https://doi.org/10.1080/0005772x.2004.11099603", "citacoes": 203, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s002650050622", "titulo": "Kin conflict over caste determination in social Hymenoptera", "autores": "Andrew F. G. Bourke, Francis L. W. Ratnieks", "revista": "Behavioral Ecology and Sociobiology", "data": "1999-10-04", "ano": 1999, "resumo": "", "url": "https://doi.org/10.1007/s002650050622", "citacoes": 198, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.201.4360.1030", "titulo": "Competitive Interactions Between Neotropical Pollinators and Africanized Honey Bees", "autores": "David Ward Roubik", "revista": "Science", "data": "1978-09-15", "ano": 1978, "resumo": "The Africanized honey bee, a hybrid of European and African honey bees, is thought to displace native pollinators. After experimental introduction of Africanized honey bee hives near flowers, stingless bees became less abundant or harvested-less resource as visitation by Africanized honey bees increased. Shifts in resource use caused by colonizing Africanized honey bees may lead to population decline of Neotropical pollinators.", "url": "https://doi.org/10.1126/science.201.4360.1030", "citacoes": 192, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/nature01127", "titulo": "Honeybee colonies achieve fitness through dancing", "autores": "Gavin Sherman, P. Kirk Visscher", "revista": "Nature", "data": "2002-10-30", "ano": 2002, "resumo": "", "url": "https://doi.org/10.1038/nature01127", "citacoes": 181, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.1113398109", "titulo": "A morphologically specialized soldier caste improves colony defense in a neotropical eusocial bee", "autores": "Christoph Grüter, Cristiano Menezes, Vera Lúcia Imperatriz-Fonseca, Francis L. W. Ratnieks", "revista": "Proceedings of the National Academy of Sciences", "data": "2012-01-09", "ano": 2012, "resumo": "Division of labor among workers is common in insect societies and is thought to be important in their ecological success. In most species, division of labor is based on age (temporal castes), but workers in some ants and termites show morphological specialization for particular tasks (physical castes). Large-headed soldier ants and termites are well-known examples of this specialization. However, until now there has been no equivalent example of physical worker subcastes in social bees or wasps. Here we provide evidence for a physical soldier subcaste in a bee. In the neotropical stingless bee", "url": "https://doi.org/10.1073/pnas.1113398109", "citacoes": 164, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/s41598-018-19583-9", "titulo": "Stingless Bee Larvae Require Fungal Steroid to Pupate", "autores": "Camila Raquel Paludo, Cristiano Menezes, Eduardo Afonso da Silva-Junior, Ayrton Vollet-Neto, Andrés Andrade-Domínguez, Gleb Pishchany et al.", "revista": "Scientific Reports", "data": "2018-01-12", "ano": 2018, "resumo": "The larval stage of the stingless bee Scaptotrigona depilis must consume a specific brood cell fungus in order to continue development. Here we show that this fungus is a member of the genus Zygosaccharomyces and provides essential steroid precursors to the developing bee. Insect pupation requires ecdysteroid hormones, and as insects cannot synthesize sterols de novo, they must obtain steroids in their diet. Larval in vitro culturing assays demonstrated that consuming ergosterol recapitulates the developmental effects on S. depilis as ingestion of Zygosaccharomyces sp. cells. Thus, we determin", "url": "https://doi.org/10.1038/s41598-018-19583-9", "citacoes": 156, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1371/journal.pone.0038406", "titulo": "Imidacloprid-Induced Impairment of Mushroom Bodies and Behavior of the Native Stingless Bee Melipona quadrifasciata anthidioides", "autores": "Hudson V. V. Tomé, Gustavo Ferreira Martins, Maria Augusta Pereira Lima, Lúcio Antônio Oliveira Campos, R. N. C. Guedes", "revista": "PLoS ONE", "data": "2012-06-04", "ano": 2012, "resumo": "Declines in pollinator colonies represent a worldwide concern. The widespread use of agricultural pesticides is recognized as a potential cause of these declines. Previous studies have examined the effects of neonicotinoid insecticides such as imidacloprid on pollinator colonies, but these investigations have mainly focused on adult honey bees. Native stingless bees (Hymenoptera: Apidae: Meliponinae) are key pollinators in neotropical areas and are threatened with extinction due to deforestation and pesticide use. Few studies have directly investigated the effects of pesticides on these pollin", "url": "https://doi.org/10.1371/journal.pone.0038406", "citacoes": 148, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s004420050178", "titulo": "Aggressive foraging of social bees as a mechanism of floral resource partitioning in an Asian tropical rainforest", "autores": "Teruyoshi Nagamitsu, Tamiji Inoue", "revista": "Oecologia", "data": "1997-04-18", "ano": 1997, "resumo": "", "url": "https://doi.org/10.1007/s004420050178", "citacoes": 142, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/s41598-020-68940-0", "titulo": "Stingless bee honey, a novel source of trehalulose: a biologically active disaccharide with health benefits", "autores": "Mary T. Fletcher, Natasha L. Hungerford, Dennis C. Webber, Matheus Carpinelli de Jesus, Jiali Zhang, Isobella S. J. Stone et al.", "revista": "Scientific Reports", "data": "2020-07-22", "ano": 2020, "resumo": "Stingless bee (Meliponini) honey has long been considered a high-value functional food, but the perceived therapeutic value has lacked attribution to specific bioactive components. Examination of honey from five different stingless bee species across Neotropical and Indo-Australian regions has enabled for the first time the identification of the unusual disaccharide trehalulose as a major component representing between 13 and 44 g per 100 g of each of these honeys. Trehalulose is an isomer of sucrose with an unusual α-(1 → 1) glucose-fructose glycosidic linkage and known acariogenic and low gl", "url": "https://doi.org/10.1038/s41598-020-68940-0", "citacoes": 130, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/s41598-018-30126-0", "titulo": "Social bees are fitter in more biodiverse environments", "autores": "Benjamin F. Kaluza, Helen Margaret Wallace, Tim A. Heard, Vanessa Minden, Alexandra‐Maria Klein, Sara D. Leonhardt", "revista": "Scientific Reports", "data": "2018-08-13", "ano": 2018, "resumo": "Bee population declines are often linked to human impacts, especially habitat and biodiversity loss, but empirical evidence is lacking. To clarify the link between biodiversity loss and bee decline, we examined how floral diversity affects (reproductive) fitness and population growth of a social stingless bee. For the first time, we related available resource diversity and abundance to resource (quality and quantity) intake and colony reproduction, over more than two years. Our results reveal plant diversity as key driver of bee fitness. Social bee colonies were fitter and their populations gr", "url": "https://doi.org/10.1038/s41598-018-30126-0", "citacoes": 130, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1371/journal.pone.0137198", "titulo": "Native and Non-Native Supergeneralist Bee Species Have Different Effects on Plant-Bee Networks", "autores": "Tereza Cristina Giannini, Lucas A. Garibaldi, André Luís Acosta, Juliana Saragiotto Silva, Kate P. Maia, António Mauro Saraiva et al.", "revista": "PLoS ONE", "data": "2015-09-10", "ano": 2015, "resumo": "Supergeneralists, defined as species that interact with multiple groups of species in ecological networks, can act as important connectors of otherwise disconnected species subsets. In Brazil, there are two supergeneralist bees: the honeybee Apis mellifera, a non-native species, and Trigona spinipes, a native stingless bee. We compared the role of both species and the effect of geographic and local factors on networks by addressing three questions: 1) Do both species have similar abundance and interaction patterns (degree and strength) in plant-bee networks? 2) Are both species equally influen", "url": "https://doi.org/10.1371/journal.pone.0137198", "citacoes": 129, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.3390/insects12080719", "titulo": "Resin Use by Stingless Bees: A Review", "autores": "Maggie Shanahan, Marla S. Spivak", "revista": "Insects", "data": "2021-08-11", "ano": 2021, "resumo": "Stingless bees (Meliponini) are highly social bees that are native to tropical and sub-tropical ecosystems. Resin use is vital to many aspects of stingless bee colony function. Stingless bees use resin to build essential nest structures, repel predators, and kill would-be invaders. Furthermore, resin-derived compounds have been found to enrich the cuticular chemical profiles of many stingless bee species, and resin may play an important role in shaping the microbial communities associated with stingless bees and their nests. Despite its importance for colony function, previous reviews of resin", "url": "https://doi.org/10.3390/insects12080719", "citacoes": 126, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/s41467-016-0012-y", "titulo": "Repeated evolution of soldier otrigona itama and", "url": "https://doi.org/10.1080/00218839.2019.1684050", "citacoes": 119, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1080/0005772x.2001.11099523", "titulo": "Meliponiculture in Mexico: problems and perspective for development", "autores": "José Javier G. Quezada‐Euán, William de Jesús May-Itzá, J A González-Acereto", "revista": "Bee World", "data": "2001-01-01", "ano": 2001, "resumo": "Beekeeping with stingless bees (meliponiculture) in Mexico is an ancient tradition which today is in the process of disappearing as a consequence of changes in cultural, economic and ecological factors. This article reviews the historical background of meliponiculture as well as its potential uses in Mexico. Meliponiculture could be revived, providing an important source of income for peasant farmers in areas where the use of Africanized honey bees is restricted, provided technical and marketing problems are solved. We outline the current weaknesses and the changes needed to exploit these bees", "url": "https://doi.org/10.1080/0005772x.2001.11099523", "citacoes": 118, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido:19950303", "titulo": "On optimal nectar foraging by some tropical bees (Hymenoptera: Apidae)", "autores": "David Ward Roubik, Douglas Yanega, [A[A[A[A[A[A[A[A[A M. Aluja, Stephen L. Buchmann, David W. Inouye", "revista": "Apidologie", "data": "1995-01-01", "ano": 1995, "resumo": "", "url": "https://doi.org/10.1051/apido:19950303", "citacoes": 118, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1093/ee/nvy137", "titulo": "Pesticide Exposure Assessment Paradigm for Stingless Bees", "autores": "Karina Cham, Roberta Cornélio Ferreira Nocelli, Leandro O Borges, Flávia Elizabeth C Viana-Silva, Carlos Augusto M Tonelli, Osmar Malaspina et al.", "revista": "Environmental Entomology", "data": "2018-08-31", "ano": 2018, "resumo": "Although the importance of bees as the pollinators responsible for maintaining gene flow for many native and cultivated plants in ecosystems around the world is recognized, much of their biodiversity and behavior remains to be discovered. Stingless bees are considered key pollinators for several plant species in tropical and subtropical ecosystems and they also provide pollination services for economically important agricultural crops. Many countries are using the honey bee (Apis mellifera Linnaeus, 1758, Hymenoptera: Apidae) as a surrogate to evaluate the risk of pesticides to all species of ", "url": "https://doi.org/10.1093/ee/nvy137", "citacoes": 115, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1080/0005772x.2005.11099651", "titulo": "Extinction ofMelipona beecheiiand traditional beekeeping in the Yucatán peninsula", "autores": "Rogel Villanueva-G, David Ward Roubik, Wilberto Colli-Ucán", "revista": "Bee World", "data": "2005-01-01", "ano": 2005, "resumo": "Rearing of the ‘xunan-kab’ bee (Melipona beecheii) had been practised widely by the Mayans of the Yucatán peninsula long before arrival of the Spanish in the New World, and had been a culturally and economically important activity in that region. Melipona beecheii is kept almost exclusively in traditional log hives. Beekeepers using this bee, from the Mayan zone in Quintana Roo state, Mexico, testify to a 93% decrease in hives during the past one-quarter century. Despite concern that stingless bee keeping is going extinct, there were scant data to examine direct impact of competition from fera", "url": "https://doi.org/10.1080/0005772x.2005.11099651", "citacoes": 115, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido:19830306", "titulo": "A COMPARATIVE STUDY OF FORAGING BEHAVIOR AND POLLEN RESOURCES OF VARIOUS STINGLESS BEES (HYM., MELIPONINAE) AND HONEYBEES (HYM., APINAE) IN TRINIDAD, WEST-INDIES", "autores": "Marinus Jan Sommeijer, G. A. DE ROOY, W. Punt, L.L.M. de Bruijn", "revista": "Apidologie", "data": "1983-01-01", "ano": 1983, "resumo": "", "url": "https://doi.org/10.1051/apido:19830306", "citacoes": 114, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s13592-019-00642-7", "titulo": "Bee colony losses in Brazil: a 5-year online survey", "autores": "Dayson Castilhos, Genevile Carife Bergamo, Kátia Peres Gramacho, Lionel Segui Gonçalves", "revista": "Apidologie", "data": "2019-05-15", "ano": 2019, "resumo": "", "url": "https://doi.org/10.1007/s13592-019-00642-7", "citacoes": 108, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.biocon.2004.03.030", "titulo": "The effects of human disturbance on a stingless bee community in a tropical rainforest", "autores": "Hiromitsu Samejima, Marfaizal Marzuki, Teruyoshi Nagamitsu, Tohru Nakasizuka", "revista": "Biological Conservation", "data": "2004-05-31", "ano": 2004, "resumo": "", "url": "https://doi.org/10.1016/j.biocon.2004.03.030", "citacoes": 108, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s13592-022-00913-w", "titulo": "The stingless bees (Hymenoptera: Apidae: Meliponini): a review of the current threats to their survival", "autores": "Erubiel Toledo-Hernández, Guadalupe Peña-Chora, Víctor Manuel Hernández-Velázquez, Caleb C. Lormendez, Jeiry Toribio-Jiménez, Yanet Romero‐Ramírez et al.", "revista": "Apidologie", "data": "2022-03-01", "ano": 2022, "resumo": "Abstract Pollination by insects is an essential service for the conservation of plant biodiversity, since it increases the rate of fertilization of flowers and therefore increases the quality and quantity of seeds and fruits. In tropical regions, native plants depend heavily on stingless bees as pollinators since before the introduction of the European honey bee Apis mellifera . However, like for many other insect species worldwide, anthropogenic actions represent a true threat to stingless bee populations. In this article, we review the works that evaluated the potential negative impacts of h", "url": "https://doi.org/10.1007/s13592-022-00913-w", "citacoes": 106, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.0307-6946.2005.00676.x", "titulo": "Does intraspecific size variation in bumblebees allow colonies to efficiently exploit different flowers?", "autores": "James Peat, J. Tucker, Dave Goulson", "revista": "Ecological Entomology", "data": "2005-04-01", "ano": 2005, "resumo": "Abstract. 1. It has long been known that foraging bumblebee workers vary greatly in size, within species, and within single nests. This phenomenon has not been adequately explained. Workers of their relatives within the Apidae exhibit much less size variation. 2. For the bumblebee Bombus terrestris size, as measured by thorax width, was found to correspond closely with tongue length, so that larger bees are equipped to feed from deeper flowers. 3. The mean size of worker bees attracted to flowers was found to differ between plant species, and larger bees with longer tongues tended to visit dee", "url": "https://doi.org/10.1111/j.0307-6946.2005.00676.x", "citacoes": 104, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s13592-019-00727-3", "titulo": "Unveiling the contribution of bee pollinators to Brazilian crops with implications for bee management", "autores": "Tereza Cristina Giannini, Denise A. Alves, Ronnie Cley de Oliveira Alves, Guaraci Duran Cordeiro, Alistair John Campbell, Marcelo Awade et al.", "revista": "Apidologie", "data": "2020-01-22", "ano": 2020, "resumo": "The need for basic information on tropical crop pollinators remains a key priority. Here, we used a dataset on Brazilian bee-crop interactions to determine important bee species for crop pollination and discuss their management in Brazilian croplands. We developed an analytical approach to select key bee species and genera from datasets based on different criteria, selecting only interactions reported as effective pollination events. Data on pollination included 261 records of unique crop-pollinator interaction, 144 bee species, and 23 crops. Despite the importance of social species, solitary ", "url": "https://doi.org/10.1007/s13592-019-00727-3", "citacoes": 101, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.13102/sociobiology.v65i4.3447", "titulo": "The economic and cultural values of stingless bees (Hymenoptera: Meliponini) among ethnic groups of tropical America", "autores": "José Javier G. Quezada‐Euán, Guiomar Nates Parra, M. M. Maués, David Ward Roubik, Vera Lúcia Imperatriz-Fonseca", "revista": "Sociobiology", "data": "2018-10-11", "ano": 2018, "resumo": "Stingless honey bees— commonly known as stingless bees— have long provided food and materials to the inhabitants of tropical America. We conducted a literature search to codify available information, including non-peer reviewed ‘grey literature’, on the purported value of stingless bees to indigenous people. Among >400 species of Neotropical stingless bees several are widely used in beekeeping. Varied cultural and economic values are associated with their use, and in some cases husbandry, as a consequence of ongoing contact between people and these social insects. Adapting new species to husba", "url": "https://doi.org/10.13102/sociobiology.v65i4.3447", "citacoes": 100, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.90.18.8687", "titulo": "Multiple origins of advanced eusociality in bees inferred from mitochondrial DNA sequences.", "autores": "S. A. Cameron", "revista": "Proceedings of the National Academy of Sciences", "data": "1993-09-15", "ano": 1993, "resumo": "The remarkably high level of colony organization found in the honey bees and stingless bees (family Apidae) is extremely rare among animals. Yet there is controversy over whether these two groups independently evolved advanced eusocial behavior or inherited it from a common ancestor. Phylogenetic analyses of DNA sequence information from the mitochondrial genome (large-subunit ribosomal RNA gene) of representative apid bees suggest that advanced eusocial behavior evolved twice independently within this assemblage. These results depart from previous hypotheses of apid relationships by indicatin", "url": "https://doi.org/10.1073/pnas.90.18.8687", "citacoes": 100, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido:19850306", "titulo": "EXPLOITATION OF FLORAL RESOURCES BY PLEBEIA REMOTA HOLMBERG (APIDAE, MELIPONINAE)", "autores": "Mauro Ramalho, Vera Lúcia Imperatriz-Fonseca, A. KLEINEKT-GIOVANNINI, M. CORTOPASSl-LAURINO", "revista": "Apidologie", "data": "1985-01-01", "ano": 1985, "resumo": "", "url": "https://doi.org/10.1051/apido:19850306", "citacoes": 100, "fonte": "OpenAlex", "topico": "Manejo e meliponicultura", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/srep21641", "titulo": "Antibacterial synergic effect of honey from two stingless bees: Scaptotrigona bipunctata Lepeletier, 1836, and S. postica Latreille, 1807", "autores": "Erick Kenji Nishio, Jhonatan Macedo Ribeiro, Admilton Gonçalves de Oliveira, Célia G.T.J. Andrade, Edson Aparecido Proní, Renata Katsuko Takayama Kobayashi et al.", "revista": "Scientific Reports", "data": "2016-02-12", "ano": 2016, "resumo": "Several studies have tested antimicrobial activity of combinations of honey and various substances. In this nte": "OpenAlex", "topico": "Abelhas solitárias e ninhos-isca em ambiente urbano", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1093/ee/nvy105", "titulo": "Pesticide Exposure Assessment Paradigm for Solitary Bees", "autores": "Fabio Sgolastra, Silvia Hinarejos, Theresa L. Pitts‐Singer, Natalie K. Boyle, Timothy Joseph, Johannes Lückmann et al.", "revista": "Environmental Entomology", "data": "2018-06-27", "ano": 2018, "resumo": "Current pesticide risk assessment for bees relies on a single (social) species, the western honey bee, Apis mellifera L. (Hymenoptera: Apidae). However, most of the >20,000 bee species worldwide are solitary. Differences in life history traits between solitary bees (SB) and honey bees (HB) are likely to determine differences in routes and levels of pesticide exposure. The objectives of this review are to: 1) compare SB and HB life history traits relevant for risk assessment; 2) summarize current knowledge about levels of pesticide exposure for SB and HB; 3) identify knowledge gaps and research", "url": "https://doi.org/10.1093/ee/nvy105", "citacoes": 225, "fonte": "OpenAlex", "topico": "Abelhas solitárias e ninhos-isca em ambiente urbano", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1365-2311.2002.00437.x", "titulo": "Landscape context affects trap‐nesting bees, wasps, and their natural enemies", "autores": "Ingolf Steffan‐Dewenter", "revista": "Ecological Entomology", "data": "2002-09-10", "ano": 2002, "resumo": "Ecologists have become increasingly aware that not only local fragmentation or alteration of habitats but also regional changes of landscape complexity may have a great effect on species diversity and biotic interactions (Kareiva & Wennergren, 1995; Huston, 1999; Tscharntke et al., 2002). The positive relationship between fragment area and both species richness and density of individuals is known (e.g. Connor & McCoy, 1979; Connor et al., 2000; Steffan-Dewenter & Tscharntke, 2000), although there have on const POR_PAGINA = 40;
let aba = 'novo', topico = '', busca = '', revista = '', limite = POR_PAGINA;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtData(s) {
  if (!s) return '';
  const d = new Date(s + 'T00:00:00');
  return isNaN(d) ? s : d.toLocaleDateString('pt-BR');
}
function setAba(a) { aba = a; limite = POR_PAGINA;
  document.getElementById('tab-novo').classList.toggle('on', a === 'novo');
  document.getElementById('tab-classico').classList.toggle('on', a === 'classico');
  render(); }
function setTopico(t) { topico = t; limite = POR_PAGINA; render(); }
function setRev(v) { revista = v; limite = POR_PAGINA; render(); }
function setBusca(v) { busca = v.toLowerCase().trim(); limite = POR_PAGINA; render(); }
function mostrarMais() { limite += POR_PAGINA; render(); }

function filtrados() {
  let xs = DADOS.filter(d => d.tipo === aba);
  if (topico) xs = xs.filter(d => d.topico === topico);
  if (revista) xs = xs.filter(d => d.revista === revista);
  if (busca) xs = xs.filter(d =>
    (d.titulo + ' ' + d.autores + ' ' + d.resumo + ' ' + d.revista).toLowerCase().includes(busca));
  if (aba === 'novo') {
    xs.sort((a, b) => (b.adicionado || '').localeCompare(a.adicionado || '') || (b.data || '').localeCompare(a.data || ''));
  } else {
    xs.sort((a, b) => (b.citacoes || 0) - (a.citacoes || 0));
  }
  return xs;
}

function itemHtml(d) {
  const meta = [esc(d.revista), fmtData(d.data) || esc(d.ano || ''),
    aba === 'classico' ? (d.citacoes || 0) + ' citações' : ''].filter(Boolean).join(' · ');
  return '<div class="item">' +
    '<a class="t" href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.titulo) + '</a>' +
    '<div class="aut">' + esc(d.autores) + '</div>' +
    '<div class="meta"><span class="tag">' + esc(d.topico) + '</span>' + meta + '</div>' +
    '<div class="res">' + (d.resumo ? esc(d.resumo) : '<i>(sem resumo disponível)</i>') + '</div></div>';
}

function render() {
  const topicos = [...new Set(DADOS.filter(d => d.tipo === aba).map(d => d.topico))];
  document.getElementById('chips').innerHTML =
    '<span class="chip ' + (topico === '' ? 'on' : '') + '" onclick="setTopico(\'\')">Todos</span>' +
    topicos.map(t => '<span class="chip ' + (topico === t ? 'on' : '') + '" data-t="' + esc(t) + '">' + esc(t) + '</span>').join('');
  document.querySelectorAll('.chip[data-t]').forEach(el => el.onclick = () => setTopico(el.dataset.t));

  const contagem = {};
  DADOS.filter(d => d.tipo === aba && (!topico || d.topico === topico) && d.revista)
       .forEach(d => { contagem[d.revista] = (contagem[d.revista] || 0) + 1; });
  const revistas = Object.keys(contagem).sort((a, b) => contagem[b] - contagem[a]);
  if (revista && !revistas.includes(revista)) revista = '';
  const sel = document.getElementById('rev');
  sel.innerHTML = '<option value="">Todas as revistas (' + revistas.length + ')</option>' +
    revistas.map(r => '<option value="' + esc(r) + '">' + esc(r) + ' (' + contagem[r] + ')</option>').join('');
  sel.value = revista;

  const xs = filtrados();
  document.getElementById('count').textContent = xs.length + ' artigo(s)';
  const parte = xs.slice(0, limite);
  let out = '', diaAtual = null;
  for (const d of parte) {
    if (aba === 'novo' && d.adicionado !== diaAtual) {
      diaAtual = d.adicionado;
      out += '<h2 class="dia">Chegaram em ' + fmtData(diaAtual) + '</h2>';
    }
    out += itemHtml(d);
  }
  if (!parte.length) out = '<p style="color:var(--mut)">Nada encontrado.</p>';
  document.getElementById('lista').innerHTML = out;
  document.getElementById('mais').style.display = xs.length > limite ? 'block' : 'none';
}
render();
</script>
</body>
</html>
