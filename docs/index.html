: their complex social lifestyles have made them incredibly successful throughout the tropics. Although known as 'white ants', they are not ants and their relationships with other insects remain unclear. Our molecular phylogenetic analyses, the most comprehensive yet attempted, show that termites are social cockroaches, no longer meriting being classified as a separate order (Isoptera) from the cockroaches (Blattodea). Instead, we propose that they should be treated as a family (Termitidae) of cockroaches. It is surprising to f", "url": "https://doi.org/10.1098/rsbl.2007.0102", "citacoes": 544, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Região não citada"]}, "sjr": 0.982, "q": "Q1"}, {"key": "doi:10.1093/ae/37.2.119", "titulo": "Insects at Low Temperature", "autores": "Richard E. Chippendale", "revista": "American Entomologist", "data": "1991-01-01", "ano": 1991, "resumo": "Physiology of Insect Cold Hardiness.- 1. A Tribute to R. W. Salt.- 2. Principles of Insect Low Temperature Tolerance.- 3. The Water Relations of Overwintering Insects.- 4. Biochemistry of Cryoprotectants.- 5. Hemolymph Proteins Involved in Insect Subzero-Temperature Tolerance: Ice Nucleators and Antifreeze Proteins.- Impact on Development and Survival.- 6. Cold Shock and Heat Shock.- 7. Effects of Cold on Morphogenesis.- 8. Relationship between Cold Hardiness and Diapause.- 9. Thermoperiodism.- Species Adaptations.- 10. Winter Habitats and Ecological Adaptations for Winter Survival.- 11. Freez", "url": "https://doi.org/10.1093/ae/37.2.119", "citacoes": 519, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Apis (Apini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.255, "q": "Q3"}, {"key": "doi:10.1016/j.jinsphys.2013.08.014", "titulo": "Towards the elements of successful insect RNAi", "autores": "Jeffrey G. Scott, Kristin Michel, Lyric C. Bartholomay, Blair D. Siegfried, Wayne Brian Hunter, Guy J. Smagghe et al.", "revista": "Journal of Insect Physiology", "data": "2013-09-13", "ano": 2013, "resumo": "", "url": "https://doi.org/10.1016/j.jinsphys.2013.08.014", "citacoes": 496, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.638, "q": "Q1"}, {"key": "doi:10.1890/0012-9615(2000)070[0617:wgpcop]2.0.co;2", "titulo": "WHAT GOVERNS PROTEIN CONTENT OF POLLEN: POLLINATOR PREFERENCES, POLLEN–PISTIL INTERACTIONS, OR PHYLOGENY?", "autores": "T’ai H. Roulston, James H. Cane, Stephen L. Buchmann", "revista": "Ecological Monographs", "data": "2000-11-01", "ano": 2000, "resumo": "Pollen ranges from 2.5% to 61% protein content. Most pollen proteins are likely to be enzymes that function during pollen tube growth and subsequent fertilization, but the vast range of protein quantity may not reflect only pollen–pistil interactions. Because numerous vertebrate and invertebrate floral visitors consume pollen for protein, protein content may influence floral host choice. Additionally, many floral visitors pollinate their host plants. If protein content influences pollinator visitation, then pollinators are hypothesized to select for increased protein content of host plants. We", "url": "https://doi.org/10.1890/0012-9615(2000)070[0617:wgpcop]2.0.co;2", "citacoes": 484, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Região não citada"]}, "sjr": 3.776, "q": "Q1"}, {"key": "doi:10.1098/rstb.1996.0087", "titulo": "Paternity in eusocial Hymenoptera", "autores": "Jacobus J. Boomsma, Francis L. W. Ratnieks", "revista": "Philosophical Transactions of the Royal Society B Biological Sciences", "data": "1996-07-29", "ano": 1996, "resumo": "Abstract Variation in paternity frequency in colonies of eusocial insects has profound effects on the relatedness among offspring and on the genetic diversity of colonies. Data on queen ‘mating-frequency’ in eusocial Hymenoptera vary in both quality and the phase of the ‘mating’ process they address. Some are observational studies of the range or maximum number of copulations; others are derived from estimates of the number of sperm in males and queens; others use genetic techniques to determine the paternity of different males among female offspring. Only the latter data can be used to calcul", "url": "https://doi.org/10.1098/rstb.1996.0087", "citacoes": 479, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Genética e molecular"], "Região": ["Região não citada"]}, "sjr": 1.725, "q": "Q1"}, {"key": "doi:10.1016/j.cub.2017.03.027", "titulo": "Phylogenomic Insights into the Evolution of Stinging Wasps and the Origins of Ants and Bees", "autores": "Michael G. Branstetter, Bryan N. Danforth, James P. Pitts, Brant C. Faircloth, Philip S. Ward, Matthew L. Buffington et al.", "revista": "Current Biology", "data": "2017-04-01", "ano": 2017, "resumo": "The stinging wasps (Hymenoptera: Aculeata) are an extremely diverse lineage of hymenopteran insects, encompassing over 70,000 described species and a diversity of life history traits, including ectoparasitism, cleptoparasitism, predation, pollen feeding (bees [Anthophila] and Masarinae), and eusociality (social vespid wasps, ants, and some bees) [1]. The most well-studied lineages of Aculeata are the ants, which are ecologically dominant in most terrestrial ecosystems [2], and the bees, the most important lineage of angiosperm-pollinating insects [3]. Establishing the phylogenetic affinities o", "url": "https://doi.org/10.1016/j.cub.2017.03.027", "citacoes": 477, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Região não citada"]}, "sjr": 2.897, "q": "Q1"}, {"key": "doi:10.1051/apido:2000102", "titulo": "Propolis: recent advances in chemistry and plant origin", "autores": "Vassya Stefanova Bankova, Solange L. de Castro, María Cristina Marcucci", "revista": "Apidologie", "data": "2000-01-01", "ano": 2000, "resumo": "", "url": "https://doi.org/10.1051/apido:2000102", "citacoes": 1330, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.573, "q": "Q2"}, {"key": "doi:10.1046/j.1523-1739.1998.97154.x", "titulo": "The Potential Consequences of Pollinator Declines on the Conservation of Biodiversity and Stability of Food Crop Yields", "autores": "", "revista": "Conservation Biology", "data": "1998-02-11", "ano": 1998, "resumo": "Following reports of dramatic declines in managed and feral honey bees from nearly every region of North America, scientists and resource managers from the U.S., Mexico, and Canada came together to review the quality of the evidence that honey bees as well as other pollinators are in long-term decline and to consider the potential consequences of these losses on the conservation of biodiversity and the stability of the yield of food crops. These experts in pollination ecology confirmed that the last 5 years of losses of honeybee colonies in North America leave us with fewer managed pollinators", "url": "https://doi.org/10.1046/j.1523-1739.1998.97154.x", "citacoes": 817, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Apis (Apini)"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Neotrópico (fora do Brasil)", "América do Norte"]}, "sjr": 2.004, "q": "Q1"}, {"key": "doi:10.3390/su11010189", "titulo": "Applications of Artificial Intelligence in Transport: An Overview", "autores": "Rusul L. Abduljabbar, Hussein Dia, Sohani Liyanage, Saeed Asadi Bagloee", "revista": "Sustainability", "data": "2019-01-02", "ano": 2019, "resumo": "The rapid pace of developments in Artificial Intelligence (AI) is providing unprecedented opportunities to enhance the performance of different industries and businesses, including the transport sector. The innovations introduced by AI include highly advanced computational methods that mimic the way the human brain works. The application of AI in the transport field is aimed at overcoming the challenges of an increasing travel demand, CO2 emissions, safety concerns, and environmental degradation. In light of the availability of a huge amount of quantitative and qualitative data and AI in this ", "url": "https://doi.org/10.3390/su11010189", "citacoes": 764, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Revisão ou síntese", "Genética e molecular"], "Região": ["Região não citada"]}, "sjr": 0.75, "q": "Q1"}, {"key": "doi:10.1007/s004420050949", "titulo": "Effects of habitat isolation on pollinator communities and seed set", "autores": "Ingolf Steffan‐Dewenter, Teja Tscharntke", "revista": "Oecologia", "data": "1999-11-22", "ano": 1999, "resumo": "", "url": "https://doi.org/10.1007/s004420050949", "citacoes": 706, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.909, "q": "Q1"}, {"key": "doi:10.1111/cobi.12840", "titulo": "The city as a refuge for insect pollinators", "autores": "Damon M. Hall, Gerardo R. Camilo, Rebecca K. Tonietto, Jeff Ollerton, Karin Ahrné, Mike Arduser et al.", "revista": "Conservation Biology", "data": "2016-09-14", "ano": 2016, "resumo": "Research on urban insect pollinators is changing views on the biological value and ecological importance of cities. The abundance and diversity of native bee species in urban landscapes that are absent in nearby rural lands evidence the biological value and ecological importance of cities and have implications for biodiversity conservation. Lagging behind this revised image of the city are urban conservation programs that historically have invested in education and outreach rather than programs designed to achieve high-priority species conservation results. We synthesized research on urban bee", "url": "https://doi.org/10.1111/cobi.12840", "citacoes": 673, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 2.004, "q": "Q1"}, {"key": "doi:10.1098/rspb.2014.2849", "titulo": "Where is the UK's pollinator biodiversity? The importance of urban areas for flower-visiting insects", "autores": "Katherine C. R. Baldock, Mark A. Goddard, Damien M. Hicks, William E. Kunin, Nadine Mitschunas, Lynne M. Osgathorpe et al.", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2015-02-12", "ano": 2015, "resumo": "Insect pollinators provide a crucial ecosystem service, but are under threat. Urban areas could be important for pollinators, though their value relative to other habitats is poorly known. We compared pollinator communities using quantified flower-visitation networks in 36 sites (each 1 km(2)) in three landscapes: urban, farmland and nature reserves. Overall, flower-visitor abundance and species richness did not differ significantly between the three landscape types. Bee abundance did not differ between landscapes, but bee species richness was higher in urban areas than farmland. Hoverfly abun", "url": "https://doi.org/10.1098/rspb.2014.2849", "citacoes": 670, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.408, "q": "Q1"}, {"key": "doi:10.1093/condor/108.4.986", "titulo": "Plant–pollinator Interactions: From Specialization To Generalization", "autores": "Carlos Martı́nez del Rio", "revista": "Ornithological Applications", "data": "2006-11-01", "ano": 2006, "resumo": "In 1985 I was present at a lecture in which Nat Wheelwright proposed that the mutualism between seed-dispersing birds and fruit-bearing plants was characterized by lack of specialization in both partners. He gave convincing evidence for the paucity of obligate one-to-one specialization, and explained the reason why extreme specializations in these systems ought to be rare (Wheelwright and Orians 1982). In the discussion after the lecture, Pete Feinsinger expressed a similar view of plant–pollinator systems. He suggested that pollination systems shared with dispersal systems a dearth of tight d", "url": "https://doi.org/10.1093/condor/108.4.986", "citacoes": 466, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Revisão ou síntese", "Experimento ou campo", "Filogenia e taxonomia", "Genética e molecular"], "Região": ["América do Norte", "Europa", "Ásia e Oceania"]}, "sjr": 0.963, "q": "Q1"}, {"key": "doi:10.1111/j.1523-1739.2006.00574.x", "titulo": "Effect of Human Disturbance on Bee Communities in a Forested Ecosystem", "autores": "Rachael Winfree, Terry Griswold, Claire Kremen", "revista": "Conservation Biology", "data": "2006-11-06", "ano": 2006, "resumo": "It is important for conservation biologists to understand how well species persist in human-dominated ecosystems because protected areas constitute a small fraction of the Earth's surface and because anthropogenic habitats may offer more opportunities for conservation than has been previously thought. We investigated how an important functional group, pollinators (bees; Hymenoptera: Apiformes), are affected by human land use at the landscape and local scales in southern New Jersey (U.S.A.). We established 40 sites that differed in surrounding landscape cover or local habitat type and collected", "url": "https://doi.org/10.1111/j.1523-1739.2006.00574.x", "citacoes": 463, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 2.004, "q": "Q1"}, {"key": "doi:10.1603/0013-8746(2008)101[140:braain]2.0.co;2", "titulo": "Bee Richness and Abundance in New York City Urban Gardens", "autores": "Kevin C. Matteson, John S. Ascher, Gail Langellotto", "revista": "Annals of the Entomological Society of America", "data": "2008-01-01", "ano": 2008, "resumo": "We describe the richness, abundance, and ecological characteristics of bees in community gardens located in heavily developed neighborhoods of the Bronx and East Harlem, NY. In total, 1,145 individual bees, representing 54 species (13% of the recorded New York State bee fauna) were collected over 4 yr. The nesting habits of these species include bees that nest in cavities (33% of species), hives (11% of species), pith (1.9% of species), wood (1.9% of species), or soft/rotting wood (7.4% of species) substrates. Soil-nesting individuals were relatively rare (25% of individuals), perhaps due to a", "url": "https://doi.org/10.1603/0013-8746(2008)101[140:braain]2.0.co;2", "citacoes": 432, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.709, "q": "Q1"}, {"key": "doi:10.1111/1365-2664.12876", "titulo": "Increasing biodiversity in urban green spaces through simple vegetation interventions", "autores": "Caragh G. Threlfall, Luis Mata, Jessica Mackie, Amy K. Hahs, Nigel E. Stork, Nicholas S. G. Williams et al.", "revista": "Journal of Applied Ecology", "data": "2017-01-30", "ano": 2017, "resumo": "Summary Cities are rapidly expanding world‐wide and there is an increasing urgency to protect urban biodiversity, principally through the provision of suitable habitat, most of which is in urban green spaces. Despite this, clear guidelines of how to reverse biodiversity loss or increase it within a given urban green space is lacking. We examined the taxa‐ and species‐specific responses of five taxonomically and functionally diverse animal groups to three key attributes of urban green space vegetation that drive habitat quality and can be manipulated over time: the density of large native trees", "url": "https://doi.org/10.1111/1365-2664.12876", "citacoes": 416, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.765, "q": "Q1"}, {"key": "doi:10.1038/s41467-020-14496-6", "titulo": "Urban areas as hotspots for bees and pollination but not a panacea for all insects", "autores": "Panagiotis Theodorou, Rita Radzevičiūtė, Guillaume Lentendu, Belinda Kahnt, Martin Husemann, Christoph Bleidorn et al.", "revista": "Nature Communications", "data": "2020-01-29", "ano": 2020, "resumo": "Urbanisation is an important global driver of biodiversity change, negatively impacting some species groups whilst providing oppor Plots (deliberately akin to garden borders) were planted with one of three treatments, represe", "url": "https://doi.org/10.1111/1365-2664.12499", "citacoes": 283, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)", "Apis (Apini)", "Solitárias"], "Tipo de estudo": ["Experimento ou campo"], "Região": ["Região não citada"]}, "sjr": 1.765, "q": "Q1"}, {"key": "doi:10.1890/13-0705.1", "titulo": "Habitat connectivity shapes urban arthropod communities: the key role of green roofs", "autores": "S. Braaker, Jaboury Ghazoul, Martin К. Obrist, Marco Moretti", "revista": "Ecology", "data": "2013-09-19", "ano": 2013, "resumo": "The installation of green roofs, defined here as rooftops with a shallow soil cover and extensive vegetation, has been proposed as a possible measure to mitigate the loss of green space caused by the steady growth of cities. However, the effectiveness of green roofs in supporting arthropod communities, and the extent to which they facilitate connectivity of these communities within the urban environment is currently largely unknown. We investigated the variation of species community composition (beta diversity) of four arthropod groups with contrasting mobility (Carabidae, Araneae, Curculionid", "url": "https://doi.org/10.1890/13-0705.1", "citacoes": 268, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Europa"]}, "sjr": 1.767, "q": "Q1"}, {"key": "doi:10.1007/s11252-014-0349-0", "titulo": "Native plants are the bee’s knees: local and landscape predictors of bee richness and abundance in backyard gardens", "autores": "Gabriella L. Pardee, Stacy M. Philpott", "revista": "Urban Ecosystems", "data": "2014-01-21", "ano": 2014, "resumo": "", "url": "https://doi.org/10.1007/s11252-014-0349-0", "citacoes": 265, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.873, "q": "Q1"}, {"key": "doi:10.2307/2265575", "titulo": "Generalization in Pollination Systems, and Why it Matters", "autores": "Nikolas M. Waser, Lars Chıttka, Mary V. Price, Neal M. Williams, Jeff Ollerton", "revista": "Ecology", "data": "1996-06-01", "ano": 1996, "resumo": "One view of pollination systems is that they tend toward specialization. This view is implicit in many discussions of angiosperm evolution and plant—pollinator coevolution and in the long—standing concept of p ollination syndromes. But actual pollination systems often are more generalized and dynamic than these traditions might suggest. To illustrate the range of specialization and generalization in pollinators' use of plants and vice versa, we draw on studies of two floras in the United States, and of members of several plant families and solitary bee genera. We also summarize a recent study ", "url": "https://doi.org/10.2307/2265575", "citacoes": 1966, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["América do Norte"]}, "sjr": 1.767, "q": "Q1"}, {"key": "doi:10.1111/j.1461-0248.2008.01157.x", "titulo": "Landscape effects on crop pollination services: are there general patterns?", "autores": "Taylor H. Ricketts, James Regetz, Ingolf Steffan‐Dewenter, Saul Alan Cunningham, Claire Kremen, Anne Bogdanski et al.", "revista": "Ecology Letters", "data": "2008-02-19", "ano": 2008, "resumo": "Pollination by bees and other animals increases the size, quality, or stability of harvests for 70% of leading global crops. Because native species pollinate many of these crops effectively, conserving habitats for wild pollinators within agricultural landscapes can help maintain pollination services. Using hierarchical Bayesian techniques, we synthesize the results of 23 studies - representing 16 crops on five continents - to estimate the general relationship between pollination services and distance from natural or semi-natural habitats. We find strong exponential declines in both pollinator", "url": "https://doi.org/10.1111/j.1461-0248.2008.01157.x", "citacoes": 1400, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 3.382, "q": "Q1"}, {"key": "doi:10.1098/rspb.2004.2909", "titulo": "Tolerance of pollination networks to species extinctions", "autores": "Jane Memmott, Nickolas M. Waser, Mary V. Price", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2004-12-08", "ano": 2004, "resumo": "Mutually beneficial interactions between flowering plants and animal pollinators represent a critical 'ecosystem service' under threat of anthropogenic extinction. We explored probable patterns of extinction in two large networks of plants and flower visitors by simulating the removal of pollinators and consequent loss of the plants that depend upon them for reproduction. For each network, we removed pollinators at random, systematically from least-linked (most specialized) to most-linked (most generalized), and systematically from most- to least-linked. Plant species diversity declined most r", "url": "https://doi.org/10.1098/rspb.2004.2909", "citacoes": 1271, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.408, "q": "Q1"}, {"key": "doi:10.1126/science.1108197", "titulo": "Haploidploidy and the Evolution of the Social Insect", "autores": "Robert L. Trivers, Hope Hare", "revista": "Science", "data": "1976-01-23", "ano": 1976, "resumo": "Halminton (1) was apparently the first to appreciate that the synthesis of Mendelian genetics with Darwin's theory of natural selection had profound implications for social theory. In particular, insofar as almost all social behavior is either selfish or altruistic (or has such effects), genetical reasoning suggests that an individual's social behavior should be adjusted to his or her degree of relatedness, r, to all individuals affected by the behavior. We call this theory kinship theory. The social insects provide a critical test of Hamilton's kinship theory. When such theory is combined wit", "url": "https://doi.org/10.1126/science.1108197", "citacoes": 1271, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)", "Solitárias"], "Tipo de estudo": ["Genética e molecular"], "Região": ["Região não citada"]}, "sjr": 10.948, "q": "Q1"}, {"key": "doi:10.1046/j.1365-2656.2002.00641.x", "titulo": "Foraging ranges of solitary bees", "autores": "Achim Gathmann, Teja Tscharntke", "revista": "Journal of Animal Ecology", "data": "2002-09-01", "ano": 2002, "resumo": "Summary Habitat requirements of solitary bees include nesting sites, food resources and nesting material. We used translocation experiments to establish foraging distances and measured foraging trip duration to analyse how solitary bees cope with the distance between nesting sites and suitable food plants in different habitat types. Maximum foraging distance between nesting site and food patch was 150–600 m for the 16 bee species examined. Foraging distance was correlated positively with body length. Mean foraging trip duration, measured for seven bee species, ranged from 6 to 28 min and was a", "url": "https://doi.org/10.1046/j.1365-2656.2002.00641.x", "citacoes": 1144, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.477, "q": "Q1"}, {"key": "doi:10.1038/nature14420", "titulo": "Seed coating with a neonicotinoid insecticide negatively affects wild bees", "autores": "Maj Rundlöf, Georg K.S. Andersson, Riccardo Bommarco, Ingemar Fries, Veronica Hederström, Lina Herbertsson et al.", "revista": "Nature", "data": "2015-04-22", "ano": 2015, "resumo": "", "url": "https://doi.org/10.1038/nature14420", "citacoes": 1111, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 19.713, "q": "Q1"}, {"key": "doi:10.1007/s10646-012-0863-x", "titulo": "Neonicotinoids in bees: a review on concentrations, side-effects and risk assessment", "autores": "T. Blacquière, Guy J. Smagghe, Cornelis A.M. van Gestel, Veerle Mommaerts", "revista": "Ecotoxicology", "data": "2012-02-17", "ano": 2012, "resumo": "Neonicotinoid insecticides are successfully applied to control pests in a variety of agricultural crops; however, they may not only affect pest insects but also non-target organisms such as pollinators. This review summarizes, for the first time, 15 years of research on the hazards of neonicotinoids to bees including honey bees, bumble bees and solitary bees. The focus of the paper is on three different key aspects determining the risks of neonicotinoid field concentrations for bee populations: (1) the environmental neonicotinoid residue levels in plants, bees and bee products in relation to p", "url": "https://doi.org/10.1007/s10646-012-0863-x", "citacoes": 1059, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)", "Apis (Apini)", "Solitárias"], "Tipo de estudo": ["Revisão ou síntese"], "Região": ["Região não citada"]}, "sjr": 0.929, "q": "Q1"}, {"key": "doi:10.1038/nature05429", "titulo": "Habitat modification alters the structure of tropical host–parasitoid food webs", "autores": "Jason M. Tylianakis, Teja Tscharntke, Owen T. Lewis", "revista": "Nature", "data": "2007-01-01", "ano": 2007, "resumo": "", "url": "https://doi.org/10.1038/nature05429", "citacoes": 1002, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 19.713, "q": "Q1"}, {"key": "doi:10.1007/s11356-014-3471-x", "titulo": "Effects of neonicotinoids and fipronil on non-target invertebrates", "autores": "Lennard Pisa, Vanessa Amaral-Rogers, Luc Belzunces, Jean‐Marc Bonmatin, Craig A. Downs, Dave Goulson et al.", "revista": "Environmental Science and Pollution Research", "data": "2014-09-15", "ano": 2014, "resumo": "We assessed the state of knowledge regarding the effects of large-scale pollution with neonicotinoid insecticides and fipronil on non-target invertebrate species of terrestrial, freshwater and marine environments. A large section of the assessment is dedicated to the state of knowledge on sublethal effects on honeybees (Apis mellifera) because this important pollinator is the most studied non-target invertebrate species. Lepidoptera (butterflies and moths), Lumbricidae (earthworms), Apoidae sensu lato (bumblebees, solitary bees) and the section \"other invertebrates\" review available studies on", "url": "https://doi.org/10.1007/s11356-014-3471-x", "citacoes": 984, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)", "Apis (Apini)", "Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.909, "q": "Q1"}, {"key": "doi:10.1073/pnas.11 las Morison, Theodora Petanidou et al.", "revista": "Ecological Monographs", "data": "2008-10-23", "ano": 2008, "resumo": "Bee pollinators are currently recorded with many different sampling methods. However, the relative performances of these methods have not been systematically evaluated and compared. In response to the strong need to record ongoing shifts in pollinator diversity and abundance, global and regional pollinator initiatives must adopt standardized sampling protocols when developing large‐scale and long‐term monitoring schemes. We systematically evaluated the performance of six sampling methods (observation plots, pan traps, standardized and variable transect walks, trap nests with reed internodes or", "url": "https://doi.org/10.1890/07-1292.1", "citacoes": 804, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Europa"]}, "sjr": 3.776, "q": "Q1"}, {"key": "doi:10.1016/j.biocon.2010.03.024", "titulo": "Ecological and life-history traits predict bee species responses to environmental disturbances", "autores": "Neal M. Williams, Elizabeth E. Crone, T’ai H. Roulston, Robert L. Minckley, Laurence . Auteur du texte Packer, Simon Geoffrey Potts", "revista": "Biological Conservation", "data": "2010-04-26", "ano": 2010, "resumo": "", "url": "https://doi.org/10.1016/j.biocon.2010.03.024", "citacoes": 755, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.7, "q": "Q1"}, {"key": "doi:10.1038/nature14414", "titulo": "Bees prefer foods containing neonicotinoid pesticides", "autores": "Sébastien C. Kessler, Erin Jo Tiedeken, Kerry L. Simcock, Sophie Derveau, Jessica Mitchell, Samantha Softley et al.", "revista": "Nature", "data": "2015-04-22", "ano": 2015, "resumo": "", "url": "https://doi.org/10.1038/nature14414", "citacoes": 500, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 19.713, "q": "Q1"}, {"key": "doi:10.1038/20829", "titulo": "Orchid pollination by sexual swindle", "autores": "Florian P. Schiestl, Manfred Ayasse, Hannes F. Paulus, Christer Löfstedt, Bill S. Hansson, Fernando Ibarra et al.", "revista": "Nature", "data": "1999-06-03", "ano": 1999, "resumo": "", "url": "https://doi.org/10.1038/20829", "citacoes": 449, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 19.713, "q": "Q1"}, {"key": "doi:10.1371/journal.pone.0014357", "titulo": "RNA Viruses in Hymenopteran Pollinators: Evidence of Inter-Taxa Virus Transmission via Pollen and Potential Impact on Non-Apis Hymenopteran Species", "autores": "Rajwinder Singh, Abby L. Levitt, Edwin George Rajotte, Edward Charles Holmes, Nancy Ostiguy, Dennis vanEngelsdorp et al.", "revista": "PLoS ONE", "data": "2010-12-22", "ano": 2010, "resumo": "Although overall pollinator populations have declined over the last couple of decades, the honey bee (Apis mellifera) malady, colony collapse disorder (CCD), has caused major concern in the agricultural community. Among honey bee pathogens, RNA viruses are emerging as a serious threat and are suspected as major contributors to CCD. Recent detection of these viral species in bumble bees suggests a possible wider environmental spread of these viruses with potential broader impact. It is therefore vital to study the ecology and epidemiology of these viruses in the hymenopteran pollinator communit", "url": "https://doi.org/10.1371/journal.pone.0014357", "citacoes": 444, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)", "Apis (Apini)", "Solitárias"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["América do Norte"]}, "sjr": 0.726, "q": "Q1"}, {"key": "doi:10.2307/1939860", "titulo": "Patch Size, Pollinator Behavior, and Pollinator Limitation in Catnip", "autores": "Andrew Sih, Marie-Sylvie Baltus", "revista": "Ecology", "data": "1987-12-01", "ano": 1987, "resumo": "We examined the effects of the patch size of catnip, Nepeta cataria, on pollinator visitation rates and pollinator limitation. The most important floral visitors were honey bees (Apis mellifera), solitary bees (Halictidae), and bumble bees (Bombus spp.). Our first goal was to see how spatial variation in patch size affected the rate at which individual flowers received pollinator visits (visitation rate). Visitation rate was higher in larger patches for honey bees and bumble bees, but lower for solitary bees. Patch size explained 74-83% of the variation in visitation rate. Intraspecific isolat", "url": "https://doi.org/10.2307/1939860", "citacoes": 444, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)", "Apis (Apini)", "Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.767, "q": "Q1"}, {"key": "doi:10.1046/j.1365-2664.1998.355343.x", "titulo": "Bioindication using trap‐nesting bees and wasps and their natural enemies: community structure and interactions", "autores": "Teja Tscharntke, Achim Gathmann, Ingolf Steffan‐Dewenter", "revista": "Journal of Applied Ecology", "data": "1998-10-01", "ano": 1998, "resumo": "1. Results from four field studies show that communities of trap‐nesting bees and wasps and their natural enemies are promising bioindicators for ecological change or habitat quality. These small and easy‐to‐handle communities can be analysed with respect to (i) species richness and related parameters, and (ii) ecological functions or interactions. The communities comprise Hymenoptera (Apidae, Sphecidae, Eumenidae, Pompilidae) and natural enemies belonging to many insect taxa. Traps consisted of 150–200, 15–20‐cm long, reed internodes, put into tins or plastic tubes of 13–15 cm diameter; woode", "url": "https://doi.org/10.1046/j.1365-2664.1998.355343.x", "citacoes": 438, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Experimento ou campo", "Filogenia e taxonomia"], "Região": ["Região não citada"]}, "sjr": 1.765, "q": "Q1"}, {"key": "doi:10.1603/0013-8746(2008)101[140:braain]2.0.co;2", "titulo": "Bee Richness and Abundance in New York City Urban Gardens", "autores": "Kevin C. Matteson, John S. Ascher, Gail Langellotto", "revista": "Annals of the Entomological Society of America", "data": "2008-01-01", "ano": 2008, "resumo": "We describe the richness, abundance, and ecological characteristics of bees in community gardens located in heavily developed neighborhoods of the Bronx and East Harlem, NY. In total, 1,145 individual bees, representing 54 species (13% of the recorded New York State bee fauna) were collected over 4 yr. The nesting habits of these species include bees that nest in cavities (33% of species), hives (11% of species), pith (1.9% of species), wood (1.9% of species), or soft/rotting wood (7.4% of species) substrates. Soil-nesting individuals were relatively rare (25% of individuals), perhaps due to a", "url": "https://doi.org/10.1603/0013-8746(2008)101[140:braain]2.0.co;2", "citacoes": 432, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.709, "q": "Q1"}, {"key": "doi:10.1046/j.1523-1739.2002.01334.x", "titulo": "Grazing Intensity and the Diversity of Grasshoppers, Butterflies, and Trap‐Nesting Bees and Wasps", "autores": "Andreas Kruess, Teja Tscharntke", "revista": "Conservation Biology", "data": "2002-12-01", "ano": 2002, "resumo": "Abstract: The maintenance of grasslands as distinct habitats depends on regular management, usually through grazing or mowing, but their species diversity is known to decline with increasing management intensity. The reduction of management intensity can be a useful tool for the long‐term conservation of the biological diversity of grasslands. We analyzed floral and faunal diversity on intensively and extensively (unintensively) grazed pastures and on 5‐ to 10‐year‐old ungrazed grasslands in northern Germany. Each of the three grassland habitats differing in grazing intensity was replicated si", "url": "https://doi.org/10.1046/j.1523-1739.2002.01334.x", "citacoes": 423, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Europa"]}, "sjr": 2.004, "q": "Q1"}, {"key": "doi:10.1046/j.1523-1739.2003.01575.x", "titulo": "Importance of Habitat Area and Landscape Context for Species Richness of Bees and Wasps in Fragmented Orchard Meadows", "autores": "Ingolf Steffan‐Dewenter", "revista": "Conservation Biology", "data": "2003-07-16", "ano": 2003, "resumo": "Abstract: I investigated how habitat area, habitat connectivity, and landscape context affect the species richness and abundance of trap‐nesting bees, wasps, and their natural enemies. The research was done on 45 orchard meadows ranging in size from 0.08 to 5.8 ha and differing in habitat connectivity and the surrounding landscape matrix. Effects of the surrounding landscape matrix were restricted to circles with a radius of 250 m. Only the species richness of natural enemies increased with landscape diversity in the surrounding matrix. Population densities of bees increased with habitat conne", "url": "https://doi.org/10.1046/j.1523-1739.2003.01575.x", "citacoes": 392, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 2.004, "q": "Q1"}, {"key": "doi:10.1890/06-0269", "titulo": "RESOURCE DISTRIBUTIONS AMONG HABITATS DETERMINE SOLITARY BEE OFFSPRING PRODUCTION IN A MOSAIC LANDSCAPE", "autores": "Neal M. Williams, Claire Kremen", "revista": "Ecological Applications", "data": "2007-04-01", "ano": 2007, "resumo": "Within mosaic landscapes, many organisms depend on attributes of the environment that operate over scales ranging from a single habitat patch to the entire landscape. One such attribute is resource distribution. Organisms' reliance on resources from within a local patch vs. those found among habitats throughout the landscape will depend on local habitat quality, patch quality, and landscape composition. The ability of individuals to move among complementary habitat types to obtain various resources may be a critical mechanism underlying the dynamics of animal populations and ultimately the lev", "url": "https://doi.org/10.1890/06-0269", "citacoes": 389, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["América do Norte"]}, "sjr": 1.677, "q": "Q1"}, {"key": "doi:10.1890/1051-0761(2006)016[0632:crwadb]2.0.co;2", "titulo": "Complex Responses Within A Desert Bee Guild (Hymenoptera: Apiformes) To Urban Habitat Fragmentation", "autores": "James H. Cane, Robert L. Minckley, Linda J. Kervin, T’ai H. Roulston, Neal M. Williams", "revista": "Ecological Applications", "data": "2006-04-01", "ano": 2006, "resumo": "Urbanization within the Tucson Basin of Arizona during the past 50+ years has fragmented the original desert scrub into patches of different sizes and ages. These remnant patches and the surrounding desert are dominated by Larrea tridentata (creosote bush), a long-lived shrub whose flowers are visited by > 120 native bee species across its range. Twenty-one of these bee species restrict their pollen foraging to L. tridentata. To evaluate the response of this bee fauna to fragmentation, we compared species incidence and abundance patterns for the bee guild visiting L. tridentata at 59 habitat f", "url": "https://doi.org/10.1890/1051-0761(2006)016[0632:crwadb]2.0.co;2", "citacoes": 388, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Apis (Apini)", "Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Europa"]}, "sjr": 1.677, "q": "Q1"}, {"key": "doi:10.1371/journal.pone.0104679", "titulo": "Decreasing Abundance, Increasing Diversity and Changing Structure of the Wild Bee Community (Hymenoptera: Anthophila) along an Urbanization Gradient", "autores": "Laura Fortel, Mickaël Henry, Laurent Guilbaud, Anne-Laure Guirao, Michael T. Kuhlmann, Hugues Mouret et al.", "revista": "PLoS ONE", "data": "2014-08-13", "ano": 2014, "resumo": "BACKGROUND: Wild bees are important pollinators that have declined in diversity and abundance during the last decades. Habitat destruction and fragmentation associated with urbanization are reported as part of the main causes of this decline. Urbanization involves dramatic changes of the landscape, increasing the proportion of impervious surface while decreasing that of green areas. Few studies have investigated the effects of urbanization on bee communities. We assessed changes in the abundance, species richness, and composition of wild bee community along an urbanization gradient. METHODOLOG", "url": "https://doi.org/10.1371/journal.pone.0104679", "citacoes": 371, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Europa"]}, "sjr": 0.726, "q": "Q1"}, {"key": "doi:10.1046/j.1365-2664.2003.00847.x", "titulo": "Pollination of Coffea canephora in relation to local and regional agroforestry management", "autores": "Alexandra‐Maria Klein, Ingolf Steffan‐Dewenter, Teja Tscharntke", "revista": "Journal of Applied Ecology", "data": "2003-09-26", "ano": 2003, "resumo": "Summary Pollination of crops depends on local agricultural management and the quality of adjacent habitats. Lowland coffee Coffea canephora, is an important tropical cash crop. Fruit set depends on cross‐pollination by bees, so inadequate pollination leads to reduced yield. In this study we analyse the relationship between bee pollinators, fruit set in coffee, and the local and regional agroforestry systems to identify the optimal conditions for pollinators. We analysed the abundance and species composition of coffee flower‐visiting bees in 15 agroforestry systems differing in distance to fore", "url": "https://doi.org/10.1046/j.1365-2664.2003.00847.x", "citacoes": 370, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Ásia e Oceania"]}, "sjr": 1.765, "q": "Q1"}, {"key": "doi:10.1007/s10531-004-6066-x", "titulo": "Urban domestic gardens (II): experimental tests of methods for increasing biodiversity", "autores": "Kevin J. Gaston, Richard M. Smith, Ken A. Thompson, Philip H. Warren", "revista": "Biodiversity and Conservation", "data": "2005-02-01", "ano": 2005, "resumo": "", "url": "https://doi.org/10.1007/s10531-004-6066-x", "citacoes": 332, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Experimento ou campo"], "Região": ["Região não citada"]}, "sjr": 1.025, "q": "Q1"}, {"key": "doi:10.1098/rspb.2012.1621", "titulo": "Diverse pollinator communities enhance plant reproductive success", "autores": "Matthias Albrecht, Bernhard Schmid, Yann Hautier, CHRISTINE B. MÜLLER", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2012-10-03", "ano": 2012, "resumo": "Understanding the functional consequences of biodiversity loss is a major goal of ecology. Animal-mediated pollination is an essential ecosystem function and service provided to mankind. However, little is known how pollinator diversity could affect pollination services. Using a substitutive design, we experimentally manipulated functional group (FG) and species richness of pollinator communities to investigate their consequences on the reproductive success of an obligate out-crossing model plant species, Raphanus sativus. Both fruit and seed set increased with pollinator FG richness. Furtherm", "url": "https://doi.org/10.1098/rspb.2012.1621", "citacoes": 330, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.408, "q": "Q1"}, {"key": "doi:10.1111/j.2007.0030-1299.16303.x", "titulo": "Agricultural landscapes with organic crops support higher pollinator diversity", "autores": "Andrea Holzschuh, Ingolf Steffan‐Dewenter, Teja Tscharntke", "revista": "Oikos", "data": "2007-12-14", "ano": 2007, "resumo": "Pollinators are traditionally thought to perceive non‐flowering crop fields as hostile landscape matrix. In this study, we show that landscapes composed of higher proportions of organic crop fields support more bee species at greater abundances in fallow strips. An increase in organic cropping in the surrounding landscape from 5% to 20% enhanced bee species richness in fallow strips by 50%, density of solitary bees by 60% and bumble bee density by 150%. Bee species richness and bumble bee density responded strongest to organic cropping in landscape sectors with 500 m radius, solitary bee densi", "url": "https://doi.org/10.1111/j.2007.0030-1299.16303.x", "citacoes": 330, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)", "Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.374, "q": "Q1"}, {"key": "doi:10.1098/rspb.2006.3721", "titulo": "Importance of pollinators in changing landscapes for world crops", "autores": "Alexandra‐Maria Klein, Bernard E Vaissiere, James H. Cane, Ingolf Steffan‐Dewenter, Saul Alan Cunningham, Claire Kremen et al.", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2006-10-27", "ano": 2006, "resumo": "The extent of our reliance on animal pollination for world crop production for human food has not previously been evaluated and the previous estimates for countries or continents have seldom used primary data. In this review, we expand the previous estimates using novel primary data from 200 countries and found that fruit, vegetable or seed production from 87 of the leading global food crops is dependent upon animal pollination, while 28 crops do not rely upon animal pollination. However, global production volumes give a contrasting perspective, since 60% of global production comes from crops ", "url": "https://doi.org/10.1098/rspb.2006.3721", "citacoes": 7328, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.408, "q": "Q1"}, {"key": "doi:10.1037/0022-3514.92.6.1087", "titulo": "Grit: Perseverance and passion for long-term goals.", "autores": "Angela Lee Duckworth, Christopher Peterson, Michael D. Matthews, Dennis R. Kelly", "revista": "Journal of Personality and Social Psychology", "data": "2007-01-01", "ano": 2007, "resumo": "The importance of intellectual talent to achievement in all professional domains is well established, but less is known about other individual differences that predict success. The authors tested the importance of 1 noncognitive trait: grit. Defined as perseverance and passion for long-term goals, grit accounted for an average of 4% of the variance in success outcomes, including educational attainment among 2 samples of adults (N=1,545 and N=690), grade point average among Ivy League undergraduates (N=138), retention in 2 classes of United States Military Academy, West Point, cadets (N=1,218 a", "url": "https://doi.org/10.1037/0022-3514.92.6.1087", "citacoes": 6977, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["América do Norte"]}, "sjr": 3.767, "q": "Q1"}, {"key": "doi:10.1016/0006-3207(92)91201-3", "titulo": "Conservation evaluation and phylogenetic diversity", "autores": "Daniel P. Faith", "revista": "Biological Conservation", "data": "1992-01-01", "ano": 1992, "resumo": "", "url": "https://doi.org/10.1016/0006-3207(92)91201-3", "citacoes": 5956, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Região não citada"]}, "sjr": 1.7, "q": "Q1"}, {"key": "doi:10.1126/science.1255957", "titulo": "Bee declines driven by combined stress from parasites, pesticides, and lack of flowers", "autores": "Dave Goulson, Elizabeth Nicholls, Cristina Botías, Ellen L. Rotheray", "revista": "Science", "data": "2015-02-26", "ano": 2015, "resumo": "Bees are subject to numerous pressures in the modern world. The abundance and diversity of flowers has declined; bees are chronically exposed to cocktails of agrochemicals, and they are simultaneously exposed to novel parasites accidentally spread by humans. Climate change is likely to exacerbate these problems in the future. Stressors do not act in isolation; for example, pesticide exposure can impair both detoxification mechanisms and immune responses, rendering bees more susceptible to parasites. It seems certain that chronic exposure to multiple interacting stressors is driving honey bee c", "url": "https://doi.org/10.1126/science.1255957", "citacoes": 4145, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Apis (Apini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 10.948, "q": "Q1"}, {"key": "doi:10.1038/nature10947", "titulo": "Emerging fungal threats to animal, plant and ecosystem health", "autores": "Matthew C. Fisher, Daniel A. Henk, Cheryl J. Briggs, John S. Brownstein, Lawrence C. Madoff, Sarah McCraw et al.", "revista": "Nature", "data": "2012-04-01", "ano": 2012, "resumo": "", "url": "https://doi.org/10.1038/nature10947", "citacoes": 3424, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 19.713, "q": "Q1"}, {"key": "doi:10.1126/science.1127863", "titulo": "Parallel Declines in Pollinators and Insect-Pollinated Plants in Britain and the Netherlands", "autores": "Jacobus Christiaan Biesmeijer, Stuart P. M. Roberts, Menno Reemer, Ralf Ohlemüller, Mike Edwards, Theo Peeters et al.", "revista": "Science", "data": "2006-07-20", "ano": 2006, "resumo": "Despite widespread concern about declines in pollination services, little is known about the patterns of change in most pollinator assemblages. By studying bee and hoverfly assemblages in Britain and the Netherlands, we found evidence of declines (pre-versus post-1980) in local bee diversity in both countries; however, divergent trends were observed in hoverflies. Depending on the assemblage and location, pollinator declines were most frequent in habitat and flower specialists, in univoltine species, and/or in nonmigrants. In conjunction with this evidence, outcrossing plant species that are r", "url": "https://doi.org/10.1126/science.1127863", "citacoes": 3233, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Europa"]}, "sjr": 10.948, "q": "Q1"}, {"key": "doi:10.2307/2265575", "titulo": "Generalization in Pollination Systems, and Why it Matters", "autores": "Nikolas M. Waser, Lars Chıttka, Mary V. Price, Neal M. Williams, Jeff Ollerton", "revista": "Ecology", "data": "1996-06-01", "ano": 1996, "resumo": "One view of pollination systems is that they tend toward specialization. This view is implicit in many discussions of angiosperm evolution and plant—pollinator coevolution and in the long—standing concept of p ollination syndromes. But actual pollination systems often are more generalized and dynamic than these traditions might suggest. To illustrate the range of specialization and generalization in pollinators' use of plants and vice versa, we draw on studies of two floras in the United States, and of members of several plant families and solitary bee genera. We also summarize a recent study ", "url": "https://doi.org/10.2307/2265575", "citacoes": 1966, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["América do Norte"]}, "sjr": 1.767, "q": "Q1"}, {"key": "doi:10.1073/pnas.262413599", "titulo": "Crop pollination from native bees at risk from agricultural intensification", "autores": "Claire Kremen, Neal M. Williams, Robbin W. Thorp", "revista": "Proceedings of the National Academy of Sciences", "data": "2002-12-16", "ano": 2002, "resumo": "Ecosystem services are critical to human survival; in selected cases, maintaining these services provides a powerful argument for conserving biodiversity. Yet, the ecological and economic underpinnings of most services are poorly understood, impeding their conservation and management. For centuries, farmers have imported colonies of European honey bees (Apis mellifera) to fields and orchards for pollination services. These colonies are becoming increasingly scarce, however, because of diseases, pesticides, and other impacts. Native bee communities also provide pollination services, but the amo", "url": "https://doi.org/10.1073/pnas.262413599", "citacoes": 1937, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Apis (Apini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Europa"]}, "sjr": 3.283, "q": "Q1"}, {"key": "doi:10.1007/s00442-007-0752-9", "titulo": "Bee foraging ranges and their relationship to body size", "autores": "Sarah S. Greenleaf, Neal M. Williams, Rachael Winfree, Claire Kremen", "revista": "Oecologia", "data": "2007-05-05", "ano": 2007, "resumo": "", "url": "https://doi.org/10.1007/s00442-007-0752-9", "citacoes": 1825, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.909, "q": "Q1"}, {"key": "doi:10.1214/06-ba104", "titulo": "Variational inference for Dirichlet process mixtures", "autores": "David M. Blei, Michael I. Jordan", "revista": "Bayesian Analysis", "data": "2006-03-01", "ano": 2006, "resumo": "Dirichlet process (DP) mixture models are the cornerstone of nonparametric Bayesian statistics, and the development of Monte-Carlo Markov chain (MCMC) sampling methods for DP mixtures has enabled the application of nonparametric Bayesian methods to a variety of practical data analysis problems. However, MCMC sampling can be prohibitively slow, and it is important to explore alternatives. One class of alternatives is provided by variational methods, a class of deterministic algorithms that convert inference problems into optimization problems (Opper and Saad 2001; Wainwright and Jordan 2003). T", "url": "https://doi.org/10.1214/06-ba104", "citacoes": 1482, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.543, "q": "Q1"}, {"key": "doi:10.1111/j.1461-0248.2008.01157.x", "titulo": "Landscape effects on crop pollination services: are there general patterns?", "autores": "Taylor H. Ricketts, James Regetz, Ingolf Steffan‐Dewenter, Saul Alan Cunningham, Claire Kremen, Anne Bogdanski et al.", "revista": "Ecology Letters", "data": "2008-02-19", "ano": 2008, "resumo": "Pollination by bees and other animals increases the size, quality, or stability of harvests for 70% of leading global crops. Because native species pollinate many of these crops effectively, conserving habitats for wild pollinators within agricultural landscapes can help maintain pollination services. Using hierarchical Bayesian techniques, we synthesize the results of 23 studies - representing 16 crops on five continents - to estimate the general relationship between pollination services and distance from natural or semi-natural habitats. We find strong exponential declines in both pollinator", "url": "https://doi.org/10.1111/j.1461-0248.2008.01157.x", "citacoes": 1400, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 3.382, "q": "Q1"}, {"key": "doi:10.1073/pnas.1002720107", "titulo": "Conservation and divergence of methylation patterning in plants and animals", "autores": "Suhua Feng, Shawn J. Cokus, Xiaoyu Zhang, Pao‐Yang Chen, Magnolia L. Bostick, Mary Grace Goll et al.", "revista": "Proceedings of the National Academy of Sciences", "data": "2010-04-15", "ano": 2010, "resumo": "Cytosine DNA methylation is a heritable epigenetic mark present in many eukaryotic organisms. Although DNA methylation likely has a conserved role in gene silencing, the levels and patterns of DNA methylation appear to vary drastically among different organisms. Here we used shotgun genomic bisulfite sequencing (BS-Seq) to compare DNA methylation in eight diverse plant and animal genomes. We found that patterns of methylation are very similar in flowering plants with methylated cytosines detected in all sequence contexts, whereas CG methylation predominates in animals. Vertebrates have methyla", "url": "https://doi.org/10.1073/pnas.1002720107", "citacoes": 1363, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Apis (Apini)"], "Tipo de estudo": ["Genética e molecular"], "Região": ["Região não citada"]}, "sjr": 3.283, "q": "Q1"}, {"key": "doi:10.1111/ele.12082", "titulo": "A global quantitative synthesis of local and landscape effects on wild bee pollinators in agroecosystems", "autores": "Christina Marie Kennedy, Eric V. Lonsdorf, Maile C. Neel, Neal M. Williams, Taylor H. Ricketts, Rachael Winfree et al.", "revista": "Ecology Letters", "data": "2013-03-11", "ano": 2013, "resumo": "Bees provide essential pollination services that are potentially affected both by local farm management and the surrounding landscape. To better understand these different factors, identificado"], "Região": ["Região não citada"]}, "sjr": 3.283, "q": "Q1"}, {"key": "doi:10.1890/0012-9658(2002)083[1421:sdeolc]2.0.co;2", "titulo": "SCALE-DEPENDENT EFFECTS OF LANDSCAPE CONTEXT ON THREE POLLINATOR GUILDS", "autores": "Ingolf Steffan‐Dewenter, Ute Münzenberg, Christof Bürger, Carsten Thies, Teja Tscharntke", "revista": "Ecology", "data": "2002-05-01", "ano": 2002, "resumo": "Most ecological processes and interactions depend on scales much larger than a single habitat, and therefore it is important to link spatial patterns and ecological processes at a landscape scale. Here, we analyzed the effects of landscape context on the distribution of bees (Hymenoptera: Apoidea) at multiple spatial scales with respect to the following hypotheses: (1) Local abundance and diversity of bees increase with increasing proportion of the surrounding seminatural habitats. (2) Solitary wild bees, bumble bees, and honey bees respond to landscape context at different spatial scales. We ", "url": "https://doi.org/10.1890/0012-9658(2002)083[1421:sdeolc]2.0.co;2", "citacoes": 1188, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)", "Apis (Apini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.767, "q": "Q1"}, {"key": "doi:10.1046/j.1365-2656.2002.00641.x", "titulo": "Foraging ranges of solitary bees", "autores": "Achim Gathmann, Teja Tscharntke", "revista": "Journal of Animal Ecology", "data": "2002-09-01", "ano": 2002, "resumo": "Summary Habitat requirements of solitary bees include nesting sites, food resources and nesting material. We used translocation experiments to establish foraging distances and measured foraging trip duration to analyse how solitary bees cope with the distance between nesting sites and suitable food plants in different habitat types. Maximum foraging distance between nesting site and food patch was 150–600 m ntries", "autores": "David Kleijn, Rocío A. Baquero, Yann Clough, Mario Dı́az, J. De Esteban, Federico Fernández‐González et al.", "revista": "Ecology Letters", "data": "2006-01-12", "ano": 2006, "resumo": "Agri-environment schemes are an increasingly important tool for the maintenance and restoration of farmland biodiversity in Europe but their ecological effects are poorly known. Scheme design is partly based on non-ecological considerations and poses important restrictions on evaluation studies. We describe a robust approach to evaluate agri-environment schemes and use it to evaluate the biodiversity effects of agri-environment schemes in five European countries. We compared species density of vascular plants, birds, bees, grasshoppers and crickets, and spiders on 202 paired fields, one with a", "url": "https://doi.org/10.1111/j.1461-0248.2005.00869.x", "citacoes": 1079, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Europa"]}, "sjr": 3.382, "q": "Q1"}, {"key": "doi:10.1890/08-1245.1", "titulo": "A meta‐analysis of bees' responses to anthropogenic disturbance", "autores": "Rachael Winfree, Ramiro Aguilar, Diego Pedro Vázquez, Gretchen LeBuhn, Marcelo A. Aizen", "revista": "Ecology", "data": "2009-07-24", "ano": 2009, "resumo": "Pollinators may be declining globally, a matter of concern because animal pollination is required by most of the world's plant species, including many crop plants. Human land use and the loss of native habitats is thought to be an important driver of decline for wild, native pollinators, yet the findings of published studies on this topic have never been quantitatively synthesized. Here we use meta-analysis to synthesize the literature on how bees, the most important group of pollinators, are affected by human disturbances such as habitat loss, grazing, logging, and agriculture. We obtained 13", "url": "https://doi.org/10.1890/08-1245.1", "citacoes": 1056, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Revisão ou síntese"], "Região": ["Região não citada"]}, "sjr": 1.767, "q": "Q1"}, {"key": "doi:10.1038/nature05429", "titulo": "Habitat modification alters the structure of tropical host–parasitoid food webs", "autores": "Jason M. Tylianakis, Teja Tscharntke, Owen T. Lewis", "revista": "Nature", "data": "2007-01-01", "ano": 2007, "resumo": "", "url": "https://doi.org/10.1038/nature05429", "citacoes": 1002, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 19.713, "q": "Q1"}, {"key": "doi:10.1038/ncomms8414", "titulo": "Delivery of crop pollination services is an insufficient argument for wild pollinator conservation", "autores": "David Kleijn, Rachael Winfree, Ígnasi Bartomeus, Luísa G. Carvalheiro, Mickaël Henry, Rufus Isaacs et al.", "revista": "Nature Communications", "data": "2015-06-16", "ano": 2015, "resumo": "There is compelling evidence that more diverse ecosystems deliver greater benefits to people, and these ecosystem services have become a key argument for biodiversity conservation. However, it is unclear how much biodiversity is needed to deliver ecosystem services in a cost-effective way. Here we show that, while the contribution of wild bees to crop production is significant, service delivery is restricted to a limited subset of all known bee species. Across crops, years and biogeographical regions, crop-visiting wild bee communities are dominated by a small number of common species, and thr", "url": "https://doi.org/10.1038/ncomms8414", "citacoes": 998, "fonte": "OpenAlex", "topico": "Diversidade, amostragem ervation of Biodiversity and Stability of Food Crop Yields", "autores": "", "revista": "Conservation Biology", "data": "1998-02-11", "ano": 1998, "resumo": "Following reports of dramatic declines in managed and feral honey bees from nearly every region of North America, scientists and resource managers from the U.S., Mexico, and Canada came together to review the quality of the evidence that honey bees as well as other pollinators are in long-term decline and to consider the potential consequences of these losses on the conservation of biodiversity and the stability of the yield of food crops. These experts in pollination ecology confirmed that the last 5 years of losses of honeybee colonies in North America leave us with fewer managed pollinators", "url": "https://doi.org/10.1046/j.1523-1739.1998.97154.x", "citacoes": 817, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Apis (Apini)"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Neotrópico (fora do Brasil)", "América do Norte"]}, "sjr": 2.004, "q": "Q1"}, {"key": "doi:10.1890/07-1292.1", "titulo": "MEASURING BEE DIVERSITY IN DIFFERENT EUROPEAN HABITATS AND BIOGEOGRAPHICAL REGIONS", "autores": "Catrin Westphal, Riccardo Bommarco, Gabriel Carré, Ellen Lamborn, Nicolas Morison, Theodora Petanidou et al.", "revista": "Ecological Monographs", "data": "2008-10-23", "ano": 2008, "resumo": "Bee pollinators are currently recorded with many different sampling methods. However, the relative performances of these methods have not been systematically evaluated and compared. In response to the strong need to record ongoing shifts in pollinator diversity and abundance, global and regional pollinator initiatives must adopt standardized sampling protocols when developing large‐scale and long‐term monitoring schemes. We systematically evaluated the performance of six sampling methods (observation plots, pan traps, standardized and variable transect walks, trap nests with reed internodes or", "url": "https://doi.org/10.1890/07-1292.1", "citacoes": 804, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Europa"]}, "sjr": 3.776, "q": "Q1"}, {"key": "doi:10.1098/rspb.2006.3721", "titulo": "Importance of pollinators in changing landscapes for world crops", "autores": "Alexandra‐Maria Klein, Bernard E Vaissiere, James H. Cane, Ingolf Steffan‐Dewenter, Saul Alan Cunningham, Claire Kremen et al.", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2006-10-27", "ano": 2006, "resumo": "The extent of our reliance on animal pollination for world crop production for human food has not previously been evaluated and the previous estimates for countries or continents have seldom used primary data. In this review, we expand the previous estimates using novel primary data from 200 countries and found that fruit, vegetable or seed production from 87 of the leading global food crops is dependent upon animal pollination, while 28 crops do not rely upon animal pollination. However, global production volumes give a contrasting perspective, since 60% of global production comes from crops ", "url": "https://doi.org/10.1098/rspb.2006.3721", "citacoes": 7328, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.408, "q": "Q1"}, {"key": "doi:10.1126/science.1255957", "titulo": "Bee declines driven by combined stress from parasites, pesticides, and lack of flowers", "autores": "Dave Goulson, Elizabeth Nicholls, Cristina Botías, Ellen L. Rotheray", "revista": "Science", "data": "2015-02-26", "ano": 2015, "resumo": "Bees are subject to numerous pressures in the modern world. The abundance and diversity of flowers has declined; bees are chronically exposed to cocktails of agrochemicals, and they are simultaneously exposed to novel parasites accidentally spread by humans. Climate change is likely to exacerbate these problems in the future. Stressors do not act in isolation; for example, pesticide exposure can impair both detoxification mechanisms and immune responses, rendering bees more susceptible to parasites. It seems certain that chronic exposure to multiple interacting stressors is driving honey bee c", "url": "https://doi.org/10.1126/science.1255957", "citacoes": 4145, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Apis (Apini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 10.948, "q": "Q1"}, {"key": "doi:10.1126/science.1127863", "titulo": "Parallel Declines in Pollinators and Insect-Pollinated Plants in Britain and the Netherlands", "autores": "Jacobus Christiaan Biesmeijer, Stuart P. M. Roberts, Menno Reemer, Ralf Ohlemüller, Mike Edwards, Theo Peeters et al.", "revista": "Science", "data": "2006-07-20", "ano": 2006, "resumo": "Despite widespread concern about declines in pollination services, little is known about the patterns of change in most pollinator assemblages. By studying bee and hoverfly assemblages in Britain and the Netherlands, we found evidence of declines (pre-versus post-1980) in local bee diversity in both countries; however, divergent trends were observed in hoverflies. Depending on the assemblage and location, pollinator declines were most frequent in habitat and flower specialists, in univoltine species, and/or in nonmigrants. In conjunction with this evidence, outcrossing plant species that are r", "url": "https://doi.org/10.1126/science.1127863", "citacoes": 3233, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Europa"]}, "sjr": 10.948, "q": "Q1"}, {"key": "doi:10.1073/pnas.262413599", "titulo": "Crop pollination from native bees at risk from agricultural intensification", "autores": "Claire Kremen, Neal M. Williams, Robbin W. Thorp", "revista": "Proceedings of the National Academy of Sciences", "data": "2002-12-16", "ano": 2002, "resumo": "Ecosystem services are critical to human survival; in selected cases, maintaining these services provides a powerful argument for conserving biodiversity. Yet, the ecological and economic underpinnings of most services are poorly understood, impeding their conservation and management. For centuries, farmers have imported colonies of European honey bees (Apis mellifera) to fields and orchards for pollination services. These colonies are becoming increasingly scarce, however, because of diseases, pesticides, and other impacts. Native bee communities also provide pollination services, but the amo", "url": "https://doi.org/10.1073/pnas.262413599", "citacoes": 1937, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Apis (Apini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Europa"]}, "sjr": 3.283, "q": "Q1"}, {"key": "doi:10.1073/pnas.1014743108", "titulo": "Patterns of widespread decline in North American bumble bees", "autores": "Sydney A. Cameron, Jeffrey D. Lozier, James P. Strange, Jonathan Berenguer Uhuad Koch, Nils Cordes, Leellen F. Solter et al.", "revista": "Proceedings of the National Academy of Sciences", "data": "2011-01-03", "ano": 2011, "resumo": "Bumble bees (Bombus) are vitally important pollinators of wild plants and agricultural crops worldwide. Fragmentary observations, however, have suggested population declines in several North American species. Despite rising concern over these observations in the United States, highlighted in a recent National Academy of Sciences report, a national assessment of the geographic scope and possible causal factors of bumble bee decline is lacking. Here, we report results of a 3-y interdisciplinary study of changing distributions, population genetic structure, and levels of pathogen infection in bum", "url": "https://doi.org/10.1073/pnas.1014743108", "citacoes": 1660, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)"], "Tipo de estudo": ["Genética e molecular"], "Região": ["América do Norte"]}, "sjr": 3.283, "q": "Q1"}, {"key": "doi:10.1111/j.1461-0248.2008.01157.x", "titulo": "Landscape effects on crop pollination services: are there general patterns?", "autores": "Taylor H. Ricketts, James Regetz, Ingolf Steffan‐Dewenter, Saul Alan Cunningham, Claire Kremen, Anne Bogdanski et al.", "revista": "Ecology Letters", "data": "2008-02-19", "ano": 2008, "resumo": "Pollination by bees and other animals increases the size, quality, or stability of harvests for 70% of leading global crops. Because native species pollinate many of these crops effectively, conserving habitats for wild pollinators within agricultural landscapes can help maintain pollination services. Using hierarchical Bayesian techniques, we synthesize the results of 23 studies - representing 16 crops on five continents - to estimate the general relationship between pollination services and distance from natural or semi-natural habitats. We find strong exponential declines in both pollinator", "url": "https://doi.org/10.1111/j.1461-0248.2008.01157.x", "citacoes": 1400, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 3.382, "q": "Q1"}, {"key": "doi:10.1371/journal.pone.0006481", "titulo": "Colony Collapse Disorder: A Descriptive Study", "autores": "Dennis vanEngelsdor /science.1215025", "citacoes": 1312, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)", "Apis (Apini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 10.948, "q": "Q1"}, {"key": "doi:10.1111/ele.12082", "titulo": "A global quantitative synthesis of local and landscape effects on wild bee pollinators in agroecosystems", "autores": "Christina Marie Kennedy, Eric V. Lonsdorf, Maile C. Neel, Neal M. Williams, Taylor H. Ricketts, Rachael Winfree et al.", "revista": "Ecology Letters", "data": "2013-03-11", "ano": 2013, "resumo": "Bees provide essential pollination services that are potentially affected both by local farm management and the surrounding landscape. To better understand these different factors, we modelled the relative effects of landscape composition (nesting and floral resources within foraging distances), landscape configuration (patch shape, interpatch connectivity and habitat aggregation) and farm management (organic vs. conventional and local-scale field diversity), and their interactions, on wild bee abundance and richness for 39 crop systems globally. Bee abundance and richness were higher in diver", "url": "https://doi.org/10.1111/ele.12082", "citacoes": 1275, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Revisão ou síntese"], "Região": ["Região não citada"]}, "sjr": 3.382, "q": "Q1"}, {"key": "doi:10.1038/nature14420", "titulo": "Seed coating with a neonicotinoid insecticide negatively affects wild bees", "autores": "Maj Rundlöf, Georg K.S. Andersson, Riccardo Bommarco, Ingemar Fries, Veronica Hederström, Lina Herbertsson et al.", "revista": "Nature", "data": "2015-04-22", "ano": 2015, "resumo": "", "url": "https://doi.org/10.1038/nature14420", "citacoes": 1111, "fonte": "OpenAlex", "topico":
