Rufus Isaacs et al.", "revista": "Nature Communications", "data": "2015-06-16", "ano": 2015, "resumo": "There is compelling evidence that more diverse ecosystems deliver greater benefits to people, and these ecosystem services have become a key argument for biodiversity conservation. However, it is unclear how much biodiversity is needed to deliver ecosystem services in a cost-effective way. Here we show that, while the contribution of wild bees to crop production is significant, service delivery is restricted to a limited subset of all known bee species. Across crops, years and biogeographical regions, crop-visiting wild bee communities are dominated by a small number of common species, and thr", "url": "https://doi.org/10.1038/ncomms8414", "citacoes": 998, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 4.904, "q": "Q1"}, {"key": "doi:10.1007/s11356-014-3471-x", "titulo": "Effects of neonicotinoids and fipronil on non-target invertebrates", "autores": "Lennard Pisa, Vanessa Amaral-Rogers, Luc Belzunces, Jean‐Marc Bonmatin, Craig A. Downs, Dave Goulson et al.", "revista": "Environmental Science and Pollution Research", "data": "2014-09-15", "ano": 2014, "resumo": "We assessed the state of knowledge regarding the effects of large-scale pollution with neonicotinoid insecticides and fipronil on non-target invertebrate species of terrestrial, freshwater and marine environments. A large section of the assessment is dedicated to the state of knowledge on sublethal effects on honeybees (Apis mellifera) because this important pollinator is the most studied non-target invertebrate species. Lepidoptera (butterflies and moths), Lumbricidae (earthworms), Apoidae sensu lato (bumblebees, solitary bees) and the section \"other invertebrates\" review available studies on", "url": "https://doi.org/1 pis (Apini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.726, "q": "Q1"}, {"key": "doi:10.1111/j.1461-0248.2004.00662.x", "titulo": "The area requirements of an ecosystem service: crop pollination by native bee communities in California", "autores": "Claire Kremen, Neal M. Williams, Robert L. Bugg, John P. Fay, Robin W. Thorp", "revista": "Ecology Letters", "data": "2004-09-22", "ano": 2004, "resumo": "Abstract Managing ecosystem services is critical to human survival, yet we do not know how large natural areas must be to support these services. We investigated how crop pollination services provided by native, unmanaged, bee communities varied on organic and conventional farms situated along a gradient of isolation from natural habitat. Pollination services from native bees were significantly, positively related to the proportion of upland natural habitat in the vicinity of farm sites, but not to any other factor studied, including farm type, insecticide usage, field size and honeybee abunda", "url": "https://doi.org/10.1111/j.1461-0248.2004.00662.x", "citacoes": 832, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Apis (Apini)"], "Tipo de estudo": ["Não identificado"], "Região": ["América do Norte"]}, "sjr": 3.382, "q": "Q1"}, {"key": "doi:10.1111/j.1365-2664.2010.01939.x", "titulo": "Multifunctional shade-tree management in tropical agroforestry landscapes - a review", "autores": "Teja Tscharntke, Yann Clough, Shonil Bhagwat, Damayanti Buchori, Heiko Faust, Dietrich Hertel et al.", "revista": "Journal of Applied Ecology", "data": "2011-01-31", "ano": 2011, "resumo": "1. Agricultural intensification reduces ecological resilience of land-use systems, whereas paradoxically, environmental change and climate extremes require a higher response capacity than ever. Adaptation strategies to environmental change include maintenance of shade trees in tropical agroforestry, but conversion of shaded to unshaded systems is common practice to increase short-term yield.2. In this paper, we review the short-term and long-term ecological benefits of shade trees in coffee Coffea arabica, C. canephora and cacao Theobroma cacao agroforestry and emphasize the poorly understood,", "url": "https://doi.org/10.1111/j.1365-2664.2010.01939.x", "citacoes": 823, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Revisão ou síntese"], "Região": ["Brasil", "Ásia e Oceania"]}, "sjr": 1.765, "q": "Q1"}, {"key": "doi:10.1046/j.1523-1739.1998.97154.x", "titulo": "The Potential Consequences of Pollinator Declines on the Conservation of Biodiversity and Stability of Food Crop Yields", "autores": "", "revista": "Conservation Biology", "data": "1998-02-11", "ano": 1998, "resumo": "Following reports of dramatic declines in managed and feral honey bees from nearly every region of North America, scientists and resource managers from the U.S., Mexico, and Canada came together to review the quality of the evidence that honey bees as well as other pollinators are in long-term decline and to consider the potential consequences of these losses on the conservation of biodiversity and the stability of the yield of food crops. These experts in pollination ecology confirmed that the last 5 years of losses of honeybee colonies in North America leave us with fewer managed pollinators", "url": "https://doi.org/10.1046/j.1523-1739.1998.97154.x", "citacoes": 817, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Apis (Apini)"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Neotrópico (fora do Brasil)", "América do Norte"]}, "sjr": 2.004, "q": "Q1"}, {"key": "doi:10.1890/07-1292.1", "titulo": "MEASURING BEE DIVERSITY IN DIFFERENT EUROPEAN HABITATS AND BIOGEOGRAPHICAL REGIONS", "autores": "Catrin Westphal, Riccardo Bommarco, Gabriel Carré, Ellen Lamborn, Nicolas Morison, Theodora Petanidou et al.", "revista": "Ecological Monographs", "data": "2008-10-23", "ano": 2008, "resumo": "Bee pollinators are currently recorded with many different sampling methods. However, the relative performances of these methods have not been systematically evaluated and compared. In response to the strong need to record ongoing shifts in pollinator diversity and abundance, global and regional pollinator initiatives must adopt standardized sampling protocols when developing large‐scale and long‐term monitoring schemes. We systematically evaluated the performance of six sampling methods (observation plots, pan traps, standardized and variable transect walks, trap nests with reed internodes or", "url": "https://doi.org/10.1890/07-1292.1", "citacoes": 804, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Europa"]}, "sjr": 3.776, "q": "Q1"}, {"key": "doi:10.1371/journal.pone.0037235", "titulo": "Insect Pollinated Crops, Insect Pollinators and US Agriculture: Trend Analysis of Aggregate Data for the Period 1992–2009", "autores": "Nicholas W. Calderone", "revista": "PLoS ONE", "data": "2012-05-22", "ano": 2012, "resumo": "In the US, the cultivated area (hectares) and production (tonnes) of crops that require or benefit from insect pollination (directly dependent crops: apples, almonds, blueberries, cucurbits, etc.) increased from 1992, the first year in this study, through 1999 and continued near those levels through 2009; aggregate yield (tonnes/hectare) remained unchanged. The value of directly dependent crops attributed to all insect pollination (2009 USD) decreased from $14.29 billion in 1996, the first year for value data in this study, to $10.69 billion in 2001, but increased thereafter, reaching $15.1 ination by bees in a mosaic of agricultural and natural habitats in California and dung burial by dung beetles on recently created islands in Venezuela. We found that large-bodied bee and", "url": "https://doi.org/10.1111/j.1461-0248.2005.00749.x", "citacoes": 706, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Modelagem ou simulação"], "Região": ["Neotrópico (fora do Brasil)", "América do Norte"]}, "sjr": 3.382, "q": "Q1"}, {"key": "doi:10.2307/1939537", "titulo": "Floral Character Displacement Generates Assemblage Structure of Western Australian Triggerplants (Stylidium)", "autores": "W. Scott Armbruster, Mary E. Edwards, Edward M. Debevec", "revista": "Ecology", "data": "1994-03-01", "ano": 1994, "resumo": "We studied the pollination ecology and assemblage structure of 31 species of Stylidium (Stylidiaceae) at 25 sites in Western Australia. The number of species per study site varied between two and size. Stylidium species are pollinated by a variety of nectar—seeking solitary bees and bombyliid flies. Within and among species there is significant variation in nectar—tube length (and therefore in the insects that visit the flowers) and in pollen placement on pollinators. Pollen is placed “explosively” on the insect by a motile column of fused staminate and pistillate tissues; the position and rea", "url": "https://doi.org/10.2307/1939537", "citacoes": 293, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Ásia e Oceania"]}, "sjr": 1.767, "q": "Q1"}, {"key": "doi:10.1051/apido:2003062", "titulo": "Niche overlap and diet breadth in bumblebees; are rare species more specialized in their choice of flowers?", "autores": "Dave Goulson, Ben Darvill", "revista": "Apidologie", "data": "2004-01 ecialized and less mobile pollinator species", "autores": "Claire Kremen, Leithen K. M’Gonigle", "revista": "Journal of Applied Ecology", "data": "2015-03-03", "ano": 2015, "resumo": "Summary Agriculture now constitutes 40–50% of terrestrial land use globally. By enhancing habitat suitability and connectivity, restoration within agricultural landscapes could have a major influence on biodiversity conservation. However, habitat management within intensive agricultural landscapes may primarily boost abundances of common, highly mobile generalists, rather than vulnerable or endangered species. We studied pollinator community response to small‐scale habitat restoration in the intensively farmed Central Valley of California to determine whether restoration could also promote mor", "url": "https://doi.org/10.1111/1365-2664.12418", "citacoes": 176, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Experimento ou campo"], "Região": ["América do Norte"]}, "sjr": 1.765, "q": "Q1"}, {"key": "doi:10.1111/j.1600-0587.2012.07191.x", "titulo": "Improving species distribution models using biotic interactions: a case study of parasites, pollinators and plants", "autores": "Tereza Cristina Giannini, Daniel S. Chapman, António Mauro Saraiva, Isabel Alves‐dos‐Santos, Jacobus Christiaan Biesmeijer", "revista": "Ecography", "data": "2012-11-19", "ano": 2012, "resumo": "Biotic interactions have been considered as an important factor to be included in species distribution modelling, but little is known about how different types of interaction or different strategies for modelling affect model performance. This study compares different methods for including interspecific interactions in distribution models for bees, their brood parasites, and the plants they pollinate. Host–parasite interactions among bumble bees (genus Bombus : generalist pollinators and brood parasites) and specialist plant–pollinator interactions between Centris bees and Krameria flowers wer", "url": "https://doi.org/10.1111/j.1600-0587.2012.07191.x", "citacoes": 176, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)", "Solitárias"], "Tipo de estudo": ["Modelagem ou simulação"], "Região": ["Região não citada"]}, "sjr": 2.295, "q": "Q1"}, {"key": "doi:10.2307/1936080", "titulo": "Difference in Pollination Niche Relationships in Early and Late Successional Plant Communities", "autores": "J. A. D. Parrish, F. A. Bazzaz", "revista": "Ecology", "data": "1979-06-01", "ano": 1979, "resumo": "Alpha—niche parameters involving pollination resources were examined for plants in communities of 3 different successional ages. Niche breadths and overlaps were compared in early successional annual, early perennial, and prairie communities. Niche axes examined were seasonal time of flowering, species of flower visitor, daily time of visit, and 2—dimensional parameter, species of visitor x daily time. Seasonal flowering was clumped in all communities. It occurred fairly synchronously in midsummer in the annual community and in the fall in the perennial community. Flowering in the winter annua", "url": "https://doi.org/10.2307/1936080", "citacoes": 171, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.767, "q": "Q1"}, {"key": "doi:10.1111/1365-2745.12978", "titulo": "Temporal variation in plant–pollinator networks from seasonal tropical environments: Higher specialization when resources are scarce", "autores": "Camila Silveira Souza, Pietro K. Maruyama, Camila Aoki, Maria Rosângela Sigrist, Josué Raizer, Caroline L. Gross et al.", "revista": "Journal of Ecology", "data": "2018-03-24", "ano": 2018, "resumo": "Abstract The temporal dynamics of plant phenology and pollinator abundance across seasons should influence the structure of plant–pollinator interaction networks. Nevertheless, such dynamics are seldom considered, especially for diverse tropical networks. Here, we evaluated the temporal variation of four plant–pollinator networks in two seasonal ecosystems in Central Brazil (Cerrado and Pantanal). Data were gathered on a monthly basis over 1 year for each network. We characterized seasonal and temporal shifts in plant–pollinator interactions, using temporally discrete networks. We predicted th", "url": "https://doi.org/10.1111/1365-2745.12978", "citacoes": 158, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Brasil"]}, "sjr": 2.424, "q": "Q1"}, {"key": "doi:10.1007/s10531-008-9428-y", "titulo": "Diet breadth, coexistence and rarity in bumblebees", "autores": "Dave Goulson, Gillian C. Lye, Ben Darvill", "revista": "Biodiversity and Conservation", "data": "2008-08-21", "ano": 2008, "resumo": "", "url": "https://doi.org/10.1007/s10531-008-9428-y", "citacoes": 140, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.025, "q": "Q1"}, {"key": "doi:10.1016/j.biocon.2012.09.015", "titulo": "Climate change increases the risk of invasion by the Yellow-legged hornet", "autores": "Morgane Barbet‐Massin, Quentin Rome, Franck J. Muller, A. Perrard, Claire Villemant, Frédéric Jiguet", "revista": "Biological Conservation", "data": "2012-11-28", "ano": 2012, "resumo": "", "url": "https://doi.org/10.1016/j.biocon.2012.09.015", "citacoes": 138, "fonte": "OpenAlex", "topi o"], "Região": ["Região não citada"]}, "sjr": 4.581, "q": "Q1"}, {"key": "doi:10.1111/j.1365-2664.2010.01949.x", "titulo": "Organic dairy farming: impacts on insect-flower interaction networks and pollination", "autores": "Eileen F. Power, Jane C. Stout", "revista": "Journal of Applied Ecology", "data": "2011-01-18", "ano": 2011, "resumo": "1. Pollination interactions comprise a network of connections between flowers and insect visitors. They are crucial for reproductive success in many angiosperms but are threatened by intensive agricultural practices. Although less intensive approaches, including organic farming, could improve farmland biodiversity, it is not clear whether or not these approaches enhance wild plant pollination and the stability of insect–flower interaction networks. 2. We investigated the effects of organic vs. conventional farming on insect–flower interaction network size and structure, bee and hoverfly divers", "url": "https://doi.org/10.1111/j.1365-2664.2010.01949.x", "citacoes": 120, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.765, "q": "Q1"}, {"key": "doi:10.1111/j.2006.0030-1299.14604.x", "titulo": "Detecting the effects of introduced species: a case study of competition between Apis and Bombus", "autores": "Diane M. Thomson", "revista": "Oikos", "data": "2006-03-16", "ano": 2006, "resumo": "Developing tools for rapid assessment of introduced species impacts is one of the most important challenges in invasion ecology. Most assessments of impact rely on correlational data or other indirect measures. Yet few studies have evaluated invasion effects using multiple, simultaneously applied monitoring and experimental approaches, in order to compare easily obtained metrics with more difficult but direct measures of reproductive success or popula ristina Giannini, Wilian França Costa, Rafael Cabral Borges, Leonardo Miranda, Claudia Priscila Wanzeler da Costa, António Mauro Saraiva et al.", "revista": "Regional Environmental Change", "data": "2020-02-05", "ano": 2020, "resumo": "Abstract There is pressing need to anticipate the impacts of climate change on species and their functional contributions to ecosystem processes. Our objective is to evaluate the potential bee response to climate change considering (1) response traits—body size, nest site, and sociality; (2) contributions to ecosystem services (effect trait)—crop pollination; and (3) bees’ size of current occurrence area. We analyzed 216 species occurring at the Carajás National Forest (Eastern Amazon, Pará, Brazil), using two different algorithms and geographically explicit data. We modeled the current occurr", "url": "https://doi.org/10.1007/s10113-020-01611-y", "citacoes": 107, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Modelagem ou simulação"], "Região": ["Brasil"]}, "sjr": 1.107, "q": "Q2"}, {"key": "doi:10.1016/j.agee.2019.04.011", "titulo": "Ecosystem services by birds and bees to coffee in a changing climate: A review of coffee berry borer control and pollination", "autores": "Adina Chain‐Guadarrama, Alejandra Martínez‐Salinas, Natalia Aristizábal, Taylor H. Ricketts", "revista": "Agriculture Ecosystems & Environment", "data": "2019-04-28", "ano": 2019, "resumo": "", "url": "https://doi.org/10.1016/j.agee.2019.04.011", "citacoes": 102, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Revisão ou síntese"], "Região": ["Região não citada"]}, "sjr": 2.094, "q": "Q1"}, {"key": "doi:10.1073/pnas.1617940114", "titulo": "Coupling of pollination services and coffee suitability under climate change", "autores": "Pablo Imbach, Emily Fung, Lee Hannah, Carlos E. Navarro Racines, David Ward Roubik, Taylor H. Ricketts et al.", "revista": "Proceedings of the National Academy of Sciences", "data": "2017-09-11", "ano": 2017, "resumo": "Climate change will cause geographic range shifts for pollinators and major crops, with global implications for food security and rural livelihoods. However, little is known about the potential for coupled impacts of climate change on pollinators and crops. Coffee production exemplifies this issue, because large losses in areas suitable for coffee production have been projected due to climate change and because coffee production is dependent on bee pollination. We modeled the potential distributions of coffee and coffee pollinators under current and future climates in Latin America to understa", "url": "https://doi.org/10.1073/pnas.1617940114", "citacoes": 101, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Neotrópico (fora do Brasil)"]}, "sjr": 3.283, "q": "Q1"}, {"key": "doi:10.1038/s41598-018-32665-y", "titulo": "Climate change-driven range losses among bumblebee species are poised to accelerate", "autores": "Catherine Sirois‐Delisle, Jeremy Thomas Kerr", "revista": "Scientific Reports", "data": "2018-09-21", "ano": 2018, "resumo": "Climate change has shaped bee distributions over the past century. Here, we conducted the first species-specific assessment of future climate change impacts on North American bumblebee distributions, using the most recent global change scenarios developed in the Fifth Assessment Report of the Intergovernmental Panel on Climate Change (IPCC). We assessed potential shifts in bumblebee species distributions with models generated using Maxent. We tested different assumptions about bumblebee species' dispersal capacities, drawing on observed patterns of range shifts to date, dispersal rates observe", "url": "https://doi.org/10.1038/s41598-018-32665-y", "citacoes": 100, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)"], "Tipo de estudo": ["Experimento ou campo", "Modelagem ou simulação"], "Região": ["Região não citada"]}, "sjr": 0.893, "q": "Q1"}, {"key": "doi:10.1073/pnas.2011441117", "titulo": "Assessing the ecological niche and invasion potential of the Asian giant hornet", "autores": "Gengping Zhu, Javier Gutiérrez Illán, Chris Looney, David William Crowder", "revista": "Proceedings of the National Academy of Sciences", "data": "2020-09-22", "ano": 2020, "resumo": "The Asian giant hornet ( Vespa mandarinia ) was recently detected in western British Columbia, Canada and Washington State, United States. V. mandarinia are an invasion concern due to their ability to kill honey bees and affect humans. Here, we used habitat suitability models and dispersal simulations to assess potential invasive spread of V. mandarinia . We show V. mandarinia are most likely to establish in areas with warm to cool annual mean temperature, high precipitation, and high human activity. The realized niche of introduced populations is small compared to native populations, suggesti", "url": "https://doi.org/10.1073/pnas.2011441117", "citacoes": 95, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Apis (Apini)"], "Tipo de estudo": ["Modelagem ou simulação"], "Região": ["América do Norte", "Ásia e Oceania"]}, "sjr": 3.283, "q": "Q1"}, {"key": "doi:10.1242/jeb.165589", "titulo": "Critical thermal limits of bumble bees (Bombus impatiens) are marked by stereotypical behaviors and are unchanged by acclimation, age, or feeding status", "autores": "Kennan Oyen, Michael E. Dillon", "revista": "Journal of Experimental Biology", "data": "2018-01-01", "ano": 2018, "resumo": "Critical thermal limits often determine species distributions for diverse ectotherms and have become a useful tool for understanding past and predicting future range shifts in response to changing climates. Despite recently documented population declines and range shifts of bumble bees (genus Bombus), the few measurements of thermal tolerance available for the group have relied on disparate measurement approaches. We describe a novel stereotypical behavior expressed by bumble bee individuals during entry into chill coma. This behavioral indicator of CTmin occurred at ambient temperatures of 3-", "url": "https://doi.org/10.1242/jeb.165589", "citacoes": 94, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.844, "q": "Q1"}, {"key": "doi:10.1007/bf00344655", "titulo": "Temporal and microclimatic partitioning of the floral resources of Justicia aurea amongst a concourse of pollen vectors and nectar robbers", "autores": "Pat G. Willmer, Sarah A. Corbet", "revista": "Oecologia", "data": "1981-10-01", "ano": 1981, "resumo": "", "url": "https://doi.org/10.1007/bf00344655", "citacoes": 89, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.909, "q": "Q1"}, {"key": "doi:10.1111/mec.14735", "titulo": "Distance, elevation and environment as drivers of diversity and divergence in bumble bees across latitude and altitude", "autores": "Jason M. Jackson, Meaghan L. Pimsler, Kennan Oyen, Jonathan B. Koch‐Uhuad, James D. Herndon, James P. Strange et al.", "revista": "Molecular Ecology", "data": "2018-06-04", "ano": 2018, "resumo": "Identifying drivers of dispersal limitation and genetic differentiation is a key goal in biogeography. We examine patterns of population connectivity and genetic diversity using restriction site-associated DNA sequencing (RADseq) in two bumble bee species, Bombus vosnesenskii and Bombus bifarius, across latitude and altitude in mountain ranges from California, Oregon and Washington, U.S.A. Bombus vosnesenskii, which occurs across a broader elevational range at most latitudes, exhibits little population structure while B. bifarius, which occupies a relatively narrow higher elevation niche acros", "url": "https://doi.org/10.1111/mec.14735", "citacoes": 88, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)"], "Tipo de estudo": ["Filogenia e taxonomia", "Genética e molecular"], "Região": ["América do Norte"]}, "sjr": 1.429, "q": "Q1"}, {"key": "doi:10.1016/j.ecolmodel.2013.11.016", "titulo": "Seeking the flowers for the bees: Integrating biotic interactions into niche models to assess the distribution of the exotic bee species Lithurgus huberi in South America", "autores": "Daniel Paiva Silva, Víctor H. González, Gabriel A. R. Melo, Mariano Lucía, Leopoldo Jesús Alvarez, Paulo de Marco Júnior", "revista": "Ecological Modelling", "data": "2013-12-05", "ano": 2013, "resumo": "", "url": "https://doi.org/10.1016/j.ecolmodel.2013.11.016", "citacoes": 84, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Modelagem ou simulação"], "Região": ["Neotrópico (fora do Brasil)"]}, "sjr": 0.859, "q": "Q1"}, {"key": "doi:10.1038/srep24451", "titulo": "Functional traits help to explain half-century long shifts in pollinator distributions", "autores": "Jesús Aguirre‐Gutiérrez, Wilm Daniel Kissling, Luísa G. Carvalheiro, Michiel F. WallisDeVries, Markus Franzén, Jacobus Christiaan Biesmeijer", "revista": "Scientific Reports", "data": "2016-04-15", "ano": 2016, "resumo": "Changes in climate and land use can have important impacts on biodiversity. Species respond to such environmental modifications by adapting to new conditions or by shifting their geographic distributions towards more suitable areas. The latter might be constrained by species' functional traits that influence their ability to move, reproduce or establish. Here, we show that functional traits related to dispersal, reproduction, habitat use and diet have influenced how three pollinator groups (bees, butterflies and hoverflies) responded to changes in climate and land-use in the Netherlands since ", "url": "https://doi.org/10.1038/srep24451", "citacoes": 81, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Europa"]}, "sjr": 0.893, "q": "Q1"}, {"key": "doi:10.1086/284846", "titulo": "Reproductive Harmony via Mutual Policing by Workers in Eusocial Hymenoptera", "autores": "Francis L. W. Ratnieks", "revista": "The American Naturalist", "data": "1988-08-01", "ano": 1988, "resumo": "When queens of eusocial Hymenoptera mate two or more times (assuming equal sperm contributions from males and random sperm use), the workers are more closely related to the queen's sons than to the sons of a randomly chosen worker. This suggests that workers should try to prevent other workers from reproducing, and hence producing sons, in species with queens that mate two or more times. It also provides a possible reason for the absence of reproductive workers in many hymenopteran societies. Reproductive harmony may, therefore, and counterintuitively, result from lowered relatedness among wor", "url": "https://doi.org/10.1086/284846", "citacoes": 739, "fonte": "OpenAlex", "topico": "Meliponicultura, mel e pólen", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem ferrão (Meliponini)", "Mamangavas (Bombini)", "Apis (Apini)"], "Tipo de estudo": ["Modelagem ou simulação", "Genética e molecular"], "Região": ["Região não citada"]}, "sjr": 1.18, "q": "Q1"}, {"key": "doi:10.1126/sciadv.1600513", "titulo": "Dynamic microbiome evolution in social bees", "autores": "Waldan K. Kwong, Luis A. Medina, Hauke Koch, Kong‐Wah Sing, Eunice J. Y. Soh, John S. Ascher et al.", "revista": "Science Advances", "data": "2017-03-03", "ano": 2017, "resumo": "The highly social (eusocial) corbiculate bees, comprising the honey bees, bumble bees, and stingless bees, are ubiquitous insect pollinators that fulfill critical roles in ecosystem services and human agriculture. Here, we conduct wide sampling across the phylogeny of these corbiculate bees and reveal a dynamic evolutionary history behind their microbiota, marked by multiple gains and losses of gut associates, the presence of generalist as well as host-specific strains, and patterns of diversification driven, in part, by host ecology (for example, colony size). Across four continents, we found", "url": "https://doi.org/10.1126/sciadv.1600513", "citacoes": 613, "fonte": "OpenAlex", "topico": "Meliponicultura, mel e pólen", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem ferrão (Meliponini)", "Mamangavas (Bombini)", "Apis (Apini)"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Região não citada"]}, "sjr": 4.534, "q": "Q1"}, {"key": "doi:10.1051/apido:2006027", "titulo": "Global meliponiculture: challenges and opportunities", "autores": "Marilda Cortopassi-Laurino, Vera Lúcia Imperatriz-Fonseca, David Ward Roubik, Anne Dollin, Tim A. Heard, Ingrid Aguilar et al.", "revista": "Apidologie", "data": "2006-03-01", "ano": 2006, "resumo": "", "url": "https://doi.org/10.1051/apido:2006027", "citacoes": 447, "fonte": "OpenAlex", "topico": "Meliponicultura, mel e pólen", "tipo": "classico", "a }

}

let sb = null, sessao = null;
let nomeUsuario = '', perfilNuvem = null;
let meusLabs = [], labAtivo = '', membros = [], convitesLab = [];
let meusConvites = [], compartilhados = [], salvos = [];
let msgConta = '';
const nuvem = () => !!(sb && sessao);

async function iniciarConta() {
  if (!SB || !SB.url || !SB.key || !window.supabase) return;
  sb = window.supabase.createClient(SB.url, SB.key);
  document.getElementById('conta').style.display = 'flex';
  sb.auth.onAuthStateChange((ev, s) => { sessao = s; setTimeout(carregarTudo, 0); });
  const r = await sb.auth.getSession();
  sessao = r.data ? r.data.session : null;
  await carregarTudo();
}

async function carregarTudo() {
  if (!sb) return;
  if (!sessao) {
    perfilNuvem = null; nomeUsuario = ''; meusLabs = []; membros = []; convitesLab = [];
    meusConvites = []; compartilhados = []; salvos = []; labAtivo = '';
    perfis = lsGet(LS_PERFIS, {}); perfilAtivo = lsGet(LS_ATIVO, '');
    if (!perfis[perfilAtivo]) perfilAtivo = '';
    if (aba === 'salvos' || aba === 'lab') aba = 'novo';
    render(); return;
  }
  try {
    const uid = sessao.user.id;
    const email = (sessao.user.email || '').toLowerCase();
    const rp = await sb.from('perfis').select('*').eq('id', uid).maybeSingle();
    if (rp.error) throw rp.error;
    perfilNuvem = rp.data || null;
    nomeUsuario = perfilNuvem ? perfilNuvem.nome : '';
    perfis = {}; perfilAtivo = '';
    if (perfilNuvem) {
      perfis[nomeUsuario || 'Meu perfil'] = {
        topicos: perfilNuvem.topicos || [], revistas: perfilNuvem.revistas || [],
        incluir: perfilNuvem.incluir || [], excluir: perfilNuvem.excluir || [] };
      perfilAtivo = nomeUsuario || 'Meu perfil';
    }
    const rm = await sb.from('membros').select('lab_id, papel, laboratorios(id, nome, dono)').eq('user_id', uid);
    if (rm.error) throw rm.error;
    meusLabs = (rm.data || []).filter(m => m.laboratorios).map(m => ({ id: m.lab_id, nome: m.laboratorios.nome, papel: m.papel }));
    if (!meusLabs.some(l => l.id === labAtivo)) labAtivo = meusLabs.length ? meusLabs[0].id : '';
    const rc = await sb.from('convites').select('*');
    if (rc.error) throw rc.error;
    meusConvites = (rc.data || []).filter(c => (c.email || '').toLowerCase() === email);
    const rs = await sb.from('salvos').select('*').order('criado_em', { ascending: false });
    if (rs.error) throw rs.error;
    salvos = rs.data || [];
    await carregarLab();
  } catch (e) { erro(e); }
  render();
  if (!perfilNuvem && !document.getElementById('painel').innerHTML) abrirPerfil('');
}

async function carregarLab() {
  membros = []; convitesLab = []; compartilhados = [];
  if (!nuvem() || !labAtivo) return;
  const rm = await sb.from('membros').select('user_id, papel').eq('lab_id', labAtivo);
  if (rm.error) throw rm.error;
  const ids = (rm.data || []).map(m => m.user_id);
  let nomes = {};
  if (ids.length) {
    const rp = await sb.from('perfis').select('id, nome').in('id', ids);
    if (rp.error) throw rp.error;
    (rp.data || []).forEach(p => { nomes[p.id] = p.nome; });
  }
  membros = (rm.data || []).map(m => ({ user_id: m.user_id, papel: m.papel, nome: nomes[m.user_id] || '(sem nome)' }));
  const rs = await sb.from('compartilhados').select('*').eq('lab_id', labAtivo).order('criado_em', { ascending: false });
  if (rs.error) throw rs.error;
  compartilhados = rs.data || [];
  if (souDono()) {
    const rc = await sb.from('convites').select('*').eq('lab_id', labAtivo);
    if (rc.error) throw rc.error;
    convitesLab = rc.data || [];
  }
}
const labAtual = () => meusLabs.find(l => l.id === labAtivo) || null;
const souDono = () => { const l = labAtual(); return !!(l && l.papel === 'dono'); };
const meuId = () => (sessao && sessao.user ? sessao.user.id : '');
const nomeDe = uid => { const m = membros.find(x => x.user_id === uid); return m ? m.nome : '(alguém)'; };

async function entrarPorEmail() {
  const el = document.getElementById('c-email');
  const email = (el.value || '').trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { alert('Digite um e-mail válido.'); return; }
  const r = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
  if (r.error) { erro(r.error); return; }
  msgConta = 'Enviamos um link de acesso para ' + email + '. Abra o e-mail e clique no link (veja também o spam).';
  renderConta();
}
async function sair() { await sb.auth.signOut(); }

function renderConta() {
  const c = document.getElementById('conta');
  if (!sb) { c.style.display = 'none'; return; }
  c.style.display = 'flex';
  if (!sessao) {
    c.innerHTML = '<b>Entrar</b>' +
      '<input type="email" id="c-email" placeholder="seu e-mail" onkeydown="if(event.key===\'Enter\')entrarPorEmail()">' +
      '<button class="btn forte" onclick="entrarPorEmail()">Receber link de acesso</button>' +
      '<div class="msg">' + esc(msgConta || 'Sem senha: enviamos um link para o seu e-mail. Entrando, seu perfil, seus salvos e o seu laboratório ficam disponíveis em qualquer aparelho.') + '</div>';
  } else {
    const n = meusConvites.length;
    c.innerHTML = '<span>👋 Olá, <b>' + esc(nomeUsuario || sessao.user.email) + '</b></span>' +
      (n ? '<button class="btn forte mini" onclick="setAba(\'lab\')">📩 ' + n + ' convite(s) de laboratório</button>' : '') +
      '<span style="flex:1"></span><button class="btn mini" onclick="sair()">Sair</button>';
  }
}

function lsGet(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
let perfis = lsGet(LS_PERFIS, {});
let perfilAtivo = lsGet(LS_ATIVO, '');
if (!perfis[perfilAtivo]) perfilAtivo = '';
function salvarLocal() { if (!nuvem()) { lsSet(LS_PERFIS, perfis); lsSet(LS_ATIVO, perfilAtivo); } }

function passaPerfil(d) {
  const p = perfis[perfilAtivo];
  if (!p) return true;
  if (p.topicos.length && !d.topicos.some(t => p.topicos.includes(t))) return false;
  if (p.revistas.length && !p.revistas.includes(d.revista)) return false;
  const txt = (d.titulo + ' ' + d.autores + ' ' + d.resumo + ' ' + d.revista).toLowerCase();
  if (p.incluir.length && !p.incluir.some(w => txt.includes(w))) return false;
  if (p.excluir.some(w => txt.includes(w))) return false;
  return true;
}
function topicosVisiveis(d) {
  const p = perfis[perfilAtivo];

function importarDoLink() {

    ? ((b.adicionado || '').localeCompare(a.adicionado || '') || (b.data || '').localeCompare(a.data || ''))
    : ((b.citacoes || 0) - (a.citacoes || 0));
  const o = ordem === 'padrao' ? 'padrao' : ordem;
  return xs.slice().sort((a, b) => {
    if (o === 'sjr') return ((b.sjr != null ? b.sjr : -1) - (a.sjr != null ? a.sjr : -1)) || padrao(a, b);
    if (o === 'cit') return ((b.citacoes || 0) - (a.citacoes || 0)) || padrao(a, b);
    if (o === 'data') return ((b.data || String(b.ano || '')).localeCompare(a.data || String(a.ano || ''))) || padrao(a, b);
    return padrao(a, b);
  });
}

function render() {
  renderConta();
  const logado = nuvem();
  document.getElementById('tab-salvos').style.display = logado ? 'inline-block' : 'none';
  document.getElementById('tab-lab').style.display = logado ? 'inline-block' : 'none';
  const ehLab = aba === 'lab', ehSalvos = aba === 'salvos';
  ['novo', 'classico', 'salvos', 'lab'].forEach(x => document.getElementById('tab-' + x).classList.toggle('on', aba === x));
  document.getElementById('tab-novo').textContent = NOV_DIAS ? 'Novidades · ' + NOV_DIAS + ' dias' : 'Novidades';
  document.getElementById('lab-view').style.display = ehLab ? 'block' : 'none';
  document.getElementById('layout').classList.toggle('sem-sidebar', ehLab || ehSalvos);
  document.getElementById('area-busca').style.display = (ehLab || ehSalvos) ? 'none' : 'flex';
  if (!(ehLab || ehSalvos)) renderPerfilBar();

  if (ehLab) {
    document.getElementById('lista').innerHTML = '';
    document.getElementById('count').textContent = '';
    document.getElementById('mais').style.display = 'none';
    renderLab(); return;
  }
  if (ehSalvos) {
    document.getElementById('count').textContent = salvos.length + ' artigo(s) salvo(s)';
    document.getElementById('lista').innerHTML = salvos.length ? salvos.map(s =>
      cardSimples(s, '<div class="botoes"><button class="btn mini" data-acao="remover-salvo" data-k="' + esc(s.chave) + '">Remover dos salvos</button>' +
      (labAtual() && POR_CHAVE[s.chave] ? '<button class="btn mini" data-acao="compartilhar" data-k="' + esc(s.chave) + '">👥 Compartilhar com o lab</button>' : '') + '</div>')).join('')
      : '<p style="color:var(--mut)">Você ainda não salvou nada. Use "☆ Salvar" nos artigos.</p>';
    document.getElementById('mais').style.display = 'none';
    return;
  }

  // ---- filtros em cascata: cada contagem respeita os outros filtros ----
  const base = ITENS.filter(d => d.tipo === aba && passaPerfil(d));
  const todosT = [...new Set(base.flatMap(topicosVisiveis))].sort();
  topicosSel = topicosSel.filter(t => todosT.includes(t));
  const passaTudo = (d, ig) => {
    if (ig !== 'topico' && topicosSel.length && !d.topicos.some(t => topicosSel.includes(t))) return false;
    if (ig !== 'rev' && revistasSel.length && !revistasSel.includes(d.revista)) return false;
    if (ig !== 'periodo' && !passaPeriodo(d)) return false;
    if (ig !== 'quartil' && !passaQuartil(d)) return false;
    for (const f of FILTROS) {
      const sel = fac[f.nome];
      if (ig !== 'f:' + f.nome && sel && sel.length && !opcoesDe(d, f.nome).some(o => sel.includes(o))) return false;
    }
    if (busca && !textoDe(d).includes(busca)) return false;
    return true;
  };
  const filtrar = ig => base.filter(d => passaTudo(d, ig));
  const secao = (titulo, corpo) => '<div class="sb-bloco"><div class="sb-titulo">' + esc(titulo) + '</div>' + corpo + '</div>';
  const facetaHtml = f => {
    const arr = filtrar('f:' + f.nome), sel = fac[f.nome] || [];
    return secao(f.nome, '<div class="lista-op">' + checks(f.opcoes.map(o => ({
      nome: o, n: arr.filter(d => opcoesDe(d, f.nome).includes(o)).length, on: sel.includes(o) })), 'faceta', f.nome) + '</div>');
  };

  // Abelha (primeira categoria) e Tema
  document.getElementById('sec-abelha').innerHTML = FILTROS.length ? facetaHtml(FILTROS[0]) : '';
  const arrT = filtrar('topico'), contT = {};
  arrT.forEach(d => topicosVisiveis(d).forEach(t => { contT[t] = (contT[t] || 0) + 1; }));
  document.getElementById('sec-tema').innerHTML = secao('Tema', '<div class="lista-op">' +
    checks(todosT.map(t => ({ nome: t, n: contT[t] || 0, on: topicosSel.includes(t) })), 'topico') + '</div>');

  // Revista
  const arrR = filtrar('rev'), contR = {};
  arrR.forEach(d => { if (d.revista) contR[d.revista] = (contR[d.revista] || 0) + 1; });
  const revs = Object.keys(contR).sort((a, b) => contR[b] - contR[a]);
  revistasSel.forEach(r => { if (!revs.includes(r)) revs.push(r); });
  const revsVis = revs.filter(r => !revBusca || r.toLowerCase().includes(revBusca) || revistasSel.includes(r)).slice(0, 300);
  document.getElementById('rev-list').innerHTML = revsVis.length
    ? checks(revsVis.map(r => ({ nome: r, n: contR[r] || 0, on: revistasSel.includes(r) })), 'rev')
    : '<div class="dica" style="font-size:12px;color:var(--mut)">Nenhuma revista encontrada.</div>';

  // Mais filtros (demais categorias, período, quartil da revista)
  document.getElementById('btn-mais').textContent = maisAberto ? 'Menos filtros ▴' : 'Mais filtros ▾';
  let mais = '';
  if (maisAberto) {
    mais = FILTROS.slice(1).map(facetaHtml).join('') +
      secao('Período', '<select onchange="setPeriodo(this.value)">' +
        [['', 'Qualquer ano'], ['5', 'Últimos 5 anos'], ['10', 'Últimos 10 anos'], ['2020+', '2020 em diante'],
         ['2010-2019', '2010 a 2019'], ['2000-2009', '2000 a 2009'], ['antes2000', 'Antes de 2000']]
          .map(p => '<option value="' + p[0] + '"' + (periodo === p[0] ? ' selected' : '') + '>' + p[1] + '</option>').join('') + '</select>') +
      (TEM_SJR ? secao('Qualidade da revista (SJR)', '<select onchange="setQuartil(this.value)">' +
        [['', 'Qualquer'], ['Q1', 'Só Q1'], ['Q12', 'Q1 ou Q2'], ['Q123', 'Q1, Q2 ou Q3'], ['sem', 'Sem dado de SJR']]
          .map(p => '<option value="' + p[0] + '"' + (quartil === p[0] ? ' selected' : '') + '>' + p[1] + '</option>').join('') + '</select>') : '');
  }
  document.getElementById('mais-dyn').innerHTML = mais;
  const ativos = !!(topicosSel.length || revistasSel.length || periodo || quartil || busca || Object.values(fac).some(s => s && s.length));
  document.getElementById('limpar-wrap').innerHTML = ativos
    ? '<button class="btn perigo largo" style="margin-bottom:14px" onclick="limparFiltros()">✖ Limpar todos os filtros</button>' : '';
  document.getElementById('fnota').textContent = FILTROS.length
    ? 'As categorias são detectadas automaticamente por palavras no título e no resumo e podem ter erros. Os números mostram quantos artigos sobram com os outros filtros aplicados.' : '';
  document.getElementById('ordem').value = ordem;

  // Lista
  const xs = ordenar(filtrar(''));
  document.getElementById('count').textContent = xs.length + ' artigo(s)' + (ativos ? ' com os filtros escolhidos' : '');
  const parte = xs.slice(0, limite);
  let out = '', diaAtual = null;
  for (const d of parte) {
    if (aba === 'novo' && ordem === 'padrao' && d.adicionado !== diaAtual) {
      diaAtual = d.adicionado;
      out += '<h2 class="dia">Chegaram em ' + fmtData(diaAtual) + '</h2>';
    }
    out += itemHtml(d);
  }
  if (!parte.length) out = '<p style="color:var(--mut)">Nada encontrado com esses filtros.</p>';
  document.getElementById('lista').innerHTML = out;
  document.getElementById('mais').style.display = xs.length > limite ? 'block' : 'none';
}

document.getElementById('sidebar').addEventListener('change', ev => {
  const i = ev.target;
  if (!i.matches || !i.matches('input[type=checkbox][data-tipo]')) return;
  const tp = i.dataset.tipo, o = i.dataset.o;
  limite = POR_PAGINA;
  if (tp === 'topico') alternarSel(topicosSel, o);
  else if (tp === 'rev') alternarSel(revistasSel, o);
  else if (tp === 'faceta') { const f = i.dataset.f; if (!fac[f]) fac[f] = []; alternarSel(fac[f], o); }
  render();
});

document.getElementById('lista').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-acao]'); if (!b) return;
  const k = b.dataset.k;
  if (b.dataset.acao === 'salvar') alternarSalvo(k);
  else if (b.dataset.acao === 'compartilhar') compartilhar(k);
  else if (b.dataset.acao === 'remover-salvo') removerSalvo(k);
});

importarDoLink();
render();
iniciarConta();
</script>
