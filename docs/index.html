nsects but also non-target organisms such as pollinators. This review summarizes, for the first time, 15 years of research on the hazards of neonicotinoids to bees including honey bees, bumble bees and solitary bees. The focus of the paper is on three different key aspects determining the risks of neonicotinoid field concentrations for bee populations: (1) the environmental neonicotinoid residue levels in plants, bees and bee products in relation to p", "url": "https://doi.org/10.1007/s10646-012-0863-x", "citacoes": 1059, "fonte": "OpenAlex", "topico": "Comunicação, cognição e comportamento", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rstb.2005.1733", "titulo": "The principles of collective animal behaviour", "autores": "David J. T. Sumpter", "revista": "Philosophical Transactions of the Royal Society B Biological Sciences", "data": "2005-11-28", "ano": 2005, "resumo": "In recent years, the concept of self-organization has been used to understand collective behaviour of animals. The central tenet of self-organization is that simple repeated interactions between individuals can produce complex adaptive patterns at the level of the group. Inspiration comes from patterns seen in physical systems, such as spiralling chemical waves, which arise without complexity at the level of the individual units of which the system is composed. The suggestion is that biological structures such as termite mounds, ant trail networks and even human crowds can be explained in term", "url": "https://doi.org/10.1098/rstb.2005.1733", "citacoes": 1051, "fonte": "OpenAlex", "topico": "Comunicação, cognição e comportamento", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/nature11585", "titulo": "Combined pesticide exposure severely affects individual- and colony-level traits in bees", "autores": "Richard J. Gill, Oscar Ramos-Rodriguez, Nigel E. Raıne", "revista": "Nature", "data": "2012-10-19", "ano": 2012, "resumo": "", "url": "https://doi.org/10.1038/nature11585 tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1558-5646.1980.tb04849.x", "titulo": "WHEN IS IT COEVOLUTION?", "autores": "Daniel H. Janzen", "revista": "Evolution", "data": "1980-05-01", "ano": 1980, "resumo": "'Coevolution' may be usefully defined as an evolutionary change in a trait of the individuals in one population in response to a trait of the individuals of a second population, followed by an evolutionary response by the second population to the change in the first. 'Diffuse coevolution' occurs when either or both populations in the above definition are represented by an array of populations that generate a selective pressure as a group. Ehrlich and Raven's (1964) classic paper on the interactions of butterflies and plants was the first essay explicitly focused on coevolution. However, they d", "url": "https://doi.org/10.1111/j.1558-5646.1980.tb04849.x", "citacoes": 877, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.96.21.11910", "titulo": "Pollinator preference and the evolution of floral traits in monkeyflowers ( Mimulus )", "autores": "Douglas W. Schemske, H. D. Bradshaw", "revista": "Proceedings of the National Academy of Sciences", "data": "1999-10-12", "ano": 1999, "resumo": "A paradigm of evolutionary biology is that adaptation and reproductive isolation are caused by a nearly infinite number of mutations of individually small effect. Here, we test this hypothesis by investigating the genetic basis of pollinator discrimination in two closely related species of monkeyflowers that differ in their major pollinators. This system provides a unique opportunity to investigate the genetic architecture of adaptation and speciation because floral traits that confer pollinator specificity also contribute to premating reproductive isolation. We asked: (i) What floral traits c", "url": "https://doi.org/10.1073/pnas.96.21.11910", "citacoes": 860, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.biocon.2009.12.003", "titulo": "Maximum foraging ranges in solitary bees: only few individuals have the capability to cover long foraging distances", "autores": "Antonia Zurbuchen, Lisa Landert, Jeannine Klaiber, Antoine Müller, Silke Hein, Silvia Dorn", "revista": "Biological Conservation", "data": "2010-01-07", "ano": 2010, "resumo": "", "url": "https://doi.org/10.1016/j.biocon.2009.12.003", "citacoes": 832, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1461-0248.2004.00662.x", "titulo": "The area requirements of an ecosystem service: crop pollination by native bee communities in California", "autores": "Claire Kremen, Neal M. Williams, Robert L. Bugg, John P. Fay, Robin W. Thorp", "revista": "Ecology Letters", "data": "2004-09-22", "ano": 2004, "resumo": "Abstract Managing ecosystem services is critical to human survival, yet we do not know how large natural areas must be to support these services. We investigated how crop pollination services provided by native, unmanaged, bee communities varied on organic and conventional farms situated along a gradient of isolation from natural habitat. Pollination services from native bees were significantly, positively related to the proportion of upland natural habitat in the vicinity of farm sites, but not to any other factor studied, including farm type, insecticide usage, field size and honeybee abunda", "url": "https://doi.org/10.1111/j.1461-0248.2004.00662.x", "citacoes": 832, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1523-1739.1998.97154.x", "titulo": "The Potential Consequences of Pollinator Declines on the Conservation of Biodiversity and Stability of Food Crop Yields", "autores": "", "revista": "Conservation Biology", "data": "1998-02-11", "ano": 1998, "resumo": "Following reports of dramatic declines in managed and feral honey bees from nearly every region of North America, scientists and resource managers from the U.S., Mexico, and Canada came together to review the quality of the evidence that honey bees as well as other pollinators are in long-term decline and to consider the potential consequences of these losses on the conservation of biodiversity and the stability of the yield of food crops. These experts in pollination ecology confirmed that the last 5 years of losses of honeybee colonies in North America leave us with fewer managed pollinators", "url": "https://doi.org/10.1046/j.1523-1739.1998.97154.x", "citacoes": 817, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1890/02-0136", "titulo": "LINKING BEES AND FLOWERS: HOW DO FLORAL COMMUNITIES STRUCTURE POLLINATOR COMMUNITIES?", "autores": "Simon Geoffrey Potts, Betsy Vulliamy, Amots Dafni, Gidi Ne’eman, Pat G. Willmer", "revista": "Ecology", "data": "2003-10-01", "ano": 2003, "resumo": "Pollinators provide essential ecosystem services, and declines in some pollinator communities around the world have been reported. Understanding the fundamental components defining these communities is essential if conservation and restoration are to be successful. We examined the structure of plant–pollinator communities in a dynamic Mediterranean landscape, comprising a mosaic of post-fire regenerating habitats, and which is a recognized global hotspot for bee diversity. Each community was characterized by a highly skewed species abundance distribution, with a few dominant and many rare bee ", "url": "https://doi.org/10.1890/02-0136", "citacoes": 800, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1039/c5cp04060d", "titulo": "ABCluster: the artificial bee colony algorithm for cluster global optimization", "autores": "Jun Zhang, Michael Dolg", "revista": "Physical Chemistry Chemical Physics", "data": "2015-01-01", "ano": 2015, "resumo": "Global optimization of cluster geometries is of fundamental importance in chemistry and an interesting problem in applied mathematics. In this work, we introduce a relatively new swarm intelligence algorithm, i.e. the artificial bee colony (ABC) algorithm proposed in 2005, to this field. It is inspired by the foraging behavior of a bee colony, and only three parameters are needed to control it. We applied it to several potential functions of quite different nature, i.e., the Coulomb-Born-Mayer, Lennard-Jones, Morse, Z and Gupta potentials. The benchmarks reveal that for long-ranged potentials ", "url": "https://doi.org/10.1039/c5cp04060d", "citacoes": 786, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.171.3967.203", "titulo": "Euglossine Bees as Long-Distance Pollinators of Tropical Plants", "autores": "Daniel H. Janzen", "revista": "Science", "data": "1971-01-15", "ano": 1971, "resumo": "Euglossine bees may return to a nest from as far away as 23 kilometers in a tropical rain forest. These bees apparently forage long distances and visit the same plants repeatedly along a feeding route. They probably promote outcrossing among tropical plants with low population density; therefore, they may permit the existence of plant species whose densities have been forced very low by such things as competition and predators on seeds and seedlings.", "url": "https://doi.org/10.1126/science.171.3967.203", "citacoes": 771, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.4249/scholarpedia.6915", "titulo": "Artificial bee colony algorithm", "autores": "Derviş Karaboğa", "revista": "Scholarpedia", "data": "2010-01-01", "ano": 2010, "resumo": "Artificial Bee Colony (ABC) algorithm is a powerful optimization algorithm that simulates the task division and self-organization abilities of honey bees in their foraging activity. ABC algorithm has attracted the attention of researchers and has been applied to many problems in various fields successfully. ABC algorithm was originally proposed to solve numeric optimization problems and researchers have made some arrangements in the algorithm to solve combinatorial, constrained, multi-objective problems, etc. In this chapter, a tutorial on the basic concepts of the ABC algorithm is given inclu", "url": "https://doi.org/10.4249/scholarpedia.6915", "citacoes": 744, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1109/tpwrd.2011.2158246", "titulo": "Optimal Distributed Generation Allocation and Sizing in Distribution Systems via Artificial Bee Colony Algorithm", "autores": "Fahad S. Abu-Mouti, M.E. El-Hawary", "revista": "IEEE Transactions on Power Delivery", "data": "2011-10-01", "ano": 2011, "resumo": "Distributed generation (DG) has been utilized in some electric power networks. Power loss reduction, environmental friendliness, voltage improvement, postponement of system upgrading, and increasing reliability are some advantages of DG-unit application. This paper presents a new optimization approach that employs an artificial bee colony (ABC) algorithm to determine the optimal DG-unit's size, power factor, and location in order to minimize the total system real power loss. The ABC algorithm is a new metaheuristic, population-based optimization technique inspired by the intelligent foraging b", "url": "https://doi.org/10.1109/tpwrd.2011.2158246", "citacoes": 727, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s004420050949", "titulo": "Effects of habitat isolation on pollinator communities and seed set", "autores": "Ingolf Steffan‐Dewenter, Teja Tscharntke", "revista": "Oecologia", "data": "1999-11-22", "ano": 1999, "resumo": "", "url": "https://doi.org/10.1007/s004420050949", "citacoes": 706, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rspb.2014.2849", "titulo": "Where is the UK's pollinator biodiversity? The importance of urban areas for flower-visiting insects", "autores": "Katherine C. R. Baldock, Mark A. Goddard, Damien M. Hicks, William E. Kunin, Nadine Mitschunas, Lynne M. Osgathorpe et al.", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2015-02-12", "ano": 2015, "resumo": "Insect pollinators provide a crucial ecosystem service, but are under threat. Urban areas could be important for pollinators, though their value relative to other habitats is poorly known. We compared pollinator communities using quantified flower-visitation networks in 36 sites (each 1 km(2)) in three landscapes: urban, farmland and nature reserves. Overall, flower-visitor abundance and species richness did not differ significantly between the three landscape types. Bee abundance did not differ between landscapes, but bee species richness was higher in urban areas than farmland. Hoverfly abun", "url": "https://doi.org/10.1098/rspb.2014.2849", "citacoes": 670, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s001140050636", "titulo": "Flower Constancy, Insect Psychology, and Plant Evolution", "autores": "Lars Chıttka, James D. Thomson, Nickolas M. Waser", "revista": "Die Naturwissenschaften", "data": "1999-08-03", "ano": 1999, "resumo": "", "url": "https://doi.org/10.1007/s001140050636", "citacoes": 656, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1086/284507", "titulo": "Flower Constancy: Definition, Cause, and Measurement", "autores": "Nickolas M. Waser", "revista": "The American Naturalist", "data": "1986-05-01", "ano": 1986, "resumo": "A pollinator that restricts its visits to one flower type, even when other rewarding types are accessible, can be said to exhibit flower constancy. This usage distinguishes constancy from fixed preference or labile preference for the most rewarding flower type; I discuss a quantitative constancy index that is insensitive to preference changes. Because a constant visitor avoids flowers with acceptable rewards, the behavior is inefficient unless there are constraints such as an inability to learn quickly or to remember simultaneously how to deal with many flower types. If such constraints are th", "url": "https://doi.org/10.1086/284507", "citacoes": 636, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1242/jeb.199.1.129", "titulo": "Visual Navigation in Insects: Coupling of Egocentric and Geocentric Information", "autores": "Rüdiger Wehner, Barbara Michel, Per Antonsen", "revista": "Journal of Experimental Biology", "data": "1996-01-01", "ano": 1996, "resumo": "Social hymenopterans such as bees and ants are central-place foragers; they regularly depart from and return to fixed positions in their environment. In returning to the starting point of their foraging excursion or to any other point, they could resort to two fundamentally different ways of navigation by using either egocentric or geocentric systems of reference. In the first case, they would rely on information continuously collected en route (path integration, dead reckoning), i.e. integrate all angles steered and all distances covered into a mean home vector. In the second case, they are e", "url": "https://doi.org/10.1242/jeb.199.1.129", "citacoes": 635, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1242/jeb.199.1.129", "titulo": "Visual Navigation in Insects: Coupling of Egocentric and Geocentric Information fire. The findings clearly demonstrate that a variety of nesting substrates and nest building materials have key roles in organising the composition of bee communities. 3. The availability of bare ground and potential nesting cavities were the t", "url": "https://doi.org/10.1111/j.0307-6946.2005.00662.x", "citacoes": 547, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.cub.2017.03.027", "titulo": "Phylogenomic Insights into the Evolution of Stinging Wasps and the Origins of Ants and Bees", "autores": "Michael G. Branstetter, Bryan N. Danforth, James P. Pitts, Brant C. Faircloth, Philip S. Ward, Matthew L. Buffington et al.", "revista": "Current Biology", "data": "2017-04-01", "ano": 2017, "resumo": "The stinging wasps (Hymenoptera: Aculeata) are an extremely diverse lineage of hymenopteran insects, encompassing over 70,000 described species and a diversity of life history traits, including ectoparasitism, cleptoparasitism, predation, pollen feeding (bees [Anthophila] and Masarinae), and eusociality (social vespid wasps, ants, and some bees) [1]. The most well-studied lineages of Aculeata are the ants, which are ecologically dominant in most terrestrial ecosystems [2], and the bees, the most important lineage of angiosperm-pollinating insects [3]. Establishing the phylogenetic affinities o", "url": "https://doi.org/10.1016/j.cub.2017.03.027", "citacoes": 477, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1365-2664.1998.355343.x", "titulo": "Bioindication using trap‐nesting bees and wasps and their natural enemies: community structure and interactions", "autores": "Teja Tscharntke, Achim Gathmann, Ingolf Steffan‐Dewenter", "revista": "Journal of Applied Ecology", "data": "1998-10-01", "ano": 1998, "resumo": "1. Results from four field studies show that communities of trap‐nesting bees and wasps and their natural enemies are promising bioindicators for ecological change or habitat quality. These small and easy‐to‐handle communities can be analysed with respect to (i) species richness and related parameters, and (ii) ecological functions or interactions. The communities comprise Hymenoptera (Apidae, Sphecidae, Eumenidae, Pompilidae) and natural enemies belonging to many insect taxa. Traps consisted of 150–200, 15–20‐cm long, reed internodes, put into tins or plastic tubes of 13–15 cm diameter; woode", "url": "https://doi.org/10.1046/j.1365-2664.1998.355343.x", "citacoes": 438, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rstb.2002.1066", "titulo": "Information flow, opinion polling and collective intelligence in house–hunting social insects", "autores": "Nigel R. Franks, Stephen C. Pratt, Eamonn B. Mallon, Nicholas Ferris Britton, David J. T. Sumpter", "revista": "Philosophical Transactions of the Royal Society B Biological Sciences", "data": "2002-11-13", "ano": 2002, "resumo": "The sharing and collective processing of information by certain insect societies is one of the reasons that they warrant the superlative epithet 'super-organisms' (Franks 1989, Am. Sci. 77, 138-145). We describe a detailed experimental and mathematical analysis of information exchange and decision-making in, arguably, the most difficult collective choices that social insects face: namely, house hunting by complete societies. The key issue is how can a complete colony select the single best nest-site among several alternatives? Individual scouts respond to the diverse information they have pers", "url": "https://doi.org/10.1098/rstb.2002.1066", "citacoes": 346, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.biocon.2005.11.004", "titulo": "Are urban parks refuges for bumble bees Bombus spp. (Hymenoptera: Apidae)?", "autores": "Quinn S. McFrederick, Gretchen LeBuhn", "revista": "Biological Conservation", "data": "2005-12-23", "ano": 2005, "resumo": "", "url": "https://doi.org/10.1016/j.biocon.2005.11.004", "citacoes": 337, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1365-2311.1998.00145.x", "titulo": "Resource discovery versus resource domination in ants: a functional mechanism for breaking the trade‐off", "autores": "Diane W. Davidson", "revista": "Ecological Entomology", "data": "1998-11-01", "ano": 1998, "resumo": "The importance of competition in structuring natural communities is often a contentious issue, but not for myrmecologists (Hölldobler & Wilson 1990). Perhaps because eusociality buffers colonies against predation and the physical environment, and because so many ants act as generalized scavengers and exudate-feeders, competition appears to be ubiquitous in ant communities. In Hölldobler and Wilson's review of this subject, for example, factors ranging from overt aggression to over-dispersion of colonies, over-dispersion and complementarity of traits, exclusion experiments, and natural and expe", "url": "https://doi.org/10.1046/j.1365-2311.1998.00145.x", "citacoes": 334, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s10531-004-6066-x", "titulo": "Urban domestic gardens (II): experimental tests of methods for increasing biodiversity", "autores": "Kevin J. Gaston, Richard M. Smith, Ken A. Thompson, Philip H. Warren", "revista": "Biodiversity and Conservation", "data": "2005-02-01", "ano": 2005, "resumo": "", "url": "https://doi.org/10.1007/s10531-004-6066-x", "citacoes": 332, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.2307/1313439", "titulo": "Why Do Flowers Vary?", "autores": "Candace Galen", "revista": "BioScience", "data": "1999-08-01", "ano": 1999, "resumo": "The remarkable diversity of flowers has a profound impact on humankind. Flower diversity inspires masterpieces of art and literature, fuels highway beautification schemes, gives amateur gardeners moments of great joy and pride, and nurtures industries of bulb growers, seed companies, and horticultural supply houses. Botanists, for their part, have pondered the processes driving diversification in flower form for over two centuries (Sprengel [1793] 1972). Nearly all botanists give animal pollinators credit for the vast smorgasbord of flower shapes and sizes observed in nature. This conclusion i", "url": "https://doi.org/10.2307/1313439", "citacoes": 329, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1890/03-0410", "titulo": "WHY ARE SOME FLORAL NECTARS SCENTED?", "autores": "Robert A. Raguso", "revista": "Ecology", "data": "2004-06-01", "ano": 2004, "resumo": "Despite recent interest in the non-sugar components of floral nectar, nearly nothing is known about the ecological importance and phylogenetic distribution of scented nectar. If present, the scent of nectar would provide an honest signal to nectar-feeding animals. Nectar odors may directly impact plant reproductive fitness, through pollinator attraction or deterrence of nectar robbers and florivores. In addition, nectar odors may indirectly impact plant fitness through antimicrobial activity, pleiotropic interactions with plant defense, and communication with predators and parasitoids. The lit", "url": "https://doi.org/10.1890/03-0410", "citacoes": 304, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/een.12986", "titulo": "Nesting habitat of ground‐nesting bees: a review", "autores": "Cécile M. Antoine, Jessica R. K. Forrest", "revista": "Ecological Entomology", "data": "2020-11-26", "ano": 2020, "resumo": "About 3/4 of all wild bee species nest in the soil and spend much of their life cycle underground. These insects require suitable environmental conditions for nest construction and for the development and survival of their offspring. However, there is little quantitative information on the nesting habitat requirements and preferences of ground‐nesting bees. Moreover, there are almost no data on the effects of nesting conditions on these bees' fitness. Here, to better understand the factors that influence nest‐site selection in ground‐nesting bees, we synthesise the literature on the nesting‐ha", "url": "https://doi.org/10.1111/een.12986", "citacoes": 303, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.biocon.2006.01.023", "titulo": "Quantitative pollen requirements of solitary bees: Implications for bee conservation and the evolution of bee–flower relationships", "autores": "Antoine Müller, Stefan Diener, Simone Schnyder, Katharina Stutz, Claudio Sédivy, Silvia Dorn", "revista": "Biological Conservation", "data": "2006-03-14", "ano": 2006, "resumo": "", "url": "https://doi.org/10.1016/j.biocon.2006.01.023", "citacoes": 296, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.5751/es-00265-050103", "titulo": "Habitat Fragmentation and Native Bees: a Premature Verdict?", "autores": "James H. Cane", "revista": "Conservation Ecology", "data": "2001-01-01", "ano": 2001, "resumo": "Few studies directly address the consequences of habitat fragmentation for communities of pollinating insects, particularly for the key pollinator group, bees (Hymenoptera: Apiformes). Bees typically live in habitats where nesting substrates and bloom are patchily distributed and spatially dissociated. Bee studies have all defined habitat fragments as remnant patches of floral hosts or forests, overlooking the nesting needs of bees. Several authors conclude that habitat fragmentation is broadly deleterious, but their own data show that some native species proliferate in sampled fragments. Othe", "url": "https://doi.org/10.5751/es-00265-050103", "citacoes": 273, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.206.4422.1095", "titulo": "Genetic Component of Bee Odor in Kin Recognition", "autores": "Les Greenberg", "revista": "Science", "data": "1979-11-30", "ano": 1979, "resumo": "The primitively social sweat bee, Lasioglossum zephyrum, blocks the entry into its nest of most conspecifics from other colonies. Laboratory inbreeding of these bees produced lines which showed a positive linear relationship between the coefficient of relationship of bees tested and how often they permitted non-nestmates to pass them. The most probable mechanism is a genetically determined odor coupled with a learned component by which guard bees discriminate between odors of close kin and other bees.", "url": "https://doi.org/10.1126/science.206.4422.1095", "citacoes": 268, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.cub.2004.07.057", "titulo": "Nocturnal Vision and Landmark Orientation in a Tropical Halictid Bee", "autores": "Eric J. Warrant, Almut Kelber, Anna Gislén, Birgit Greiner, Willi A. Ribi, William T. Wcislo", "revista": "Current Biology", "data": "2004-08-01", "ano": 2004, "resumo": "", "url": "https://doi.org/10.1016/j.cub.2004.07.057", "citacoes": 255, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.sedgeo.2004.01.006", "titulo": "Reconnaissance of Upper Jurassic Morrison Formation ichnofossils, Rocky Mountain Region, USA: paleoenvironmental, stratigraphic, and paleoclimatic significance of terrestrial and freshwater ichnocoenoses", "autores": "Stephen T. Hasiotis", "revista": "Sedimentary Geology", "data": "2004-03-13", "ano": 2004, "resumo": "", "url": "https://doi.org/10.1016/j.sedgeo.2004.01.006", "citacoes": 253, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1439-0310.1986.tb00566.x", "titulo": "Forced Copulations and Intra‐specific Parasitism: Two Costs of Social Living in the White‐fronted Bee‐eater", "autores": "Stephen T. Emlen, Peter H. Wrege", "revista": "Ethology", "data": "1986-01-12", "ano": 1986, "resumo": "Abstract White‐fronted bee‐eaters are colonially breeding birds that exhibit highly developed helping‐at‐the‐nest. Through long‐term studies of an individually‐marked population, we have documented two costs of social living: 1) harassment of mated females by extra‐pair males, and 2) intra‐specific parasitism by females who lay eggs in the nests of others. Breeding females are sexually chased and, occasionally, forceably mated by males other than their mates. Focal‐sampling of females throughout their period of receptivity revealed that the average female is involved in 5 to 8 sexual chases an", "url": "https://doi.org/10.1111/j.1439-0310.1986.tb00566.x", "citacoes": 250, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.cub.2010.06.035", "titulo": "Path Integration Provides a Scaffold for Landmark Learning in Desert Ants", "autores": "Martin Müller, Rüdiger Wehner", "revista": "Current Biology", "data": "2010-07-09", "ano": 2010, "resumo": "", "url": "https://doi.org/10.1016/j.cub.2010.06.035", "citacoes": 246, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.cub.2009.08.015", "titulo": "Ants use the panoramic skyline as a visual cue during navigation", "autores": "Paul Graham, Ken Cheng", "revista": "Current Biology", "data": "2009-11-01", "ano": 2009, "resumo": "", "url": "https://doi.org/10.1016/j.cub.2009.08.015", "citacoes": 245, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s00442-012-2515-5", "titulo": "Mass-flowering crops enhance wild bee abundance", "autores": "Andrea Holzschuh, Carsten F. Dormann, Teja Tscharntke, Ingolf Steffan‐Dewenter", "revista": "Oecologia", "data": "2012-10-31", "ano": 2012, "resumo": "Although agricultural habitats can provide enormous amounts of food resources for pollinator species, links between agricultural and (semi-)natural habitats through dispersal and foraging movements have hardly been studied. In 67 study sites, we assessed the interactions between mass-flowering oilseed rape fields and semi-natural grasslands at different spatial scales, and their effects on the number of brood cells of a solitary cavity-nesting bee. The probability that the bee Osmia bicornis colonized trap nests in oilseed rape fields increased from 12 to 59 % when grassland was nearby, compar", "url": "https://doi.org/10.1007/s00442-012-2515-5", "citacoes": 243, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1890/06-1323.1", "titulo": "DO RESOURCES OR NATURAL ENEMIES DRIVE BEE POPULATION DYNAMICS IN FRAGMENTED HABITATS", "autores": "Ingolf Steffan‐Dewenter, Susanne Schiele", "revista": "Ecology", "data": "2008-05-01", "ano": 2008, "resumo": "The relative importance of bottom-up or top-down forces has been mainly studied for herbivores but rarely for pollinators. Habitat fragmentation might change driving forces of population dynamics by reducing the area of resource-providing habitats, disrupting habitat connectivity, and affecting natural enemies more than their host species. We studied spatial and temporal population dynamics of the solitary bee Osmia rufa (Hymenoptera: Megachilidae) in 30 fragmented orchard meadows ranging in size from 0.08 to 5.8 ha in an agricultural landscape in central Germany. From 1998 to 2003, we monitor", "url": "https://doi.org/10.1890/06-1323.1", "citacoes": 238, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1365-2656.2010.01675.x", "titulo": "Long foraging distances impose high costs on offspring production in solitary bees", "autores": "Antonia Zurbuchen, Stephanie Cheesman, Jeannine Klaiber, Antoine Müller, Silke Hein, Silvia Dorn", "revista": "Journal of Animal Ecology", "data": "2010-03-05", "ano": 2010, "resumo": "1. Solitary bees are central place foragers returning to their nests several times a day with pollen and nectar to provision their brood cells. They are especially susceptible to landscape changes that lead to an increased spatial separation of suitable nesting sites and flower rich host plant stands. While knowledge of bee foraging ranges is currently growing, quantitative data on the costs of foraging flights are very scarce, although such data are crucial to understand bee population dynamics. 2. In this study, the impact of increased foraging distance on the duration of foraging bouts and ", "url": "https://doi.org/10.1111/j.1365-2656.2010.01675.x", "citacoes": 231, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1890/03-0390", "titulo": "THE DUAL ROLE OF FLORAL TRAITS: POLLINATOR ATTRACTION AND PLANT DEFENSE", "autores": "Rebecca E. Irwin, Lynn S. Adler, Alison K. Brody", "revista": "Ecology", "data": "2004-06-01", "ano": 2004, "resumo": "Plants are under siege from a diversity of enemies that consume both leaf and floral parts. Plants resist damage to leaves in a variety of ways, and we now have a rich literature documenting how plants defend themselves against herbivore attack. In contrast, the mechanisms by which plants resist enemies that consume floral parts or resources are much less known, even though damage to floral tissue usually has tighter links to plant fitness than damage to leaf tissue. Many plants experience nectar robbing, whereby floral visitors remove nectar from flowers, often without pollinating. Nectar rob", "url": "https://doi.org/10.1890/03-0390", "citacoes": 209, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1242/jeb.00680", "titulo": "Hot bees in empty broodnest cells: heating from within", "autores": "Marco Kleinhenz, Brigitte Bujok, Stefan Fuchs, Jürgen Tautz", "revista": "Journal of Experimental Biology", "data": "2003-10-27", "ano": 2003, "resumo": "Honeybee colonies maintain brood nest temperatures of 33-36 degrees C. We investigated brood nest thermoregulation at the level of individual worker behaviour and the transfer of heat from workers to the brood. Worker bees contribute to the regulation of brood nest temperature by producing heat while sitting motionless on the caps of brood cells. We report here an additional, newly observed heating strategy where heating bees enter empty cells between sealed brood cells and remain there motionless for periods of up to 45 min. Individually marked worker bees on the surface of sealed brood cells", "url": "https://doi.org/10.1242/jeb.00680", "citacoes": 208, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1353/sor.2005.0012", "titulo": "Kin Selection as the Key to Altruism: Its Rise and Fall", "autores": "Edward O. Wilson", "revista": "Social research", "data": "2005-03-01", "ano": 2005, "resumo": "Edward O. Wilson Kin Selection as the Key to Altruism: Its Rise and Fall ONE OF THE ENDURING UNSETTLED ISSUES OF EVOLUTIONARY BIOLOGY is the paradox of collateral altruistic behavior—that is, when some individuals subordinate their own interests and those of their immedi­ ate offspring in order to serve the interests of a larger group beyond offspring (Wilson, 1975). How might such behavior evolve if the genes promoting it are at such a disadvantage in competition with genes that oppose it? Charles Darwin saw that the paradox was dangerous to his theory of evolution by natural selection. He wa", "url": "https://doi.org/10.1353/sor.2005.0012", "citacoes": 206, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.1006299107", "titulo": "Comprehensive phylogeny of apid bees reveals the evolutionary origins and antiquity of cleptoparasitism", "autores": "Sophie Cardinal, Jakub Straka, Bryan N. Danforth", "revista": "Proceedings of the National Academy of Sciences", "data": "2010-08-30", "ano": 2010, "resumo": "Apidae is the most speciose and behaviorally diverse family of bees. It includes solitary, eusocial, socially parasitic, and an exceptionally high proportion of cleptoparasitic species. Cleptoparasitic bees, which are brood parasites in the nests of other bees, have long caused problems in resolving the phylogenetic relationships within Apidae based on morphological data because of the tendency for parasites to converge on a suite of traits, making it difficult to differentiate similarity caused by common ancestry from convergence. Here, we resolve the evolutionary history of apid cleptoparasi", "url": "https://doi.org/10.1073/pnas.1006299107", "citacoes": 204, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1365-2311.1997.00071.x", "titulo": "Abiotic and biotic factors influencing nest‐site selection by Halictus rubicundus , a ground‐nesting halictine bee", "autores": "Simon Geoffrey Potts, Pat G. Willmer", "revista": "Ecological Entomology", "data": "1997-08-01", "ano": 1997, "resumo": "1. The nest‐site selection behaviour of the bee Halictus rubicundus (Christ) was examined both within and across sites in the U.K. Females utilized a range of edaphic and microclimatic conditions when choosing a site to excavate a nest. Factors with broad tolerances included slope and hardness; those with much narrower limits included aspect, soil humidity and soil particle composition. 2. There was a preference for softer soils that were easier to dig within a site with a low overall density, but in much denser aggregations problems of maintaining the structural integrity of a nest led to the", "url": "https://doi.org/10.1046/j.1365-2311.1997.00071.x", "citacoes": 204, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1365-294x.2012.05496.x", "titulo": "Environment or kin: whence do bees obtain acidophilic bacteria?", "autores": "Quinn S. McFrederick, William T. Wcislo, DOUGLAS R. TAYLOR, Heather D. Ishak, Scot E. Dowd, Ulrich G. Mueller", "revista": "Molecular Ecology", "data": "2012-02-16", "ano": 2012, "resumo": "As honey bee populations decline, interest in pathogenic and mutualistic relationships between bees and microorganisms has increased. Honey bees and bumble bees appear to have a simple intestinal bacterial fauna that includes acidophilic bacteria. Here, we explore the hypothesis that sweat bees can acquire acidophilic bacteria from the environment. To quantify bacterial communities associated with two species of North American and one species of Neotropical sweat bees, we conducted 16S rDNA amplicon 454 pyrosequencing of bacteria associated with the bees, their brood cells and their nests. Lac", "url": "https://doi.org/10.1111/j.1365-294x.2012.05496.x", "citacoes": 197, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s10841-007-9071-z", "titulo": "Displacement of Japanese native bumblebees by the recently introduced Bombus terrestris (L.) (Hymenoptera: Apidae)", "autores": "Maki N. Inoue, Jun Yokoyama, Izumi Washitani", "revista": "Journal of Insect Conservation", "data": "2007-03-12", "ano": 2007, "resumo": "", "url": "https://doi.org/10.1007/s10841-007-9071-z", "citacoes": 194, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/0006-3207(92)91201-3", "titulo": "Conservation evaluation and phylogenetic diversity", "autores": "Daniel P. Faith", "revista": "Biological Conservation", "data": "1992-01-01", "ano": 1992, "resumo": "", "url": "https://doi.org/10.1016/0006-3207(92)91201-3", "citacoes": 5956, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.1002720107", "titulo": "Conservation and divergence of methylation patterning in plants and animals", "autores": "Suhua Feng, Shawn J. Cokus, Xiaoyu Zhang, Pao‐Yang Chen, Magnolia L. Bostick, Mary Grace Goll et al.", "revista": "Proceedings of the National Academy of Sciences", "data": "2010-04-15", "ano": 2010, "resumo": "Cytosine DNA methylation is a heritable epigenetic mark present in many eukaryotic organisms. Although DNA methylation likely has a conserved role in gene silencing, the levels and patterns of DNA methylation appear to vary drastically among different organisms. Here we used shotgun genomic bisulfite sequencing (BS-Seq) to compare DNA methylation in eight diverse plant and animal genomes. We found that patterns of methylation are very similar in flowering plants with methylated cytosines detected in all sequence contexts, whereas CG methylation predominates in animals. Vertebrates have methyla", "url": "https://doi.org/10.1073/pnas.1002720107", "citacoes": 1363, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rspb.2004.2909", "titulo": "Tolerance of pollination networks to species extinctions", "autores": "Jane Memmott, Nickolas M. Waser, Mary V. Price", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2004-12-08", "ano": 2004, "resumo": "Mutually beneficial interactions between flowering plants and animal pollinators represent a critical 'ecosystem service' under threat of anthropogenic extinction. We explored probable patterns of extinction in two large networks of plants and flower visitors by simulating the removal of pollinators and consequent loss of the plants that depend upon them for reproduction. For each network, we removed pollinators at random, systematically from least-linked (most specialized) to most-linked (most generalized), and systematically from most- to least-linked. Plant species diversity declined most r", "url": "https://doi.org/10.1098/rspb.2004.2909", "citacoes": 1271, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.0703333104", "titulo": "Quantifying the biodiversity value of tropical primary, secondary, and plantation forests", "autores": "Jos Barlow, Toby Alan Gardner, Ivanei S. Araujo, Teresa C. S. Ávila‐Pires, Alexandre Bragio Bonaldo, Joana E. Costa et al.", "revista": "Proceedings of the National Academy of Sciences", "data": "2007-11-14", "ano": 2007, "resumo": "Biodiversity loss from deforestation may be partly offset by the expansion of secondary forests and plantation forestry in the tropics. However, our current knowledge of the value of these habitats for biodiversity conservation is limited to very few taxa, and many studies are severely confounded by methodological shortcomings. We examined the conservation value of tropical primary, secondary, and plantation forests for 15 taxonomic groups using a robust and replicated sample design that minimized edge effects. Different taxa varied markedly in their response to patterns of land use in terms o", "url": "https://doi.org/10.1073/pnas.0703333104", "citacoes": 1188, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1155/2015/931256", "titulo": "A Comprehensive Survey on Particle Swarm Optimization Algorithm and Its Applications", "autores": "Yudong Zhang, Shuihua Wang‎, Genlin Ji", "revista": "Mathematical Problems in Engineering", "data": "2015-01-01", "ano": 2015, "resumo": "Particle swarm optimization (PSO) is a heuristic global optimization method, proposed originally by Kennedy and Eberhart in 1995. It is now one of the most commonly used optimization techniques. This survey presented a comprehensive investigation of PSO. On one hand, we provided advances with PSO, including its modifications (including quantum-behaved PSO, bare-bones PSO, chaotic PSO, and fuzzy PSO), population topology (as fully connected, von Neumann, ring, star, random, etc.), hybridization (with genetic algorithm, simulated annealing, Tabu search, artificial immune system, ant colony algor", "url": "https://doi.org/10.1155/2015/931256", "citacoes": 1169, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.asoc.2009.12.025", "titulo": "A novel clustering approach: Artificial Bee Colony (ABC) algorithm", "autores": "Derviş Karaboğa, Celal Öztürk", "revista": "Applied Soft Computing", "data": "2009-12-23", "ano": 2009, "resumo": "", "url": "https://doi.org/10.1016/j.asoc.2009.12.025", "citacoes": 1082, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "t:the social behavior of the bees a comparative study", "titulo": "The social behavior of the bees : a comparative study", "autores": "Charles Duncan Michener", "revista": "Medical Entomology and Zoology", "data": "1974-01-01", "ano": 1974, "resumo": "Although the honeybee is without doubt man's favorite social insect, and the most studied by him, there are twenty thousand other species of bees, many of which are social. This book is the first to offer a systematic account of social behavior in the entire super family Apoidea. Of all the social insects, the various species of bees exhibit perhaps the broadest spectrum of social behavior, including intermediate stages which are scarce or totally extinct in other groups; in this respect the bees are particularly appropriate subjects for evolutionary study.With the aid of more than 200 illustr", "url": "https://openalex.org/W2989243010", "citacoes": 998, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/s41592-022-01426-1", "titulo": "SLEAP: A deep learning system for multi-animal pose tracking", "autores": "Talmo Pereira, Nathaniel Tabris, Arie Matsliah, David M. Turner, Junyu Li, Shruthi Ravindranath et al.", "revista": "Nature Methods", "data": "2022-04-01", "ano": 2022, "resumo": "The desire to understand how the brain generates and patterns behavior has driven rapid methodological innovation in tools to quantify natural animal behavior. While advances in deep learning and computer vision have enabled markerless pose estimation in individual animals, extending these to multiple animals presents unique challenges for studies of social behaviors or animals in their natural environments. Here we present Social LEAP Estimates Animal Poses (SLEAP), a machine learning system for multi-animal pose tracking. This system enables versatile workflows for data labeling, model train", "url": "https://doi.org/10.1038/s41592-022-01426-1", "citacoes": 989, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.1012675108", "titulo": "Episodic radiations in the fly tree of life", "autores": "Brian M. Wiegmann, Michelle Trautwein, Isaac S. Winkler, Norman B. Barr, Jungwook Kim, Christine L. Lambkin et al.", "revista": "Proceedings of the National Academy of Sciences", "data": "2011-03-14", "ano": 2011, "resumo": "Flies are one of four superradiations of insects (along with beetles, wasps, and moths) that account for the majority of animal life on Earth. Diptera includes species known for their ubiquity (Musca domestica house fly), their role as pests (Anopheles gambiae malaria mosquito), and their value as model organisms across the biological sciences (Drosophila melanogaster). A resolved phylogeny for flies provides a framework for genomic, developmental, and evolutionary studies by facilitating comparisons across model organisms, yet recent research has suggested that fly relationships have been obs", "url": "https://doi.org/10.1073/pnas.1012675108", "citacoes": 986, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.cub.2017.01.027", "titulo": "Evolutionary History of the Hymenoptera", "autores": "Ralph S. Peters, Lars Krogmann, Christoph Mayer, Alexander Donath, Simon Gunkel, Karen Meusemann et al.", "revista": "Current Biology", "data": "2017-03-23", "ano": 2017, "resumo": "", "url": "https://doi.org/10.1016/j.cub.2017.01.027", "citacoes": 971, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1023/a:1006456720416", "titulo": "Varroa jacobsoni (Acari: Varroidae) is more than one species", "autores": "Denis Anderson, John W. H. Trueman", "revista": "Experimental and Applied Acarology", "data": "2000-03-01", "ano": 2000, "resumo": "", "url": "https://doi.org/10.1023/a:1006456720416", "citacoes": 875, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1523-1739.1998.97154.x", "titulo": "The Potential Consequences of Pollinator Declines on the Conservation of Biodiversity and Stability of Food Crop Yields", "autores": "", "revista": "Conservation Biology", "data": "1998-02-11", "ano": 1998, "resumo": "Following reports of dramatic declines in managed and feral honey bees from nearly every region of North America, scientists and resource managers from the U.S., Mexico, and Canada came together to review the quality of the evidence that honey bees as well as other pollinators are in long-term decline and to consider the potential consequences of these losses on the conservation of biodiversity and the stability of the yield of food crops. These experts in pollination ecology confirmed that the last 5 years of losses of honeybee colonies in North America leave us with fewer managed pollinators", "url": "https://doi.org/10.1046/j.1523-1739.1998.97154.x", "citacoes": 817, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/bf00190398", "titulo": "The spectral input systems of hymenopteran insects and their receptor-based colour vision", "autores": "Dagmar Peitsch, Andrea Fietz, Horst Hertel, John de Souza, Dora Fix Ventura, Randolf Menzel", "revista": "Journal of Comparative Physiology A", "data": "1992-01-01", "ano": 1992, "resumo": "", "url": "https://doi.org/10.1007/bf00190398", "citacoes": 808, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1890/07-1292.1", "titulo": "MEASURING BEE DIVERSITY IN DIFFERENT EUROPEAN HABITATS AND BIOGEOGRAPHICAL REGIONS", "autores": "Catrin Westphal, Riccardo Bommarco, Gabriel Carré, Ellen Lamborn, Nicolas Morison, Theodora Petanidou et al.", "revista": "Ecological Monographs", "data": "2008-10-23", "ano": 2008, "resumo": "Bee pollinators are currently recorded with many different sampling methods. However, the relative performances of these methods have not been systematically evaluated and compared. In response to the strong need to record ongoing shifts in pollinator diversity and abundance, global and regional pollinator initiatives must adopt standardized sampling protocols when developing large‐scale and long‐term monitoring schemes. We systematically evaluated the performance of six sampling methods (observation plots, pan traps, standardized and variable transect walks, trap nests with reed internodes or", "url": "https://doi.org/10.1890/07-1292.1", "citacoes": 804, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rspb.2008.0405", "titulo": "Functional group diversity of bee pollinators increases crop yield", "autores": "Patrick Hoehn, Teja Tscharntke, Jason M. Tylianakis, Ingolf Steffan‐Dewenter", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2008-07-01", "ano": 2008, "resumo": "Niche complementarity is a commonly invoked mechanism underlying the positive relationship between biodiversity and ecosystem functioning, but little empirical evidence exists for complementarity among pollinator species. This study related differences in three functional traits of pollinating bees (flower height preference, daily time of flower visitation and within-flower behaviour) to the seed set of the obligate cross-pollinated pumpkin Cucurbita moschata Duch. ex Poir. across a land-use intensity gradient from tropical rainforest and agroforests to grassland in Indonesia. Bee richness and", "url": "https://doi.org/10.1098/rspb.2008.0405", "citacoes": 772, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.3390/molecules191219610", "titulo": "Recent Advances in the Chemical Composition of Propolis", "autores": "Shuai Huang, Cuiping Zhang, Kai Wang, George Qian Li, Fuliang Hu", "revista": "Molecules", "data": "2014-11-26", "ano": 2014, "resumo": "Propolis is a honeybee product with broad clinical applications. Current literature describes that propolis is collected from plant resins. From a systematic database search, 241 compounds were identified in propolis for the first time between 2000 and 2012; and they belong to such diverse chemical classes as flavonoids, p uman agriculture. Here, we conduct wide sampling across the phylogeny of these corbiculate bees and reveal a dynamic evolutionary history behind their microbiota, marked by multiple gains and losses of gut associates, the presence of generalist as well as host-specific strains, and patterns of diversification driven, in part, by host ecology (for example, colony size). Across four continents, we found", "url": "https://doi.org/10.1126/sciadv.1600513", "citacoes": 613, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.2307/2398833", "titulo": "Biogeography of the Bees", "autores": "Charles Duncan Michener", "revista": "Annals of the Missouri Botanical Garden", "data": "1979-01-01", "ano": 1979, "resumo": "", "url": "https://doi.org/10.2307/2398833", "citacoes": 606, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s00442-011-1965-5", "titulo": "CWM and Rao’s quadratic diversity: a unified framework for functional ecology", "autores": "Carlo Ricotta, Marco Moretti", "revista": "Oecologia", "data": "2011-03-21", "ano": 2011, "resumo": "", "url": "https://doi.org/10.1007/s00442-011-1965-5", "citacoes": 604, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.swevo.2016.12.005", "titulo": "A survey of swarm intelligence for dynamic optimization: Algorithms and applications", "autores": "Michalis Mavrovouniotis, Changhe Li, Shengxiang Yang", "revista": "Swarm and Evolutionary Computation", "data": "2017-01-11", "ano": 2017, "resumo": "", "url": "https://doi.org/10.1016/j.swevo.2016.12.005", "citacoes": 593, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido/2009019", "titulo": "The conservation of bees: a global perspective", "autores": "Mark J. F. Brown, Robert J. Paxton", "revista": "Apidologie", "data": "2009-04-30", "ano": 2009, "resumo": "Bees are major pollinators of Angiosperms and therefore their apparent decline is of importance for humans and biodiversity. We synthesise results of 12 recent reviews to provide a global picture of the threats they face. Habitat loss is the major threat to bee diversity, whilst invasive species, emerging diseases, pesticide use, and climate change also have the potential to impact bee populations. We suggest that future conservation strategies need to prioritise (i) minimising habitat loss, (ii) making agricultural habitats bee-friendly, (iii) training scientists and the public in bee taxonom", "url": "https://doi.org/10.1051/apido/2009019", "citacoes": 587, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.asoc.2018.10.036", "titulo": "Feature selection based on artificial bee colony and gradient boosting decision tree", "autores": "Haidi Rao, Xianzhang Shi, Ahoussou Kouassi Rodrigue, Juanjuan Feng, Yingchun Xia, Mohamed Elhoseny et al.", "revista": "Applied Soft Computing", "data": "2018-11-05", "ano": 2018, "resumo": "", "url": "https://doi.org/10.1016/j.asoc.2018.10.036", "citacoes": 585, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rspb.2015.1553", "titulo": "Orchid phylogenomics and multiple drivers of their extraordinary diversification", "autores": "Thomas J. Givnish, Daniel Spalink, Mercedes Ames, Stephanie P. Lyon, Steven J. Hunter, Alejandro Zuluaga et al.", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2015-08-26", "ano": 2015, "resumo": "Orchids are the most diverse family of angiosperms, with over 25 000 species,more than mammals, birds and reptiles combined. Tests of hypotheses to account for such diversity have been stymied by the lack of a fully resolved broad-scale phylogeny. Here,we provide such a phylogeny, based on 75 chloroplast genes for 39 species representing all orchid subfamilies and 16 of 17 tribes, time-calibrated against 17 angiosperm fossils. Asupermatrix analysis places an additional 144 species based on three plastid genes. Orchids appear to have arisen roughly 112 million years ago (Mya); the subfamilies O", "url": "https://doi.org/10.1098/rspb.2015.1553", "citacoes": 554, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rsbl.2007.0102", "titulo": "Death of an order: a comprehensive molecular phylogenetic study confirms that termites are eusocial cockroaches", "autores": "Daegan J. G. Inward, George Beccaloni, Paul Eggleton", "revista": "Biology Letters", "data": "2007-04-05", "ano": 2007, "resumo": "Termites are instantly recognizable mound-builders and house-eaters: their complex social lifestyles have made them incredibly successful throughout the tropics. Although known as 'white ants', they are not ants and their relationships with other insects remain unclear. Our molecular phylogenetic analyses, the most comprehensive yet attempted, show that termites are social cockroaches, no longer meriting being classified as a separate order (Isoptera) from the cockroaches (Blattodea). Instead, we propose that they should be treated as a family (Termitidae) of cockroaches. It is surprising to f", "url": "https://doi.org/10.1098/rsbl.2007.0102", "citacoes": 544, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1093/ae/37.2.119", "titulo": "Insects at Low Temperature", "autores": "Richard E. Chippendale", "revista": "American Entomologist", "data": "1991-01-01", "ano": 1991, "resumo": "Physiology of Insect Cold Hardiness.- 1. A Tribute to R. W. Salt.- 2. Principles of Insect Low Temperature Tolerance.- 3. The Water Relations of Overwintering Insects.- 4. Biochemistry of Cryoprotectants.- 5. Hemolymph Proteins Involved in Insect Subzero-Temperature Tolerance: Ice Nucleators and Antifreeze Proteins.- Impact on Development and Survival.- 6. Cold Shock and Heat Shock.- 7. Effects of Cold on Morphogenesis.- 8. Relationship between Cold Hardiness and Diapause.- 9. Thermoperiodism.- Species Adaptations.- 10. Winter Habitats and Ecological Adaptations for Winter Survival.- 11. Freez", "url": "https://doi.org/10.1093/ae/37.2.119", "citacoes": 519, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.jinsphys.2013.08.014", "titulo": "Towards the elements of successful insect RNAi", "autores": "Jeffrey G. Scott, Kristin Michel, Lyric C. Bartholomay, Blair D. Siegfried, Wayne Brian Hunter, Guy J. Smagghe et al.", "revista": "Journal of Insect Physiology", "data": "2013-09-13", "ano": 2013, "resumo": "", "url": "https://doi.org/10.1016/j.jinsphys.2013.08.014", "citacoes": 496, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1890/0012-9615(2000)070[0617:wgpcop]2.0.co;2", "titulo": "WHAT GOVERNS PROTEIN CONTENT OF POLLEN: POLLINATOR PREFERENCES, POLLEN–PISTIL INTERACTIONS, OR PHYLOGENY?", "autores": "T’ai H. Roulston, James H. Cane, Stephen L. Buchmann", "revista": "Ecological Monographs", "data": "2000-11-01", "ano": 2000, "resumo": "Pollen ranges from 2.5% to 61% protein content. Most pollen proteins are likely to be enzymes that function during pollen tube growth and subsequent fertilization, but the vast range of protein quantity may not reflect only pollen–pistil interactions. Because numerous vertebrate and invertebrate floral visitors consume pollen for protein, protein content may influence floral host choice. Additionally, many floral visitors pollinate their host plants. If protein content influences pollinator visitation, then pollinators are hypothesized to select for increased protein content of host plants. We", "url": "https://doi.org/10.1890/0012-9615(2000)070[0617:wgpcop]2.0.co;2", "citacoes": 484, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido:2000102", "titulo": "Propolis: recent advances in chemistry and plant origin", "autores": "Vassya Stefanova Bankova, Solange L. de Castro, María Cristina Marcucci", "revista": "Apidologie", "data": "2000-01-01", "ano": 2000, "resumo": "", "url": "https://doi.org/10.1051/apido:2000102", "citacoes": 1330, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1523-1739.1998.97154.x", "titulo": "The Potential Consequences of Pollinator Declines on the Conservation of Biodiversity and Stability of Food Crop Yields", "autores": "", "revista": "Conservation Biology", "data": "1998-02-11", "ano": 1998, "resumo": "Following reports of dramatic declines in managed and feral honey bees from nearly every region of North America, scientists and resource managers from the U.S., Mexico, and Canada came together to review the quality of the evidence that honey bees as well as other pollinators are in long-term decline and to consider the potential consequences of these losses on the conservation of biodiversity and the stability of the yield of food crops. These experts in pollination ecology confirmed that the last 5 years of losses of honeybee colonies in North America leave us with fewer managed pollinators", "url": "https://doi.org/10.1046/j.1523-1739.1998.97154.x", "citacoes": 817, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.3390/su11010189", "titulo": "Applications of Artificial Intelligence in Transport: An Overview", "autores": "Rusul L. Abduljabbar, Hussein Dia, Sohani Liyanage, Saeed Asadi Bagloee", "revista": "Sustainability", "data": "2019-01-02", "ano": 2019, "resumo": "The rapid pace of developments in Artificial Intelligence (AI) is providing unprecedented opportunities to enhance the performance of different industries and businesses, including the transport sector. The innovations introduced by AI include highly advanced computational methods that mimic the way the human brain works. The application of AI in the transport field is aimed at overcoming the challenges of an increasing travel demand, CO2 emissions, safety concerns, and environmental degradation. In light of the availability of a huge amount of quantitative and qualitative data and AI in this ", "url": "https://doi.org/10.3390/su11010189", "citacoes": 764, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s004420050949", "titulo": "Effects of habitat isolation on pollinator communities and seed set", "autores": "Ingolf Steffan‐Dewenter, Teja Tscharntke", "revista": "Oecologia", "data": "1999-11-22", "ano": 1999, "resumo": "", "url": "https://doi.org/10.1007/s004420050949", "citacoes": 706, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/cobi.12840", "titulo": "The city as a refuge for insect pollinators", "autores": "Damon M. Hall, Gerardo R. Camilo, Rebecca K. Tonietto, Jeff Ollerton, Karin Ahrné, Mike Arduser et al.", "revista": "Conservation Biology", "data": "2016-09-14", "ano": 2016, "resumo": "Research on urban insect pollinators is changing views on the biological value and ecological importance of cities. The abundance and diversity of native bee species in urban landscapes that are absent in nearby rural lands evidence the biological value and ecological importance of cities and have implications for biodiversity conservation. Lagging behind this revised image of the city are urban conservation programs that historically have invested in education and outreach rather than programs designed to achieve high-priority species conservation results. We synthesized research on urban bee", "url": "https://doi.org/10.1111/cobi.12840", "citacoes": 673, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rspb.2014.2849", "titulo": "Where is the UK's pollinator biodiversity? The importance of urban areas for flower-visiting insects", "autores": "Katherine C. R. Baldock, Mark A. Goddard, Damien M. Hicks, William E. Kunin, Nadine Mitschunas, Lynne M. Osgathorpe et al.", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2015-02-12", "ano": 2015, "resumo": "Insect pollinators provide a crucial ecosystem service, but are under threat. Urban areas could be important for pollinators, though their value relative to other habitats is poorly known. We compared pollinator communities using quantified flower-visitation networks in 36 sites (each 1 km(2)) in three landscapes: urban, farmland and nature reserves. Overall, flower-visitor abundance and species richness did not differ significantly between the three landscape types. Bee abundance did not differ between landscapes, but bee species richness was higher in urban areas than farmland. Hoverfly abun", "url": "https://doi.org/10.1098/rspb.2014.2849", "citacoes": 670, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1093/condor/108.4.986", "titulo": "Plant–pollinator Interactions: From Specialization To Generalization", "autores": "Carlos Martı́nez del Rio", "revista": "Ornithological Applications", "data": "2006-11-01", "ano": 2006, "resumo": "In 1985 I was present at a lecture in which Nat Wheelwright proposed that the mutualism between seed-dispersing birds and fruit-bearing plants was characterized by lack of specialization in both partners. He gave convincing evidence for the paucity of obligate one-to-one specialization, and explained the reason why extreme specializations in these systems ought to be rare (Wheelwright and Orians 1982). In the discussion after the lecture, Pete Feinsinger expressed a similar view of plant–pollinator systems. He suggested that pollination systems shared with dispersal systems a dearth of tight d", "url": "https://doi.org/10.1093/condor/108.4.986", "citacoes": 466, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1523-1739.2006.00574.x", "titulo": "Effect of Human Disturbance on Bee Communities in a Forested Ecosystem", "autores": "Rachael Winfree, Terry Griswold, Claire Kremen", "revista": "Conservation Biology", "data": "2006-11-06", "ano": 2006, "resumo": "It is important for conservation biologists to understand how well species persist in human-dominated ecosystems because protected areas constitute a small fraction of the Earth's surface and because anthropogenic habitats may offer more opportunities for conservation than has been previously thought. We investigated how an important functional group, pollinators (bees; Hymenoptera: Apiformes), are affected by human land use at the landscape and local scales in southern New Jersey (U.S.A.). We established 40 sites that differed in surrounding landscape cover or local habitat type and collected", "url": "https://doi.org/10.1111/j.1523-1739.2006.00574.x", "citacoes": 463, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1603/0013-8746(2008)101[140:braain]2.0.co;2", "titulo": "Bee Richness and Abundance in New York City Urban Gardens", "autores": "Kevin C. Matteson, John S. Ascher, Gail Langellotto", "revista": "Annals of the Entomological Society of America", "data": "2008-01-01", "ano": 2008, "resumo": "We describe the richness, abundance, and ecological characteristics of bees in community gardens located in heavily developed neighborhoods of the Bronx and East Harlem, NY. In total, 1,145 individual bees, representing 54 species (13% of the recorded New York State bee fauna) were collected over 4 yr. The nesting habits of these species include bees that nest in cavities (33% of species), hives (11% of species), pith (1.9% of species), wood (1.9% of species), or soft/rotting wood (7.4% of species) substrates. Soil-nesting individuals were relatively rare (25% of individuals), perhaps due to a", "url": "https://doi.org/10.1603/0013-8746(2008)101[140:braain]2.0.co;2", "citacoes": 432, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1525/auk.2011.10248", "titulo": "The Need to Quantify Ecosystem Services Provided by Birds", "autores": "Daniel G. Wenny, Travis L. DeVault, Matthew D. Johnson, Dave Kelly, Cagan Hakki Sekercioglu, Diana F. Tomback et al.", "revista": "The Auk", "data": "2011-01-01", "ano": 2011, "resumo": "WHAT ARE BIRDS worth—what is their actual dollar value to human society? To most of us in the ornithological community, birds are invaluable. But in these times we need more specific rationales to convince policy makers and business leaders to include bird conservation in land-use and development decisions. Over the past two decades, awareness of our dependence on a variety of ecosystem services (natural ecological processes that benefit human society) and of their importance and prevalence has progressed toward the goal of making conservation a mainstream value (Ehrlich and Kennedy 2005, Perr", "url": "https://doi.org/10.1525/auk.2011.10248", "citacoes": 420, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/1365-2664.12876", "titulo": "Increasing biodiversity in urban green spaces through simple vegetation interventions", "autores": "Caragh G. Threlfall, Luis Mata, Jessica Mackie, Amy K. Hahs, Nigel E. Stork, Nicholas S. G. Williams et al.", "revista": "Journal of Applied Ecology", "data": "2017-01-30", "ano": 2017, "resumo": "Summary Cities are rapidly expanding world‐wide and there is an increasing urgency to protect urban biodiversity, principally through the provision of suitable habitat, most of which is in urban green spaces. Despite this, clear guidelines of how to reverse biodiversity loss or increase it within a given urban green space is lacking. We examined the taxa‐ and species‐specific responses of five taxonomically and functionally diverse animal groups to three key attributes of urban green space vegetation that drive habitat quality and can be manipulated over time: the density of large native trees", "url": "https://doi.org/10.1111/1365-2664.12876", "citacoes": 416, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/s41467-020-14496-6", "titulo": "Urban areas as hotspots for bees and pollination but not a panacea for all insects", "autores": "Panagiotis Theodorou, Rita Radzevičiūtė, Guillaume Lentendu, Belinda Kahnt, Martin Husemann, Christoph Bleidorn et al.", "revista": "Nature Communications", "data": "2020-01-29", "ano": 2020, "resumo": "Urbanisation is an important global driver of biodiversity change, negatively impacting some species groups whilst providing opportunities for others. Yet its impact on ecosystem services is poorly investigated. Here, using a replicated experimental design, we test how Central European cities impact flying insects and the ecosystem service of pollination. City sites have lower insect species richness, particularly of Diptera and Lepidoptera, than neighbouring rural sites. In contrast, Hymenoptera, especially bees, show higher species richness and flower visitation rates in cities, where our ex", "url": "https://doi.org/10.1038/s41467-020-14496-6", "citacoes": 415, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1371/journal.pone.0023459", "titulo": "Changing Bee and Hoverfly Pollinator Assemblages along an Urban-Rural Gradient", "autores": "Adam J. Bates, Jon P. Sadler, Alison J. Fairbrass, Steven J. Falk, James Hale, Tom J. Matthews", "revista": "PLoS ONE", "data": "2011-08-12", "ano": 2011, "resumo": "BACKGROUND: The potential for reduced pollination ecosystem service due to global declines of bees and other pollinators is cause for considerable concern. Habitat degradation, destruction and fragmentation due to agricultural intensification have historically been the main causes of this pollinator decline. However, despite increasing and accelerating levels of global urbanization, very little research has investigated the effects of urbanization on pollinator assemblages. We assessed changes in the diversity, abundance and species composition of bee and hoverfly pollinator assemblages in urb", "url": "https://doi.org/10.1371/journal.pone.0023459", "citacoes": 401, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.envint.2015.12.011", "titulo": "Widespread contamination of wildflower and bee-collected pollen with complex mixtures of neonicotinoids and fungicides commonly applied to crops", "autores": "Arthur David, Cristina Botías, Ala'a K. Abdul‐Sada, Elizabeth Nicholls, Ellen L. Rotheray, Elizabeth M. Hill et al.", "revista": "Environment International", "data": "2016-01-04", "ano": 2016, "resumo": "", "url": "https://doi.org/10.1016/j.envint.2015.12.011", "citacoes": 392, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1523-1739.2003.01575.x", "titulo": "Importance of Habitat Area and Landscape Context for Species Richness of Bees and Wasps in Fragmented Orchard Meadows", "autores": "Ingolf Steffan‐Dewenter", "revista": "Conservation Biology", "data": "2003-07-16", "ano": 2003, "resumo": "Abstract: I investigated how habitat area, habitat connectivity, and landscape context affect the species richness and abundance of trap‐nesting bees, wasps, and their natural enemies. The research was done on 45 orchard meadows ranging in size from 0.08 to 5.8 ha and differing in habitat connectivity and the surrounding landscape matrix. Effects of the surrounding landscape matrix were restricted to circles with a radius of 250 m. Only the species richness of natural enemies increased with landscape diversity in the surrounding matrix. Population densities of bees increased with habitat conne", "url": "https://doi.org/10.1046/j.1523-1739.2003.01575.x", "citacoes": 392, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1890/1051-0761(2006)016[0632:crwadb]2.0.co;2", "titulo": "Complex Responses Within A Desert Bee Guild (Hymenoptera: Apiformes) To Urban Habitat Fragmentation", "autores": "James H. Cane, Robert L. Minckley, Linda J. Kervin, T’ai H. Roulston, Neal M. Williams", "revista": "Ecological Applications", "data": "2006-04-01", "ano": 2006, "resumo": "Urbanization within the Tucson Basin of Arizona during the past 50+ years has fragmented the original desert scrub into patches of different sizes and ages. These remnant patches and the surrounding desert are dominated by Larrea tridentata (creosote bush), a long-lived shrub whose flowers are visited by > 120 native bee species across its range. Twenty-one of these bee species restrict their pollen foraging to L. tridentata. To evaluate the response of this bee fauna to fragmentation, we compared species incidence and abundance patterns for the bee guild visiting L. tridentata at 59 habitat f", "url": "https://doi.org/10.1890/1051-0761(2006)016[0632:crwadb]2.0.co;2", "citacoes": 388, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1137/1003003", "titulo": "The Backboard Wiring Problem: A Placement Algorithm", "autores": "Leon Steinberg", "revista": "SIAM Review", "data": "1961- 19-2", "titulo": "Wild bees along an urban gradient: winners and losers", "autores": "Weronika Banaszak‐Cibicka, Michał Żmihorski", "revista": "Journal of Insect Conservation", "data": "2011-07-21", "ano": 2011, "resumo": "The variability of bee communities along an urban gradient has a potentially strong impact on pollinator-plant interactions. We investigated changes in bee species richness and community composition in the city centre and suburbs of Poznań, Poland. During 2006–2008 we recorded 2,495 individuals from 104 species. The most abundant species was Andrena haemmorhoa . Other abundant species were Bombus pascuorum , Andrena vaga , Andrena nitida , Bombus terrestris . Several species appeared to be more abundant in the city centre whereas others showed an opposite tendency. We have found that the urban", "url": "https://doi.org/10.1007/s10841-011-9419-2", "citacoes": 358, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1023/a:1013153427422", "titulo": "Plants, insects and birds in semi-natural pastures in relation to local habitat and landscape factors", "autores": "Bo Söderström, Birgitta Svensson, Karolina Vessby, Anders Glimskär", "revista": "Biodiversity and Conservation", "data": "2001-11-01", "ano": 2001, "resumo": "", "url": "https://doi.org/10.1023/a:1013153427422", "citacoes": 358, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1371/journal.pone.0005574", "titulo": "Bumble Bees (Bombus spp) along a Gradient of Increasing Urbanization", "autores": "Karin Ahrné, Jan Bengtsson, Thomas Elmqvist", "revista": "PLoS ONE", "data": "2009-05-14", "ano": 2009, "resumo": "BACKGROUND: Bumble bees and other wild bees are important pollinators of wild flowers and several cultivated crop plants, and have declined in diversity and abundance during the last decades. The main cause of the decline is believed to be habitat destructi
