<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de Abelhas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='32,3 58,18 58,46 32,61 6,46 6,18' fill='%23FFC933'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#FFFDF5; --surface:#FFFFFF; --surface2:#FFF7DB; --ink:#2A2208; --mut:#7C6F48; --line:#F1E7C6;
    --amarelo:#FFC933; --amarelo2:#F5B800; --suave:#FFEFB8; --acento:#8A5E00;
    --ok:#2F7D4F; --err:#B3261E;
    --sombra:0 1px 2px rgba(120,90,0,.06), 0 8px 24px rgba(120,90,0,.08);
    --raio:18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#15120A; --surface:#1F1B0E; --surface2:#2A2410; --ink:#F7EFD8; --mut:#B3A777; --line:#37301A;
      --amarelo:#FFCB3D; --amarelo2:#FFD966; --suave:#4A3C0F; --acento:#FFD966;
      --ok:#6FCF97; --err:#FF8A80;
      --sombra:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--ink); line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
  a { color:inherit; }

  /* ---------- topo ---------- */
  .topo { background:linear-gradient(180deg,var(--surface2),var(--bg)); border-bottom:1px solid var(--line); }
  .topo-in { max-width:1180px; margin:auto; padding:22px 20px 18px; display:flex; align-items:center; gap:14px; }
  .marca { display:flex; align-items:center; gap:14px; }
  .marca svg { flex:none; filter:drop-shadow(0 4px 8px rgba(184,134,0,.25)); }
  .marca h1 { margin:0; font-size:26px; letter-spacing:-.02em; font-weight:800; }
  .marca .sub { color:var(--mut); font-size:13.5px; margin-top:1px; }
  .conta { max-width:1180px; margin:12px auto 0; padding:0 20px; font-size:14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .conta input[type=email] { flex:1; min-width:210px; max-width:340px; padding:9px 14px; font-size:14px; border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--ink); }
  .conta .msg { width:100%; font-size:12px; color:var(--mut); }

  /* ---------- layout ---------- */
  .layout { max-width:1180px; margin:18px auto 60px; padding:0 20px; display:grid; grid-template-columns:290px minmax(0,1fr); gap:28px; align-items:start; }
  .layout.sem-sidebar { grid-template-columns:minmax(0,1fr); }
  .layout.sem-sidebar .sidebar { display:none; }
  .sidebar { position:sticky; top:14px; max-height:calc(100vh - 28px); overflow:auto; padding-right:4px; }
  .sb-bloco { background:var(--surface); border:1px solid var(--line); border-radius:var(--raio); padding:14px 14px 10px; margin-bottom:14px; box-shadow:var(--sombra); }
  .sb-titulo { font-size:13px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--acento); margin-bottom:8px; }
  .sb-bloco select { width:100%; padding:9px 12px; font-size:14px; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); margin-bottom:8px; }
  .sb-bloco input[type=search] { width:100%; padding:8px 12px; font-size:13px; border:1px solid var(--line); border-radius:999px; background:var(--bg); color:var(--ink); margin-bottom:6px; }
  .linha-btns { display:flex; gap:6px; flex-wrap:wrap; }
  .perfil-info { font-size:12px; color:var(--mut); margin-top:8px; }
  .lista-op { max-height:260px; overflow:auto; margin:0 -4px; padding:0 4px; }
  label.op { display:flex; align-items:center; gap:9px; padding:6px 6px; border-radius:10px; cursor:pointer; font-size:14px; position:relative; }
  label.op:hover { background:var(--surface2); }
  label.op input { position:absolute; opacity:0; pointer-events:none; }
  label.op .ck { flex:none; width:18px; height:18px; border:2px solid var(--amarelo2); border-radius:6px; background:var(--surface); display:inline-block; position:relative; }
  label.op input:checked + .ck { background:var(--amarelo); border-color:var(--amarelo2); }
  label.op input:checked + .ck::after { content:""; position:absolute; left:4px; top:0; width:5px; height:10px; border:solid var(--ink); border-width:0 2px 2px 0; transform:rotate(45deg); }
  label.op input:focus-visible + .ck { outline:2px solid var(--acento); outline-offset:2px; }
  label.op .nome { flex:1; min-width:0; line-height:1.25; }
  label.op .n { font-size:12px; color:var(--mut); background:var(--surface2); border-radius:999px; padding:1px 8px; }
  label.op.zero { opacity:.45; }
  .mais-filtros { width:100%; margin-bottom:14px; }
  .fnota { font-size:11px; color:var(--mut); margin:2px 4px 14px; }

  /* ---------- botões ---------- */
  .btn { padding:8px 16px; border:1.5px solid var(--amarelo2); background:transparent; color:var(--acento); border-radius:999px; cursor:pointer; font-size:13px; font-weight:600; font-family:inherit; }
  .btn:hover { background:var(--suave); }
  .btn.forte { background:var(--amarelo); border-color:var(--amarelo); color:#2A2208; }
  .btn.forte:hover { background:var(--amarelo2); }
  .btn.perigo { border-color:var(--err); color:var(--err); }
  .btn.mini { padding:4px 12px; font-size:12px; }
  .btn.largo { width:100%; }

  /* ---------- barra de abas ---------- */
  .barra { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .seg { display:inline-flex; background:var(--surface2); border:1px solid var(--line); border-radius:999px; padding:4px; gap:2px; flex-wrap:wrap; }
  .seg button { border:none; background:transparent; color:var(--mut); padding:9px 20px; border-radius:999px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .seg button.on { background:var(--amarelo); color:#2A2208; box-shadow:0 2px 8px rgba(184,134,0,.25); }
  .btn-filtros { display:none; }
  .busca-linha { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:6px; }
  .busca-linha input[type=search] { flex:1; min-width:220px; padding:12px 18px; font-size:15px; border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--ink); box-shadow:var(--sombra); }
  .busca-linha select { padding:11px 16px; font-size:14px; border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--ink); }
  .count { color:var(--mut); font-size:13px; margin:12px 4px; }

  /* ---------- cartões de artigo ---------- */
  h2.dia { font-size:13px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--acento); margin:26px 4px 12px; display:flex; align-items:center; gap:10px; }
  h2.dia::after { content:""; flex:1; height:2px; background:var(--suave); border-radius:2px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--raio); padding:16px 20px 14px; margin-bottom:14px; box-shadow:var(--sombra); transition:transform .12s, border-color .12s; }
  .card:hover { transform:translateY(-1px); border-color:var(--amarelo2); }
  .card-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; font-size:13px; }
  .rv { display:flex; flex-wrap:wrap; gap:8px; align-items:center; min-width:0; }
  .rev { font-weight:700; color:var(--acento); }
  .rev.mut { color:var(--mut); font-weight:500; }
  .sjr { background:var(--suave); color:var(--ink); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:700; white-space:nowrap; }
  .data { color:var(--mut); font-weight:600; white-space:nowrap; font-size:13px; }
  .titulo { display:block; margin:8px 0 4px; font-size:20px; line-height:1.3; font-weight:800; letter-spacing:-.01em; text-decoration:none; color:var(--ink); }
  .titulo:hover { color:var(--acento); text-decoration:underline; text-decoration-color:var(--amarelo); text-underline-offset:3px; }
  .autores { font-size:14px; color:var(--mut); }
  details.det { margin-top:10px; }
  details.det summary { cursor:pointer; font-size:13px; font-weight:700; color:var(--acento); list-style:none; }
  details.det summary::-webkit-details-marker { display:none; }
  details.det summary::before { content:"▸ "; }
  details.det[open] summary::before { content:"▾ "; }
  .det-in { margin-top:8px; }
  .res { font-size:14px; color:var(--ink); opacity:.88; }
  .tags { margin-bottom:8px; }
  .tag { display:inline-block; font-size:11.5px; background:var(--surface2); border:1px solid var(--line); padding:2px 10px; border-radius:999px; margin:0 6px 4px 0; color:var(--mut); font-weight:600; }
  .meta { font-size:12px; color:var(--mut); margin:6px 0; }
  .nota { font-size:14px; background:var(--surface2); border-left:4px solid var(--amarelo); padding:8px 12px; margin:10px 0; border-radius:8px; }
  .botoes { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }

  /* ---------- painéis, laboratório ---------- */
  .painel { background:var(--surface); border:2px solid var(--amarelo); border-radius:var(--raio); padding:18px; margin:0 0 16px; box-shadow:var(--sombra); }
  .painel h3 { margin:0 0 10px; font-size:19px; }
  .painel label.rot { display:block; font-weight:700; font-size:13px; margin:14px 0 4px; }
  .painel .dica { font-size:12px; color:var(--mut); margin:0 0 6px; }
  .painel input[type=text] { width:100%; padding:10px 14px; font-size:14px; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); }
  .caixas { max-height:210px; overflow:auto; border:1px solid var(--line); border-radius:12px; padding:6px 12px; background:var(--bg); }
  .caixas label { display:block; font-size:13px; padding:3px 0; cursor:pointer; }
  .acoes { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .bloco { background:var(--surface); border:1px solid var(--line); border-radius:var(--raio); padding:16px 18px; margin-bottom:14px; box-shadow:var(--sombra); }
  .bloco h3 { margin:0 0 8px; font-size:17px; }
  .linha { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .linha:last-child { border-bottom:none; }
  .bloco input[type=text], .bloco input[type=email] { padding:9px 14px; font-size:14px; border:1px solid var(--line); border-radius:999px; background:var(--bg); color:var(--ink); width:100%; max-width:340px; }
  .bloco select { padding:9px 12px; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); margin-bottom:8px; width:100%; }
  .aviso { background:var(--surface2); border:1.5px dashed var(--amarelo2); border-radius:var(--raio); padding:14px 16px; font-size:14px; margin-bottom:14px; }
  button.mais { display:block; margin:22px auto; padding:11px 26px; border-radius:999px; border:1.5px solid var(--amarelo2); background:var(--surface); color:var(--acento); cursor:pointer; font-size:14px; font-weight:700; font-family:inherit; }
  footer { text-align:center; color:var(--mut); font-size:12px; padding:20px 20px 30px; }

  /* ---------- celular ---------- */
  @media (max-width: 860px) {
    .layout { grid-template-columns:minmax(0,1fr); gap:10px; }
    .sidebar { display:none; position:static; max-height:none; }
    .sidebar.aberta { display:block; }
    .btn-filtros { display:inline-block; }
    .marca h1 { font-size:22px; }
    .seg button { padding:8px 14px; font-size:13px; }
    .titulo { font-size:18px; }
  }
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <div class="marca">
      <svg width="54" height="54" viewBox="0 0 64 64" role="img" aria-label="Logo: abelha em um favo">
        <defs><clipPath id="corpo"><ellipse cx="31" cy="37" rx="14" ry="10"/></clipPath></defs>
        <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" fill="#FFC933" stroke="#E0A800" stroke-width="2" stroke-linejoin="round"/>
        <ellipse cx="22" cy="24" rx="7.5" ry="11" fill="#FFFFFF" opacity=".92" transform="rotate(-28 22 24)"/>
        <ellipse cx="36" cy="22" rx="7.5" ry="11" fill="#FFFFFF" opacity=".92" transform="rotate(18 36 22)"/>
        <ellipse cx="31" cy="37" rx="14" ry="10" fill="#2A2208"/>
        <g clip-path="url(#corpo)" fill="#FFC933"><rect x="25" y="25" width="4.5" height="24"/><rect x="34" y="25" width="4.5" height="24"/></g>
        <circle cx="46" cy="36" r="5.2" fill="#2A2208"/>
        <circle cx="47.6" cy="34.6" r="1.1" fill="#FFFFFF"/>
        <path d="M17 37 L11 38.5 L17 40 Z" fill="#2A2208"/>
      </svg>
      <div><h1>Radar de Abelhas</h1><div class="sub">Artigos novos todo dia + clássicos da literatura · atualizado em 08/10/2026</div></div>
    </div>
  </div>
</header>
<div class="conta" id="conta" style="display:none"></div>

<div class="layout" id="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-bloco" id="area-lista">
      <div class="sb-titulo">Meu perfil</div>
      <select id="perfil-sel" onchange="setPerfil(this.value)"></select>
      <div class="linha-btns">
        <button class="btn forte mini" id="btn-criar" onclick="abrirPerfil('')">+ Criar perfil</button>
        <button class="btn mini" id="btn-editar" onclick="abrirPerfil(perfilAtivo)" style="display:none">Editar</button>
      </div>
      <div class="perfil-info" id="perfil-info"></div>
    </div>
    <div id="area-filtros">
      <div id="sec-abelha"></div>
      <div id="sec-tema"></div>
      <div class="sb-bloco">
        <div class="sb-titulo">Revista</div>
        <input type="search" id="rev-busca" placeholder="Buscar revista…" oninput="setRevBusca(this.value)">
        <div class="lista-op" id="rev-list"></div>
      </div>
      <button class="btn mais-filtros" id="btn-mais" onclick="alternarMais()">Mais filtros ▾</button>
      <div id="mais-dyn"></div>
      <div id="limpar-wrap"></div>
      <div class="fnota" id="fnota"></div>
    </div>
  </aside>

  <main class="conteudo">
    <div class="barra">
      <div class="seg">
        <button class="on" id="tab-novo" onclick="setAba('novo')">Novidades</button>
        <button id="tab-classico" onclick="setAba('classico')">Clássicos</button>
        <button id="tab-salvos" onclick="setAba('salvos')" style="display:none">⭐ Salvos</button>
        <button id="tab-lab" onclick="setAba('lab')" style="display:none">👥 Laboratório</button>
      </div>
      <button class="btn btn-filtros" onclick="alternarSidebar()">☰ Filtros</button>
    </div>
    <div class="painel" id="painel" style="display:none"></div>
    <div class="busca-linha" id="area-busca">
      <input type="search" id="busca" placeholder="Buscar por palavra no título, autor ou resumo…" oninput="setBusca(this.value)">
      <select id="ordem" onchange="setOrdem(this.value)">
        <option value="padrao">Ordem padrão</option>
        <option value="sjr">Maior SJR da revista</option>
        <option value="cit">Mais citados</option>
        <option value="data">Data de publicação</option>
      </select>
    </div>
    <div class="count" id="count"></div>
    <div id="lista"></div>
    <div id="lab-view" style="display:none"></div>
    <button class="mais" id="mais" onclick="mostrarMais()" style="display:none">Mostrar mais</button>
  </main>
</div>
<footer>Montado automaticamente com dados abertos do OpenAlex e do Europe PMC. SJR: SCImago Journal Rank.</footer>

ica e clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.561, "q": "Q1"}, {"key": "doi:10.3897/biorisk.10.4749", "titulo": "Climatic Risk and Distribution Atlas of European Bumblebees", "autores": "Pierre Rasmont, Markus Franzén, Thomas Lecocq, Alexander Harpke, Stuart P. M. Roberts, Koos Biesmeijer et al.", "revista": "BIORISK – Biodiversity and Ecosystem Risk Assessment", "data": "2015-02-18", "ano": 2015, "resumo": "Bumble bees represent one of the most important groups of pollinators. In addition to their ecological and economic relevance, they are also a highly charismatic group which can help to increase the interest of people in realizing, enjoying and conserving natural systems. However, like most animals, bum- ble bees are sensitive to climate. In this atlas, maps depicting potential risks of climate change for bumble bees are shown together with informative summary statistics, ecological back- ground information and a picture of each European species. Thanks to the EU FP7 project STEP, the authors ", "url": "https://doi.org/10.3897/biorisk.10.4749", "citacoes": 290, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Europa"]}, "sjr": 0.243, "q": "Q3"}, {"key": "doi:10.1890/10-1885.1", "titulo": "An examination of synchrony between insect emergence and flowering in Rocky Mountain meadows", "autores": "Jessica R. K. Forrest, James D. Thomson", "revista": "Ecological Monographs", "data": "2011-02-23", "ano": 2011, "resumo": "One possible effect of climate change is the generation of a mismatch in the seasonal timing of interacting organisms, owing to species-specific shifts in phenology. Despite concerns that plants and pollinators might be at risk of such decoupling, there have been few attempts to test this hypothesis using detailed phenological data on insect emergence and flowering at the same localities. In particular, there are few data sets on pollinator flight seasons that are independent of flowering phenology, because pollinators are typically collected at flowers. To address this problem, we established", "url": "https://doi.org/10.1890/10-1885.1", "citacoes": 288, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 3.776, "q": "Q1"}, {"key": "doi:10.1098/rspb.2012.1581", "titulo": "Altitude acts as an environmental filter on phylogenetic composition, traits and diversity in bee communities", "autores": "Bernhard Hoiß, Jochen Krauß, Simon Geoffrey Potts, Stuart M. Roberts, Ingolf Steffan‐Dewenter", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2012-08-29", "ano": 2012, "resumo": "Knowledge about the phylogeny and ecology of communities along environmental gradients helps to disentangle the role of competition-driven processes and environmental filtering for community assembly. In this study, we evaluated patterns in species richness, phylogenetic structure and life-history traits of bee communities along altitudinal gradients in the Alps, Germany. We found a linear decline in species richness and abundance but increasing phylogenetic clustering in communities with increasing altitude. The proportion of social- and ground-nesting species, as well as mean body size and a", "url": "https://doi.org/10.1098/rspb.2012.1581", "citacoes": 285, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Europa"]}, "sjr": 1.408, "q": "Q1"}, {"key": "doi:10.1007/s00040-002-8286-y", "titulo": "Self-assemblages in insect societies", "autores": "C. Anderson, Guy Théraulaz, J. L. Deneubourg", "revista": "Insectes Sociaux", "data": "2002-05-01", "ano": 2002, "resumo": "", "url": "https://doi.org/10.1007/s00040-002-8286-y", "citacoes": 282, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.342, "q": "Q3"}, {"key": "doi:10.1007/s11269-014-0700-5", "titulo": "Reservoir Optimization in Water Resources: a Review", "autores": "Asmadi Ahmad, Ahmed El‐Shafie, Siti Fatin Mohd Razali, Zawawi Samba Mohamad", "revista": "Water Resources Management", "data": "2014-06-19", "ano": 2014, "resumo": "", "url": "https://doi.org/10.1007/s11269-014-0700-5", "citacoes": 280, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Revisão ou síntese"], "Região": ["Região não citada"]}, "sjr": 1.207, "q": "Q1"}, {"key": "doi:10.1111/ele.12170", "titulo": "Biodiversity ensures plant–pollinator phenological synchrony against climate change", "autores": "Ígnasi Bartomeus, Mia G. Park, Jason Gibbs, Bryan N. Danforth, Alan N. Lakso, Rachael Winfree", "revista": "Ecology Letters", "data": "2013-08-22", "ano": 2013, "resumo": "Climate change has the potential to alter the phenological synchrony between interacting mutualists, such as plants and their pollinators. However, high levels of biodiversity might buffer the negative effects of species-specific phenological shifts and maintain synchrony at the community level, as predicted by the biodiversity insurance hypothesis. Here, we explore how biodiversity might enhance and stabilise phenological synchrony between a valuable crop, apple and its native pollinators. We combine 46 years of data on apple flowering phenology with historical records of bee pollinators over", "url": "https://doi.org/10.1111/ele.12170", "citacoes": 266, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Modelagem ou simulação"], "Região": ["Região não citada"]}, "sjr": 3.382, "q": "Q1"}, {"key": "doi:10.1126/science.aab0868", "titulo": "Functional mismatch in a bumble bee pollination mutualism under climate change", "autores": "Nicole E. Miller‐Struttmann, Jennifer C. Geib, James D. Franklin, Peter G. Kevan, Ricardo M. Holdø, Diane Ebert‐May et al.", "revista": "Science", "data": "2015-09-24", "ano": 2015, "resumo": "Ecological partnerships, or mutualisms, are globally widespread, sustaining agriculture and biodiversity. Mutualisms evolve through the matching of functional traits between partners, such as tongue length of pollinators and flower tube depth of plants. Long-tongued pollinators specialize on flowers with deep corolla tubes, whereas shorter-tongued pollinators generalize across tube lengths. Losses of functional guilds because of shifts in global climate may disrupt mutualisms and threaten partner species. We found that in two alpine bumble bee species, decreases in tongue length have evolved o", "url": "https://doi.org/10.1126/science.aab0868", "citacoes": 263, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 10.948, "q": "Q1"}, {"key": "doi:10.1046/j.1461-9563.2002.00152.x", "titulo": "Landscape structure, habitat fragmentation, and the ecology of insects", "autores": "Mark D. Hunter", "revista": "Agricultural and Forest Entomology", "data": "2002-07-15", "ano": 2002, "resumo": "My office doesn't have a window. If it did, and I could look across campus, my view would be a mosaic of buildings, grass, trees, parking areas, a couple of small streams, and even a lake. There are oak trees with diverse Cynipid assemblages, a myriad of arthropods in the litter beneath the ornamental plantings, and abundant pollinators on the Hypericum that lines the path from my office to the library. There are also diesel-belching buses and some insane planner's nightmare of one-way roads and dead-end footpaths. As a microcosm of the world at large, our campus is a study in fragmentation. A", "url": "https://doi.org/10.1046/j.1461-9563.2002.00152.x", "citacoes": 244, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Apis (Apini)"], "Tipo de estudo": ["Experimento ou campo", "Modelagem ou simulação", "Filogenia e taxonomia", "Genética e molecular"], "Região": ["América do Norte", "Europa"]}, "sjr": 0.516, "q": "Q1"}, {"key": "doi:10.1016/j.jenvman.2008.12.015", "titulo": "Managing carbon emissions in China through building energy efficiency", "autores": "Jun Li, Michel Colombier", "revista": "Journal of Environmental Management", "data": "2009-04-05", "ano": 2009, "resumo": "", "url": "https://doi.org/10.1016/j.jenvman.2008.12.015", "citacoes": 240, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Ásia e Oceania"]}, "sjr": 1.923, "q": "Q1"}, {"key": "doi:10.1093/mmy/myv067", "titulo": "Aspergillusand aspergilloses in wild and domestic animals: a global health concern with parallels to human disease", "autores": "Seyedmojtaba Seyedmousavi, Jacques Guillot, Pascal Arné, Sybren de Hoog, Johan Willem Mouton, Willem J. G. Melchers et al.", "revista": "Medical Mycology", "data": "2015-08-26", "ano": 2015, "resumo": "The importance of aspergillosis in humans and various animal species has increased over the last decades. Aspergillus species are found worldwide in humans and in almost all domestic animals and birds as well as in many wild species, causing a wide range of diseases from localized infections to fatal disseminated diseases, as well as allergic responses to inhaled conidia. Some prevalent forms of animal aspergillosis are invasive fatal infections in sea fan corals, stonebrood mummification in honey bees, pulmonary and air sac infection in birds, mycotic abortion and mammary gland infections in ", "url": "https://doi.org/10.1093/mmy/myv067", "citacoes": 234, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Apis (Apini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.721, "q": "Q1"}, {"key": "doi:10.1098/rsbl.2017.0125", "titulo": "Physiological thermal limits predict differential responses of bees to urban heat-island effects", "autores": "April L. Hamblin, Elsa Youngsteadt, Margarita María López-Uribe, Steven D. Frank", "revista": "Biology Letters", "data": "2017-06-01", "ano": 2017, "resumo": "Changes in community composition are an important, but hard to predict, effect of climate change. Here, we use a wild-bee study system to test the ability of critical thermal maxima (CT max , a measure of heat tolerance) to predict community responses to urban heat-island effects in Raleigh, NC, USA. Among 15 focal species, CT max ranged from 44.6 to 51.3°C, and was strongly predictive of population responses to urban warming across 18 study sites ( r 2 = 0.44). Species with low CT max declined the most. After phylogenetic correction, solitary species and cavity-nesting species (bumblebees) ha", "url": "https://doi.org/10.1098/rsbl.2017.0125", "citacoes": 226, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)", "Solitárias"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Região não citada"]}, "sjr": 0.982, "q": "Q1"}, {"key": "doi:10.1186/s13020-022-00651-2", "titulo": "Propolis: An update on its chemistry and pharmacological applications", "autores": "Rajib Hossain, Cristina Quispe, Rasel Ahmed Khan, Abu Saim Mohammad Saikat, Pranta Ray, Damira Ongalbek et al.", "revista": "Chinese Medicine", "data": "2022-08-26", "ano": 2022, "resumo": "Propolis, a resinous substance produced by honeybees from various plant sources, has been used for thousands of years in traditional medicine for several purposes all over the world. The precise composition of propolis varies according to plant source, seasons harvesting, geography, type of bee flora, climate changes, and honeybee species at the site of collection. This apiary product has broad clinical applications such as antioxidant, anti-inflammatory, antimicrobial, anticancer, analgesic, antidepressant, and anxiolytic as well asimmunomodulatory effects. It is also well known from traditio", "url": "https://doi.org/10.1186/s13020-022-00651-2", "citacoes": 218, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Apis (Apini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.298, "q": "Q1"}, {"key": "doi:10.1111/j.1461-0248.2011.01729.x", "titulo": "Warming, CO 2 , and nitrogen deposition interactively affect a plant‐pollinator mutualism", "autores": "Shelley E. Hoover, Jenny J. Ladley, Anastasia A. Shchepetkina, Maggie Tisch, Steven P. Gieseg, Jason M. Tylianakis", "revista": "Ecology Letters", "data": "2012-01-06", "ano": 2012, "resumo": "Environmental changes threaten plant-pollinator mutualisms and their critical ecosystem service. Drivers such as land use, invasions and climate change can affect pollinator diversity or species encounter rates. However, nitrogen deposition, climate warming and CO(2) enrichment could interact to disrupt this crucial mutualism by altering plant chemistry in ways that alter floral attractiveness or even nutritional rewards for pollinators. Using a pumpkin model system, we show that these drivers non-additively affect flower morphology, phenology, flower sex ratios and nectar chemistry (sugar and", "url": "https://doi.org/10.1111/j.1461-0248.2011.01729.x", "citacoes": 216, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 3.382, "q": "Q1"}, {"key": "doi:10.1098/rspb.1979.0081", "titulo": "Arms races between and within species", "autores": "Richard Dawkins, John Richard Krebs", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "1979-09-21", "ano": 1979, "resumo": "An adaptation in one lineage (e.g. predators) may change the selection pressure on another lineage (e.g. prey), giving rise to a counter-adaptation. If this occurs reciprocally, an unstable runaway escalation or 'arms race' may result. We discuss various factors which might give one side an advantage in an arms race. For example, a lineage under strong selection may out-evolve a weakly selected one (' the life-dinner principle'). We then classify arms races in two independent ways. They may be symmetric or asymmetric, and they may be interspecific or intraspecific. Our example of an asymmetric", "url": "https://doi.org/10.1098/rspb.1979.0081", "citacoes": 2228, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.408, "q": "Q1"}, {"key": "doi:10.1038/nature09205", "titulo": "The evolution of eusociality", "autores": "Martin A. Nowak, Corina E. Tarnita, Edward O. Wilson", "revista": "Nature", "data": "2010-08-01", "ano": 2010, "resumo": "", "url": "https://doi.org/10.1038/nature09205", "citacoes": 1516, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 19.713, "q": "Q1"}, {"key": "doi:10.1126/science.1215025", "titulo": "Neonicotinoid Pesticide Reduces Bumble Bee Colony Growth and Queen Production", "autores": "Penelope R. Whitehorn, Stephanie O’Connor, FELIX L. WÄCKERS, Dave Goulson", "revista": "Science", "data": "2012-03-30", "ano": 2012, "resumo": "Bad News for Bees Neonicotinoid insecticides were introduced in the early 1990s and have become one of the most widely used crop pesticides in the world. These compounds act on the insect central nervous system, and they have been shown to be persistent in the environment and in plant tissues. Recently, there have been controversial connections made between neonicotinoids and pollinator deaths, but the mechanisms underlying these potential deaths have remained unknown. Whitehorn et al. (p. 351 , published online 29 March) exposed developing colonies of bumble bees to low levels of the neonicot", "url": "https://doi.org/10.1126/science.1215025", "citacoes": 1312, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)", "Apis (Apini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 10.948, "q": "Q1"}, {"key": "doi:10.1126/science.1108197", "titulo": "Haploidploidy and the Evolution of the Social Insect", "autores": "Robert L. Trivers, Hope Hare", "revista": "Science", "data": "1976-01-23", "ano": 1976, "resumo": "Halminton (1) was apparently the first to appreciate that the synthesis of Mendelian genetics with Darwin's theory of natural selection had profound implications for social theory. In particular, insofar as almost all social behavior is either selfish or altruistic (or has such effects), genetical reasoning suggests that an individual's social behavior should be adjusted to his or her degree of relatedness, r, to all individuals affected by the behavior. We call this theory kinship theory. The social insects provide a critical test of Hamilton's kinship theory. When such theory is combined wit", "url": "https://doi.org/10.1126/science.1108197", "citacoes": 1271, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)", "Solitárias"], "Tipo de estudo": ["Genética e molecular"], "Região": ["Região não citada"]}, "sjr": 10.948, "q": "Q1"}, {"key": "doi:10.1038/nature11585", "titulo": "Combined pesticide exposure severely affects individual- and colony-level traits in bees", "autores": "Richard J. Gill, Oscar Ramos-Rodriguez, Nigel E. Raıne", "revista": "Nature", "data": "2012-10-19", "ano": 2012, "resumo": "", "url": "https://doi.org/10.1038/nature11585", "citacoes": 1027, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 19.713, "q": "Q1"}, {"key": "doi:10.1016/j.cub.2017.01.027", "titulo": "Evolutionary History of the Hymenoptera", "autores": "Ralph S. Peters, Lars Krogmann, Christoph Mayer, Alexander Donath, Simon Gunkel, Karen Meusemann et al.", "revista": "Current Biology", "data": "2017-03-23", "ano": 2017, "resumo": "", "url": "https://doi.org/10.1016/j.cub.2017.01.027", "citacoes": 971, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 2.897, "q": "Q1"}, {"key": "doi:10.1086/284846", "titulo": "Reproductive Harmony via Mutual Policing by Workers in Eusocial Hymenoptera", "autores": "Francis L. W. Ratnieks", "revista": "The American Naturalist", "data": "1988-08-01", "ano": 1988, "resumo": "When queens of eusocial Hymenoptera mate two or more times (assuming equal sperm contributions from males and random sperm use), the workers are more closely related to the queen's sons than to the sons of a randomly chosen worker. This suggests that workers should try to prevent other workers from reproducing, and hence producing sons, in species with queens that mate two or more times. It also provides a possible reason for the absence of reproductive workers in many hymenopteran societies. Reproductive harmony may, therefore, and counterintuitively, result from lowered relatedness among wor", "url": "https://doi.org/10.1086/284846", "citacoes": 739, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem ferrão (Meliponini)", "Mamangavas (Bombini)", "Apis (Apini)"], "Tipo de estudo": ["Modelagem ou simulação", "Genética e molecular"], "Região": ["Região não citada"]}, "sjr": 1.18, "q": "Q1"}, {"key": "doi:10.1126/science.1156108", "titulo": "Ancestral Monogamy Shows Kin Selection Is Key to the Evolution of Eusociality", "autores": "William O. H. Hughes, Benjamin P. Oldroyd, Madeleine Beekman, Francis L. W. Ratnieks", "revista": "Science", "data": "2008-05-29", "ano": 2008, "resumo": "Close relatedness has long been considered crucial to the evolution of eusociality. However, it has recently been suggested that close relatedness may be a consequence, rather than a cause, of eusociality. We tested this idea with a comparative analysis of female mating frequencies in 267 species of eusocial bees, wasps, and ants. We found that mating with a single male, which maximizes relatedness, is ancestral for all eight independent eusocial lineages that we investigated. Mating with multiple males is always derived. Furthermore, we found that high polyandry (>2 effective mates) occurs on", "url": "https://doi.org/10.1126/science.1156108", "citacoes": 692, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Experimento ou campo"], "Região": ["Região não citada"]}, "sjr": 10.948, "q": "Q1"}, {"key": "doi:10.1111/j.1523-1739.2004.00227.x", "titulo": "Tropical Forest Fragments Enhance Pollinator Activity in Nearby Coffee Crops", "autores": "Taylor H. Ricketts", "revista": "Conservation Biology", "data": "2004-09-28", "ano": 2004, "resumo": "Abstract: Crop pollination by wild bees is an ecosystem service of enormous value, but it is under increasing threat from agricultural intensification. As with many ecosystem services, the mechanisms, scales, and species through which crop pollination is provided are too poorly understood to inform land‐use decisions. I investigated the role of tropical forest remnants as sources of pollinators to surrounding coffee crops in Costa Rica. In 2001 and 2002 I observed bee activity and pollen deposition rates at coffee flowers along distance gradients from two fragments and one narrow riparian stri", "url": "https://doi.org/10.1111/j.1523-1739.2004.00227.x", "citacoes": 639, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem ferrão (Meliponini)", "Apis (Apini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Neotrópico (fora do Brasil)"]}, "sjr": 2.004, "q": "Q1"}, {"key": "doi:10.1038/40130", "titulo": "Extraordinary lifespans in ants: a test of evolutionary theories of ageing", "autores": "Laurent Keller, Michel Genoud", "revista": "Nature", "data": "1997-10-01", "ano": 1997, "resumo": "", "url": "https://doi.org/10.1038/40130", "citacoes": 629, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 19.713, "q": "Q1"}, {"key": "doi:10.1126/sciadv.1600513", "titulo": "Dynamic microbiome evolution in social bees", "autores": "Waldan K. Kwong, Luis A. Medina, Hauke Koch, Kong‐Wah Sing, Eunice J. Y. Soh, John S. Ascher et al.", "revista": "Science Advances", "data": "2017-03-03", "ano": 2017, "resumo": "The highly social (eusocial) corbiculate bees, comprising the honey bees, bumble bees, and stingless bees, are ubiquitous insect pollinators that fulfill critical roles in ecosystem services and human agriculture. Here, we conduct wide sampling across the phylogeny of these corbiculate bees and reveal a dynamic evolutionary history behind their microbiota, marked by multiple gains and losses of gut associates, the presence of generalist as well as host-specific strains, and patterns of diversification driven, in part, by host ecology (for example, colony size). Across four continents, we found", "url": "https://doi.org/10.1126/sciadv.1600513", "citacoes": 613, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem ferrão (Meliponini)", "Mamangavas (Bombini)", "Apis (Apini)"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Região não citada"]}, "sjr": 4.534, "q": "Q1"}, {"key": "doi:10.1016/j.leaqua.2015.12.007", "titulo": "The queen bee phenomenon: Why women leaders distance themselves from junior women", "autores": "Belle Derks, Colette van Laar, Naomi Ellemers", "revista": "The Leadership Quarterly", "data": "2016-01-15", "ano": 2016, "resumo": "", "url": "https://doi.org/10.1016/j.leaqua.2015.12.007", "citacoes": 594, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 6.124, "q": "Q1"}, {"key": "doi:10.1098/rsbl.2007.0102", "titulo": "Death of an order: a comprehensive molecular phylogenetic study confirms that termites are eusocial cockroaches", "autores": "Daegan J. G. Inward, George Beccaloni, Paul Eggleton", "revista": "Biology Letters", "data": "2007-04-05", "ano": 2007, "resumo": "Termites are instantly recognizable mound-builders and house-eaters: their complex social lifestyles have made them incredibly successful throughout the tropics. Although known as 'white ants', they are not ants and their relationships with other insects remain unclear. Our molecular phylogenetic analyses, the most comprehensive yet attempted, show that termites are social cockroaches, no longer meriting being classified as a separate order (Isoptera) from the cockroaches (Blattodea). Instead, we propose that they should be treated as a family (Termitidae) of cockroaches. It is surprising to f", "url": "https://doi.org/10.1098/rsbl.2007.0102", "citacoes": 544, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Região não citada"]}, "sjr": 0.982, "q": "Q1"}, {"key": "doi:10.1371/journal.pbio.0050062", "titulo": "The Gene vitellogenin Has Multiple Coordinating Effects on Social Organization", "autores": "C. Mindy Nelson, Kate E. Ihle, M. Kim Fondrk, Robert E. Page, Gro Vang Amdam", "revista": "PLoS Biology", "data": "2007-02-27", "ano": 2007, "resumo": "Temporal division of labor and foraging specialization are key characteristics of honeybee social organization. Worker honeybees (Apis mellifera) initiate foragin key": "doi:10.1016/j.cub.2017.03.027", "titulo": "Phylogenomic Insights into the Evolution of Stinging Wasps and the Origins of Ants and Bees", "autores": "Michael G. Branstetter, Bryan N. Danforth, James P. Pitts, Brant C. Faircloth, Philip S. Ward, Matthew L. Buffington et al.", "revista": "Current Biology", "data": "2017-04-01", "ano": 2017, "resumo": "The stinging wasps (Hymenoptera: Aculeata) are an extremely diverse lineage of hymenopteran insects, encompassing over 70,000 described species and a diversity of life history traits, including ectoparasitism, cleptoparasitism, predation, pollen feeding (bees [Anthophila] and Masarinae), and eusociality (social vespid wasps, ants, and some bees) [1]. The most well-studied lineages of Aculeata are the ants, which are ecologically dominant in most terrestrial ecosystems [2], and the bees, the most important lineage of angiosperm-pollinating insects [3]. Establishing the phylogenetic affinities o", "url": "https://doi.org/10.1016/j.cub.2017.03.027", "citacoes": 477, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Região não citada"]}, "sjr": 2.897, "q": "Q1"}, {"key": "doi:10.1126/science.aaa4788", "titulo": "Genomic signatures of evolutionary transitions from solitary to group living", "autores": "Karen M. Kapheim, Hailin Pan, Cai Li, Steven L. Salzberg, Daniela Puiu, Tanja Magoč et al.", "revista": "Science", "data": "2015-05-15", "ano": 2015, "resumo": "The evolution of eusociality is one of the major transitions in evolution, but the underlying genomic changes are unknown. We compared the genomes of 10 bee species that vary in social complexity, representing multiple independent transitions in social evolution, and report three major findings. First, many important genes show evidence of neutral evolution as a consequence of relaxed se ation, Constraint, and History in the Evolution of Eyes", "autores": "Timothy H. Goldsmith", "revista": "The Quarterly Review of Biology", "data": "1990-09-01", "ano": 1990, "resumo": "Several features of the evolution of eyes and photoreceptors are examined in an effort to explore the relative roles of adaptation and historical and developmental constraints. Optical design shows clear evidence of adaptation, which in some respects approaches optima predictable from physics. The primate fovea, on the other hand, illustrates how adaptation can be channeled by developmental heritage. The primary structures of opsins reveal multiple evolutionary lineages within both Drosophila and humans. The pigments of vertebrae rods comprise a subset of opsins whose evolutionary relationship", "url": "https://doi.org/10.1086/416840", "citacoes": 642, "fonte": "OpenAlex", "topico": "Comunicação, cognição e comportamento", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Região não citada"]}, "sjr": 0.95, "q": "Q1"}, {"key": "doi:10.1242/jeb.199.1.129", "titulo": "Visual Navigation in Insects: Coupling of Egocentric and Geocentric Information", "autores": "Rüdiger Wehner, Barbara Michel, Per Antonsen", "revista": "Journal of Experimental Biology", "data": "1996-01-01", "ano": 1996, "resumo": "Social hymenopterans such as bees and ants are central-place foragers; they regularly depart from and return to fixed positions in their environment. In returning to the starting point of their foraging excursion or to any other point, they could resort to two fundamentally different ways of navigation by using either egocentric or geocentric systems of reference. In the first case, they would rely on information continuously collected en route (path integration, dead reckoning), i.e. integrate all angles steered and all distances covered into a mean home vector. In the second case, they are e", "url": ada"]}, "sjr": 1.7, "q": "Q1"}, {"key": "doi:10.1046/j.1365-2311.1998.00145.x", "titulo": "Resource discovery versus resource domination in ants: a functional mechanism for breaking the trade‐off", "autores": "Diane W. Davidson", "revista": "Ecological Entomology", "data": "1998-11-01", "ano": 1998, "resumo": "The importance of competition in structuring natural communities is often a contentious issue, but not for myrmecologists (Hölldobler & Wilson 1990). Perhaps because eusociality buffers colonies against predation and the physical environment, and because so many ants act as generalized scavengers and exudate-feeders, competition appears to be ubiquitous in ant communities. In Hölldobler and Wilson's review of this subject, for example, factors ranging from overt aggression to over-dispersion of colonies, over-dispersion and complementarity of traits, exclusion experiments, and natural and expe", "url": "https://doi.org/10.1046/j.1365-2311.1998.00145.x", "citacoes": 334, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Experimento ou campo", "Filogenia e taxonomia"], "Região": ["Brasil", "América do Norte", "Ásia e Oceania"]}, "sjr": 0.631, "q": "Q1"}, {"key": "doi:10.1007/s10531-004-6066-x", "titulo": "Urban domestic gardens (II): experimental tests of methods for increasing biodiversity", "autores": "Kevin J. Gaston, Richard M. Smith, Ken A. Thompson, Philip H. Warren", "revista": "Biodiversity and Conservation", "data": "2005-02-01", "ano": 2005, "resumo": "", "url": "https://doi.org/10.1007/s10531-004-6066-x", "citacoes": 332, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Experimento ou campo"], "Região": ["Região não citada"]}, "sjr": 1.025, "q": "Q1"}, {"key": "doi:10.2307/1313439", "titulo": "Why Do Flowers Vary?", "autores": "Candace Galen", "revista": "BioScience", "data": "1999-08-01", "ano": 1999, "resumo": "The remarkable diversity of flowers has a profound impact on humankind. Flower diversity inspires masterpieces of art and literature, fuels highway beautification schemes, gives amateur gardeners moments of great joy and pride, and nurtures industries of bulb growers, seed companies, and horticultural supply houses. Botanists, for their part, have pondered the processes driving diversification in flower form for over two centuries (Sprengel [1793] 1972). Nearly all botanists give animal pollinators credit for the vast smorgasbord of flower shapes and sizes observed in nature. This conclusion i", "url": "https://doi.org/10.2307/1313439", "citacoes": 329, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)"], "Tipo de estudo": ["Filogenia e taxonomia", "Genética e molecular"], "Região": ["Região não citada"]}, "sjr": 2.295, "q": "Q1"}, {"key": "doi:10.1890/03-0410", "titulo": "WHY ARE SOME FLORAL NECTARS SCENTED?", "autores": "Robert A. Raguso", "revista": "Ecology", "data": "2004-06-01", "ano": 2004, "resumo": "Despite recent interest in the non-sugar components of floral nectar, nearly nothing is known about the ecological importance and phylogenetic distribution of scented nectar. If present, the scent of nectar would provide an honest signal to nectar-feeding animals. Nectar odors may directly impact plant reproductive fitness, through pollinator attraction or deterrence of nectar robbers and florivores. In addition, nectar odors may indirectly impact plant fitness through antimicrobial activity, pleiotropic interactions with plant defense, and communication with predators and parasitoids. The lit", "url": "https://doi.org/10.1890/03-0410", "citacoes": 304, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Região não citada"]}, "sjr": 1.767, "q": "Q1"}, {"key": "doi:10.1111/een.12986", "titulo": "Nesting habitat of ground‐nesting bees: a review", "autores": "Cécile M. Antoine, Jessica R. K. Forrest", "revista": "Ecological Entomology", "data": "2020-11-26", "ano": 2020, "resumo": "About 3/4 of all wild bee species nest in the soil and spend much of their life cycle underground. These insects require suitable environmental conditions for nest construction and for the development and survival of their offspring. However, there is little quantitative information on the nesting habitat requirements and preferences of ground‐nesting bees. Moreover, there are almost no data on the effects of nesting conditions on these bees' fitness. Here, to better understand the factors that influence nest‐site selection in ground‐nesting bees, we synthesise the literature on the nesting‐ha", "url": "https://doi.org/10.1111/een.12986", "citacoes": 303, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Revisão ou síntese", "Experimento ou campo"], "Região": ["Região não citada"]}, "sjr": 0.631, "q": "Q1"}, {"key": "doi:10.1016/j.biocon.2006.01.023", "titulo": "Quantitative pollen requirements of solitary bees: Implications for bee conservation and the evolution of bee–flower relationships", "autores": "Antoine Müller, Stefan Diener, Simone Schnyder, Katharina Stutz, Claudio Sédivy, Silvia Dorn", "revista": "Biological Conservation", "data": "2006-03-14", "ano": 2006, "resumo": "", "url": "https://doi.org/10.1016/j.biocon.2006.01.023", "citacoes": 296, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.7, "q": "Q1"}, {"key": "doi:10.1126/science.206.4422.1095", "titulo": "Genetic Component of Bee Odor in Kin Recognition", "autores": "Les Greenberg", "revista": "Science", "data": "1979-11-30", "ano": 1979, "resumo": "The primitively social sweat bee, Lasioglossum zephyrum, blocks the entry into its nest of most conspecifics from other colonies. Laboratory inbreeding of these bees produced lines which showed a positive linear relationship between the coefficient of relationship of bees tested and how often they permitted non-nestmates to pass them. The most probable mechanism is a genetically determined odor coupled with a learned component by which guard bees discriminate between odors of close kin and other bees.", "url": "https://doi.org/10.1126/science.206.4422.1095", "citacoes": 268, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Genética e molecular"], "Região": ["Região não citada"]}, "sjr": 10.948, "q": "Q1"}, {"key": "doi:10.1016/j.cub.2004.07.057", "titulo": "Nocturnal Vision and Landmark Orientation in a Tropical Halictid Bee", "autores": "Eric J. Warrant, Almut Kelber, Anna Gislén, Birgit Greiner, Willi A. Ribi, William T. Wcislo", "revista": "Current Biology", "data": "2004-08-01", "ano": 2004, "resumo": "", "url": "https://doi.org/10.1016/j.cub.2004.07.057", "citacoes": 255, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 2.897, "q": "Q1"}, {"key": "doi:10.1016/j.sedgeo.2004.01.006", "titulo": "Reconnaissance of Upper Jurassic Morrison Formation ichnofossils, Rocky Mountain Region, USA: paleoenvironmental, stratigraphic, and paleoclimatic significance of terrestrial and freshwater ichnocoenoses", "autores": "Stephen T. H lo": "DO RESOURCES OR NATURAL ENEMIES DRIVE BEE POPULATION DYNAMICS IN FRAGMENTED HABITATS", "autores": "Ingolf Steffan‐Dewenter, Susanne Schiele", "revista": "Ecology", "data": "2008-05-01", "ano": 2008, "resumo": "The relative importance of bottom-up or top-down forces has been mainly studied for herbivores but rarely for pollinators. Habitat fragmentation might change driving forces of population dynamics by reducing the area of resource-providing habitats, disrupting habitat connectivity, and affecting natural enemies more than their host species. We studied spatial and temporal population dynamics of the solitary bee Osmia rufa (Hymenoptera: Megachilidae) in 30 fragmented orchard meadows ranging in size from 0.08 to 5.8 ha in an agricultural landscape in central Germany. From 1998 to 2003, we monitor", "url": "https://doi.org/10.1890/06-1323.1", "citacoes": 238, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Europa"]}, "sjr": 1.767, "q": "Q1"}, {"key": "doi:10.1111/j.1365-2656.2010.01675.x", "titulo": "Long foraging distances impose high costs on offspring production in solitary bees", "autores": "Antonia Zurbuchen, Stephanie Cheesman, Jeannine Klaiber, Antoine Müller, Silke Hein, Silvia Dorn", "revista": "Journal of Animal Ecology", "data": "2010-03-05", "ano": 2010, "resumo": "1. Solitary bees are central place foragers returning to their nests several times a day with pollen and nectar to provision their brood cells. They are especially susceptible to landscape changes that lead to an increased spatial separation of suitable nesting sites and flower rich host plant stands. While knowledge of bee foraging ranges is currently growing, quantitative data on the costs of foraging flights are very scarce, although such data are crucial to understand bee population dynamics. 2. In this study, the impact of increased foraging distance on the duration of foraging bouts and ", "url": "https://doi.org/10.1111/j.1365-2656.2010.01675.x", "citacoes": 231, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Solitárias"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.477, "q": "Q1"}, {"key": "doi:10.1890/03-0390", "titulo": "THE DUAL ROLE OF FLORAL TRAITS: POLLINATOR ATTRACTION AND PLANT DEFENSE", "autores": "Rebecca E. Irwin, Lynn S. Adler, Alison K. Brody", "revista": "Ecology", "data": "2004-06-01", "ano": 2004, "resumo": "Plants are under siege from a diversity of enemies that consume both leaf and floral parts. Plants resist damage to leaves in a variety of ways, and we now have a rich literature documenting how plants defend themselves against herbivore attack. In contrast, the mechanisms by which plants resist enemies that consume floral parts or resources are much less known, even though damage to floral tissue usually has tighter links to plant fitness than damage to leaf tissue. Many plants experience nectar robbing, whereby floral visitors remove nectar from flowers, often without pollinating. Nectar rob", "url": "https://doi.org/10.1890/03-0390", "citacoes": 209, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 1.767, "q": "Q1"}, {"key": "doi:10.1242/jeb.00680", "titulo": "Hot bees in empty broodnest cells: heating from within", "autores": "Marco Kleinhenz, Brigitte Bujok, Stefan Fuchs, Jürgen Tautz", "revista": "Journal of Experimental Biology", "data": "2003-10-27", "ano": 2003, "resumo": "Honeybee colonies maintain brood nest temperatures of 33-36 degrees C. We investigated brood nest thermoregulation at the level of individual worker behaviour and the transfer of heat from workers to the brood. Worker bees contribute to the regulation of brood nest temperature by producing heat while sitting motionless on the caps of brood cells. We report here an additional, newly observed heating strategy where heating bees enter empty cells between sealed brood cells and remain there motionless for periods of up to 45 min. Individually marked worker bees on the surface of sealed brood cells", "url": "https://doi.org/10.1242/jeb.00680", "citacoes": 208, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Apis (Apini)"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.844, "q": "Q1"}, {"key": "doi:10.1353/sor.2005.0012", "titulo": "Kin Selection as the Key to Altruism: Its Rise and Fall", "autores": "Edward O. Wilson", "revista": "Social research", "data": "2005-03-01", "ano": 2005, "resumo": "Edward O. Wilson Kin Selection as the Key to Altruism: Its Rise and Fall ONE OF THE ENDURING UNSETTLED ISSUES OF EVOLUTIONARY BIOLOGY is the paradox of collateral altruistic behavior—that is, when some individuals subordinate their own interests and those of their immedi­ ate offspring in order to serve the interests of a larger group beyond offspring (Wilson, 1975). How might such behavior evolve if the genes promoting it are at such a disadvantage in competition with genes that oppose it? Charles Darwin saw that the paradox was dangerous to his theory of evolution by natural selection. He wa", "url": "https://doi.org/10.1353/sor.2005.0012", "citacoes": 206, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Genética e molecular"], "Região": ["Região não citada"]}, "sjr": 0.228, "q": "Q1"}, {"key": "doi:10.1073/pnas.1006299107", "titulo": "Comprehensive phylogeny of apid bees reveals the evolutionary origins and antiquity of cleptoparasitism", "autores": "Sophie Cardinal, Jakub Straka, Bryan N. Danforth", "revista": "Proceedings of the National Academy of Sciences", "data": "2010-08-30", "ano": 2010, "resumo": "Apidae is the most speciose and behaviorally diverse family of bees. It includes solitary, eusocial, socially parasitic, and an exceptionally high proportion of cleptoparasitic species. Cleptoparasitic bees, which are brood parasites in the nests of other bees, have long caused problems in resolving the phylogenetic relationships within Apidae based on morphological data because of the tendency for parasites to converge on a suite of traits, making it difficult to differentiate similarity caused by common ancestry from convergence. Here, we resolve the evolutionary history of apid cleptoparasi", "url": "https://doi.org/10.1073/pnas.1006299107", "citacoes": 204, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Região não citada"]}, "sjr": 3.283, "q": "Q1"}, {"key": "doi:10.1046/j.1365-2311.1997.00071.x", "titulo": "Abiotic and biotic factors influencing nest‐site selection by Halictus rubicundus , a ground‐nesting halictine bee", "autores": "Simon Geoffrey Potts, Pat G. Willmer", "revista": "Ecological Entomology", "data": "1997-08-01", "ano": 1997, "resumo": "1. The nest‐site selection behaviour of the bee Halictus rubicundus (Christ) was examined both within and across sites in the U.K. Females utilized a range of edaphic and microclimatic conditions when choosing a site to excavate a nest. Factors with broad tolerances included slope and hardness; those with much narrower limits included aspect, soil humidity and soil particle composition. 2. There was a preference for softer soils that were easier to dig within a site with a low overall density, but in much denser aggregations problems of maintaining the structural integrity of a nest led to the", "url": "https://doi.org/10.1046/j.1365-2311.1997.00071.x", "citacoes": 204, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Sem grupo identificado"], "Tipo de estudo": ["Não identificado"], "Região": ["Região não citada"]}, "sjr": 0.631, "q": "Q1"}, {"key": "doi:10.1111/j.1365-294x.2012.05496.x", "titulo": "Environment or kin: whence do bees obtain acidophilic bacteria?", "autores": "Quinn S. McFrederick, William T. Wcislo, DOUGLAS R. TAYLOR, Heather D. Ishak, Scot E. Dowd, Ulrich G. Mueller", "revista": "Molecular Ecology", "data": "2012-02-16", "ano": 2012, "resumo": "As honey bee populations decline, interest in pathogenic and mutualistic relationships between bees and microorganisms has increased. Honey bees and bumble bees appear to have a simple intestinal bacterial fauna that includes acidophilic bacteria. Here, we explore the hypothesis that sweat bees can acquire acidophilic bacteria from the environment. To quantify bacterial communities associated with two species of North American and one species of Neotropical sweat bees, we conducted 16S rDNA amplicon 454 pyrosequencing of bacteria associated with the bees, their brood cells and their nests. Lac", "url": "https://doi.org/10.1111/j.1365-294x.2012.05496.x", "citacoes": 197, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": "", "facetas": {"Abelha": ["Mamangavas (Bombini)", "Apis (Apini)"], "Tipo de estudo": ["Filogenia e taxonomia"], "Região": ["Neotrópico (fora do Brasil)"]}, "sjr": 1.429, "q": "Q1"}, {"key": "doi:10.1007/s10841-007-9071-z", "titulo": "Displacement of Japanese native bumblebees by the recently introduced Bombus terrestris (L.) (Hymenoptera: Apidae)", "autores": "Maki N. Inoue, Jun Yokoyama, Izumi Washitani", "revista": "Journal of Insect Conservation", "data": "2007-03-12", "ano": 2007, "resumo": "", "url": "https://doi.org/10.
