evista": "Landscape and Urban Planning", "data": "2011-08-06", "ano": 2011, "resumo": "", "url": "https://doi.org/10.1016/j.landurbplan.2011.07.004", "citacoes": 292, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1365-2664.2007.01412.x", "titulo": "The effects of forest fragmentation on bee communities in tropical countryside", "autores": "Berry J. Brosi, Gretchen C. Daily, Tiffany M. Shih, Federico Oviedo, Guillermo Durán", "revista": "Journal of Applied Ecology", "data": "2007-11-14", "ano": 2007, "resumo": "Summary Despite ongoing concerns and controversy over a putative ‘global pollination crisis’ there is little information on the response of bees, the most important group of pollinators, to land‐use change. In particular, there are no published studies of the effects of tropical forest fragmentation on entire bee communities. We examined bee community responses to forest fragment size, shape, isolation and landscape context (forest variables) by sampling foraging bees at ground level using aerial netting within, and in pastures adjacent to, 22 forest fragments ranging in area from c. 0·25 ha t", "url": "https://doi.org/10.1111/j.1365-2664.2007.01412.x", "citacoes": 289, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.2307/2265575", "titulo": "Generalization in Pollination Systems, and Why it Matters", "autores": "Nikolas M. Waser, Lars Chıttka, Mary V. Price, Neal M. Williams, Jeff Ollerton", "revista": "Ecology", "data": "1996-06-01", "ano": 1996, "resumo": "One view of pollination systems is that they tend toward specialization. This view is implicit in many discussions of angiosperm evolution and plant—pollinator coevolution and in the long—standing concept of p ollination syndromes. But actual pollination systems often are more generalized and dynamic than these traditions might suggest. To illustrate the range of specialization and generalization in pollinators' use of plants and vice versa, we draw on studies of two floras in the United States, and of members of several plant families and solitary bee genera. We also summarize a recent study ", "url": "https://doi.org/10.2307/2265575", "citacoes": 1966, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1461-0248.2008.01157.x", "titulo": "Landscape effects on crop pollination services: are there general patterns?", "autores": "Taylor H. Ricketts, James Regetz, Ingolf Steffan‐Dewenter, Saul Alan Cunningham, Claire Kremen, Anne Bogdanski et al.", "revista": "Ecology Letters", "data": "2008-02-19", "ano": 2008, "resumo": "Pollination by bees and other animals increases the size, quality, or stability of harvests for 70% of leading global crops. Because native species pollinate many of these crops effectively, conserving habitats for wild pollinators within agricultural landscapes can help maintain pollination services. Using hierarchical Bayesian techniques, we synthesize the results of 23 studies - representing 16 crops on five continents - to estimate the general relationship between pollination services and distance from natural or semi-natural habitats. We find strong exponential declines in both pollinator", "url": "https://doi.org/10.1111/j.1461-0248.2008.01157.x", "citacoes": 1400, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rspb.2004.2909", "titulo": "Tolerance of pollination networks to species extinctions", "autores": "Jane Memmott, Nickolas M. Waser, Mary V. Price", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2004-12-08", "ano": 2004, "resumo": "Mutually beneficial interactions between flowering plants and animal pollinators represent a critical 'ecosystem service' under threat of anthropogenic extinction. We explored probable patterns of extinction in two large networks of plants and flower visitors by simulating the removal of pollinators and consequent loss of the plants that depend upon them for reproduction. For each network, we removed pollinators at random, systematically from least-linked (most specialized) to most-linked (most generalized), and systematically from most- to least-linked. Plant species diversity declined most r", "url": "https://doi.org/10.1098/rspb.2004.2909", "citacoes": 1271, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.1108197", "titulo": "Haploidploidy and the Evolution of the Social Insect", "autores": "Robert L. Trivers, Hope Hare", "revista": "Science", "data": "1976-01-23", "ano": 1976, "resumo": "Halminton (1) was apparently the first to appreciate that the synthesis of Mendelian genetics with Darwin's theory of natural selection had profound implications for social theory. In particular, insofar as almost all social behavior is either selfish or altruistic (or has such effects), genetical reasoning suggests that an individual's social behavior should be adjusted to his or her degree of relatedness, r, to all individuals affected by the behavior. We call this theory kinship theory. The social insects provide a critical test of Hamilton's kinship theory. When such theory is combined wit", "url": "https://doi.org/10.1126/science.1108197", "citacoes": 1271, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1365-2656.2002.00641.x", "titulo": "Foraging ranges of solitary bees", "autores": "Achim Gathmann, Teja Tscharntke", "revista": "Journal of Animal Ecology", "data": "2002-09-01", "ano": 2002, "resumo": "Summary Habitat requirements of solitary bees include nesting sites, food resources and nesting material. We used translocation experiments to establish foraging distances and measured foraging trip duration to analyse how solitary bees cope with the distance between nesting sites and suitable food plants in different habitat types. Maximum foraging distance between nesting site and food patch was 150–600 m for the 16 bee species examined. Foraging distance was correlated positively with body length. Mean foraging trip duration, measured for seven bee species, ranged from 6 to 28 min and was a", "url": "https://doi.org/10.1046/j.1365-2656.2002.00641.x", "citacoes": 1144, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/nature14420", "titulo": "Seed coating with a neonicotinoid insecticide negatively affects wild bees", "autores": "Maj Rundlöf, Georg K.S. Andersson, Riccardo Bommarco, Ingemar Fries, Veronica Hederström, Lina Herbertsson et al.", "revista": "Nature", "data": "2015-04-22", "ano": 2015, "resumo": "", "url": "https://doi.org/10.1038/nature14420", "citacoes": 1111, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s10646-012-0863-x", "titulo": "Neonicotinoids in bees: a review on concentrations, side-effects and risk assessment", "autores": "T. Blacquière, Guy J. Smagghe, Cornelis A.M. van Gestel, Veerle Mommaerts", "revista": "Ecotoxicology", "data": "2012-02-17", "ano": 2012, "resumo": "Neonicotinoid insecticides are successfully applied to control pests in a variety of agricultural crops; however, they may not only affect pest insects but also non-target organisms such as pollinators. This review summarizes, for the first time, 15 years of research on the hazards of neonicotinoids to bees including honey bees, bumble bees and solitary bees. The focus of the paper is on three different key aspects determining the risks of neonicotinoid field concentrations for bee populations: (1) the environmental neonicotinoid residue levels in plants, bees and bee products in relation to p", "url"  "ano": 2011, "resumo": "Populations of important pollinators, such as bumble bees and honey bees, are declining at alarming rates worldwide. Parasites are likely contributing to this phenomenon. A distinct resident community of bacteria has recently been identified in bumble bees and honey bees that is not shared with related solitary bee species. We now show that the presence of these microbiota protects bee hosts against a widespread and highly virulent natural parasite (Crithidia bombi) in an experimental setting. We add further support to this antagonistic relationship from patterns found in field data. For the s", "url": "https://doi.org/10.1073/pnas.1110474108", "citacoes": 894, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rspb.2002.2306", "titulo": "Fruit set of highland coffee increases with the diversity of pollinating bees", "autores": "Alexandra‐Maria Klein, Ingolf Steffan‐Dewenter, Teja Tscharntke", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2003-05-07", "ano": 2003, "resumo": "The worldwide decline of pollinators may negatively affect the fruit set of wild and cultivated plants. Here, we show that fruit set of the self-fertilizing highland coffee (Coffea arabica) is highly variable and related to bee pollination. In a comparison of 24 agroforestry systems in Indonesia, the fruit set of coffee could be predicted by the number of flower-visiting bee species, and it ranged from ca. 60% (three species) to 90% (20 species). Diversity, not abundance, explained variation in fruit set, so the collective role of a species-rich bee community was important for pollination succ", "url": "https://doi.org/10.1098/rspb.2002.2306", "citacoes": 864, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.biocon.2009.12.003", "titulo": "Maximum foraging ranges in solitary bees: only few individuals have the capability to cover long foraging distances", "autores": "Antonia Zurbuchen, Lisa Landert, Jeannine Klaiber, Antoine Müller, Silke Hein, Silvia Dorn", "revista": "Biological Conservation", "data": "2010-01-07", "ano": 2010, "resumo": "", "url": "https://doi.org/10.1016/j.biocon.2009.12.003", "citacoes": 832, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/bf00190398", "titulo": "The spectral input systems of hymenopteran insects and their receptor-based colour vision", "autores": "Dagmar Peitsch, Andrea Fietz, Horst Hertel, John de Souza, Dora Fix Ventura, Randolf Menzel", "revista": "Journal of Comparative Physiology A", "data": "1992-01-01", "ano": 1992, "resumo": "", "url": "https://doi.org/10.1007/bf00190398", "citacoes": 808, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1890/07-1292.1", "titulo": "MEASURING BEE DIVERSITY IN DIFFERENT EUROPEAN HABITATS AND BIOGEOGRAPHICAL REGIONS", "autores": "Catrin Westphal, Riccardo Bommarco, Gabriel Carré, Ellen Lamborn, Nicolas Morison, Theodora Petanidou et al.", "revista": "Ecological Monographs", "data": "2008-10-23", "ano": 2008, "resumo": "Bee pollinators are currently recorded with many different sampling methods. However, the relative performances of these methods have not been systematically evaluated and compared. In response to the strong need to record ongoing shifts in pollinator diversity and abundance, global and regional pollinator initiatives must adopt standardized sampling protocols when developing large‐scale and long‐term monitoring schemes. We systematically evaluated the performance of six sampling methods (observation plots, pan traps, standardized and variable transect walks, trap nests with reed internodes or", "url": "https://doi.org/10.1890/07-1292.1", "citacoes": 804, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelh  last couple of decades, the honey bee (Apis mellifera) malady, colony collapse disorder (CCD), has caused major concern in the agricultural community. Among honey bee pathogens, RNA viruses are emerging as a serious threat and are suspected as major contributors to CCD. Recent detection of these viral species in bumble bees suggests a possible wider environmental spread of these viruses with potential broader impact. It is therefore vital to study the ecology and epidemiology of these viruses in the hymenopteran pollinator communit", "url": "https://doi.org/10.1371/journal.pone.0014357", "citacoes": 444, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.2307/1939860", "titulo": "Patch Size, Pollinator Behavior, and Pollinator Limitation in Catnip", "autores": "Andrew Sih, Marie-Sylvie Baltus", "revista": "Ecology", "data": "1987-12-01", "ano": 1987, "resumo": "We examined the effects of the patch size of catnip, Nepeta cataria, on pollinator visitation rates and pollinator limitation. The most important floral visitors were honey bees (Apis mellifera), solitary bees (Halictidae), and bumble bees (Bombus spp.). Our first goal was to see how spatial variation in patch size affected the rate at which individual flowers received pollinator visits (visitation rate). Visitation rate was higher in larger patches for honey bees and bumble bees, but lower for solitary bees. Patch size explained 74-83% of the variation in visitation rate. Intraspecific isolat", "url": "https://doi.org/10.2307/1939860", "citacoes": 444, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1365-2664.1998.355343.x", "titulo": "Bioindication using trap‐nesting bees and wasps and their natural enemies: community structure and interactions", "autores": "Teja Tscharntke, Achim Gathmann, Ingolf Steffan‐Dewenter", "revista": "Journal of Applied Ecology", "data": "1998-10-01", "ano": 1998, "resumo": "1. Results from four field studies show that communities of trap‐nesting bees and wasps and their natural enemies are promising bioindicators for ecological change or habitat quality. These small and easy‐to‐handle communities can be analysed with respect to (i) species richness and related parameters, and (ii) ecological functions or interactions. The communities comprise Hymenoptera (Apidae, Sphecidae, Eumenidae, Pompilidae) and natural enemies belonging to many insect taxa. Traps consisted of 150–200, 15–20‐cm long, reed internodes, put into tins or plastic tubes of 13–15 cm diameter; woode", "url": "https://doi.org/10.1046/j.1365-2664.1998.355343.x", "citacoes": 438, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1603/0013-8746(2008)101[140:braain]2.0.co;2", "titulo": "Bee Richness and Abundance in New York City Urban Gardens", "autores": "Kevin C. Matteson, John S. Ascher, Gail Langellotto", "revista": "Annals of the Entomological Society of America", "data": "2008-01-01", "ano": 2008, "resumo": "We describe the richness, abundance, and ecological characteristics of bees in community gardens located in heavily developed neighborhoods of the Bronx and East Harlem, NY. In total, 1,145 individual bees, representing 54 species (13% of the recorded New York State bee fauna) were collected over 4 yr. The nesting habits of these species include bees that nest in cavities (33% of species), hives (11% of species), pith (1.9% of species), wood (1.9% of species), or soft/rotting wood (7.4% of species) substrates. Soil-nesting individuals were relatively rare (25% of individuals), perhaps due to a", "url": "https://doi.org/10.1603/0013-8746(2008)101[140:braain]2.0.co;2", "citacoes": 432, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1523-1739.2002.01334.x", "titulo": "Grazing Intensity and the Diversity of Grasshoppers, Butterflies, and Trap‐Nesting Bees and Wasps", "autores": "Andreas Kruess, Teja Tscharntke", "revista": "Conservation Biology", "data": "2002-12-01", "ano": 2002, "resumo": "Abstract: The maintenance of grasslands as distinct habitats depends on regular management, usually through grazing or mowing, but their species diversity is known to decline with increasing management intensity. The reduction of management intensity can be a useful tool for the long‐term conservation of the biological diversity of grasslands. We analyzed floral and faunal diversity on intensively and extensively (unintensively) grazed pastures and on 5‐ to 10‐year‐old ungrazed grasslands in northern Germany. Each of the three grassland habitats differing in grazing intensity was replicated si", "url": "https://doi.org/10.1046/j.1523-1739.2002.01334.x", "citacoes": 423, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1525/auk.2011.10248", "titulo": "The Need to Quantify Ecosystem Services Provided by Birds", "autores": "Daniel G. Wenny, Travis L. DeVault, Matthew D. Johnson, Dave Kelly, Cagan Hakki Sekercioglu, Diana F. Tomback et al.", "revista": "The Auk", "data": "2011-01-01", "ano": 2011, "resumo": "WHAT ARE BIRDS worth—what is their actual dollar value to human society? To most of us in the ornithological community, birds are invaluable. But in these times we need more specific rationales to convince policy makers and business leaders to include bird conservation in land-use and development decisions. Over the past two decades, awareness of our dependence on a variety of ecosystem services (natural ecological processes that benefit human society) and of their importance and prevalence has progressed toward the goal of making conservation a mainstream value (Ehrlich and Kennedy 2005, Perr", "url": "https://doi.org/10.1525/auk.2011.10248", "citacoes": 420, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1523-1739.2003.01575.x", "titulo": "Importance of Habitat Area and Landscape Context for Species Richness of Bees and Wasps in Fragmented Orchard Meadows", "autores": "Ingolf Steffan‐Dewenter", "revista": "Conservation Biology", "data": "2003-07-16", "ano": 2003, "resumo": "Abstract: I investigated how habitat area, habitat connectivity, and landscape context affect the species richness and abundance of trap‐nesting bees, wasps, and their natural enemies. The research was done on 45 orchard meadows ranging in size from 0.08 to 5.8 ha and differing in habitat connectivity and the surrounding landscape matrix. Effects of the surrounding landscape matrix were restricted to circles with a radius of 250 m. Only the species richness of natural enemies increased with landscape diversity in the surrounding matrix. Population densities of bees increased with habitat conne", "url": "https://doi.org/10.1046/j.1523-1739.2003.01575.x", "citacoes": 392, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1890/06-0269", "titulo": "RESOURCE DISTRIBUTIONS AMONG HABITATS DETERMINE SOLITARY BEE OFFSPRING PRODUCTION IN A MOSAIC LANDSCAPE", "autores": "Neal M. Williams, Claire Kremen", "revista": "Ecological Applications", "data": "2007-04-01", "ano": 2007, "resumo": "Within mosaic landscapes, many organisms depend on attributes of the environment that operate over scales ranging from a single habitat patch to the entire landscape. One such attribute is resource distribution. Organisms' reliance on resources from within a local patch vs. those found among habitats throughout the landscape will depend on local habitat quality, patch quality, and landscape composition. The ability of individuals to move among complementary habitat types to obtain various resources may be a critical mechanism underlying the dynamics of animal populations and ultimately the lev", "url": "https://doi.org/10.1890/06-0269", "citacoes": 389, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1890/1051-0761(2006)016[0632:crwadb]2.0.co;2", "titulo": "Complex Responses Within A Desert Bee Guild (Hymenoptera: Apiformes) To Urban Habitat Fragmentation", "autores": "James H. Cane, Robert L. Minckley, Linda J. Kervin, T’ai H. Roulston, Neal M. Williams", "revista": "Ecological Applications", "data": "2006-04-01", "ano": 2006, "resumo": "Urbanization within the Tucson Basin of Arizona during the past 50+ years has fragmented the original desert scrub into patches of different sizes and ages. These remnant patches and the surrounding desert are dominated by Larrea tridentata (creosote bush), a long-lived shrub whose flowers are visited by > 120 native bee species across its range. Twenty-one of these bee species restrict their pollen foraging to L. tridentata. To evaluate the response of this bee fauna to fragmentation, we compared species incidence and abundance patterns for the bee guild visiting L. tridentata at 59 habitat f", "url": "https://doi.org/10.1890/1051-0761(2006)016[0632:crwadb]2.0.co;2", "citacoes": 388, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.2307/2412072", "titulo": "Trap-Nesting Wasps and Bees: Life Histories, Nests, and Associates.", "autores": "Radclyffe B. Roberts, Karl V. Krombein", "revista": "Systematic Zoology", "data": "1967-09-01", "ano": 1967, "resumo": "Radclyffe B. Roberts; Trap-nesting Wasps and Bees: Life Histories, Nests, and Associates, Systematic Biology, Volume 16, Issue 3, 1 September 1967, Pages 261–26", "url": "https://doi.org/10.2307/2412072", "citacoes": 372, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1371/journal.pone.0104679", "titulo": "Decreasing Abundance, Increasing Diversity and Changing Structure of the Wild Bee Community (Hymenoptera: Anthophila) along an Urbanization Gradient", "autores": "Laura Fortel, Mickaël Henry, Laurent Guilbaud, Anne-Laure Guirao, Michael T. Kuhlmann, Hugues Mouret et al.", "revista": "PLoS ONE", "data": "2014-08-13", "ano": 2014, "resumo": "BACKGROUND: Wild bees are important pollinators that have declined in diversity and abundance during the last decades. Habitat destruction and fragmentation associated with urbanization are reported as part of the main causes of this decline. Urbanization involves dramatic changes of the landscape, increasing the proportion of impervious surface while decreasing that of green areas. Few studies have investigated the effects of urbanization on bee communities. We assessed changes in the abundance, species richness, and composition of wild bee community along an urbanization gradient. METHODOLOG", "url": "https://doi.org/10.1371/journal.pone.0104679", "citacoes": 371, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1365-2664.2003.00847.x", "titulo": "Pollination of Coffea canephora in relation to local and regional agroforestry management", "autores": "Alexandra‐Maria Klein, Ingolf Steffan‐Dewenter, Teja Tscharntke", "revista": "Journal of Applied Ecology", "data": "2003-09-26", "ano": 2003, "resumo": "Summary Pollination of crops depends on local agricultural management and the quality of adjacent habitats. Lowland coffee Coffea canephora, is an important tropical cash crop. Fruit set depends on cross‐pollination by bees, so inadequate pollination leads to reduced yield. In this study we analyse the relationship between bee pollinators, fruit set in coffee, and the local and regional agroforestry systems to identify the optimal conditions for pollinators. We analysed the abundance and species composition of coffee flower‐visiting bees in 15 agroforestry systems differing in distance to fore", "url": "https://doi.org/10.1046/j.1365-2664.2003.00847.x", "citacoes": 370, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s10531-004-6066-x", "titulo": "Urban domestic gardens (II): experimental tests of methods for increasing biodiversity", "autores": "Kevin J. Gaston, Richard M. Smith, Ken A. Thompson, Philip H. Warren", "revista": "Biodiversity and Conservation", "data": "2005-02-01", "ano": 2005, "resumo": "", "url": "https://doi.org/10.1007/s10531-004-6066-x", "citacoes": 332, "fonte": "OpenAlex", "topico": "Ninhos-isca e abelhas solitárias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rspb.2006.3721", "titulo": "Importance of pollinators in changing landscapes for world crops", "autores": "Alexandra‐Maria Klein, Bernard E Vaissiere, James H. Cane, Ingolf Steffan‐Dewenter, Saul Alan Cunningham, Claire Kremen et al.", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2006-10-27", "ano": 2006, "resumo": "The extent of our reliance on animal pollination for world crop production for human food has not previously been evaluated and the previous estimates for countries or continents have seldom used primary data. In this review, we expand the previous estimates using novel primary data from 200 countries and found that fruit, vegetable or seed production from 87 of the leading global food crops is dependent upon animal pollination, while 28 crops do not rely upon animal pollination. However, global production volumes give a contrasting perspective, since 60% of global production comes from crops ", "url": "https://doi.org/10.1098/rspb.2006.3721", "citacoes": 7328, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1037/0022-3514.92.6.1087", "titulo": "Grit: Perseverance and passion for long-term goals.", "autores": "Angela Lee Duckworth, Christopher Peterson, Michael D. Matthews, Dennis R. Kelly", "revista": "Journal of Personality and Social Psychology", "data": "2007-01-01", "ano": 2007, "resumo": "The importance of intellectual talent to achievement in all professional domains is well established, but less is known about other individual differences that predict success. The authors tested the importance of 1 noncognitive trait: grit. Defined as perseverance and passion for long-term goals, grit accounted for an average of 4% of the variance in success outcomes, including educational attainment among 2 samples of adults (N=1,545 and N=690), grade point average among Ivy League undergraduates (N=138), retention in 2 classes of United States Military Academy, West Point, cadets (N=1,218 a", "url": "https://doi.org/10.1037/0022-3514.92.6.1087", "citacoes": 6977, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/0006-3207(92)91201-3", "titulo": "Conservation evaluation and phylogenetic diversity", "autores": "Daniel P. Faith", "revista": "Biological Conservation", "data": "1992-01-01", "ano": 1992, "resumo": "", "url": "https://doi.org/10.1016/0006-3207(92)91201-3", "citacoes": 5956, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.1255957", "titulo": "Bee declines driven by combined stress from parasites, pesticides, and lack of flowers", "autores": "Dave Goulson, Elizabeth Nicholls, Cristina Botías, Ellen L. Rotheray", "revista": "Science", "data": "2015-02-26", "ano": 2015, "resumo": "Bees are subject to numerous pressures in the modern world. The abundance and diversity of flowers has declined; bees are chronically exposed to cocktails of agrochemicals, and they are simultaneously exposed to novel parasites accidentally spread by humans. Climate change is likely to exacerbate these problems in the future. Stressors do not act in isolation; for example, pesticide exposure can impair both detoxification mechanisms and immune responses, rendering bees more susceptible to parasites. It seems certain that chronic exposure to multiple interacting stressors is driving honey bee c", "url": "https://doi.org/10.1126/science.1255957", "citacoes": 4145, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/nature10947", "titulo": "Emerging fungal threats to animal, plant and ecosystem health", "autores": "Matthew C. Fisher, Daniel A. Henk, Cheryl J. Briggs, John S. Brownstein, Lawrence C. Madoff, Sarah McCraw et al.", "revista": "Nature", "data": "2012-04-01", "ano": 2012, "resumo": "", "url": "https://doi.org/10.1038/nature10947", "citacoes": 3424, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.1127863", "titulo": "Parallel Declines in Pollinators and Insect-Pollinated Plants in Britain and the Netherlands", "autores": "Jacobus Christiaan Biesmeijer, Stuart P. M. Roberts, Menno Reemer, Ralf Ohlemüller, Mike Edwards, Theo Peeters et al.", "revista": "Science", "data": "2006-07-20", "ano": 2006, "resumo": "Despite widespread concern about declines in pollination services, little is known about the patterns of change in most pollinator assemblages. By studying bee and hoverfly assemblages in Britain and the Netherlands, we found evidence of declines (pre-versus post-1980) in local bee diversity in both countries; however, divergent trends were observed in hoverflies. Depending on the assemblage and location, pollinator declines were most frequent in habitat and flower specialists, in univoltine species, and/or in nonmigrants. In conjunction with this evidence, outcrossing plant species that are r", "url": "https://doi.org/10.1126/science.1127863", "citacoes": 3233, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.2307/2265575", "titulo": "Generalization in Pollination Systems, and Why it Matters", "autores": "Nikolas M. Waser, Lars Chıttka, Mary V. Price, Neal M. Williams, Jeff Ollerton", "revista": "Ecology", "data": "1996-06-01", "ano": 1996, "resumo": "One view of pollination systems is that they tend toward specialization. This view is implicit in many discussions of angiosperm evolution and plant—pollinator coevolution and in the long—standing concept of p ollination syndromes. But actual pollination systems often are more generalized and dynamic than these traditions might suggest. To illustrate the range of specialization and generalization in pollinators' use of plants and vice versa, we draw on studies of two floras in the United States, and of members of several plant families and solitary bee genera. We also summarize a recent study ", "url": "https://doi.org/10.2307/2265575", "citacoes": 1966, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.262413599", "titulo": "Crop pollination from native bees at risk from agricultural intensification", "autores": "Claire Kremen, Neal M. Williams, Robbin W. Thorp", "revista": "Proceedings of the National Academy of Sciences", "data": "2002-12-16", "ano": 2002, "resumo": "Ecosystem services are critical to human survival; in selected cases, maintaining these services provides a powerful argument for conserving biodiversity. Yet, the ecological and economic underpinnings of most services are poorly understood, impeding their conservation and management. For centuries, farmers have imported colonies of European honey bees (Apis mellifera) to fields and orchards for pollination services. These colonies are becoming increasingly scarce, however, because of diseases, pesticides, and other impacts. Native bee communities also provide pollination services, but the amo", "url": "https://doi.org/10.1073/pnas.262413599", "citacoes": 1937, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1146/annurev.ecolsys.29.1.83", "titulo": "ENDANGERED MUTUALISMS: The Conservation of Plant-Pollinator Interactions", "autores": "Carol Ann Kearns, David W. Inouye, Nickolas M. Waser", "revista": "Annual Review of Ecology and Systematics", "data": "1998-11-01", "ano": 1998, "resumo": "▪ Abstract The pollination of flowering plants by animals represents a critical ecosystem service of great value to humanity, both monetary and otherwise. However, the need for active conservation of pollination interactions is only now being appreciated. Pollination systems are under increasing threat from anthropogenic sources, including fragmentation of habitat, changes in land use, modern agricultural practices, use of chemicals such as pesticides and herbicides, and invasions of non-native plants and animals. Honeybees, which themselves are non-native pollinators on most continents, and w", "url": "https://doi.org/10.1146/annurev.ecolsys.29.1.83", "citacoes": 1857, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s00442-007-0752-9", "titulo": "Bee foraging ranges and their relationship to body size", "autores": "Sarah S. Greenleaf, Neal M. Williams, Rachael Winfree, Claire Kremen", "revista": "Oecologia", "data": "2007-05-05", "ano": 2007, "resumo": "", "url": "https://doi.org/10.1007/s00442-007-0752-9", "citacoes": 1825, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1214/06-ba104", "titulo": "Variational inference for Dirichlet process mixtures", "autores": "David M. Blei, Michael I. Jordan", "revista": "Bayesian Analysis", "data": "2006-03-01", "ano": 2006, "resumo": "Dirichlet process (DP) mixture models are the cornerstone of nonparametric Bayesian statistics, and the development of Monte-Carlo Markov chain (MCMC) sampling methods for DP mixtures has enabled the application of nonparametric Bayesian methods to a variety of practical data analysis problems. However, MCMC sampling can be prohibitively slow, and it is important to explore alternatives. One class of alternatives is provided by variational methods, a class of deterministic algorithms that convert inference problems into optimization problems (Opper and Saad 2001; Wainwright and Jordan 2003). T", "url": "https://doi.org/10.1214/06-ba104", "citacoes": 1482, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1461-0248.2008.01157.x", "titulo": "Landscape effects on crop pollination services: are there general patterns?", "autores": "Taylor H. Ricketts, James Regetz, Ingolf Steffan‐Dewenter, Saul Alan Cunningham, Claire Kremen, Anne Bogdanski et al.", "revista": "Ecology Letters", "data": "2008-02-19", "ano": 2008, "resumo": "Pollination by bees and other animals increases the size, quality, or stability of harvests for 70% of leading global crops. Because native species pollinate many of these crops effectively, conserving habitats for wild pollinators within agricultural landscapes can help maintain pollination services. Using hierarchical Bayesian techniques, we synthesize the results of 23 studies - representing 16 crops on five continents - to estimate the general relationship between pollination services and distance from natural or semi-natural habitats. We find strong exponential declines in both pollinator", "url": "https://doi.org/10.1111/j.1461-0248.2008.01157.x", "citacoes": 1400, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.1002720107", "titulo": "Conservation and divergence of methylation patterning in plants and animals", "autores": "Suhua Feng, Shawn J. Cokus, Xiaoyu Zhang, Pao‐Yang Chen, Magnolia L. Bostick, Mary Grace Goll et al.", "revista": "Proceedings of the National Academy of Sciences", "data": "2010-04-15", "ano": 2010, "resumo": "Cytosine DNA methylation is a heritable epigenetic mark present in many eukaryotic organisms. Although DNA methylation likely has a conserved role in gene silencing, the levels and patterns of DNA methylation appear to vary drastically among different organisms. Here we used shotgun genomic bisulfite sequencing (BS-Seq) to compare DNA methylation in eight diverse plant and animal genomes. We found that patterns of methylation are very similar in flowering plants with methylated cytosines detected in all sequence contexts, whereas CG methylation predominates in animals. Vertebrates have methyla", "url": "https://doi.org/10.1073/pnas.1002720107", "citacoes": 1363, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/ele.12082", "titulo": "A global quantitative synthesis of local and landscape effects on wild bee pollinators in agroecosystems", "autores": "Christina Marie Kennedy, Eric V. Lonsdorf, Maile C. Neel, Neal M. Williams, Taylor H. Ricketts, Rachael Winfree et al.", "revista": "Ecology Letters", "data": "2013-03-11", "ano": 2013, "resumo": "Bees provide essential pollination services that are potentially affected both by local farm management and the surrounding landscape. To better understand these different factors, we modelled the relative effects of landscape composition (nesting and floral resources within foraging distances), landscape configuration (patch shape, interpatch connectivity and habitat aggregation) and farm management (organic vs. conventional and local-scale field diversity), and their interactions, on wild bee abundance and richness for 39 crop systems globally. Bee abundance and richness were higher in diver", "url": "https://doi.org/10.1111/ele.12082", "citacoes": 1275, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.0703333104", "titulo": "Quantifying the biodiversity value of tropical primary, secondary, and plantation forests", "autores": "Jos Barlow, Toby Alan Gardner, Ivanei S. Araujo, Teresa C. S. Ávila‐Pires, Alexandre Bragio Bonaldo, Joana E. Costa et al.", "revista": "Proceedings of the National Academy of Sciences", "data": "2007-11-14", "ano": 2007, "resumo": "Biodiversity loss from deforestation may be partly offset by the expansion of secondary forests and plantation forestry in the tropics. However, our current knowledge of the value of these habitats for biodiversity conservation is limited to very few taxa, and many studies are severely confounded by methodological shortcomings. We examined the conservation value of tropical primary, secondary, and plantation forests for 15 taxonomic groups using a robust and replicated sample design that minimized edge effects. Different taxa varied markedly in their response to patterns of land use in terms o", "url": "https://doi.org/10.1073/pnas.0703333104", "citacoes": 1188, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1890/0012-9658(2002)083[1421:sdeolc]2.0.co;2", "titulo": "SCALE-DEPENDENT EFFECTS OF LANDSCAPE CONTEXT ON THREE POLLINATOR GUILDS", "autores": "Ingolf Steffan‐Dewenter, Ute Münzenberg, Christof Bürger, Carsten Thies, Teja Tscharntke", "revista": "Ecology", "data": "2002-05-01", "ano": 2002, "resumo": "Most ecological processes and interactions depend on scales much larger than a single habitat, and therefore it is important to link spatial patterns and ecological processes at a landscape scale. Here, we analyzed the effects of landscape context on the distribution of bees (Hymenoptera: Apoidea) at multiple spatial scales with respect to the following hypotheses: (1) Local abundance and diversity of bees increase with increasing proportion of the surrounding seminatural habitats. (2) Solitary wild bees, bumble bees, and honey bees respond to landscape context at different spatial scales. We ", "url": "https://doi.org/10.1890/0012-9658(2002)083[1421:sdeolc]2.0.co;2", "citacoes": 1188, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1365-2656.2002.00641.x", "titulo": "Foraging ranges of solitary bees", "autores": "Achim Gathmann, Teja Tscharntke", "revista": "Journal of Animal Ecology", "data": "2002-09-01", "ano": 2002, "resumo": "Summary Habitat requirements of solitary bees include nesting sites, food resources and nesting material. We used translocation experiments to establish foraging distances and measured foraging trip duration to analyse how solitary bees cope with the distance between nesting sites and suitable food plants in different habitat types. Maximum foraging distance between nesting site and food patch was 150–600 m for the 16 bee species examined. Foraging distance was correlated positively with body length. Mean foraging trip duration, measured for seven bee species, ranged from 6 to 28 min and was a", "url": "https://doi.org/10.1046/j.1365-2656.2002.00641.x", "citacoes": 1144, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/s0378-8741(98)00131-7", "titulo": "Antibacterial, antifungal and antiviral activity of propolis of different geographic origin", "autores": "A Kujumgiev, Yulia Vladislavovna Tsvetkova, Yu Serkedjieva, Vassya Stefanova Bankova, R. Christov, S. S. Popov", "revista": "Journal of Ethnopharmacology", "data": "1999-03-01", "ano": 1999, "resumo": "", "url": "https://doi.org/10.1016/s0378-8741(98)00131-7", "citacoes": 1117, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/nature14420", "titulo": "Seed coating with a neonicotinoid insecticide negatively affects wild bees", "autores": "Maj Rundlöf, Georg K.S. Andersson, Riccardo Bommarco, Ingemar Fries, Veronica Hederström, Lina Herbertsson et al.", "revista": "Nature", "data": "2015-04-22", "ano": 2015, "resumo": "", "url": "https://doi.org/10.1038/nature14420", "citacoes": 1111, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1461-0248.2005.00869.x", "titulo": "Mixed biodiversity benefits of agri‐environment schemes in five European countries", "autores": "David Kleijn, Rocío A. Baquero, Yann Clough, Mario Dı́az, J. De Esteban, Federico Fernández‐González et al.", "revista": "Ecology Letters", "data": "2006-01-12", "ano": 2006, "resumo": "Agri-environment schemes are an increasingly important tool for the maintenance and restoration of farmland biodiversity in Europe but their ecological effects are poorly known. Scheme design is partly based on non-ecological considerations and poses important restrictions on evaluation studies. We describe a robust approach to evaluate agri-environment schemes and use it to evaluate the biodiversity effects of agri-environment schemes in five European countries. We compared species density of vascular plants, birds, bees, grasshoppers and crickets, and spiders on 202 paired fields, one with a", "url": "https://doi.org/10.1111/j.1461-0248.2005.00869.x", "citacoes": 1079, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1890/08-1245.1", "titulo": "A meta‐analysis of bees' responses to anthropogenic disturbance", "autores": "Rachael Winfree, Ramiro Aguilar, Diego Pedro Vázquez, Gretchen LeBuhn, Marcelo A. Aizen", "revista": "Ecology", "data": "2009-07-24", "ano": 2009, "resumo": "Pollinators may be declining globally, a matter of concern because animal pollination is required by most of the world's plant species, including many crop plants. Human land use and the loss of native habitats is thought to be an important driver of decline for wild, native pollinators, yet the findings of published studies on this topic have never been quantitatively synthesized. Here we use meta-analysis to synthesize the literature on how bees, the most important group of pollinators, are affected by human disturbances such as habitat loss, grazing, logging, and agriculture. We obtained 13", "url": "https://doi.org/10.1890/08-1245.1", "citacoes": 1056, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/nature05429", "titulo": "Habitat modification alters the structure of tropical host–parasitoid food webs", "autores": "Jason M. Tylianakis, Teja Tscharntke, Owen T. Lewis", "revista": "Nature", "data": "2007-01-01", "ano": 2007, "resumo": "", "url": "https://doi.org/10.1038/nature05429", "citacoes": 1002, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/ncomms8414", "titulo": "Delivery of crop pollination services is an insufficient argument for wild pollinator conservation", "autores": "David Kleijn, Rachael Winfree, Ígnasi Bartomeus, Luísa G. Carvalheiro, Mickaël Henry, Rufus Isaacs et al.", "revista": "Nature Communications", "data": "2015-06-16", "ano": 2015, "resumo": "There is compelling evidence that more diverse ecosystems deliver greater benefits to people, and these ecosystem services have become a key argument for biodiversity conservation. However, it is unclear how much biodiversity is needed to deliver ecosystem services in a cost-effective way. Here we show that, while the contribution of wild bees to crop production is significant, service delivery is restricted to a limited subset of all known bee species. Across crops, years and biogeographical regions, crop-visiting wild bee communities are dominated by a small number of common species, and thr", "url": "https://doi.org/10.1038/ncomms8414", "citacoes": 998, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.jep.2010.10.032", "titulo": "Propolis: Is there a potential for the development of new drugs?", "autores": "José Maurício Sforcin, Vassya Stefanova Bankova", "revista": "Journal of Ethnopharmacology", "data": "2010-10-22", "ano": 2010, "resumo": "", "url": "https://doi.org/10.1016/j.jep.2010.10.032", "citacoes": 878, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rspb.2002.2306", "titulo": "Fruit set of highland coffee increases with the diversity of pollinating bees", "autores": "Alexandra‐Maria Klein, Ingolf Steffan‐Dewenter, Teja Tscharntke", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2003-05-07", "ano": 2003, "resumo": "The worldwide decline of pollinators may negatively affect the fruit set of wild and cultivated plants. Here, we show that fruit set of the self-fertilizing highland coffee (Coffea arabica) is highly variable and related to bee pollination. In a comparison of 24 agroforestry systems in Indonesia, the fruit set of coffee could be predicted by the number of flower-visiting bee species, and it ranged from ca. 60% (three species) to 90% (20 species). Diversity, not abundance, explained variation in fruit set, so the collective role of a species-rich bee community was important for pollination succ", "url": "https://doi.org/10.1098/rspb.2002.2306", "citacoes": 864, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/35038060", "titulo": "Isolation of a 250 million-year-old halotolerant bacterium from a primary salt crystal", "autores": "Russell H. Vreeland, William D. Rosenzweig, Dennis W. Powers", "revista": "Nature", "data": "2000-10-01", "ano": 2000, "resumo": "", "url": "https://doi.org/10.1038/35038060", "citacoes": 837, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.biocon.2009.12.003", "titulo": "Maximum foraging ranges in solitary bees: only few individuals have the capability to cover long foraging distances", "autores": "Antonia Zurbuchen, Lisa Landert, Jeannine Klaiber, Antoine Müller, Silke Hein, Silvia Dorn", "revista": "Biological Conservation", "data": "2010-01-07", "ano": 2010, "resumo": "", "url": "https://doi.org/10.1016/j.biocon.2009.12.003", "citacoes": 832, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1461-0248.2004.00662.x", "titulo": "The area requirements of an ecosystem service: crop pollination by native bee communities in California", "autores": "Claire Kremen, Neal M. Williams, Robert L. Bugg, John P. Fay, Robin W. Thorp", "revista": "Ecology Letters", "data": "2004-09-22", "ano": 2004, "resumo": "Abstract Managing ecosystem services is critical to human survival, yet we do not know how large natural areas must be to support these services. We investigated how crop pollination services provided by native, unmanaged, bee communities varied on organic and conventional farms situated along a gradient of isolation from natural habitat. Pollination services from native bees were significantly, positively related to the proportion of upland natural habitat in the vicinity of farm sites, but not to any other factor studied, including farm type, insecticide usage, field size and honeybee abunda", "url": "https://doi.org/10.1111/j.1461-0248.2004.00662.x", "citacoes": 832, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1365-2664.2010.01939.x", "titulo": "Multifunctional shade-tree management in tropical agroforestry landscapes - a review", "autores": "Teja Tscharntke, Yann Clough, Shonil Bhagwat, Damayanti Buchori, Heiko Faust, Dietrich Hertel et al.", "revista": "Journal of Applied Ecology", "data": "2011-01-31", "ano": 2011, "resumo": "1. Agricultural intensification reduces ecological resilience of land-use systems, whereas paradoxically, environmental change and climate extremes require a higher response capacity than ever. Adaptation strategies to environmental change include maintenance of shade trees in tropical agroforestry, but conversion of shaded to unshaded systems is common practice to increase short-term yield.2. In this paper, we review the short-term and long-term ecological benefits of shade trees in coffee Coffea arabica, C. canephora and cacao Theobroma cacao agroforestry and emphasize the poorly understood,", "url": "https://doi.org/10.1111/j.1365-2664.2010.01939.x", "citacoes": 823, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1523-1739.1998.97154.x", "titulo": "The Potential Consequences of Pollinator Declines on the Conservation of Biodiversity and Stability of Food Crop Yields", "autores": "", "revista": "Conservation Biology", "data": "1998-02-11", "ano": 1998, "resumo": "Following reports of dramatic declines in managed and feral honey bees from nearly every region of North America, scientists and resource managers from the U.S., Mexico, and Canada came together to review the quality of the evidence that honey bees as well as other pollinators are in long-term decline and to consider the potential consequences of these losses on the conservation of biodiversity and the stability of the yield of food crops. These experts in pollination ecology confirmed that the last 5 years of losses of honeybee colonies in North America leave us with fewer managed pollinators", "url": "https://doi.org/10.1046/j.1523-1739.1998.97154.x", "citacoes": 817, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rspb.2006.3721", "titulo": "Importance of pollinators in changing landscapes for world crops", "autores": "Alexandra‐Maria Klein, Bernard E Vaissiere, James H. Cane, Ingolf Steffan‐Dewenter, Saul Alan Cunningham, Claire Kremen et al.", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2006-10-27", "ano": 2006, "resumo": "The extent of our reliance on animal pollination for world crop production for human food has not previously been evaluated and the previous estimates for countries or continents have seldom used primary data. In this review, we expand the previous estimates using novel primary data from 200 countries and found that fruit, vegetable or seed production from 87 of the leading global food crops is dependent upon animal pollination, while 28 crops do not rely upon animal pollination. However, global production volumes give a contrasting perspective, since 60% of global production comes from crops ", "url": "https://doi.org/10.1098/rspb.2006.3721", "citacoes": 7328, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.1255957", "titulo": "Bee declines driven by combined stress from parasites, pesticides, and lack of flowers", "autores": "Dave Goulson, Elizabeth Nicholls, Cristina Botías, Ellen L. Rotheray", "revista": "Science", "data": "2015-02-26", "ano": 2015, "resumo": "Bees are subject to numerous pressures in the modern world. The abundance and diversity of flowers has declined; bees are chronically exposed to cocktails of agrochemicals, and they are simultaneously exposed to novel parasites accidentally spread by humans. Climate change is likely to exacerbate these problems in the future. Stressors do not act in isolation; for example, pesticide exposure can impair both detoxification mechanisms and immune responses, rendering bees more susceptible to parasites. It seems certain that chronic exposure to multiple interacting stressors is driving honey bee c", "url": "https://doi.org/10.1126/science.1255957", "citacoes": 4145, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.1127863", "titulo": "Parallel Declines in Pollinators and Insect-Pollinated Plants in Britain and the Netherlands", "autores": "Jacobus Christiaan Biesmeijer, Stuart P. M. Roberts, Menno Reemer, Ralf Ohlemüller, Mike Edwards, Theo Peeters et al.", "revista": "Science", "data": "2006-07-20", "ano": 2006, "resumo": "Despite widespread concern about declines in pollination services, little is known about the patterns of change in most pollinator assemblages. By studying bee and hoverfly assemblages in Britain and the Netherlands, we found evidence of declines (pre-versus post-1980) in local bee diversity in both countries; however, divergent trends were observed in hoverflies. Depending on the assemblage and location, pollinator declines were most frequent in habitat and flower specialists, in univoltine species, and/or in nonmigrants. In conjunction with this evidence, outcrossing plant species that are r", "url": "https://doi.org/10.1126/science.1127863", "citacoes": 3233, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.262413599", "titulo": "Crop pollination from native bees at risk from agricultural intensification", "autores": "Claire Kremen, Neal M. Williams, Robbin W. Thorp", "revista": "Proceedings of the National Academy of Sciences", "data": "2002-12-16", "ano": 2002, "resumo": "Ecosystem services are critical to human survival; in selected cases, maintaining these services provides a powerful argument for conserving biodiversity. Yet, the ecological and economic underpinnings of most services are poorly understood, impeding their conservation and management. For centuries, farmers have imported colonies of European honey bees (Apis mellifera) to fields and orchards for pollination services. These colonies are becoming increasingly scarce, however, because of diseases, pesticides, and other impacts. Native bee communities also provide pollination services, but the amo", "url": "https://doi.org/10.1073/pnas.262413599", "citacoes": 1937, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1146/annurev.ecolsys.29.1.83", "titulo": "ENDANGERED MUTUALISMS: The Conservation of Plant-Pollinator Interactions", "autores": "Carol Ann Kearns, David W. Inouye, Nickolas M. Waser", "revista": "Annual Review of Ecology and Systematics", "data": "1998-11-01", "ano": 1998, "resumo": "▪ Abstract The pollination of flowering plants by animals represents a critical ecosystem service of great value to humanity, both monetary and otherwise. However, the need for active conservation of pollination interactions is only now being appreciated. Pollination systems are under increasing threat from anthropogenic sources, including fragmentation of habitat, changes in land use, modern agricultural practices, use of chemicals such as pesticides and herbicides, and invasions of non-native plants and animals. Honeybees, which themselves are non-native pollinators on most continents, and w", "url": "https://doi.org/10.1146/annurev.ecolsys.29.1.83", "citacoes": 1857, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.1014743108", "titulo": "Patterns of widespread decline in North American bumble bees", "autores": "Sydney A. Cameron, Jeffrey D. Lozier, James P. Strange, Jonathan Berenguer Uhuad Koch, Nils Cordes, Leellen F. Solter et al.", "revista": "Proceedings of the National Academy of Sciences", "data": "2011-01-03", "ano": 2011, "resumo": "Bumble bees (Bombus) are vitally important pollinators of wild plants and agricultural crops worldwide. Fragmentary observations, however, have suggested population declines in several North American species. Despite rising concern over these observations in the United States, highlighted in a recent National Academy of Sciences report, a national assessment of the geographic scope and possible causal factors of bumble bee decline is lacking. Here, we report results of a 3-y interdisciplinary study of changing distributions, population genetic structure, and levels of pathogen infection in bum", "url": "https://doi.org/10.1073/pnas.1014743108", "citacoes": 1660, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1461-0248.2008.01157.x", "titulo": "Landscape effects on crop pollination services: are there general patterns?", "autores": "Taylor H. Ricketts, James Regetz, Ingolf Steffan‐Dewenter, Saul Alan Cunningham, Claire Kremen, Anne Bogdanski et al.", "revista": "Ecology Letters", "data": "2008-02-19", "ano": 2008, "resumo": "Pollination by bees and other animals increases the size, quality, or stability of harvests for 70% of leading global crops. Because native species pollinate many of these crops effectively, conserving habitats for wild pollinators within agricultural landscapes can help maintain pollination services. Using hierarchical Bayesian techniques, we synthesize the results of 23 studies - representing 16 crops on five continents - to estimate the general relationship between pollination services and distance from natural or semi-natural habitats. We find strong exponential declines in both pollinator", "url": "https://doi.org/10.1111/j.1461-0248.2008.01157.x", "citacoes": 1400, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1371/journal.pone.0006481", "titulo": "Colony Collapse Disorder: A Descriptive Study", "autores": "Dennis vanEngelsdorp, Jay D ": "doi:10.1111/ele.12082", "titulo": "A global quantitative synthesis of local and landscape effects on wild bee pollinators in agroecosystems", "autores": "Christina Marie Kennedy, Eric V. Lonsdorf, Maile C. Neel, Neal M. Williams, Taylor H. Ricketts, Rachael Winfree et al.", "revista": "Ecology Letters", "data": "2013-03-11", "ano": 2013, "resumo": "Bees provide essential pollination services that are potentially affected both by local farm management and the surrounding landscape. To better understand these different factors, we modelled the relative effects of landscape composition (nesting and floral resources within foraging distances), landscape configuration (patch shape, interpatch connectivity and habitat aggregation) and farm management (organic vs. conventional and local-scale field diversity), and their interactions, on wild bee abundance and richness for 39 crop systems globally. Bee abundance and richness were higher in diver", "url": "https://doi.org/10.1111/ele.12082", "citacoes": 1275, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/nature14420", "titulo": "Seed coating with a neonicotinoid insecticide negatively affects wild bees", "autores": "Maj Rundlöf, Georg K.S. Andersson, Riccardo Bommarco, Ingemar Fries, Veronica Hederström, Lina Herbertsson et al.", "revista": "Nature", "data": "2015-04-22", "ano": 2015, "resumo": "", "url": "https://doi.org/10.1038/nature14420", "citacoes": 1111, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/nature13531", "titulo": "Declines in insectivorous birds are associated with high neonicotinoid concentrations", "autores": "Caspar A. Hallmann, Ruud Foppen, Chris A. M. van Turnhout, Hans de Kroon, Eelke Jongejans", "revista": "Nature", "data": "2014-07-01", "ano": 2014, "resumo": "", "url": "https://doi.org/10.1038/nature13531", "citacoes": 1091, "fonte": "OpenA azing, logging, and agriculture. We obtained 13", "url": "https://doi.org/10.1890/08-1245.1", "citacoes": 1056, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/nature11585", "titulo": "Combined pesticide exposure severely affects individual- and colony-level traits in bees", "autores": "Richard J. Gill, Oscar Ramos-Rodriguez, Nigel E. Raıne", "revista": "Nature", "data": "2012-10-19", "ano": 2012, "resumo": "", "url": "https://doi.org/10.1038/nature11585", "citacoes": 1027, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.1517092112", "titulo": "Non-bee insects are important contributors to global crop pollination", "autores": "Romina Rader, Ígnasi Bartomeus, Lucas A. Garibaldi, Michael P. D. Garratt, Brad G. Howlett, Rachael Winfree et al.", "revista": "Proceedings of the National Academy of Sciences", "data": "2015-11-30", "ano": 2015, "resumo": "Wild and managed bees are well documented as effective pollinators of global crops of economic importance. However, the contributions by pollinators other than bees have been little explored despite their potential to contribute to crop production and stability in the face of environmental change. Non-bee pollinators include flies, beetles, moths, butterflies, wasps, ants, birds, and bats, among others. Here we focus on non-bee insects and synthesize 39 field studies from five continents that directly measured the crop pollination services provided by non-bees, honey bees, and other bees to co", "url": "https://doi.org/10.1073/pnas.1517092112", "citacoes": 1012, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/nature05429", "titulo": "Habitat modification alters the structure of tropical host–parasitoid food webs", "autores": "Jason M. Tylianakis, Teja Tscharntke, Owen T. Lewis", "revista": "
