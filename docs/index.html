agem e conservação", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.1111/een.70125", "titulo": "Forest edges buffer effects of agricultural management on bee–plant interaction networks", "autores": "Samantha Marx de Castro, Cauê Nagatani, Vânia Nobuko Yoshikawa, Franciny Yuko Urushima, Kelli dos Santos Ramos, Guaraci Duran Cordeiro et al.", "revista": "Ecological Entomology", "data": "2026-07-20", "ano": 2026, "resumo": "Abstract Bee–plant interaction networks are essential for sustaining pollination services in agricultural landscapes, and farming practices can modify their structure by altering species composition and interaction patterns along crop margins. This study assessed how conventional and organic management influence bee–plant interaction networks and key network metrics (connectance, nestedness, interaction richness, interaction diversity and modularity) along crop field edges bordering native forest fragments. Surveys conducted on farms growing different crops revealed similar bee and plant…", "url": "https://doi.org/10.1111/een.70125", "citacoes": 0, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.1016/j.biocon.2026.112007", "titulo": "3D-printed flowers for standardised pollinator monitoring", "autores": "Carlos Martínez‐Núñez, Rocío Sánchez-López, Domingo Cano, Antonio Pérez, Felix Neff, Corina Maurer et al.", "revista": "Biological Conservation", "data": "2026-07-14", "ano": 2026, "resumo": "Global declines in insect pollinators have triggered the need for standardised, scalable methods to monitor pollinator populations. Automated photomonitoring and machine-learning-based identification are emerging as promising non-lethal approaches for large-scale insect observation, but their effectiveness requires reliable and consistent monitoring designs. Artificial flowers offer a solution to limitations associated with natural flowers, including variability in floral availability, lack of standardisation, and wind-induced noise in visual data, yet their performance under real field…", "url": "https://doi.org/10.1016/j.biocon.2026.112007", "citacoes": 0, "fonte": "OpenAlex", "topico": "Diversidade, amostragem e conservação", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.13102/sociobiology.v73i3.12765", "titulo": "Fostering Colony Growth Post Division: Earthen Pot Hives for Stingless Bees, Tetragonula sp. (Hymenoptera: Apidae)", "autores": "Amala Udayakumar, Venu Hunasikote Shamappa", "revista": "Sociobiology", "data": "2026-08-07", "ano": 2026, "resumo": "Stingless bee colony multiplication is vital for expanding agricultural pollination and sustainable honey production, yet it is often constrained by slow natural establishment after division in standard hive systems. This study evaluated the use of red earthen pots as an ideal, natural artificial hive to facilitate the successful division and management of stingless bee colonies. Three different hive types, viz., wooden square hives, red earthen pots, and wooden rectangular hives, were evaluated for the colony establishment after division. Significantly greater percentage of colony…", "url": "https://doi.org/10.13102/sociobiology.v73i3.12765", "citacoes": 0, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.1126/science.1255957", "titulo": "Bee declines driven by combined stress from parasites, pesticides, and lack of flowers", "autores": "Dave Goulson, Elizabeth Nicholls, Cristina Botías, Ellen L. Rotheray", "revista": "Science", "data": "2015-02-26", "ano": 2015, "resumo": "Bees are subject to numerous pressures in the modern world. The abundance and diversity of flowers has declined; bees are chronically exposed to cocktails of agrochemicals, and they are simultaneously exposed to novel parasites accidentally spread by humans. Climate change is likely to exacerbate these problems in the future. Stressors do not act in isolation; for example, pesticide exposure can impair both detoxification mechanisms and immune responses, rendering bees more susceptible to parasites. It seems certain that chronic exposure to multiple interacting stressors is driving honey bee c", "url": "https://doi.org/10.1126/science.1255957", "citacoes": 4145, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.1232728", "titulo": "Plant-Pollinator Interactions over 120 Years: Loss of Species, Co-Occurrence, and Function", "autores": "Laura A. Burkle, John C. Marlin, Tiffany M. Knight", "revista": "Science", "data": "2013-03-01", "ano": 2013, "resumo": "Honeybees Can't Do It Alone The majority of food crops require pollination to set fruit with the honeybee providing a pollination workhorse, with both feral and managed populations an integral component of crop management (see the Perspective by Tylianakis , published online 28 February). Garibaldi et al. (p. 1608 , published online 28 February) now show that wild pollinators are also a vital part of our crop systems. In more than 40 important crops grown worldwide, wild pollinators improved pollination efficiency, increasing fruit set by twice that facilitated by honeybees. Burkle et al. (p. ", "url": "https://doi.org/10.1126/science.1232728", "citacoes": 1133, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.aax8591", "titulo": "Climate change contributes to widespread declines among bumble bees across continents", "autores": "Peter Soroye, Tim Newbold, Jeremy Thomas Kerr", "revista": "Science", "data": "2020-02-06", "ano": 2020, "resumo": "Climate change could increase species' extinction risk as temperatures and precipitation begin to exceed species' historically observed tolerances. Using long-term data for 66 bumble bee species across North America and Europe, we tested whether this mechanism altered likelihoods of bumble bee species' extinction or colonization. Increasing frequency of hotter temperatures predicts species' local extinction risk, chances of colonizing a new area, and changing species richness. Effects are independent of changing land uses. The method developed in this study permits spatially explicit predictio", "url": "https://doi.org/10.1126/science.aax8591", "citacoes": 734, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido/2009019", "titulo": "The conservation of bees: a global perspective", "autores": "Mark J. F. Brown, Robert J. Paxton", "revista": "Apidologie", "data": "2009-04-30", "ano": 2009, "resumo": "Bees are major pollinators of Angiosperms and therefore their apparent decline is of importance for humans and biodiversity. We synthesise results of 12 recent reviews to provide a global picture of the threats they face. Habitat loss is the major threat to bee diversity, whilst invasive species, emerging diseases, pesticide use, and climate change also have the potential to impact bee populations. We suggest that future conservation strategies need to prioritise (i) minimising habitat loss, (ii) making agricultural habitats bee-friendly, (iii) training scientists and the public in bee taxonom", "url": "https://doi.org/10.1051/apido/2009019", "citacoes": 587, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido:2006026", "titulo": "Stingless bee nesting biology", "autores": "David Ward Roubik", "revista": "Apidologie", "data": "2006-03-01", "ano": 2006, "resumo": "", "url": "https://doi.org/10.1051/apido:2006026", "citacoes": 581, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.185.4153.747", "titulo": "Thermoregulation in Endothermic Insects", "autores": "Bernd Heinrich", "revista": "Science", "data": "1974-08-30", "ano": 1974, "resumo": "On the basis of body weight, most flying insects have higher rates of metabolism, and hence heat production, than other animals. However, rapid rates of cooling because of small body size in most cases precludes appreciable endothermy. The body temperature of small flies in flight is probably close to ambient temperature, and that of flying butterflies and locusts is 5 degrees to 10 degrees C above ambient temperature. Many moths and bumblebees are insulated with scales and hair, and their metabolism during flight can cause the temperature of the flight muscles to increase 20 degrees to 30 deg", "url": "https://doi.org/10.1126/science.185.4153.747", "citacoes": 363, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.aat1598", "titulo": "Neonicotinoid exposure disrupts bumblebee nest behavior, social networks, and thermoregulation", "autores": "James D. Crall, Callin M. Switzer, Robert L Oppenheimer, Ashlee N. Ford Versypt, Biswadip Dey, Andrea L. M. Brown et al.", "revista": "Science", "data": "2018-11-08", "ano": 2018, "resumo": "Neonicotinoid pesticides can negatively affect bee colonies, but the behavioral mechanisms by which these compounds impair colony growth remain unclear. Here, we investigate imidacloprid's effects on bumblebee worker behavior within the nest, using an automated, robotic platform for continuous, multicolony monitoring of uniquely identified workers. We find that exposure to field-realistic levels of imidacloprid impairs nursing and alters social and spatial dynamics within nests, but that these effects vary substantially with time of day. In the field, imidacloprid impairs colony thermoregulati", "url": "https://doi.org/10.1126/science.aat1598", "citacoes": 307, "fonte": "OpenAlex", "topico" n.2009.12.003", "titulo": "Maximum foraging ranges in solitary bees: only few individuals have the capability to cover long foraging distances", "autores": "Antonia Zurbuchen, Lisa Landert, Jeannine Klaiber, Antoine Müller, Silke Hein, Silvia Dorn", "revista": "Biological Conservation", "data": "2010-01-07", "ano": 2010, "resumo": "", "url": "https://doi.org/10.1016/j.biocon.2009.12.003", "citacoes": 832, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.171.3967.203", "titulo": "Euglossine Bees as Long-Distance Pollinators of Tropical Plants", "autores": "Daniel H. Janzen", "revista": "Science", "data": "1971-01-15", "ano": 1971, "resumo": "Euglossine bees may return to a nest from as far away as 23 kilometers in a tropical rain forest. These bees apparently forage long distances and visit the same plants repeatedly along a feeding route. They probably promote outcrossing among tropical plants with low population density; therefore, they may permit the existence of plant species whose densities have been forced very low by such things as competition and predators on seeds and seedlings.", "url": "https://doi.org/10.1126/science.171.3967.203", "citacoes": 771, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.0307-6946.2005.00662.x", "titulo": "Role of nesting resources in organising diverse bee communities in a Mediterranean landscape", "autores": "Simon Geoffrey Potts, Betsy Vulliamy, Stuart P. M. Roberts, Chris O’Toole, Amots Dafni, Gidi Ne’eman et al.", "revista": "Ecological Entomology", "data": "2005-01-17", "ano": 2005, "resumo": "Abstract. 1. The habitat components determining the structure of bee communities are well known when considering foraging resources; however, there is little data with respect to the role of nesting resources. 2. As a model system this study uses 21 diverse bee communitie 67", "titulo": "Neonicotinoid pesticide exposure impairs crop pollination services provided by bumblebees", "autores": "Dara Anne Stanley, Michael P. D. Garratt, Jennifer B. Wickens, Victoria J. Wickens, Simon Geoffrey Potts, Nigel E. Raıne", "revista": "Nature", "data": "2015-11-17", "ano": 2015, "resumo": "", "url": "https://doi.org/10.1038/nature16167", "citacoes": 379, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1365-2311.1993.tb01075.x", "titulo": "Temperature and the pollinating activity of social bees", "autores": "Sarah A. Corbet, M. Fussell, R. Ake, A. FRASER, C. GUNSON, A. SAVAGE et al.", "revista": "Ecological Entomology", "data": "1993-02-01", "ano": 1993, "resumo": "Abstract. Thermal constraints on flight acivity limit the pollinating effectiveness of bees. Each species of social bee has a microclimatic ‘window’ within which foraging flight can be sustained. To predict whether a given species of social bee is worth testing as a pollinator in a given climate, it is useful to know at least the lower limits of that microclimatic ‘window’. We consider how information from a series of bee counts through a day can be used to characterize a bee species in terms of activity/microclimate relations as a basis for predicting the diel pattern of foraging activity of ", "url": "https://doi.org/10.1111/j.1365-2311.1993.tb01075.x", "citacoes": 379, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.cub.2013.07.020", "titulo": "Spatial Memory in Insect Navigation", "autores": "Matthew Collett, Lars Chıttka, Thomas S. Collett", "revista": "Current Biology", "data": "2013-09-01", "ano": 2013, "resumo": "", "url": "https://doi.org/10.1016/j.cub.2013.07.020", "citacoes": 368, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.185. iological Conservation", "data": "2006-03-14", "ano": 2006, "resumo": "", "url": "https://doi.org/10.1016/j.biocon.2006.01.023", "citacoes": 296, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.206.4422.1095", "titulo": "Genetic Component of Bee Odor in Kin Recognition", "autores": "Les Greenberg", "revista": "Science", "data": "1979-11-30", "ano": 1979, "resumo": "The primitively social sweat bee, Lasioglossum zephyrum, blocks the entry into its nest of most conspecifics from other colonies. Laboratory inbreeding of these bees produced lines which showed a positive linear relationship between the coefficient of relationship of bees tested and how often they permitted non-nestmates to pass them. The most probable mechanism is a genetically determined odor coupled with a learned component by which guard bees discriminate between odors of close kin and other bees.", "url": "https://doi.org/10.1126/science.206.4422.1095", "citacoes": 268, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.cub.2004.07.057", "titulo": "Nocturnal Vision and Landmark Orientation in a Tropical Halictid Bee", "autores": "Eric J. Warrant, Almut Kelber, Anna Gislén, Birgit Greiner, Willi A. Ribi, William T. Wcislo", "revista": "Current Biology", "data": "2004-08-01", "ano": 2004, "resumo": "", "url": "https://doi.org/10.1016/j.cub.2004.07.057", "citacoes": 255, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.cub.2010.06.035", "titulo": "Path Integration Provides a Scaffold for Landmark Learning in Desert Ants", "autores": "Martin Müller, Rüdiger Wehner", "revista": "Current Biology", "data": "2010-07-09", "ano": 2010, "resumo": "", "url": "https://doi.org/10.1016/j.cub.2010.06.035", "citacoes": 246, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.cub.2009.08.015", "titulo": "Ants use the panoramic skyline as a visual cue during navigation", "autores": "Paul Graham, Ken Cheng", "revista": "Current Biology", "data": "2009-11-01", "ano": 2009, "resumo": "", "url": "https://doi.org/10.1016/j.cub.2009.08.015", "citacoes": 245, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1365-2311.1997.00071.x", "titulo": "Abiotic and biotic factors influencing nest‐site selection by Halictus rubicundus , a ground‐nesting halictine bee", "autores": "Simon Geoffrey Potts, Pat G. Willmer", "revista": "Ecological Entomology", "data": "1997-08-01", "ano": 1997, "resumo": "1. The nest‐site selection behaviour of the bee Halictus rubicundus (Christ) was examined both within and across sites in the U.K. Females utilized a range of edaphic and microclimatic conditions when choosing a site to excavate a nest. Factors with broad tolerances included slope and hardness; those with much narrower limits included aspect, soil humidity and soil particle composition. 2. There was a preference for softer soils that were easier to dig within a site with a low overall density, but in much denser aggregations problems of maintaining the structural integrity of a nest led to the", "url": "https://doi.org/10.1046/j.1365-2311.1997.00071.x", "citacoes": 204, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1365-2311.2002.00437.x", "titulo": "Landscape context affects trap‐nesting bees, wasps, and their natural enemies", "autores": "Ingolf Steffan‐Dewenter", "revista": "Ecological Entomology", "data": "2002-09-10", "ano": 2002, "resumo": "Ecologists have become increasingly aware that not only local fragmentation or alteration of habitats but also regional changes of landscape complexity may have a great effect on penAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido:19990203", "titulo": "Population modelling of Varroa jacobsoni Oud", "autores": "Johan N. M. Calis, Ingemar Fries, Stephen C. Ryrie", "revista": "Apidologie", "data": "1999-01-01", "ano": 1999, "resumo": "", "url": "https://doi.org/10.1051/apido:19990203", "citacoes": 90, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1093/beheco/arl017", "titulo": "Open-cell parasitism shapes maternal investment patterns in the Red Mason bee Osmia rufa", "autores": "Karsten Seidelmann", "revista": "Behavioral Ecology", "data": "2006-07-14", "ano": 2006, "resumo": "Brood cell parasitism inflicts high fitness costs on solitary, nest-constructing bees. Many of these parasites enter open cells during its provisioning, when the mother bee is absent. Therefore, females can reduce the risk of open-cell parasitism by limiting the time they are away from the nest. However, provisioning efficiency (provisioning time per unit of progeny body mass) decreases due to aging. To limit the increasing risk of open-cell parasitism as the nesting season progresses, female bees could optimize their maternal investment strategy by shifting the sex ratio and the body size of ", "url": "https://doi.org/10.1093/beheco/arl017", "citacoes": 89, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1093/beheco/ari040", "titulo": "Bumble bees (Bombus terrestris) store both food and information in honeypots", "autores": "Anna Dornhaus, Lars Chıttka", "revista": "Behavioral Ecology", "data": "2005-03-16", "ano": 2005, "resumo": "Social insect foragers often transmit information about food sources to nest mates. In bumble bees (Bombus terrestris), for example, successful foragers use excited motor displays and a pheromone as communication signals. In n service providers such as bees lack a modern distributional synthesis. Here, we combine a uniquely comprehensive checklist of bee species distributions and >5,800,000 public bee occurrence records to describe global patterns of bee biodiversity. Publicly accessible records are sparse, especially from developing countries, and are frequently inaccurate throughout much of the world, consequently suggesting different biodiversity patterns from checklist data. Global analyses reveal hotspot", "url": "https://doi.org/10.1016/j.cub.2020.10.053", "citacoes": 402, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/s0960-9822(00)00561-3", "titulo": "Evidence from multiple gene sequences indicates that termites evolved from wood-feeding cockroaches", "autores": "Nathan Lo, Gaku Tokuda, Hirofumi Watanabe, Harley A. Rose, M. Slaytor, Kiyoto Maekawa et al.", "revista": "Current Biology", "data": "2000-06-01", "ano": 2000, "resumo": "", "url": "https://doi.org/10.1016/s0960-9822(00)00561-3", "citacoes": 356, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1365-2311.1998.00145.x", "titulo": "Resource discovery versus resource domination in ants: a functional mechanism for breaking the trade‐off", "autores": "Diane W. Davidson", "revista": "Ecological Entomology", "data": "1998-11-01", "ano": 1998, "resumo": "The importance of competition in structuring natural communities is often a contentious issue, but not for myrmecologists (Hölldobler & Wilson 1990). Perhaps because eusociality buffers colonies against predation and the physical environment, and because so many ants act as generalized scavengers and exudate-feeders, competition appears to be ubiquitous in ant communities. In Hölldobler and Wilson's review of this subject, for example, factors ranging from overt aggression to over-dispersion of colonies, over-d  1994, "resumo": "", "url": "https://doi.org/10.1051/apido:19940302", "citacoes": 61, "fonte": "OpenAlex", "topico": "Meliponicultura, mel e pólen", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1365-2311.1993.tb01075.x", "titulo": "Temperature and the pollinating activity of social bees", "autores": "Sarah A. Corbet, M. Fussell, R. Ake, A. FRASER, C. GUNSON, A. SAVAGE et al.", "revista": "Ecological Entomology", "data": "1993-02-01", "ano": 1993, "resumo": "Abstract. Thermal constraints on flight acivity limit the pollinating effectiveness of bees. Each species of social bee has a microclimatic ‘window’ within which foraging flight can be sustained. To predict whether a given species of social bee is worth testing as a pollinator in a given climate, it is useful to know at least the lower limits of that microclimatic ‘window’. We consider how information from a series of bee counts through a day can be used to characterize a bee species in terms of activity/microclimate relations as a basis for predicting the diel pattern of foraging activity of ", "url": "https://doi.org/10.1111/j.1365-2311.1993.tb01075.x", "citacoes": 379, "fonte": "OpenAlex", "topico": "Monitoramento eletrônico de colmeias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.cub.2017.08.008", "titulo": "Bee cognition", "autores": "Lars Chıttka", "revista": "Current Biology", "data": "2017-10-01", "ano": 2017, "resumo": "", "url": "https://doi.org/10.1016/j.cub.2017.08.008", "citacoes": 150, "fonte": "OpenAlex", "topico": "Monitoramento eletrônico de colmeias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.adf5451", "titulo": "Miniature magneto-mechanical resonators for wireless tracking and sensing", "autores": "Bernhard Gleich, Ingo Schmale, Tim Tolker‐Nielsen, Jürgen Rahmer", "revista": "Science", "data": "2023-06-01", "ano": 2023, "resumo": "Sensor miniaturization enables applications such as minimally invasive medical procedures or patient monitoring by providing process feedback in situ. Ideally, miniature sensors should be wireless, inexpensive, and allow for remote detection over sufficient distance by an affordable detection system. We analyze the signal strength of wireless sensors theoretically and derive a simple design of high-signal resonant magneto-mechanical sensors featuring volumes below 1 cubic millimeter. As examples, we demonstrate real-time tracking of position and attitude of a flying bee, navigation of a biopsy", "url": "https://doi.org/10.1126/science.adf5451", "citacoes": 71, "fonte": "OpenAlex", "topico": "Monitoramento eletrônico de colmeias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s13592-019-00714-8", "titulo": "Automated monitoring of bee behaviour using connected hives: Towards a computational apidology", "autores": "Paul Alfred Marchal, Alexis Buatois, Stéphane Kraus, Simon Klein, Tamara Gómez‐Moracho, Mathieu Lihoreau", "revista": "Apidologie", "data": "2019-12-10", "ano": 2019, "resumo": "", "url": "https://doi.org/10.1007/s13592-019-00714-8", "citacoes": 60, "fonte": "OpenAlex", "topico": "Monitoramento eletrônico de colmeias", "tipo": "classico", "adicionado": ""}];
const POR_PAGINA = 40;
let aba = 'novo', topico = '', busca = '', revista = '', limite = POR_PAGINA;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtData(s) {
  if (!s) return '';
  const d = new Date(s + 'T00:00:00');
  return isNaN(d) ? s : d.toLocaleDateString('pt-BR');
}
function setAba(a) { aba = a; limite = POR_PAGINA;
  document.getElementById('tab-novo').classList.toggle('on', a === 'novo');
  document.getElementById('tab-classico').classList.toggle('on', a === 'classico');
  render(); }
function setTopico(t) { topico = t; limite = POR_PAGINA; render(); }
function setRev(v) { revista = v; limite = POR_PAGINA; render(); }
function setBusca(v) { busca = v.toLowerCase().trim(); limite = POR_PAGINA; render(); }
function mostrarMais() { limite += POR_PAGINA; render(); }

function filtrados() {
  let xs = DADOS.filter(d => d.tipo === aba);
  if (topico) xs = xs.filter(d => d.topico === topico);
  if (revista) xs = xs.filter(d => d.revista === revista);
  if (busca) xs = xs.filter(d =>
    (d.titulo + ' ' + d.autores + ' ' + d.resumo + ' ' + d.revista).toLowerCase().includes(busca));
  if (aba === 'novo') {
    xs.sort((a, b) => (b.adicionado || '').localeCompare(a.adicionado || '') || (b.data || '').localeCompare(a.data || ''));
  } else {
    xs.sort((a, b) => (b.citacoes || 0) - (a.citacoes || 0));
  }
  return xs;
}

function itemHtml(d) {
  const meta = [esc(d.revista), fmtData(d.data) || esc(d.ano || ''),
    aba === 'classico' ? (d.citacoes || 0) + ' citações' : ''].filter(Boolean).join(' · ');
  return '<div class="item">' +
    '<a class="t" href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.titulo) + '</a>' +
    '<div class="aut">' + esc(d.autores) + '</div>' +
    '<div class="meta"><span class="tag">' + esc(d.topico) + '</span>' + meta + '</div>' +
    '<div class="res">' + (d.resumo ? esc(d.resumo) : '<i>(sem resumo disponível)</i>') + '</div></div>';
}

function render() {
  const topicos = [...new Set(DADOS.filter(d => d.tipo === aba).map(d => d.topico))];
  document.getElementById('chips').innerHTML =
    '<span class="chip ' + (topico === '' ? 'on' : '') + '" onclick="setTopico(\'\')">Todos</span>' +
    topicos.map(t => '<span class="chip ' + (topico === t ? 'on' : '') + '" data-t="' + esc(t) + '">' + esc(t) + '</span>').join('');
  document.querySelectorAll('.chip[data-t]').forEach(el => el.onclick = () => setTopico(el.dataset.t));

  const contagem = {};
  DADOS.filter(d => d.tipo === aba && (!topico || d.topico === topico) && d.revista)
       .forEach(d => { contagem[d.revista] = (contagem[d.revista] || 0) + 1; });
  const revistas = Object.keys(contagem).sort((a, b) => contagem[b] - contagem[a]);
  if (revista && !revistas.includes(revista)) revista = '';
  const sel = document.getElementById('rev');
  sel.innerHTML = '<option value="">Todas as revistas (' + revistas.length + ')</option>' +
    revistas.map(r => '<option value="' + esc(r) + '">' + esc(r) + ' (' + contagem[r] + ')</option>').join('');
  sel.value = revista;

  const xs = filtrados();
  document.getElementById('count').textContent = xs.length + ' artigo(s)';
  const parte = xs.slice(0, limite);
  let out = '', diaAtual = null;
  for (const d of parte) {
    if (aba === 'novo' && d.adicionado !== diaAtual) {
      diaAtual = d.adicionado;
      out += '<h2 class="dia">Chegaram em ' + fmtData(diaAtual) + '</h2>';
    }
    out += itemHtml(d);
  }
  if (!parte.length) out = '<p style="color:var(--mut)">Nada encontrado.</p>';
  document.getElementById('lista').innerHTML = out;
  document.getElementById('mais').style.display = xs.length > limite ? 'block' : 'none';
}
render();
</script>
