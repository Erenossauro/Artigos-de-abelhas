n Access Journals)", "data": "2026-09-01", "ano": 2026, "resumo": "Stingless bees collect a variety of resources, mostly from plants, for nest construction, hydration, and the feeding of immatures and adults. They also commonly dispose of waste from their colonies. These activities are directly influenced by abiotic factors, which can determine different foraging patterns. Given the current climate change, understanding how physical climatic factors affect bee behavior is extremely relevant. Therefore, this study aimed to investigate how physical climatic factors influence the foraging patterns of the native bee species, Plebeia catamarcensis (Holmberg). To…", "url": "https://doi.org/10.13102/sociobiology.v73i3.12423", "citacoes": 0, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.32846/2306-9716/2026.eco.4-67.17", "titulo": "Sphecidae and Crabronidae (Apoidea, Hymenoptera, Insecta) of the subalpine belt of the Ukrainian Carpathians", "autores": "А.П. Сімчук, Artur Sirenko", "revista": "Ecological Sciences", "data": "2026-08-31", "ano": 2026, "resumo": "Розглянуто та проаналізовано результати багаторічних досліджень (2002 -2025 років) фауни та екології Sphecidae та Crabronidae (Apoidea, Hymenoptera, Insecta) субальпійського поясу Українських Карпат.Дослідження проводились на 19 полонинах гірських масивів Ґорґани, Чивчини, Гриняви, Чорногора, а саме, досліджувались полонини: Верхнижня, Блажів, Бабин Погар, Боревка, Боярин, Середня, Довга, Плоска, Ріжі, Братківська (Горгани), Альбина, Погребина, Пнів'є, Веснярка (Чивчини та Гриняви), Кострич, Пожижевська, Шпиці, Ребра, Веснярка (Чорногора), що розташовані на висотаї від 1300 та 2000 м над…", "url": "https://doi.org/10.32846/2306-9716/2026.eco.4-67.17", "citacoes": 0, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.12688/openreseurope.24677 mbuor, Ivy Bazar Divina, Arman Idlan Haidis, Wolyna Pindi et al.", "revista": "International Journal of Food", "data": "2026-09-30", "ano": 2026, "resumo": "This study was conducted to develop a jelly using a mixture of black fungus mushroom extract and stingless bee honey. Five formulations of jellies were prepared with different percentage of black fungus mushroom extract [F1(0%); F2(10%); F3(20%); F4(30%) and F5(40%)] with the addition of 1% of stingless bee honey. The jellies were further analysed for their physicochemical properties, sensory attributes and proximate composition. The texture analysis showed a decrease in hardness and cohesiveness, while springiness, resilience and adhesiveness remain unchanged. Syneresis and colour analysis…", "url": "https://doi.org/10.51200/ijf.v3i2.7483", "citacoes": 0, "fonte": "OpenAlex", "topico": "Comunicação, cognição e comportamento", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "t:hybrid artificial bee colony long short term memory networks for enhanced short term load forecasting", "titulo": "Hybrid Artificial Bee Colony Long Short-Term Memory Networks for Enhanced Short-Term Load Forecasting", "autores": "Sunday Alade Jude AREMU, Mohammed UTHMAN, Alfa A. MAHMOUD, Kehinde J. OGUNJUYIGBE, Abubakar L. NABIL", "revista": "UNIABUJA Journal of Engineering and Technology", "data": "2026-09-26", "ano": 2026, "resumo": "Short-term load forecasting is critical for optimising energy distribution in urban networks, yet challenges arise from non-linear and non-stationary demand patterns. This study addresses the problem of inaccurate load predictions in the Abuja Electricity Distribution Company (AEDC) network, which can lead to inefficient resource allocation and grid instability. The aim was to develop a hybrid Artificial Bee Colony (ABC)-Long Short-Term Memory (LSTM) model to enhance forecasting accuracy across three distribution areas: Lugbe, Gwagwalada, and Abaji. The methodology integrated ABC for…", "url": "https:/ r VLAs either cannot incorporate such corrections or fold them into undifferentiated supervision. Yet human corrections are not uniformly noisy but reliable along some action dimensions and variable along…", "url": "https://doi.org/10.48550/arxiv.2609.27450", "citacoes": 0, "fonte": "OpenAlex", "topico": "Comunicação, cognição e comportamento", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.1016/j.asoc.2026.116445", "titulo": "Multi-level adaptive artificial bee colony coordination for hierarchical graph–temporal multi-agent reinforcement learning in multi-objective cloud–edge task scheduling", "autores": "Mustafa Ibrahim Khaleel", "revista": "Applied Soft Computing", "data": "2026-09-16", "ano": 2026, "resumo": "Swarm intelligence has demonstrated remarkable success in large-scale optimization; however, its integration with deep Multi-Agent Reinforcement Learning (MARL) for dynamic distributed systems remains underexplored. In cloud–edge task scheduling, cooperative MARL suffers from credit assignment instability, oscillatory multi-objective trade-offs, and scalability degradation under increasing system size. To address these challenges, this paper proposes a multi-level adaptive Artificial Bee Colony (ABC) framework structurally embedded within a hierarchical graph–temporal MARL architecture…", "url": "https://doi.org/10.1016/j.asoc.2026.116445", "citacoes": 0, "fonte": "OpenAlex", "topico": "Comunicação, cognição e comportamento", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.3390/computers15090613", "titulo": "Collaboratively Designing Curriculum-Aligned Bee-Bot Learning Resources: Insights from a Qualitative Case Study of a Professional Development Workshop for Primary Teachers", "autores": "Kalliopi Kanaki, Michail Kalogiannakis, Nicholas Zaranis", "revista": "Computers", "data": "2026-09-14", "ano": 2026, "resumo": "Although educational robotics is widely recognised as an effective approach to supporting curriculum-aligned learni ão e comportamento", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.3390/math14183406", "titulo": "Computational Cost Reduction in FEM-Based Optimization of a Magnetorheological Actuator Using Memory Assistance", "autores": "Jakob Vizjak, Mislav Trbušić, Marko Jesenik", "revista": "Mathematics", "data": "2026-09-20", "ano": 2026, "resumo": "Magnetorheological (MR) fluids are smart materials widely used in applications requiring controllable braking torque and force generation. The optimization of such devices often relies on the finite element method (FEM) combined with a numerical optimization algorithm, incurring high computational cost due to the large number of required evaluations. This study investigates the geometric optimization of a spherical MR actuator using Differential Evolution (DE), Artificial Bee Colony (ABC), and Teaching–Learning-Based Optimization (TLBO). To reduce computational effort, Short-Term Memory…", "url": "https://doi.org/10.3390/math14183406", "citacoes": 0, "fonte": "OpenAlex", "topico": "Comunicação, cognição e comportamento", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.1016/j.eswa.2026.134311", "titulo": "Integrated scheduling of single-track channels, tugboats, continuous berths and quay cranes via learning-driven multi-objective artificial bee colony algorithms", "autores": "Zengtao Geng, Xiangqian Ding, Yaping Fu", "revista": "Expert Systems with Applications", "data": "2026-09-16", "ano": 2026, "resumo": "", "url": "https://doi.org/10.1016/j.eswa.2026.134311", "citacoes": 0, "fonte": "OpenAlex", "topico": "Comunicação, cognição e comportamento", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.18805/ag.d-6558", "titulo": "An Optimized Temporal Attention-based Deep Learning Framwork for Accurate Crop Yield Prediction from Multi-source Agricultural Data", "autores": "M Lokeshwari, Nivethitha Manavalagan, P. Amrutha, S Harinee, N R Divyasree", "revista": "Agricultural Science Digest - A Research Journal", "data": "2026-09-10", "ano": 2026, "resumo": "Background: In precision agriculture, crop yield prediction is crucial for supporting effective management of crops, timely settlement of farmers crop insurances, food security planning and serve as decision tool for sustainable agricultural achievements. However, prediction of crop yield is difficult due to the complex interaction behavior among diverse conditions in weather, soil properties, multispectral remote sensing observations and the dynamics in crop growth. Despite existing AI techniques like machine learning and deep learning models outperformed in predicting crop yield, they are…", "url": "https://doi.org/10.18805/ag.d-6558", "citacoes": 0, "fonte": "OpenAlex", "topico": "Comunicação, cognição e comportamento", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.1016/j.apacoust.2026.111548", "titulo": "Bee sound classification via distributional learning of acoustic features with support histogram machines", "autores": "Seyong Park, Tae‐Young Heo, Jonghwa Na, Ilsuk Kang", "revista": "Applied Acoustics", "data": "2026-09-07", "ano": 2026, "resumo": "", "url": "https://doi.org/10.1016/j.apacoust.2026.111548", "citacoes": 0, "fonte": "OpenAlex", "topico": "Comunicação, cognição e comportamento", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.3390/insects17090924", "titulo": "Olfactory Information Transfer in Bumblebees and Its Variation According to the Food Resource", "autores": "Tomás Eloy González Chinnici, Mateo Miró, Camila Belen Saldaña, Walter Marcelo Farina", "revista": "Insects", "data": "2026-09-03", "ano": 2026, "resumo": "Within the framework of animal learning theory, information transfer refers to the generalization or transmission of acquired knowledge to novel situations, individuals, or environments. In pollinators, this process is critical for adaptive foraging and ecological success. Although olfactory information transfer has been demonstrated in bumblebe nado": "2026-10-08"}, {"key": "doi:10.5281/zenodo.21828795", "titulo": "Operant Symbolic Communication Protocol for Assessing Internal Homeostatic States in Bombus terrestris: A Stage 1 Registered Report Framework", "autores": "Luigi Usai", "revista": "Zenodo (CERN European Organization for Nuclear Research)", "data": "2026-08-06", "ano": 2026, "resumo": "English Description Abstract & Research Overview This manuscript presents a Stage 1 Registered Report framework introducing an Operant Symbolic Communication Protocol designed to evaluate state-dependent intentional signaling in bumblebees (Bombus terrestris). While social Hymenoptera demonstrate high cognitive flexibility—including non-natural object manipulation and spontaneous play-like behavior—it remains unknown whether invertebrates can utilize an artificially acquired, arbitrary motor-symbolic code to communicate internal homeostatic deficits (carbohydrate deficit, protein deficit, or…", "url": "https://doi.org/10.5281/zenodo.21828795", "citacoes": 0, "fonte": "OpenAlex", "topico": "Comunicação, cognição e comportamento", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.3390/s26154996", "titulo": "Adaptive MARL-Assisted Hybrid Bat-Artificial Bee Colony Optimization for Energy-Efficient Clustering and Routing in IoT-Enabled Wireless Sensor Networks", "autores": "H. S. Mohammed, Poria Pirozmand, Sheeraz Memon, Sajad Ghatrehsamani, Sweta Thakur, R. W. Kadel et al.", "revista": "Sensors", "data": "2026-08-06", "ano": 2026, "resumo": "Energy efficiency remains a major challenge in IoT-enabled wireless sensor networks because sensor nodes operate with limited battery capacity and are often deployed in environments where battery replacement is impractical. Existing clustering and routing protocols frequently optimize cluster-head selection and routing separately, leading to uneven energy consumption, premature node failure, increased routing overhead, and reduced network reliability. This paper proposes sented by intervals, making machine-sequencing decisions sensitive to temporal uncertainty. We propose Risk-Aware Partial-Order Reinforcement Learning with Timed Automata Completion (RAPO-RL-TAC), which couples Risk-Aware Partial-Order Reinforcement Learning (RAPO-RL) for machine-order construction with Timed Automata Completion (TAC) for execution-time resolution of deferred sequencing decisions. Risk awareness focuses on preserving temporal flexibility in machine-order relations whose preferred ordering is…", "url": "https://doi.org/10.3390/pr14182995", "citacoes": 0, "fonte": "OpenAlex", "topico": "Comunicação, cognição e comportamento", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.1016/j.afres.2026.102622", "titulo": "Vis/NIR spectroscopy combined with machine learning for internal bruise detection in potatoes: a comparative study of spectral preprocessing strategies", "autores": "Mohammad Vahedi Torshizi, Sajad Sabzi, Razieh Pourdarbani, Tahereh seidkhani", "revista": "Applied Food Research", "data": "2026-09-19", "ano": 2026, "resumo": "Internal bruising in potatoes reduces postharvest quality and market value, yet remains difficult to detect with visual inspection. This study proposes a framework that combines Visible/Near-Infrared spectroscopy with unsupervised and supervised machine learning for the non-destructive detection of bruised potato tubers. A total of 240 potato samples (120 healthy and 120 bruised) were analyzed within the spectral range of 400–1000 nm. Five spectral preprocessing methods, including raw spectra, Standard Normal Variate, Multiplicative Scatter Correction, Savitzky–Golay smoothing, and…", "url": "https://doi.org/10.1016/j.afres.2026.102622", "citacoes": 0, "fonte": "OpenAlex", "topico": "Comunicação, cognição e comportamento", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.1016/j.asoc.2026.116444", "titulo": "BeeCF: Artificial bee colony based counterfactual explanations for healthcare recommendation s  "citacoes": 0, "fonte": "OpenAlex", "topico": "Comunicação, cognição e comportamento", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.3126/jodem.v17i1.99417", "titulo": "Representation of Trauma in Sue Monk Kidd’s The Secret Life of Bees", "autores": "Bimal Kishore Shrivastwa", "revista": "JODEM Journal of Language and Literature", "data": "2026-09-09", "ano": 2026, "resumo": "Drawing upon the basic theoretical insights mainly from the domain of racial and psychological trauma advocated by Dominic La Capra, the present research explores the psychological disorder and trauma of Lily Owens, the central character of Sue Monk Kidd’s The Secret Life of Bees. The research displays how Lily has shaped her entire life around the shocking, distorted memory. The research questions raised are though Lily was raised by her abusive father, T. Ray, why is she blamed for the death of her mother, Deborah, who was killed when Lily was only four years old? What forces Lily and…", "url": "https://doi.org/10.3126/jodem.v17i1.99417", "citacoes": 0, "fonte": "OpenAlex", "topico": "Comunicação, cognição e comportamento", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.21203/rs.3.rs-10938319/v1", "titulo": "Quantifying Climate-Induced Socio-Acoustic Communication Failure in Apis ceranaThrough Sentinel-3 and Integrating Quantum Genomic Tautomerization, Audio-MAE Transformers, and Poincare Hyperbolic Neural Networks Across Geoclimatic Zones", "autores": "M. R. K. Pathan", "revista": "Research Square", "data": "2026-09-08", "ano": 2026, "resumo": "Abstract    As climate anomaly pressures intensify across agrarian and natural ecosystems, evaluating multi-scale biotic-abiotic couplings becomes paramount for predicting social insect resilience. We analyzed N = 90 colonies of the indigenous honeybee,  Apis cerana  inhabiting three distinct geographical areas of Bangladesh-Sundarbans Coastal Mangroves (21.93°N, 89.47°E), Chittagong Hill Tracts (21.80°N, 92.35°E), and Ra tores": "Heng Zhang, Darren F. Ward", "revista": "Arthropod-Plant Interactions", "data": "2026-09-16", "ano": 2026, "resumo": "Land cover change and biological invasions alter pollinator communities and the distribution of floral resources, but how these changes influence specific bee–plant interactions across different landscapes and time often remains unclear. We reconstructed bee–plant interaction networks from New Zealand using 2,266 interactions extracted from digitised natural history collections and compared interaction patterns between land cover dominated by native or exotic vegetation. Native bees accounted for most recorded interactions across all land cover types. Bee and plant biostatus showed strong…", "url": "https://doi.org/10.1007/s11829-026-10286-x", "citacoes": 0, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.1016/j.cois.2026.101614", "titulo": "The horned mason bee, Osmia cornuta, as a managed orchard pollinator: current status and future perspectives", "autores": "Bosch J, Roquer-Beni L, Eeraerts M", "revista": "MED", "data": "2026-09-15", "ano": 2026, "resumo": "Osmia cornuta is a cavity-nesting solitary bee that occurs across most of continental Europe. Because of its early activity period, its strong affinity for Rosaceae fruit tree pollen and its high pollinating effectiveness, methods have been developed to manage this species as a crop pollinator. In this review, we identify the main challenges associated with O. cornuta management: synchronisation of population emergence with the blooming period of the focal orchard, female establishment at the nesting sites and pesticide exposure. We discuss how to address these challenges and suggest research…", "url": "https://doi.org/10.1016/j.cois.2026.101614", "citacoes": 0, "fonte": "Europe PMC", "topico": "Forrageamento e recursos florais", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.55362/ijecol/202 "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.21203/rs.3.rs-10826054/v1", "titulo": "Long-Read rbcL Metabarcoding Reveals Dominant Elaeis and Curcuma Signals in Clear Stingless Bee Honey from Riau, Indonesia", "autores": "Endang Sulistyarini Gultom, Rini Hafzari, Esi Emilia, Hasruddin Hasruddin", "revista": "Research Square", "data": "2026-09-04", "ano": 2026, "resumo": "Abstract    Identifying the botanical components of honey is important for product characterization and tracing plant sources, particularly in stingless bee honey produced within heterogeneous tropical landscapes. This exploratory study characterized plant DNA signals in a clear stingless bee honey sample from Riau, Indonesia, using chloroplast  rbcL  metabarcoding coupled with Oxford Nanopore sequencing. Plant DNA was extracted from 1 mL of honey using a modified DNeasy Plant Mini Kit protocol, amplified with universal  rbcL  primers, and analyzed using a consensus-based long-read workflow.…", "url": "https://doi.org/10.21203/rs.3.rs-10826054/v1", "citacoes": 0, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.21203/rs.3.rs-10664796/v1", "titulo": "Diversity and foraging behaviour of insects visiting broccoli blooms", "autores": "Himanshu Negi, Manthan Sood, ARPIT CHOPRA, Anjana Thakur", "revista": "Research Square", "data": "2026-09-03", "ano": 2026, "resumo": "Abstract    Commercial broccoli (  Brassica oleracea  var.  italica  ) seed production requires efficient vector pollination, however the extent to which managed honey bees can substitute for the pollination services provided by diverse naturally occurring pollinator communities remained largely understudied, particularly in sub-temperate region. Field studies were conducted during 2023–24 in Palampur, India to evaluate insect pollinator community dynamics, foraging behaviour, relat Research)", "data": "2026-08-31", "ano": 2026, "resumo": "This paper presents a novel metaheuristic algorithm, termed \"Bare-Eared Squirrel Monkey Algorithm\" (BESMA), inspired by the foraging strategies observed in *Sciurus niger*, commonly known as the bare-eared squirrel monkey. These primates exhibit intelligent and adaptive foraging behavior, utilizing a combination of exploration and exploitation to maximize food acquisition efficiency. BESMA leverages these principles through a dynamic agent population, adaptive territory allocation, and a novel solution evaluation function. The algorithm's core mechanics mimic the monkey's tendency to explore…", "url": "https://doi.org/10.5281/zenodo.22194714", "citacoes": 0, "fonte": "OpenAlex", "topico": "Forrageamento e recursos florais", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.1002/edn3.70360", "titulo": "eDNA Analysis for Native Cavity‐Nesting Bee Ecology: A Comparison of Data From Brood Cells Contents and Larval DNA", "autores": "Katherine Lunn, Orianne Tournayre, Alejandro José Biganzoli‐Rangel, Nina R. Garrett, Maria Kuzmina, Nguyen Nguyen et al.", "revista": "Environmental DNA", "data": "2026-09-01", "ano": 2026, "resumo": "ABSTRACT While the colonial honeybee is widely recognized by the public as a pollinator, thousands of native bees play an important but often under‐recognized role. Their solitary or semi‐solitary life histories and small population sizes make them difficult to study at scale. Traditional approaches such as pan‐trapping, netting, or larval collection are invasive and may be unsuitable when species at risk are present. Although environmental DNA (eDNA) methods have expanded rapidly in honeybee research, analogous non‐invasive approaches for native bees remain limited and often provide only…", "url": "https://doi.org/10.1002/edn3.70360", "citacoes": 0, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:1 icultural areas, requires understanding its drivers. Studies of cavity‐nesting bees and wasps with trap nests provide information on the number of locally reproducing species and their potential offspring, and how this relates to local resources and landscape diversity. We investigated insect communities across all major habitat types in agricultural landscapes in Germany using a grid‐based design to evenly and proportionally cover the major habitats of our landscapes. The landscape plots…", "url": "https://doi.org/10.1111/icad.70126", "citacoes": 0, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.13102/sociobiology.v73i3.12422", "titulo": "A New Subterranean Species of Tetragonula Moure, 1961 (Hymenoptera: Apidae: Meliponini) from Wokha (Nagaland, India) with Comparative Notes on the Species from India", "autores": "Noyingbeni M. Odyuo, Sudipta Dey, Bendang Ao, Ranjit Kumar, ANANDHAN RAMESHKUMAR", "revista": "Sociobiology", "data": "2026-07-22", "ano": 2026, "resumo": "This paper describes a new subterranean species of stingless bee, Tetragonula yikhumensis Odyuo sp. nov., with associated males from Wokha district of Nagaland, India. It is the largest species of stingless bees found in India. It is distinctive in shape, size, colouration pubescence and especially their genital capsule and its associated sterna. The S5 apicomedial region has a parabolic concavity, the apicomedial process of S6 is urn shaped, the gonostylus has a lateral origin and the penis valve has a distinctive shape. This paper supports many prior studies that have emphasised the…", "url": "https://doi.org/10.13102/sociobiology.v73i3.12422", "citacoes": 0, "fonte": "OpenAlex", "topico": "Nidificação, defesa e parasitismo", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.22541/authorea.15007268/v1", "titulo": "Wing venation reflects phylogenetic divergence and allometric scaling in bees", "autores": "Jorge De La Cruz, Charles N. Thrift, Madeleine M. Ostwald, Katja C. Seltmann", "revista": "", "data": "2026-08-10", "ano": 2026, "resumo": "Wing venation is widely used in insect systematics, but the extent to which bee wing morphology reflects phylogenetic divergence, taxonomic identity, and body-size scaling remains poorly understood. Here, we used geometric morphometrics to quantify forewing venation across 17 bee species representing 17 genera and five families. We placed nine homologous landmarks on wing vein intersections and analyzed shape variation among species, subfamilies, and families. We also tested whether wing morphology contained phylogenetic signal, compared a morphology-inferred tree with a molecular reference…", "url": "https://doi.org/10.22541/authorea.15007268/v1", "citacoes": 0, "fonte": "OpenAlex", "topico": "Filogenia, sistemática e biogeografia", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.1080/00222933.2026.2712631", "titulo": "Why make it easy when you can make it difficult? the nigritus group as example of the current challenges in the traditional taxonomy of the bee genus Hylaeus Fabricius (Apoidea: Colletidae)", "autores": "Romain Le Divelec, Christian Schmid‐Egger, Daniel Benda, Denis Michez, Kobe Janssen, Villu Soon et al.", "revista": "Journal of Natural History", "data": "2026-09-02", "ano": 2026, "resumo": "The genus Hylaeus Fabricius is one of the most diverse and taxonomically challenging bee genera in the Palaearctic region, with a confused taxonomy and unclear supraspecific classification. The nigritus species group, currently assigned to the subgenus Hylaeus, was previously considered to comprise 13 species, primarily distributed across Asia. Despite a recent revision, reliable identification of the group and its constituent species has remained difficult. We present a comprehensive revision of the group based on detailed morphological study combined with DNA barcoding. Our review revealed…", "url": "https://doi. tential as bioindicators of airborne particulate pollution in urban environments. Between May and August 2024, 677 wild bee individuals from 26 genera were sampled across urbanisation gradients in two metropolitan areas of northern Italy. Microparticles adhering to bee…", "url": "https://doi.org/10.1016/j.envres.2026.125463", "citacoes": 0, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.3390/buildings16193924", "titulo": "Green Façades in the Urban Climate: Microclimatic Performance and Implications as Potential Wild Bee Nesting Sites", "autores": "Melina Wochner, Holger Röseler, Linda Meier, Leonie Katharina Fischer, Pia Krause, Philip Leistner", "revista": "Buildings", "data": "2026-10-02", "ano": 2026, "resumo": "When designing green façades, parameters such as system type, orientation and solar exposure can directly affect the achievement of the intended objectives, like maximizing cooling potential or promoting biodiversity. Using data from 22 façades in southern Germany, characteristic features and their impact on microclimatic properties were analysed. Considering the microclimate as an important determinant of habitat quality in green façades, the potential for these systems to serve as habitats for wild bees was evaluated. During the summer period a temperature decrease was observed from the…", "url": "https://doi.org/10.3390/buildings16193924", "citacoes": 0, "fonte": "OpenAlex", "topico": "Ecologia urbana de abelhas", "tipo": "novo", "adicionado": "2026-10-08"}, {"key": "doi:10.3390/plants15182765", "titulo": "Urban Weeds: Supporters of Pollinator Biodiversity in Urban Landscapes", "autores": "Stefano Benvenuti", "revista": "Plants", "data": "2026-09-09", "ano": 2026, "resumo": "Urbanization is widely recognized as a major driver of biodiversity loss; however, cities can also provide important refuges for pollinators when diverse and continuous floral resources are available. This of the National Academy of Sciences", "data": "2013-03-04", "ano": 2013, "resumo": "Pollinators such as bees are essential to the functioning of terrestrial ecosystems. However, despite concerns about a global pollinator crisis, long-term data on the status of bee species are limited. We present a long-term study of relative rates of change for an entire regional bee fauna in the northeastern United States, based on >30,000 museum records representing 438 species. Over a 140-y period, aggregate native species richness weakly decreased, but richness declines were significant only for the genus Bombus. Of 187 native species analyzed individually, only three declined steeply, al", "url": "https://doi.org/10.1073/pnas.1218503110", "citacoes": 575, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.1115559108", "titulo": "Climate-associated phenological advances in bee pollinators and bee-pollinated plants", "autores": "Ígnasi Bartomeus, John S. Ascher, David L. Wagner, Bryan N. Danforth, Sheila Rafaella Colla, Sarah Kornbluth et al.", "revista": "Proceedings of the National Academy of Sciences", "data": "2011-12-05", "ano": 2011, "resumo": "The phenology of many ecological processes is modulated by temperature, making them potentially sensitive to climate change. Mutualistic interactions may be especially vulnerable because of the potential for phenological mismatching if the species involved do not respond similarly to changes in temperature. Here we present an analysis of climate-associated shifts in the phenology of wild bees, the most important pollinators worldwide, and compare these shifts to published studies of bee-pollinated plants over the same time period. We report that over the past 130 y, the phenology of 10 bee spe", "url": "https://doi.org/10.1073/pnas.1115559108", "citacoes": 564, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1093/ae/37.2.119", "titulo": "Insects at Low Temperature", "autores": "Richard E. Chippendale", "revista": "American Entomologist", "data": "1991-01-01", "ano": 1991, "resumo": "Physiology of Insect Cold Hardiness.- 1. A Tribute to R. W. Salt.- 2. Principles of Insect Low Temperature Tolerance.- 3. The Water Relations of Overwintering Insects.- 4. Biochemistry of Cryoprotectants.- 5. Hemolymph Proteins Involved in Insect Subzero-Temperature Tolerance: Ice Nucleators and Antifreeze Proteins.- Impact on Development and Survival.- 6. Cold Shock and Heat Shock.- 7. Effects of Cold on Morphogenesis.- 8. Relationship between Cold Hardiness and Diapause.- 9. Thermoperiodism.- Species Adaptations.- 10. Winter Habitats and Ecological Adaptations for Winter Survival.- 11. Freez", "url": "https://doi.org/10.1093/ae/37.2.119", "citacoes": 519, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1002/j.1537-2197.1982.tb13237.x", "titulo": "COMMUNITY STUDIES IN POLLINATION ECOLOGY IN THE HIGH TEMPERATE ANDES OF CENTRAL CHILE. I. POLLINATION MECHANISMS AND ALTITUDINAL VARIATION", "autores": "Mary T. K. Arroyo, Richard B. Primack, Juan J. Armestó", "revista": "American Journal of Botany", "data": "1982-01-01", "ano": 1982, "resumo": "Pollination mechanisms and pollinators are reported for a total of 137 species (75% of the non‐abiotically pollinated flora) as they occur at three altitudinal levels (subandean scrub: 2,200–2,600 m; cushion‐plant zone: 2,700–3,100 m; subnival feldfield: 3,200–3,600 m) in the Andean (alpine) zone on the Cordon del Cepo (33°17'S) in central Chile as part of community oriented research in reproductive biology in the high temperate Andes of South America. Only around 4% of the species studied failed to be visited by potential pollinators. Hymenopterans (principally bees) are important pollinators", "url": "https://doi.org/10.1002/j.1537-2197.1982.tb13237.x", "citacoes": 434, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "t:bumblebees behaviour ecology and conservation", "titulo": "Bumblebees: Behaviour, Ecology, and Conservation", "autores": "Dave Goulson", "revista": "", "data": "2003-01-01", "ano": 2003, "resumo": "Preface 1. Introduction 2. Thermoregulation 3. Social Organisation and Conflict 4. Finding a Mate 5. Natural Enemies 6. Foraging Economics 7. Exploitation of Patchy Resources 8. Choice of Flower Species 9. Intraspecific Floral Choices 10. Foraging Cues Gained from Other Bees 11. Competition and Niche Differentiation in Bumblebee Communities 12. Bumblebees as Pollinators 13. Conservation 14. Bumblebees Abroad Effects of Introduced Bees References Index", "url": "https://openalex.org/W1497819585", "citacoes": 411, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1104/pp.112.204750", "titulo": "Climate Change: Resetting Plant-Insect Interactions", "autores": "Evan H. DeLucia, Paul D. Nabity, Jorge A. Zavala, May R. Berenbaum", "revista": "PLANT PHYSIOLOGY", "data": "2012-09-12", "ano": 2012, "resumo": "Elevated CO2 and temperature are altering the interactions between plants and insects with important implications for food security and natural ecosystems. Ecologically, the acceleration of plant phenology by warming is generating mismatches between plants and insect pollinators. Similarly, shifting the rate of plant development relative to insect development can amplify or minimize the consequences of herbivory. Warming also enables some insects to increase the number of generations per year, thus increasing damage to plant communities. The suitability of plant tissues as food for insects als", "url": "https://doi.org/10.1104/pp.112.204750", "citacoes": 381, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.1412973111", "titulo": "Museum specimens reveal loss of pollen host plants as key factor driving wild bee decline in The Netherlands", "autores": "Jeroen A. Scheper, Menno Reemer, Ruud van Kats, W.A. Ozinga, Giel T. J. van der Linden, J.H.J. Schaminée et al.", "revista": "Proceedings of the National Academy of Sciences", "data": "2014-11-24", "ano": 2014, "resumo": "Evidence for declining populations of both wild and managed bees has raised concern about a potential global pollination crisis. Strategies to mitigate bee loss generally aim to enhance floral resources. However, we do not really know whether loss of preferred floral resources is the key driver of bee decline because accurate assessment of host plant preferences is difficult, particularly for species that have become rare. Here we examine whether population trends of wild bees in The Netherlands can be explained by trends in host plants, and how this relates to other factors such as climate ch", "url": "https://doi.org/10.1073/pnas.1412973111", "citacoes": 369, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.185.4153.747", "titulo": "Thermoregulation in Endothermic Insects", "autores": "Bernd Heinrich", "revista": "Science", "data": "1974-08-30", "ano": 1974, "resumo": "On the basis of body weight, most flying insects have higher rates of metabolism, and hence heat production, than other animals. However, rapid rates of cooling because of small body size in most cases precludes appreciable endothermy. The body temperature of small flies in flight is probably close to ambient temperature, and that of flying butterflies and locusts is 5 degrees to 10 degrees C above ambient temperature. Many moths and bumblebees are insulated with scales and hair, and their metabolism during flight can cause the temperature of the flight muscles to increase 20 degrees to 30 deg", "url": "https://doi.org/10.1126/science.185.4153.747", "citacoes": 363, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.20506/rst.27.2.1819", "titulo": "Influencia de los cambios climáticos en las poblaciones de abejas y sus enfermedades", "autores": "Yves Le Conte, Maria Navajas", "revista": "Scientific and Technical Review (World Organisation for Animal Health)", "data": "2008-08-01", "ano": 2008, "resumo": "The European honey bee, Apis mellifera, is the most economically valuable pollinator of agricultural crops worldwide. Bees are also crucial in maintaining biodiversity by pollinating numerous plant species whose fertilisation requires an obligatory pollinator. Apis mellifera is a species that has shown great adaptive potential, as it is found almost everywhere in the world and in highly diverse climates. In a context of climate change, the variability of the honey bee's life-history traits as regards temperature and the environment shows that the species possesses such plasticity and genetic v", "url": "https://doi.org/10.20506/rst.27.2.1819", "citacoes": 326, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1590/s0100-879x2000000200003", "titulo": "Insect juvenile hormone: from \"status quo\" to high society", "autores": "Klaus Hartfelder", "revista": "Brazilian Journal of Medical and Biological Research", "data": "2000-02-01", "ano": 2000, "resumo": "Juvenile hormone (JH) exerts pleiotropic functions during insect life cycles. The regulation of JH biosynthesis by neuropeptides and biogenic amines, as well as the transport of JH by specific binding proteins is now well understood. In contrast, comprehending its mode of action on target organs is still hampered by the difficulties in isolating specific receptors. In concert with ecdysteroids, JH orchestrates molting and metamorphosis, and its modulatory function in molting processes has gained it the attribute \"status quo\" hormone. Whereas the metamorphic role of JH appears to have been wide", "url": "https://doi.org/10.1590/s0100-879x2000000200003", "citacoes": 320, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.aat1598", "titulo": "Neonicotinoid exposure disrupts bumblebee nest behavior, social networks, and thermoregulation", "autores": "James D. Crall, Callin M. Switzer, Robert L Oppenheimer, Ashlee N. Ford Versypt, Biswadip Dey, Andrea L. M. Brown et al.", "revista": "Science", "data": "2018-11-08", "ano": 2018, "resumo": "Neonicotinoid pesticides can negatively affect bee colonies, but the behavioral mechanisms by which these compounds impair colony growth remain unclear. Here, we investigate imidacloprid's effects on bumblebee worker behavior within the nest, using an automated, robotic platform for continuous, multicolony monitoring of uniquely identified workers. We find that exposure to field-realistic levels of imidacloprid impairs nursing and alters social and spatial dynamics within nests, but that these effects vary substantially with time of day. In the field, imidacloprid impairs colony thermoregulati", "url": "https://doi.org/10.1126/science.aat1598", "citacoes": 307, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/bf00706595", "titulo": "Thermoregulation in bumblebees", "autores": "Bernd Heinrich", "revista": "Journal of Comparative Physiology B", "data": "1975-01-01", "ano": 1975, "resumo": "", "url": "https://doi.org/10.1007/bf00706595", "citacoes": 291, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.3897/biorisk.10.4749", "titulo": "Climatic Risk and Distribution Atlas of European Bumblebees", "autores": "Pierre Rasmont, Markus Franzén, Thomas Lecocq, Alexander Harpke, Stuart P. M. Roberts, Koos Biesmeijer et al.", "revista": "BIORISK – Biodiversity and Ecosystem Risk Assessment", "data": "2015-02-18", "ano": 2015, "resumo": "Bumble bees represent one of the most important groups of pollinators. In addition to their ecological and economic relevance, they are also a highly charismatic group which can help to increase the interest of people in realizing, enjoying and conserving natural systems. However, like most animals, bum- ble bees are sensitive to climate. In this atlas, maps depicting potential risks of climate change for bumble bees are shown together with informative summary statistics, ecological back- ground information and a picture of each European species. Thanks to the EU FP7 project STEP, the authors ", "url": "https://doi.org/10.3897/biorisk.10.4749", "citacoes": 290, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1890/10-1885.1", "titulo": "An examination of synchrony between insect emergence and flowering in Rocky Mountain meadows", "autores": "Jessica R. K. Forrest, James D. Thomson", "revista": "Ecological Monographs", "data": "2011-02-23", "ano": 2011, "resumo": "One possible effect of climate change is the generation of a mismatch in the seasonal timing of interacting organisms, owing to species-specific shifts in phenology. Despite concerns that plants and pollinators might be at risk of such decoupling, there have been few attempts to test this hypothesis using detailed phenological data on insect emergence and flowering at the same localities. In particular, there are few data sets on pollinator flight seasons that are independent of flowering phenology, because pollinators are typically collected at flowers. To address this problem, we established", "url": "https://doi.org/10.1890/10-1885.1", "citacoes": 288, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rspb.2012.1581", "titulo": "Altitude acts as an environmental filter on phylogenetic composition, traits and diversity in bee communities", "autores": "Bernhard Hoiß, Jochen Krauß, Simon Geoffrey Potts, Stuart M. Roberts, Ingolf Steffan‐Dewenter", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "2012-08-29", "ano": 2012, "resumo": "Knowledge about the phylogeny and ecology of communities along environmental gradients helps to disentangle the role of competition-driven processes and environmental filtering for community assembly. In this study, we evaluated patterns in species richness, phylogenetic structure and life-history traits of bee communities along altitudinal gradients in the Alps, Germany. We found a linear decline in species richness and abundance but increasing phylogenetic clustering in communities with increasing altitude. The proportion of social- and ground-nesting species, as well as mean body size and a", "url": "https://doi.org/10.1098/rspb.2012.1581", "citacoes": 285, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s00040-002-8286-y", "titulo": "Self-assemblages in insect societies", "autores": "C. Anderson, Guy Théraulaz, J. L. Deneubourg", "revista": "Insectes Sociaux", "data": "2002-05-01", "ano": 2002, "resumo": "", "url": "https://doi.org/10.1007/s00040-002-8286-y", "citacoes": 282, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s11269-014-0700-5", "titulo": "Reservoir Optimization in Water Resources: a Review", "autores": "Asmadi Ahmad, Ahmed El‐Shafie, Siti Fatin Mohd Razali, Zawawi Samba Mohamad", "revista": "Water Resources Management", "data": "2014-06-19", "ano": 2014, "resumo": "", "url": "https://doi.org/10.1007/s11269-014-0700-5", "citacoes": 280, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/ele.12170", "titulo": "Biodiversity ensures plant–pollinator phenological synchrony against climate change", "autores": "Ígnasi Bartomeus, Mia G. Park, Jason Gibbs, Bryan N. Danforth, Alan N. Lakso, Rachael Winfree", "revista": "Ecology Letters", "data": "2013-08-22", "ano": 2013, "resumo": "Climate change has the potential to alter the phenological synchrony between interacting mutualists, such as plants and their pollinators. However, high levels of biodiversity might buffer the negative effects of species-specific phenological shifts and maintain synchrony at the community level, as predicted by the biodiversity insurance hypothesis. Here, we explore how biodiversity might enhance and stabilise phenological synchrony between a valuable crop, apple and its native pollinators. We combine 46 years of data on apple flowering phenology with historical records of bee pollinators over", "url": "https://doi.org/10.1111/ele.12170", "citacoes": 266, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.aab0868", "titulo": "Functional mismatch in a bumble bee pollination mutualism under climate change", "autores": "Nicole E. Miller‐Struttmann, Jennifer C. Geib, James D. Franklin, Peter G. Kevan, Ricardo M. Holdø, Diane Ebert‐May et al.", "revista": "Science", "data": "2015-09-24", "ano": 2015, "resumo": "Ecological partnerships, or mutualisms, are globally widespread, sustaining agriculture and biodiversity. Mutualisms evolve through the matching of functional traits between partners, such as tongue length of pollinators and flower tube depth of plants. Long-tongued pollinators specialize on flowers with deep corolla tubes, whereas shorter-tongued pollinators generalize across tube lengths. Losses of functional guilds because of shifts in global climate may disrupt mutualisms and threaten partner species. We found that in two alpine bumble bee species, decreases in tongue length have evolved o", "url": "https://doi.org/10.1126/science.aab0868", "citacoes": 263, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.aej.2021.04.100", "titulo": "A review of the hybrid artificial intelligence and optimization modelling of hydrological streamflow forecasting", "autores": "Karim Sherif Mostafa Hassan Ibrahim, Yuk Feng Huang, Ali Najah Ahmed, Chai Hoon Koo, Ahmed El‐Shafie", "revista": "Alexandria Engineering Journal", "data": "2021-06-05", "ano": 2021, "resumo": "Ever since the first introduction of Artificial Intelligence into the field of hydrology, it has further generated immense interest in researching aspects for further improvements to hydrology. This can be seen in the rising number of related works published. This culminated further with the combination of pioneering optimization techniques. Who would have thought that the birds and the bees can offer advances in the mathematical sciences and so have the ants too? The ingenuity of humans is spelled out in the algorithms that mimic many natural activities, like pack hunting by the wolves! This ", "url": "https://doi.org/10.1016/j.aej.2021.04.100", "citacoes": 259, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1461-9563.2002.00152.x", "titulo": "Landscape structure, habitat fragmentation, and the ecology of insects", "autores": "Mark D. Hunter", "revista": "Agricultural and Forest Entomology", "data": "2002-07-15", "ano": 2002, "resumo": "My office doesn't have a window. If it did, and I could look across campus, my view would be a mosaic of buildings, grass, trees, parking areas, a couple of small streams, and even a lake. There are oak trees with diverse Cynipid assemblages, a myriad of arthropods in the litter beneath the ornamental plantings, and abundant pollinators on the Hypericum that lines the path from my office to the library. There are also diesel-belching buses and some insane planner's nightmare of one-way roads and dead-end footpaths. As a microcosm of the world at large, our campus is a study in fragmentation. A", "url": "https://doi.org/10.1046/j.1461-9563.2002.00152.x", "citacoes": 244, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.jenvman.2008.12.015", "titulo": "Managing carbon emissions in China through building energy efficiency", "autores": "Jun Li, Michel Colombier", "revista": "Journal of Environmental Management", "data": "2009-04-05", "ano": 2009, "resumo": "", "url": "https://doi.org/10.1016/j.jenvman.2008.12.015", "citacoes": 240, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1093/mmy/myv067", "titulo": "Aspergillusand aspergilloses in wild and domestic animals: a global health concern with parallels to human disease", "autores": "Seyedmojtaba Seyedmousavi, Jacques Guillot, Pascal Arné, Sybren de Hoog, Johan Willem Mouton, Willem J. G. Melchers et al.", "revista": "Medical Mycology", "data": "2015-08-26", "ano": 2015, "resumo": "The importance of aspergillosis in humans and various animal species has increased over the last decades. Aspergillus species are found worldwide in humans and in almost all domestic animals and birds as well as in many wild species, causing a wide range of diseases from localized infections to fatal disseminated diseases, as well as allergic responses to inhaled conidia. Some prevalent forms of animal aspergillosis are invasive fatal infections in sea fan corals, stonebrood mummification in honey bees, pulmonary and air sac infection in birds, mycotic abortion and mammary gland infections in ", "url": "https://doi.org/10.1093/mmy/myv067", "citacoes": 234, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rsbl.2017.0125", "titulo": "Physiological thermal limits predict differential responses of bees to urban heat-island effects", "autores": "April L. Hamblin, Elsa Youngsteadt, Margarita María López-Uribe, Steven D. Frank", "revista": "Biology Letters", "data": "2017-06-01", "ano": 2017, "resumo": "Changes in community composition are an important, but hard to predict, effect of climate change. Here, we use a wild-bee study system to test the ability of critical thermal maxima (CT max , a measure of heat tolerance) to predict community responses to urban heat-island effects in Raleigh, NC, USA. Among 15 focal species, CT max ranged from 44.6 to 51.3°C, and was strongly predictive of population responses to urban warming across 18 study sites ( r 2 = 0.44). Species with low CT max declined the most. After phylogenetic correction, solitary species and cavity-nesting species (bumblebees) ha", "url": "https://doi.org/10.1098/rsbl.2017.0125", "citacoes": 226, "fonte": "OpenAlex", "topico": "Termorregulação, tolerância térmica e clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rspb.1979.0081", "titulo": "Arms races between and within species", "autores": "Richard Dawkins, John Richard Krebs", "revista": "Proceedings of the Royal Society B Biological Sciences", "data": "1979-09-21", "ano": 1979, "resumo": "An adaptation in one lineage (e.g. predators) may change the selection pressure on another lineage (e.g. prey), giving rise to a counter-adaptation. If this occurs reciprocally, an unstable runaway escalation or 'arms race' may result. We discuss various factors which might give one side an advantage in an arms race. For example, a lineage under strong selection may out-evolve a weakly selected one (' the life-dinner principle'). We then classify arms races in two independent ways. They may be symmetric or asymmetric, and they may be interspecific or intraspecific. Our example of an asymmetric", "url": "https://doi.org/10.1098/rspb.1979.0081", "citacoes": 2228, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/nature09205", "titulo": "The evolution of eusociality", "autores": "Martin A. Nowak, Corina E. Tarnita, Edward O. Wilson", "revista": "Nature", "data": "2010-08-01", "ano": 2010, "resumo": "", "url": "https://doi.org/10.1038/nature09205", "citacoes": 1516, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.1215025", "titulo": "Neonicotinoid Pesticide Reduces Bumble Bee Colony Growth and Queen Production", "autores": "Penelope R. Whitehorn, Stephanie O’Connor, FELIX L. WÄCKERS, Dave Goulson", "revista": "Science", "data": "2012-03-30", "ano": 2012, "resumo": "Bad News for Bees Neonicotinoid insecticides were introduced in the early 1990s and have become one of the most widely used crop pesticides in the world. These compounds act on the insect central nervous system, and they have been shown to be persistent in the environment and in plant tissues. Recently, there have been controversial connections made between neonicotinoids and pollinator deaths, but the mechanisms underlying these potential deaths have remained unknown. Whitehorn et al. (p. 351 , published online 29 March) exposed developing colonies of bumble bees to low levels of the neonicot", "url": "https://doi.org/10.1126/science.1215025", "citacoes": 1312, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.1108197", "titulo": "Haploidploidy and the Evolution of the Social Insect", "autores": "Robert L. Trivers, Hope Hare", "revista": "Science", "data": "1976-01-23", "ano": 1976, "resumo": "Halminton (1) was apparently the first to appreciate that the synthesis of Mendelian genetics with Darwin's theory of natural selection had profound implications for social theory. In particular, insofar as almost all social behavior is either selfish or altruistic (or has such effects), genetical reasoning suggests that an individual's social behavior should be adjusted to his or her degree of relatedness, r, to all individuals affected by the behavior. We call this theory kinship theory. The social insects provide a critical test of Hamilton's kinship theory. When such theory is combined wit", "url": "https://doi.org/10.1126/science.1108197", "citacoes": 1271, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/nature11585", "titulo": "Combined pesticide exposure severely affects individual- and colony-level traits in bees", "autores": "Richard J. Gill, Oscar Ramos-Rodriguez, Nigel E. Raıne", "revista": "Nature", "data": "2012-10-19", "ano": 2012, "resumo": "", "url": "https://doi.org/10.1038/nature11585", "citacoes": 1027, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "t:the social behavior of the bees a comparative study", "titulo": "The social behavior of the bees : a comparative study", "autores": "Charles Duncan Michener", "revista": "Medical Entomology and Zoology", "data": "1974-01-01", "ano": 1974, "resumo": "Although the honeybee is without doubt man's favorite social insect, and the most studied by him, there are twenty thousand other species of bees, many of which are social. This book is the first to offer a systematic account of social behavior in the entire super family Apoidea. Of all the social insects, the various species of bees exhibit perhaps the broadest spectrum of social behavior, including intermediate stages which are scarce or totally extinct in other groups; in this respect the bees are particularly appropriate subjects for evolutionary study.With the aid of more than 200 illustr", "url": "https://openalex.org/W2989243010", "citacoes": 998, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.cub.2017.01.027", "titulo": "Evolutionary History of the Hymenoptera", "autores": "Ralph S. Peters, Lars Krogmann, Christoph Mayer, Alexander Donath, Simon Gunkel, Karen Meusemann et al.", "revista": "Current Biology", "data": "2017-03-23", "ano": 2017, "resumo": "", "url": "https://doi.org/10.1016/j.cub.2017.01.027", "citacoes": 971, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1086/284846", "titulo": "Reproductive Harmony via Mutual Policing by Workers in Eusocial Hymenoptera", "autores": "Francis L. W. Ratnieks", "revista": "The American Naturalist", "data": "1988-08-01", "ano": 1988, "resumo": "When queens of eusocial Hymenoptera mate two or more times (assuming equal sperm contributions from males and random sperm use), the workers are more closely related to the queen's sons than to the sons of a randomly chosen worker. This suggests that workers should try to prevent other workers from reproducing, and hence producing sons, in species with queens that mate two or more times. It also provides a possible reason for the absence of reproductive workers in many hymenopteran societies. Reproductive harmony may, therefore, and counterintuitively, result from lowered relatedness among wor", "url": "https://doi.org/10.1086/284846", "citacoes": 739, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.1156108", "titulo": "Ancestral Monogamy Shows Kin Selection Is Key to the Evolution of Eusociality", "autores": "William O. H. Hughes, Benjamin P. Oldroyd, Madeleine Beekman, Francis L. W. Ratnieks", "revista": "Science", "data": "2008-05-29", "ano": 2008, "resumo": "Close relatedness has long been considered crucial to the evolution of eusociality. However, it has recently been suggested that close relatedness may be a consequence, rather than a cause, of eusociality. We tested this idea with a comparative analysis of female mating frequencies in 267 species of eusocial bees, wasps, and ants. We found that mating with a single male, which maximizes relatedness, is ancestral for all eight independent eusocial lineages that we investigated. Mating with multiple males is always derived. Furthermore, we found that high polyandry (>2 effective mates) occurs on", "url": "https://doi.org/10.1126/science.1156108", "citacoes": 692, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1523-1739.2004.00227.x", "titulo": "Tropical Forest Fragments Enhance Pollinator Activity in Nearby Coffee Crops", "autores": "Taylor H. Ricketts", "revista": "Conservation Biology", "data": "2004-09-28", "ano": 2004, "resumo": "Abstract: Crop pollination by wild bees is an ecosystem service of enormous value, but it is under increasing threat from agricultural intensification. As with many ecosystem services, the mechanisms, scales, and species through which crop pollination is provided are too poorly understood to inform land‐use decisions. I investigated the role of tropical forest remnants as sources of pollinators to surrounding coffee crops in Costa Rica. In 2001 and 2002 I observed bee activity and pollen deposition rates at coffee flowers along distance gradients from two fragments and one narrow riparian stri", "url": "https://doi.org/10.1111/j.1523-1739.2004.00227.x", "citacoes": 639, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/40130", "titulo": "Extraordinary lifespans in ants: a test of evolutionary theories of ageing", "autores": "Laurent Keller, Michel Genoud", "revista": "Nature", "data": "1997-10-01", "ano": 1997, "resumo": "", "url": "https://doi.org/10.1038/40130", "citacoes": 629, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/sciadv.1600513", "titulo": "Dynamic microbiome evolution in social bees", "autores": "Waldan K. Kwong, Luis A. Medina, Hauke Koch, Kong‐Wah Sing, Eunice J. Y. Soh, John S. Ascher et al.", "revista": "Science Advances", "data": "2017-03-03", "ano": 2017, "resumo": "The highly social (eusocial) corbiculate bees, comprising the honey bees, bumble bees, and stingless bees, are ubiquitous insect pollinators that fulfill critical roles in ecosystem services and human agriculture. Here, we conduct wide sampling across the phylogeny of these corbiculate bees and reveal a dynamic evolutionary history behind their microbiota, marked by multiple gains and losses of gut associates, the presence of generalist as well as host-specific strains, and patterns of diversification driven, in part, by host ecology (for example, colony size). Across four continents, we found", "url": "https://doi.org/10.1126/sciadv.1600513", "citacoes": 613, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.leaqua.2015.12.007", "titulo": "The queen bee phenomenon: Why women leaders distance themselves from junior women", "autores": "Belle Derks, Colette van Laar, Naomi Ellemers", "revista": "The Leadership Quarterly", "data": "2016-01-15", "ano": 2016, "resumo": "", "url": "https://doi.org/10.1016/j.leaqua.2015.12.007", "citacoes": 594, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rsbl.2007.0102", "titulo": "Death of an order: a comprehensive molecular phylogenetic study confirms that termites are eusocial cockroaches", "autores": "Daegan J. G. Inward, George Beccaloni, Paul Eggleton", "revista": "Biology Letters", "data": "2007-04-05", "ano": 2007, "resumo": "Termites are instantly recognizable mound-builders and house-eaters: their complex social lifestyles have made them incredibly successful throughout the tropics. Although known as 'white ants', they are not ants and their relationships with other insects remain unclear. Our molecular phylogenetic analyses, the most comprehensive yet attempted, show that termites are social cockroaches, no longer meriting being classified as a separate order (Isoptera) from the cockroaches (Blattodea). Instead, we propose that they should be treated as a family (Termitidae) of cockroaches. It is surprising to f", "url": "https://doi.org/10.1098/rsbl.2007.0102", "citacoes": 544, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1371/journal.pbio.0050062", "titulo": "The Gene vitellogenin Has Multiple Coordinating Effects on Social Organization", "autores": "C. Mindy Nelson, Kate E. Ihle, M. Kim Fondrk, Robert E. Page, Gro Vang Amdam", "revista": "PLoS Biology", "data": "2007-02-27", "ano": 2007, "resumo": "Temporal division of labor and foraging specialization are key characteristics of honeybee social organization. Worker honeybees (Apis mellifera) initiate foraging for food around their third week of life and often specialize in collecting pollen or nectar before they die. Variation in these fundamental social traits correlates with variation in worker reproductive physiology. However, the genetic and hormonal mechanisms that mediate the control of social organization are not understood and remain a central question in social insect biology. Here we demonstrate that a yolk precursor gene, vite", "url": "https://doi.org/10.1371/journal.pbio.0050062", "citacoes": 537, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1155/2013/697390", "titulo": "Recent Progress of Propolis for Its Biological and Chemical Compositions and Its Botanical Origin", "autores": "Viviane Cristina Toreti, Hélia Harumi Sato, Gláucia María Pastore, Yong Kun Park", "revista": "Evidence-based Complementary and Alternative Medicine", "data": "2013-01-01", "ano": 2013, "resumo": "Propolis is the generic name given to the product obtained from resinous substances, which is gummy and balsamic and which is collected by bees from flowers, buds, and exudates of plants. It is a popular folk medicine possessing a broad spectrum of biological activities. These biological properties are related to its chemical composition and more specifically to the phenolic compounds that vary in their structure and concentration depending on the region of production, availability of sources to collect plant resins, genetic variability of the queen bee, the technique used for production, and ", "url": "https://doi.org/10.1155/2013/697390", "citacoes": 480, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rstb.1996.0087", "titulo": "Paternity in eusocial Hymenoptera", "autores": "Jacobus J. Boomsma, Francis L. W. Ratnieks", "revista": "Philosophical Transactions of the Royal Society B Biological Sciences", "data": "1996-07-29", "ano": 1996, "resumo": "Abstract Variation in paternity frequency in colonies of eusocial insects has profound effects on the relatedness among offspring and on the genetic diversity of colonies. Data on queen ‘mating-frequency’ in eusocial Hymenoptera vary in both quality and the phase of the ‘mating’ process they address. Some are observational studies of the range or maximum number of copulations; others are derived from estimates of the number of sperm in males and queens; others use genetic techniques to determine the paternity of different males among female offspring. Only the latter data can be used to calcul", "url": "https://doi.org/10.1098/rstb.1996.0087", "citacoes": 479, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.cub.2017.03.027", "titulo": "Phylogenomic Insights into the Evolution of Stinging Wasps and the Origins of Ants and Bees", "autores": "Michael G. Branstetter, Bryan N. Danforth, James P. Pitts, Brant C. Faircloth, Philip S. Ward, Matthew L. Buffington et al.", "revista": "Current Biology", "data": "2017-04-01", "ano": 2017, "resumo": "The stinging wasps (Hymenoptera: Aculeata) are an extremely diverse lineage of hymenopteran insects, encompassing over 70,000 described species and a diversity of life history traits, including ectoparasitism, cleptoparasitism, predation, pollen feeding (bees [Anthophila] and Masarinae), and eusociality (social vespid wasps, ants, and some bees) [1]. The most well-studied lineages of Aculeata are the ants, which are ecologically dominant in most terrestrial ecosystems [2], and the bees, the most important lineage of angiosperm-pollinating insects [3]. Establishing the phylogenetic affinities o", "url": "https://doi.org/10.1016/j.cub.2017.03.027", "citacoes": 477, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1206/0003-0090(2001)259<0001:amotba>2.0.co;2", "titulo": "A MONOGRAPH OF THE BALTIC AMBER BEES AND EVOLUTION OF THE APOIDEA (HYMENOPTERA)", "autores": "Michael S. Engel", "revista": "Bulletin of the American Museum of Natural History", "data": "2001-04-01", "ano": 2001, "resumo": "Abstract The bees found as Baltic amber inclusions are revised and the history of studies on these fossils is briefly reviewed. In total this subtropical Eocene fauna contains 36 species and 18 genera, all extinct. These are classified here into nine tribes, six subfamilies, and five families of which six tribes and one family are unknown in the modern fauna. The following taxa are described as new to science: PALEOMELITTIDAE, new family; Boreallodapini, Electrobombini, Eomacropidini, Melikertini, Protolithurgini, new tribes; Ctenoplectrellina, new subtribe; Boreallodape, Electrobombus, Electr", "url": "https://doi.org/10.1206/0003-0090(2001)259<0001:amotba>2.0.co;2", "citacoes": 464, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1126/science.aaa4788", "titulo": "Genomic signatures of evolutionary transitions from solitary to group living", "autores": "Karen M. Kapheim, Hailin Pan, Cai Li, Steven L. Salzberg, Daniela Puiu, Tanja Magoč et al.", "revista": "Science", "data": "2015-05-15", "ano": 2015, "resumo": "The evolution of eusociality is one of the major transitions in evolution, but the underlying genomic changes are unknown. We compared the genomes of 10 bee species that vary in social complexity, representing multiple independent transitions in social evolution, and report three major findings. First, many important genes show evidence of neutral evolution as a consequence of relaxed selection with increasing social complexity. Second, there is no single road map to eusociality; independent evolutionary transitions in sociality have independent genetic underpinnings. Third, though clearly ind", "url": "https://doi.org/10.1126/science.aaa4788", "citacoes": 444, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1371/journal.pone.0014357", "titulo": "RNA Viruses in Hymenopteran Pollinators: Evidence of Inter-Taxa Virus Transmission via Pollen and Potential Impact on Non-Apis Hymenopteran Species", "autores": "Rajwinder Singh, Abby L. Levitt, Edwin George Rajotte, Edward Charles Holmes, Nancy Ostiguy, Dennis vanEngelsdorp et al.", "revista": "PLoS ONE", "data": "2010-12-22", "ano": 2010, "resumo": "Although overall pollinator populations have declined over the last couple of decades, the honey bee (Apis mellifera) malady, colony collapse disorder (CCD), has caused major concern in the agricultural community. Among honey bee pathogens, RNA viruses are emerging as a serious threat and are suspected as major contributors to CCD. Recent detection of these viral species in bumble bees suggests a possible wider environmental spread of these viruses with potential broader impact. It is therefore vital to study the ecology and epidemiology of these viruses in the hymenopteran pollinator communit", "url": "https://doi.org/10.1371/journal.pone.0014357", "citacoes": 444, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1890/12-2003.1", "titulo": "Early onset of spring increases the phenological mismatch between plants and pollinators", "autores": "Gaku Kudo, Takashi Y. Ida", "revista": "Ecology", "data": "2013-04-17", "ano": 2013, "resumo": "Climate warming accelerates the timing of flowering and insect pollinator emergence, especially in spring. If these phenological shifts progress independently between species, features of plant-pollinator mutualisms may be modified. However, evidence of phenological mismatch in pollination systems is limited. We investigated the phenologies of a spring ephemeral, Corydalis ambigua, and its pollinators (bumble bees), and seed-set success over 10-14 years in three populations. Although both flowering onset and first detection of overwintered queen bees in the C. ambigua populations were closely ", "url": "https://doi.org/10.1890/12-2003.1", "citacoes": 443, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1098/rstb.2009.0101", "titulo": "Lifetime monogamy and the evolution of eusociality", "autores": "Jacobus J. Boomsma", "revista": "Philosophical Transactions of the Royal Society B Biological Sciences", "data": "2009-10-05", "ano": 2009, "resumo": "All evidence currently available indicates that obligatory sterile eusocial castes only arose via the association of lifetime monogamous parents and offspring. This is consistent with Hamilton's rule (br(s) > r(o)c), but implies that relatedness cancels out of the equation because average relatedness to siblings (r(s)) and offspring (r(o)) are both predictably 0.5. This equality implies that any infinitesimally small benefit of helping at the maternal nest (b), relative to the cost in personal reproduction (c) that persists throughout the lifespan of entire cohorts of helpers suffices to estab", "url": "https://doi.org/10.1098/rstb.2009.0101", "citacoes": 440, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1086/407216", "titulo": "Evolution of Sociality in Insects", "autores": "Norman Lin, Charles Duncan Michener", "revista": "The Quarterly Review of Biology", "data": "1972-06-01", "ano": 1972, "resumo": "Kin selection has been used to explain evolution of man altruistic traits found in those social insect castes which have reduced reproductivity. Kin selection is most probable among organisms living in family groups. It is commonly assumed, therefore, that (1) the most primitive social insects, like the more specialized ones, live in mother-daughter (eusocial) colonies, (2) colonies of individuals of the same generation and showing castes (semisocial colonies) are abnormal or originate only in inbreeding populations, and (3) transfer of individuals among colonies must be selected against, exce", "url": "https://doi.org/10.1086/407216", "citacoes": 432, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/ncomms4636", "titulo": "Molecular traces of alternative social organization in a termite genome", "autores": "Nicolas Terrapon, Cai Li, Hugh M. Robertson, Lu Ji, Xuehong Meng, Warren Booth et al.", "revista": "Nature Communications", "data": "2014-05-20", "ano": 2014, "resumo": "Although eusociality evolved independently within several orders of insects, research into the molecular underpinnings of the transition towards social complexity has been confined primarily to Hymenoptera (for example, ants and bees). Here we sequence the genome and stage-specific transcriptomes of the dampwood termite Zootermopsis nevadensis (Blattodea) and compare them with similar data for eusocial Hymenoptera, to better identify commonalities and differences in achieving this significant transition. We show an expansion of genes related to male fertility, with upregulated gene expression ", "url": "https://doi.org/10.1038/ncomms4636", "citacoes": 431, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1186/s13059-015-0623-3", "titulo": "The genomes of two key bumblebee species with primitive eusocial organization", "autores": "Ben Michael Sadd, Seth Michael Barribeau, Guy Bloch, Dirk C. de Graaf, Peter K. Dearden, Christine G. Elsik et al.", "revista": "Genome biology", "data": "2015-04-13", "ano": 2015, "resumo": "BACKGROUND: The shift from solitary to social behavior is one of the major evolutionary transitions. Primitively eusocial bumblebees are uniquely placed to illuminate the evolution of highly eusocial insect societies. Bumblebees are also invaluable natural and agricultural pollinators, and there is widespread concern over recent population declines in some species. High-quality genomic data will inform key aspects of bumblebee biology, including susceptibility to implicated population viability threats. ed by the reproductive queen, but also by the functionally sterile workers. In summer, the worker population consists of a hive bee group performing a multitude of tasks including nursing inside the nest, and a forager group specialized in collecting nectar, pollen, water, and propolis. Vitellogenin is sy", "url": "https://doi.org/10.1073/pnas.0333979100", "citacoes": 412, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "t:up from invisibility lesbians gay men and the media in america", "titulo": "Up from Invisibility: Lesbians, Gay Men, and the Media in America", "autores": "Larry P. Gross", "revista": "", "data": "2001-12-26", "ano": 2001, "resumo": "Preface: Up from InvisibilitySources1. The Mediated SocietyMass Media and American SocietyTelevision as the MainstreamSexual Minorities and the MediaSubversion and Resistance2: Coming Out and Coming TogetherThe Homosexual in Midcentury AmericaGiving Voice to the VoicelessProvoking ConcernThe Voice Gets LouderComing Out in the Nation's Living Rooms3: Stonewall and BeyondHomo Nest Raided, Queen Bees Stinging MadTurning Their Condition into PoliticsExpressing OutrageTalking Back to the Media4: At the MoviesA Queer Feeling Every Time I Look at YouShow Me a Happy Homosexual and I'll Show You a Corp", "url": "https://openalex.org/W565561218", "citacoes": 410, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1086/415930", "titulo": "Worker Reproduction in the Higher Eusocial Hymenoptera", "autores": "Andrew F. G. Bourke", "revista": "The Quarterly Review of Biology", "data": "1988-09-01", "ano": 1988, "resumo": "Worker reproduction (i.e., the parthenogenetic production by workers of males and, more rarely, females) is very widespread in the higher eusocial Hymenoptera (bumble bees, stinglees bees, honey bees, vespine wasps, higher ants). Examples are given in the text. The mutualistic theory (\"hopeful reproductive\" hypothesis) of hymenopteran eusociality (semisocial route) states that the first workers were reproductive because the possibility of future reproduction was the condition for their originally working. In Hamilton's kinship theory (subsocial route) workers produce males on account of their ", "url": "https://doi.org/10.1086/415930", "citacoes": 400, "fonte": "OpenAlex", "topico": "Comportamento social, castas e divisão de trabalho", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/1574-6976.12025", "titulo": "The gut microbiota of insects – diversity in structure and function", "autores": "Philipp Engel, Nancy A. Moran", "revista": "FEMS Microbiology Reviews", "data": "2013-05-21", "ano": 2013, "resumo": "Insect guts present distinctive environments for microbial colonization, and bacteria in the gut potentially provide many beneficial services to their hosts. Insects display a wide range in degree of dependence on gut bacteria for basic functions. Most insect guts contain relatively few microbial species as compared to mammalian guts, but some insects harbor large gut communities of specialized bacteria. Others are colonized only opportunistically and sparsely by bacteria common in other environments. Insect digestive tracts vary extensively in morphology and physicochemical properties, factor", "url": "https://doi.org/10.1111/1574-6976.12025", "citacoes": 2734, "fonte": "OpenAlex", "topico": "Comunicação, cognição e comportamento", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s10462-012-9328-0", "titulo": "A comprehensive survey: artificial bee colony (ABC) algorithm and applications", "autores": "Derviş Karaboğa, Beyza Görkemli, Celal Öztürk, Nurhan Karaboğa", "revista": "Artificial Intelligence Review", "data": "2012-03-10", "ano": 2012, "resumo": "", "url": "https://doi.org/10.1007/s10462-012-9328-0", "citacoes": 1990, "fonte": "OpenAlex", "topico": "Comunicação, cogniçã
