tulo": "The area requirements of an ecosystem service: crop pollination by native bee communities in California", "autores": "Claire Kremen, Neal M. Williams, Robert L. Bugg, John P. Fay, Robin W. Thorp", "revista": "Ecology Letters", "data": "2004-09-22", "ano": 2004, "resumo": "Abstract Managing ecosystem services is critical to human survival, yet we do not know how large natural areas must be to support these services. We investigated how crop pollination services provided by native, unmanaged, bee communities varied on organic and conventional farms situated along a gradient of isolation from natural habitat. Pollination services from native bees were significantly, positively related to the proportion of upland natural habitat in the vicinity of farm sites, but not to any other factor studied, including farm type, insecticide usage, field size and honeybee abunda", "url": "https://doi.org/10.1111/j.1461-0248.2004.00662.x", "citacoes": 832, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1365-2664.2010.01939.x", "titulo": "Multifunctional shade-tree management in tropical agroforestry landscapes - a review", "autores": "Teja Tscharntke, Yann Clough, Shonil Bhagwat, Damayanti Buchori, Heiko Faust, Dietrich Hertel et al.", "revista": "Journal of Applied Ecology", "data": "2011-01-31", "ano": 2011, "resumo": "1. Agricultural intensification reduces ecological resilience of land-use systems, whereas paradoxically, environmental change and climate extremes require a higher response capacity than ever. Adaptation strategies to environmental change include maintenance of shade trees in tropical agroforestry, but conversion of shaded to unshaded systems is common practice to increase short-term yield.2. In this paper, we review the short-term and long-term ecological benefits of shade trees in coffee Coffea arabica, C. canephora and cacao Theobroma cacao agroforestry and emphasize the poorly understood,", "url": "https://doi.org/10.1111/j.1365-2664.2010.01939.x", "citacoes": 823, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1046/j.1523-1739.1998.97154.x", "titulo": "The Potential Consequences of Pollinator Declines on the Conservation of Biodiversity and Stability of Food Crop Yields", "autores": "", "revista": "Conservation Biology", "data": "1998-02-11", "ano": 1998, "resumo": "Following reports of dramatic declines in managed and feral honey bees from nearly every region of North America, scientists and resource managers from the U.S., Mexico, and Canada came together to review the quality of the evidence that honey bees as well as other pollinators are in long-term decline and to consider the potential consequences of these losses on the conservation of biodiversity and the stability of the yield of food crops. These experts in pollination ecology confirmed that the last 5 years of losses of honeybee colonies in North America leave us with fewer managed pollinators", "url": "https://doi.org/10.1046/j.1523-1739.1998.97154.x", "citacoes": 817, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1890/07-1292.1", "titulo": "MEASURING BEE DIVERSITY IN DIFFERENT EUROPEAN HABITATS AND BIOGEOGRAPHICAL REGIONS", "autores": "Catrin Westphal, Riccardo Bommarco, Gabriel Carré, Ellen Lamborn, Nicolas Morison, Theodora Petanidou et al.", "revista": "Ecological Monographs", "data": "2008-10-23", "ano": 2008, "resumo": "Bee pollinators are currently recorded with many different sampling methods. However, the relative performances of these methods have not been systematically evaluated and compared. In response to the strong need to record ongoing shifts in pollinator diversity and abundance, global and regional pollinator initiatives must adopt standardized sampling protocols when developing large‐scale and long‐term monitoring schemes. We systematically evaluated the performance of six sampling methods (observation plots, pan traps, standardized and variable transect walks, trap nests with reed internodes or", "url": "https://doi.org/10.1890/07-1292.1", "citacoes": 804, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1371/journal.pone.0037235", "titulo": "Insect Pollinated Crops, Insect Pollinators and US Agriculture: Trend Analysis of Aggregate Data for the Period 1992–2009", "autores": "Nicholas W. Calderone", "revista": "PLoS ONE", "data": "2012-05-22", "ano": 2012, "resumo": "In the US, the cultivated area (hectares) and production (tonnes) of crops that require or benefit from insect pollination (directly dependent crops: apples, almonds, blueberries, cucurbits, etc.) increased from 1992, the first year in this study, through 1999 and continued near those levels through 2009; aggregate yield (tonnes/hectare) remained unchanged. The value of directly dependent crops attributed to all insect pollination (2009 USD) decreased from $14.29 billion in 1996, the first year for value data in this study, to $10.69 billion in 2001, but increased thereafter, reaching $15.12 b", "url": "https://doi.org/10.1371/journal.pone.0037235", "citacoes": 784, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.biocon.2010.03.024", "titulo": "Ecological and life-history traits predict bee species responses to environmental disturbances", "autores": "Neal M. Williams, Elizabeth E. Crone, T’ai H. Roulston, Robert L. Minckley, Laurence . Auteur du texte Packer, Simon Geoffrey Potts", "revista": "Biological Conservation", "data": "2010-04-26", "ano": 2010, "resumo": "", "url": "https://doi.org/10.1016/j.biocon.2010.03.024", "citacoes": 755, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1002/clen.201300989", "titulo": "Antibiotic Pollution in the Environment: A Review", "autores": "Ritu Gothwal, Shashidhar Thatikonda", "revista": "CLEAN - Soil Air Water", "data": "2014-07-08", "ano": 2014, "resumo": "Antibiotics have been extensively and effectively used in human and veterinary medicines. Their benefits have been recognized in agriculture, aquaculture, bee‐keeping, and livestock as growth promoters. This paper collects information from several investigations on the sources and occurrences of antibiotics in natural and artificial environmental systems. Several antibiotics were reported for their occurrences in water resources, effluent from industries, sludge, manure, soil, plants, and organisms across the globe. Sorption, photo‐degradation, biodegradation, and oxidation were recognized as ", "url": "https://doi.org/10.1002/clen.201300989", "citacoes": 739, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/35099540", "titulo": "Agri-environment schemes do not effectively protect biodiversity in Dutch agricultural landscapes", "autores": "David Kleijn, Frank Berendse, Ruben Smit, Niels Gilissen", "revista": "Nature", "data": "2001-10-18", "ano": 2001, "resumo": "", "url": "https://doi.org/10.1038/35099540", "citacoes": 720, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido:2005043", "titulo": "Contaminants of bee products", "autores": "Stefan Bogdanov", "revista": "Apidologie", "data": "2005-12-12", "ano": 2005, "resumo": "", "url": "https://doi.org/10.1051/apido:2005043", "citacoes": 707, "fonte": "OpenAlex", "topico": "Polinização e agroecossistemas", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.2307/1939537", "titulo": "Floral Character Displacement Generates Assemblage Structure of Western Australian Triggerplants (Stylidium)", "autores": "W. Scott Armbruster, Mary E. Edwards, Edward M. Debevec", "revista": "Ecology", "data": "1994-03-01", "ano": 1994, "resumo": "We studied the pollination ecology and assemblage structure of 31 species of Stylidium (Stylidiaceae) at 25 sites in Western Australia. The number of species per study site varied between two and size. Stylidium species are pollinated by a variety of nectar—seeking solitary bees and bombyliid flies. Within and among species there is significant variation in nectar—tube length (and therefore in the insects that visit the flowers) and in pollen placement on pollinators. Pollen is placed “explosively” on the insect by a motile column of fused staminate and pistillate tissues; the position and rea", "url": "https://doi.org/10.2307/1939537", "citacoes": 293, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1051/apido:2003062", "titulo": "Niche overlap and diet breadth in bumblebees; are rare species more specialized in their choice of flowers?", "autores": "Dave Goulson, Ben Darvill", "revista": "Apidologie", "data": "2004-01-01", "ano": 2004, "resumo": "", "url": "https://doi.org/10.1051/apido:2003062", "citacoes": 232, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.3732/ajb.92.11.1899", "titulo": "Rapid speciation and the evolution of hummingbird pollination in neotropical Costus subgenus Costus (Costaceae): evidence from nrDNA ITS and ETS sequences", "autores": "Kathleen M. Kay, Patrick A. Reeves, Richard G. Olmstead, Douglas W. Schemske", "revista": "American Journal of Botany", "data": "2005-11-01", "ano": 2005, "resumo": "We estimate phylogenetic relationships and the biogeographic and pollination history of Costus subgenus Costus (Costaceae) using sequence data from the internal and external transcribed spacer (ITS and ETS) regions of 18S-26S nuclear ribosomal DNA. The African members of the subgenus form a series of lineages basal to a monophyletic neotropical species radiation. The neotropical species have large, showy flowers visited by either euglossine bees or hummingbirds. The hummingbird pollination syndrome is supported as a derived character state from the bee pollination syndrome, and we estimate tha", "url": "https://doi.org/10.3732/ajb.92.11.1899", "citacoes": 223, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.biocon.2011.04.009", "titulo": "Predicting the invasion risk by the alien bee-hawking Yellow-legged hornet Vespa velutina nigrithorax across Europe and other continents with niche models", "autores": "Claire Villemant, Morgane Barbet‐Massin, A. Perrard, Franck J. Muller, Olivier Gargominy, Frédéric Jiguet et al.", "revista": "Biological Conservation", "data": "2011-06-20", "ano": 2011, "resumo": "", "url": "https://doi.org/10.1016/j.biocon.2011.04.009", "citacoes": 204, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s10841-007-9071-z", "titulo": "Displacement of Japanese native bumblebees by the recently introduced Bombus terrestris (L.) (Hymenoptera: Apidae)", "autores": "Maki N. Inoue, Jun Yokoyama, Izumi Washitani", "revista": "Journal of Insect Conservation", "data": "2007-03-12", "ano": 2007, "resumo": "", "url": "https://doi.org/10.1007/s10841-007-9071-z", "citacoes": 194, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.ecolmodel.2012.06.035", "titulo": "Pollination services at risk: Bee habitats will decrease owing to climate change in Brazil", "autores": "Tereza Cristina Giannini, André Luís Acosta, Carlos Alberto Garófalo, António Mauro Saraiva, Isabel Alves‐dos‐Santos, Vera Lúcia Imperatriz-Fonseca", "revista": "Ecological Modelling", "data": "2012-07-27", "ano": 2012, "resumo": "", "url": "https://doi.org/10.1016/j.ecolmodel.2012.06.035", "citacoes": 185, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.jtherbio.2016.04.015", "titulo": "Altitudinal variation in bumble bee (Bombus) critical thermal limits", "autores": "Kennan Oyen, Susma Giri, Michael E. Dillon", "revista": "Journal of Thermal Biology", "data": "2016-05-05", "ano": 2016, "resumo": "", "url": "https://doi.org/10.1016/j.jtherbio.2016.04.015", "citacoes": 183, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1076/snfe.31.3.137.13336", "titulo": "Resource Partitioning between Highly Eusocial Bees and Possible Impact of the Introduced Africanized Honey Bee on Native Stingless Bees in the Brazilian Atlantic Rainforest", "autores": "Wolfgang Wilms, Vera Lúcia Imperatriz-Fonseca, Wolf Engels", "revista": "Studies on Neotropical Fauna and Environment", "data": "1996-12-01", "ano": 1996, "resumo": "The highly eusocial bee community of the neotropical Atlantic Rainforest was studied at Boracéia Biological Station in the state of São Paulo, Brazil. In this reserve, 17 species of stingless bees and the introduced Africanized honey bee were found, the latter being the most abundant flower visitor. Of all flowering plants, Asteraceae and Myrtaceae were particularly important as resources for bees. Trophic niche overlap between the various species of stingless bees is evident, and it was generally larger within the tribes Meliponini and Trigonini than between members of different tribes. Never", "url": "https://doi.org/10.1076/snfe.31.3.137.13336", "citacoes": 183, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/1365-2664.12418", "titulo": "EDITOR'S CHOICE: Small‐scale restoration in intensive agricultural landscapes supports more specialized and less mobile pollinator species", "autores": "Claire Kremen, Leithen K. M’Gonigle", "revista": "Journal of Applied Ecology", "data": "2015-03-03", "ano": 2015, "resumo": "Summary Agriculture now constitutes 40–50% of terrestrial land use globally. By enhancing habitat suitability and connectivity, restoration within agricultural landscapes could have a major influence on biodiversity conservation. However, habitat management within intensive agricultural landscapes may primarily boost abundances of common, highly mobile generalists, rather than vulnerable or endangered species. We studied pollinator community response to small‐scale habitat restoration in the intensively farmed Central Valley of California to determine whether restoration could also promote mor", "url": "https://doi.org/10.1111/1365-2664.12418", "citacoes": 176, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1600-0587.2012.07191.x", "titulo": "Improving species distribution models using biotic interactions: a case study of parasites, pollinators and plants", "autores": "Tereza Cristina Giannini, Daniel S. Chapman, António Mauro Saraiva, Isabel Alves‐dos‐Santos, Jacobus Christiaan Biesmeijer", "revista": "Ecography", "data": "2012-11-19", "ano": 2012, "resumo": "Biotic interactions have been considered as an important factor to be included in species distribution modelling, but little is known about how different types of interaction or different strategies for modelling affect model performance. This study compares different methods for including interspecific interactions in distribution models for bees, their brood parasites, and the plants they pollinate. Host–parasite interactions among bumble bees (genus Bombus : generalist pollinators and brood parasites) and specialist plant–pollinator interactions between Centris bees and Krameria flowers wer", "url": "https://doi.org/10.1111/j.1600-0587.2012.07191.x", "citacoes": 176, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.2307/1936080", "titulo": "Difference in Pollination Niche Relationships in Early and Late Successional Plant Communities", "autores": "J. A. D. Parrish, F. A. Bazzaz", "revista": "Ecology", "data": "1979-06-01", "ano": 1979, "resumo": "Alpha—niche parameters involving pollination resources were examined for plants in communities of 3 different successional ages. Niche breadths and overlaps were compared in early successional annual, early perennial, and prairie communities. Niche axes examined were seasonal time of flowering, species of flower visitor, daily time of visit, and 2—dimensional parameter, species of visitor x daily time. Seasonal flowering was clumped in all communities. It occurred fairly synchronously in midsummer in the annual community and in the fall in the perennial community. Flowering in the winter annua", "url": "https://doi.org/10.2307/1936080", "citacoes": 171, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/1365-2745.12978", "titulo": "Temporal variation in plant–pollinator networks from seasonal tropical environments: Higher specialization when resources are scarce", "autores": "Camila Silveira Souza, Pietro K. Maruyama, Camila Aoki, Maria Rosângela Sigrist, Josué Raizer, Caroline L. Gross et al.", "revista": "Journal of Ecology", "data": "2018-03-24", "ano": 2018, "resumo": "Abstract The temporal dynamics of plant phenology and pollinator abundance across seasons should influence the structure of plant–pollinator interaction networks. Nevertheless, such dynamics are seldom considered, especially for diverse tropical networks. Here, we evaluated the temporal variation of four plant–pollinator networks in two seasonal ecosystems in Central Brazil (Cerrado and Pantanal). Data were gathered on a monthly basis over 1 year for each network. We characterized seasonal and temporal shifts in plant–pollinator interactions, using temporally discrete networks. We predicted th", "url": "https://doi.org/10.1111/1365-2745.12978", "citacoes": 158, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s10531-008-9428-y", "titulo": "Diet breadth, coexistence and rarity in bumblebees", "autores": "Dave Goulson, Gillian C. Lye, Ben Darvill", "revista": "Biodiversity and Conservation", "data": "2008-08-21", "ano": 2008, "resumo": "", "url": "https://doi.org/10.1007/s10531-008-9428-y", "citacoes": 140, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.biocon.2012.09.015", "titulo": "Climate change increases the risk of invasion by the Yellow-legged hornet", "autores": "Morgane Barbet‐Massin, Quentin Rome, Franck J. Muller, A. Perrard, Claire Villemant, Frédéric Jiguet", "revista": "Biological Conservation", "data": "2012-11-28", "ano": 2012, "resumo": "", "url": "https://doi.org/10.1016/j.biocon.2012.09.015", "citacoes": 138, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/2041-210x.12567", "titulo": "Model‐based inference for estimating shifts in species distribution, area occupied and centre of gravity", "autores": "James T. Thorson, Malin L. Pinsky, Eric J. Ward", "revista": "Methods in Ecology and Evolution", "data": "2016-03-31", "ano": 2016, "resumo": "Summary Changing climate is already impacting the spatial distribution of many taxa, including bees, plants, birds, butterflies and fishes. A common goal is to detect range shifts in response to climate change, including changes in the centre of the population's distribution (the centre of gravity, COG), population boundaries and area occupied. Conventional estimators, such as the abundance‐weighted average (AWA) estimator for COG, confound range shifts with changes in the spatial distribution of available survey data and may be biased when the distribution of survey data shifts over time. AWA", "url": "https://doi.org/10.1111/2041-210x.12567", "citacoes": 132, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1371/journal.pone.0137198", "titulo": "Native and Non-Native Supergeneralist Bee Species Have Different Effects on Plant-Bee Networks", "autores": "Tereza Cristina Giannini, Lucas A. Garibaldi, André Luís Acosta, Juliana Saragiotto Silva, Kate P. Maia, António Mauro Saraiva et al.", "revista": "PLoS ONE", "data": "2015-09-10", "ano": 2015, "resumo": "Supergeneralists, defined as species that interact with multiple groups of species in ecological networks, can act as important connectors of otherwise disconnected species subsets. In Brazil, there are two supergeneralist bees: the honeybee Apis mellifera, a non-native species, and Trigona spinipes, a native stingless bee. We compared the role of both species and the effect of geographic and local factors on networks by addressing three questions: 1) Do both species have similar abundance and interaction patterns (degree and strength) in plant-bee networks? 2) Are both species equally influen", "url": "https://doi.org/10.1371/journal.pone.0137198", "citacoes": 129, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/gcb.15751", "titulo": "Bumblebee resilience to climate change, through plastic and adaptive responses", "autores": "Kevin Maebe, Alex F. Hart, Leon Marshall, Peter A. R. Vandamme, Nicolas J. Vereecken, Denis Michez et al.", "revista": "Global Change Biology", "data": "2021-06-12", "ano": 2021, "resumo": "Bumblebees are ubiquitous, cold-adapted eusocial bees found worldwide from subarctic to tropical regions of the world. They are key pollinators in most temperate and boreal ecosystems, and both wild and managed populations are significant contributors to agricultural pollination services. Despite their broad ecological niche at the genus level, bumblebee species are threatened by climate change, particularly by rising average temperatures, intensifying seasonality and the increasing frequency of extreme weather events. While some temperature extremes may be offset at the individual or colony l", "url": "https://doi.org/10.1111/gcb.15751", "citacoes": 123, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.1365-2664.2010.01949.x", "titulo": "Organic dairy farming: impacts on insect-flower interaction networks and pollination", "autores": "Eileen F. Power, Jane C. Stout", "revista": "Journal of Applied Ecology", "data": "2011-01-18", "ano": 2011, "resumo": "1. Pollination interactions comprise a network of connections between flowers and insect visitors. They are crucial for reproductive success in many angiosperms but are threatened by intensive agricultural practices. Although less intensive approaches, including organic farming, could improve farmland biodiversity, it is not clear whether or not these approaches enhance wild plant pollination and the stability of insect–flower interaction networks. 2. We investigated the effects of organic vs. conventional farming on insect–flower interaction network size and structure, bee and hoverfly divers", "url": "https://doi.org/10.1111/j.1365-2664.2010.01949.x", "citacoes": 120, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/j.2006.0030-1299.14604.x", "titulo": "Detecting the effects of introduced species: a case study of competition between Apis and Bombus", "autores": "Diane M. Thomson", "revista": "Oikos", "data": "2006-03-16", "ano": 2006, "resumo": "Developing tools for rapid assessment of introduced species impacts is one of the most important challenges in invasion ecology. Most assessments of impact rely on correlational data or other indirect measures. Yet few studies have evaluated invasion effects using multiple, simultaneously applied monitoring and experimental approaches, in order to compare easily obtained metrics with more difficult but direct measures of reproductive success or population dynamics. In this study, I use data from an experimental test of introduced honey bee ( Apis mellifera ) impacts on native bumble bees ( Bom", "url": "https://doi.org/10.1111/j.2006.0030-1299.14604.x", "citacoes": 113, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1111/1365-2435.13151", "titulo": "Experimental warming in the field delays phenology and reduces body mass, fat content and survival: Implications for the persistence of a pollinator under climate change", "autores": "Paul J. CaraDonna, James L. Cunningham, Amy Marie Iler", "revista": "Functional Ecology", "data": "2018-06-27", "ano": 2018, "resumo": "Abstract Climate change is rapidly altering thermal environments across the globe. The effects of increased temperatures in already warm environments may be particularly strong because organisms are likely to be near their thermal safety margins, with limited tolerance to additional heat stress. We conduct an in situ field experiment over 2 years to investigate the direct effects of temperature change on an early‐season solitary bee in a warm, arid region of the Southwestern USA. Our field experiment manipulates the thermal environment of Osmia ribifloris (Megachilidae) from larval development", "url": "https://doi.org/10.1111/1365-2435.13151", "citacoes": 110, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s10113-020-01611-y", "titulo": "Climate change in the Eastern Amazon: crop-pollinator and occurrence-restricted bees are potentially more affected", "autores": "Tereza Cristina Giannini, Wilian França Costa, Rafael Cabral Borges, Leonardo Miranda, Claudia Priscila Wanzeler da Costa, António Mauro Saraiva et al.", "revista": "Regional Environmental Change", "data": "2020-02-05", "ano": 2020, "resumo": "Abstract There is pressing need to anticipate the impacts of climate change on species and their functional contributions to ecosystem processes. Our objective is to evaluate the potential bee response to climate change considering (1) response traits—body size, nest site, and sociality; (2) contributions to ecosystem services (effect trait)—crop pollination; and (3) bees’ size of current occurrence area. We analyzed 216 species occurring at the Carajás National Forest (Eastern Amazon, Pará, Brazil), using two different algorithms and geographically explicit data. We modeled the current occurr", "url": "https://doi.org/10.1007/s10113-020-01611-y", "citacoes": 107, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1016/j.agee.2019.04.011", "titulo": "Ecosystem services by birds and bees to coffee in a changing climate: A review of coffee berry borer control and pollination", "autores": "Adina Chain‐Guadarrama, Alejandra Martínez‐Salinas, Natalia Aristizábal, Taylor H. Ricketts", "revista": "Agriculture Ecosystems & Environment", "data": "2019-04-28", "ano": 2019, "resumo": "", "url": "https://doi.org/10.1016/j.agee.2019.04.011", "citacoes": 102, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.1617940114", "titulo": "Coupling of pollination services and coffee suitability under climate change", "autores": "Pablo Imbach, Emily Fung, Lee Hannah, Carlos E  "classico", "adicionado": ""}, {"key": "doi:10.1073/pnas.2011441117", "titulo": "Assessing the ecological niche and invasion potential of the Asian giant hornet", "autores": "Gengping Zhu, Javier Gutiérrez Illán, Chris Looney, David William Crowder", "revista": "Proceedings of the National Academy of Sciences", "data": "2020-09-22", "ano": 2020, "resumo": "The Asian giant hornet ( Vespa mandarinia ) was recently detected in western British Columbia, Canada and Washington State, United States. V. mandarinia are an invasion concern due to their ability to kill honey bees and affect humans. Here, we used habitat suitability models and dispersal simulations to assess potential invasive spread of V. mandarinia . We show V. mandarinia are most likely to establish in areas with warm to cool annual mean temperature, high precipitation, and high human activity. The realized niche of introduced populations is small compared to native populations, suggesti", "url": "https://doi.org/10.1073/pnas.2011441117", "citacoes": 95, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1242/jeb.165589", "titulo": "Critical thermal limits of bumble bees (Bombus impatiens) are marked by stereotypical behaviors and are unchanged by acclimation, age, or feeding status", "autores": "Kennan Oyen, Michael E. Dillon", "revista": "Journal of Experimental Biology", "data": "2018-01-01", "ano": 2018, "resumo": "Critical thermal limits often determine species distributions for diverse ectotherms and have become a useful tool for understanding past and predicting future range shifts in response to changing climates. Despite recently documented population declines and range shifts of bumble bees (genus Bombus), the few measurements of thermal tolerance available for the group have relied on disparate measurement approaches. We describe a novel stereotypical behavior expressed by bumble bee individuals during entry into  Integrating biotic interactions into niche models to assess the distribution of the exotic bee species Lithurgus huberi in South America", "autores": "Daniel Paiva Silva, Víctor H. González, Gabriel A. R. Melo, Mariano Lucía, Leopoldo Jesús Alvarez, Paulo de Marco Júnior", "revista": "Ecological Modelling", "data": "2013-12-05", "ano": 2013, "resumo": "", "url": "https://doi.org/10.1016/j.ecolmodel.2013.11.016", "citacoes": 84, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1038/srep24451", "titulo": "Functional traits help to explain half-century long shifts in pollinator distributions", "autores": "Jesús Aguirre‐Gutiérrez, Wilm Daniel Kissling, Luísa G. Carvalheiro, Michiel F. WallisDeVries, Markus Franzén, Jacobus Christiaan Biesmeijer", "revista": "Scientific Reports", "data": "2016-04-15", "ano": 2016, "resumo": "Changes in climate and land use can have important impacts on biodiversity. Species respond to such environmental modifications by adapting to new conditions or by shifting their geographic distributions towards more suitable areas. The latter might be constrained by species' functional traits that influence their ability to move, reproduce or establish. Here, we show that functional traits related to dispersal, reproduction, habitat use and diet have influenced how three pollinator groups (bees, butterflies and hoverflies) responded to changes in climate and land-use in the Netherlands since ", "url": "https://doi.org/10.1038/srep24451", "citacoes": 81, "fonte": "OpenAlex", "topico": "Modelagem de distribuição e mudanças no clima", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1086/284846", "titulo": "Reproductive Harmony via Mutual Policing by Workers in Eusocial Hymenoptera", "autores": "Francis L. W. Ratnieks", "revista": "The American Naturalist", "data": "1988-08-01", "ano": 1988, "resumo": "When queens of eusocial Hymenoptera mate two or more times verage Problem in Wireless Sensor Networks", "autores": "S. Mini, Siba Kumar Udgata, Samrat Lagnajeet Sabat", "revista": "IEEE Sensors Journal", "data": "2013-10-18", "ano": 2013, "resumo": "Network lifetime plays an integral role in setting up an efficient wireless sensor network. The objective of this paper is twofold. The first one is to deploy sensor nodes at optimal locations such that the theoretically computed network lifetime is maximum. The second is to schedule these sensor nodes such that the network attains the maximum lifetime. Thus, the overall objective of this paper is to identify optimal deployment locations of the given sensor nodes with a pre-specified sensing range, and to schedule them such that the network lifetime is maximum with the required coverage level.", "url": "https://doi.org/10.1109/jsen.2013.2286332", "citacoes": 294, "fonte": "OpenAlex", "topico": "Monitoramento eletrônico de colmeias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1007/s11276-012-0438-z", "titulo": "Cluster based wireless sensor network routing using artificial bee colony algorithm", "autores": "Derviş Karaboğa, Selçuk Ökdem, Celal Öztürk", "revista": "Wireless Networks", "data": "2012-04-23", "ano": 2012, "resumo": "", "url": "https://doi.org/10.1007/s11276-012-0438-z", "citacoes": 293, "fonte": "OpenAlex", "topico": "Monitoramento eletrônico de colmeias", "tipo": "classico", "adicionado": ""}, {"key": "doi:10.1021/ar400014r", "titulo": "Synthetic Ion Transporters that Work with Anion−π Interactions, Halogen Bonds, and Anion–Macrodipole Interactions", "autores": "Andreas Vargas Jentzsch, Andreas Hennig, Jiri Mareda, Stefan Matile", "revista": "Accounts of Chemical Research", "data": "2013-04-02", "ano": 2013, "resumo": "The transport of ions and molecules across lipid bilayer membranes connects cells and cellular compartments with their environment. This biological process is central to a host of functions including signal transduction in neurons and the const POR_PAGINA = 40;
let aba = 'novo', topico = '', busca = '', revista = '', limite = POR_PAGINA;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtData(s) {
  if (!s) return '';
  const d = new Date(s + 'T00:00:00');
  return isNaN(d) ? s : d.toLocaleDateString('pt-BR');
}
function setAba(a) { aba = a; limite = POR_PAGINA;
  document.getElementById('tab-novo').classList.toggle('on', a === 'novo');
  document.getElementById('tab-classico').classList.toggle('on', a === 'classico');
  render(); }
function setTopico(t) { topico = t; limite = POR_PAGINA; render(); }
function setRev(v) { revista = v; limite = POR_PAGINA; render(); }
function setBusca(v) { busca = v.toLowerCase().trim(); limite = POR_PAGINA; render(); }
function mostrarMais() { limite += POR_PAGINA; render(); }

function filtrados() {
  let xs = DADOS.filter(d => d.tipo === aba);
  if (topico) xs = xs.filter(d => d.topico === topico);
  if (revista) xs = xs.filter(d => d.revista === revista);
  if (busca) xs = xs.filter(d =>
    (d.titulo + ' ' + d.autores + ' ' + d.resumo + ' ' + d.revista).toLowerCase().includes(busca));
  if (aba === 'novo') {
    xs.sort((a, b) => (b.adicionado || '').localeCompare(a.adicionado || '') || (b.data || '').localeCompare(a.data || ''));
  } else {
    xs.sort((a, b) => (b.citacoes || 0) - (a.citacoes || 0));
  }
  return xs;
}

function itemHtml(d) {
  const meta = [esc(d.revista), fmtData(d.data) || esc(d.ano || ''),
    aba === 'classico' ? (d.citacoes || 0) + ' citações' : ''].filter(Boolean).join(' · ');
  return '<div class="item">' +
    '<a class="t" href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.titulo) + '</a>' +
    '<div class="aut">' + esc(d.autores) + '</div>' +
    '<div class="meta"><span class="tag">' + esc(d.topico) + '</span>' + meta + '</div>' +
    '<div class="res">' + (d.resumo ? esc(d.resumo) : '<i>(sem resumo disponível)</i>') + '</div></div>';
}

function render() {
  const topicos = [...new Set(DADOS.filter(d => d.tipo === aba).map(d => d.topico))];
  document.getElementById('chips').innerHTML =
    '<span class="chip ' + (topico === '' ? 'on' : '') + '" onclick="setTopico(\'\')">Todos</span>' +
    topicos.map(t => '<span class="chip ' + (topico === t ? 'on' : '') + '" data-t="' + esc(t) + '">' + esc(t) + '</span>').join('');
  document.querySelectorAll('.chip[data-t]').forEach(el => el.onclick = () => setTopico(el.dataset.t));

  const contagem = {};
  DADOS.filter(d => d.tipo === aba && (!topico || d.topico === topico) && d.revista)
       .forEach(d => { contagem[d.revista] = (contagem[d.revista] || 0) + 1; });
  const revistas = Object.keys(contagem).sort((a, b) => contagem[b] - contagem[a]);
  if (revista && !revistas.includes(revista)) revista = '';
  const sel = document.getElementById('rev');
  sel.innerHTML = '<option value="">Todas as revistas (' + revistas.length + ')</option>' +
    revistas.map(r => '<option value="' + esc(r) + '">' + esc(r) + ' (' + contagem[r] + ')</option>').join('');
  sel.value = revista;

  const xs = filtrados();
  document.getElementById('count').textContent = xs.length + ' artigo(s)';
  const parte = xs.slice(0, limite);
  let out = '', diaAtual = null;
  for (const d of parte) {
    if (aba === 'novo' && d.adicionado !== diaAtual) {
      diaAtual = d.adicionado;
      out += '<h2 class="dia">Chegaram em ' + fmtData(diaAtual) + '</h2>';
    }
    out += itemHtml(d);
  }
  if (!parte.length) out = '<p style="color:var(--mut)">Nada encontrado.</p>';
  document.getElementById('lista').innerHTML = out;
  document.getElementById('mais').style.display = xs.length > limite ? 'block' : 'none';
}
render();
</script>
